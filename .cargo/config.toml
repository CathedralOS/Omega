[alias]
xtask = "run --package xtask --"

# The compiler's x86-64 builds assume AVX2-era CPUs (x86-64-v3: Haswell 2013,
# Zen 1 2017 and later). On a one-line `omega --check` this removes about 4.6%
# of the compiler's instructions with byte-identical output, because LLVM can
# use BMI/LZCNT/POPCNT and wider vector moves in hashing, scanning and copies.
# The cost is that the omega binary no longer starts on older x86 CPUs. This
# changes only how the Rust compiler binary is built, not the native code Omega
# emits for Omega programs. An explicit RUSTFLAGS still overrides it.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

# Every Cargo command in this repository uses content (checksum) freshness, the
# method the corpus producer and CI require. Cargo stores the freshness method in
# each unit's fingerprint and rebuilds a unit whose method changed. With a
# per-command setting, `mbx xtask` rebuilt xtask's proc-macro dependencies under
# timestamp freshness and the producer's runner build then rebuilt all 212 runner
# units from scratch, about eleven minutes on every corpus invocation. One method
# for every command lets the runner reuse `mbx build -p omega` and itself.
[unstable]
checksum-freshness = true

[build]
fingerprint = "content"
