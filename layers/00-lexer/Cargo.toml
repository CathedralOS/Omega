[package]
name = "omega-lexer"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dev-dependencies]
golden = { path = "../../tools/golden" }
measure = { path = "../../tools/measure" }
spec-corpus = { path = "../../tools/spec-corpus" }

# The measurement tools. Cargo only finds programs like these by itself in a folder called
# `examples`, and these are not examples of using the lexer, so the folder is named for what
# they are and each tool is listed here. They are still run with `cargo run --example <name>`.
[[example]]
name = "lex_pipeline"
path = "measurements/lex_pipeline.rs"

[[example]]
name = "lex_throughput"
path = "measurements/lex_throughput.rs"

[[example]]
name = "lex_tree"
path = "measurements/lex_tree.rs"

[[example]]
name = "open_breakdown"
path = "measurements/open_breakdown.rs"

[[example]]
name = "read_breakdown"
path = "measurements/read_breakdown.rs"
