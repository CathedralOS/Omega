[package]
name = "alpha"
version = "0.0.0"
edition = "2021"
publish = false

# Alpha = the tape VM (rung 0 / v1): a tiny register machine with byte I/O. This crate
# is now just the throwaway *assembler* on-ramp — it assembles Alpha-assembly text into
# a bytecode tape. The VM itself is the hand-assembled ../alpha/seed (vm.hex/hex0.hex);
# the old Rust `vm` reference was removed as redundant. Used only by dev-regen.sh to
# mint the committed assembler tape; the reproduce path (build.sh) needs no Rust.
[[bin]]
name = "assembler"
path = "src/assembler.rs"

[workspace]
