[package]
name = "delta"
version = "0.0.0"
edition = "2021"
publish = false

# The Delta compiler. Currently the throwaway Rust "on-ramp"; the binary is
# `delta`. Eventually this directory holds the Delta seed + the Delta-in-Delta
# compiler, and the Rust on-ramp is discarded.
[[bin]]
name = "delta"
path = "src/main.rs"

# Standalone (own workspace root) so the parent Omega workspace (explicit
# members) does not absorb it, and it never rots when the main compiler churns.
[workspace]
