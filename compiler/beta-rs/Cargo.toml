[package]
name = "beta"
version = "0.0.0"
edition = "2021"
publish = false

# Beta's throwaway Rust on-ramp: it assembles alpha-assembly (.alp) text into a bytecode
# tape, the same job ../beta/assembler.alp does. Used by ../beta/build.sh to mint the
# tape today; it goes away once beta assembles its own source. The alpha seed itself
# (../alpha) needs no Rust.
[[bin]]
name = "assembler"
path = "src/assembler.rs"

[workspace]
