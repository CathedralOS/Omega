name: Verify named UEFI image providers
on:
  push:
    branches: [work/observe-named-uefi-providers]
permissions:
  contents: read
jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Build the ordinary compiler
        run: |
          bash tools/xtask/bootstrap-mbx.sh --install-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/mbx" build --locked -p omega --bin omega
          cp -L target/debug/omega /tmp/omega
      - name: Compile accepted and rejected provider selections
        run: python3 .github/observe-named-uefi.py /tmp/omega
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: named-uefi-compiler
          path: /tmp/omega
          retention-days: 1
