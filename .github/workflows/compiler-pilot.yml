name: Observe the existing Mac bounded timeout failure
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: /tmp/process-diagnostic
jobs:
  observe:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0530b68c89c8498cf3b8ed1185ac37c83226641e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run only the existing timeout test
        run: |
          python3 - <<'OBSERVE'
          from pathlib import Path
          import hashlib,json,os,re,shutil,subprocess,time
          root=Path.cwd();source='0530b68c89c8498cf3b8ed1185ac37c83226641e';driver=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source and not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          assert subprocess.check_output(['uname','-m'],text=True).strip()=='arm64'
          out=root/'build/timeout-diagnostic';out.mkdir(parents=True,exist_ok=False)
          selected='bounded_process::tests::timeout_terminates_the_owned_process_group'
          arguments=(['mbx','nextest','run','--no-capture'] if shutil.which('mbx') else ['cargo','test'])+['--locked','-p','bounded-process','--lib',selected]
          if not shutil.which('mbx'):arguments+=['--','--nocapture']
          report={'source':source,'driver':driver,'target':'macos_arm64','toolchain':subprocess.check_output(['rustc','-Vv'],text=True).strip(),'command':arguments,'existing_test':selected,'test_wall_deadline_milliseconds':50,'assertion_unchanged':'TimedOut is required; later two-second and descendant marker assertions are unchanged.','builds_compiler':False,'passed':False}
          started=time.monotonic()
          try:
           with (out/'test.stdout').open('wb') as stdout,(out/'test.stderr').open('wb') as stderr:
            report['exit']=subprocess.run(arguments,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,timeout=600).returncode
          except subprocess.TimeoutExpired:report.update(exit=None,error='The single existing test exceeded600s; no test outcome inferred.')
          report['seconds']=round(time.monotonic()-started,3)
          text='\n'.join((out/('test.'+suffix)).read_text(errors='replace') for suffix in ['stdout','stderr'])
          text=re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]','',text)
          report['observed_test_counts']=[int(v) for v in re.findall(r'(?:running|Starting) ([0-9]+) tests?',text)]
          report['actual_failure_reason']=[line for line in text.splitlines() if 'unexpected timeout failure:' in line]
          report['passed']=report['exit']==0 and report['observed_test_counts']==[1]
          report['channels']={suffix:{'path':'test.'+suffix,'sha256':hashlib.sha256((out/('test.'+suffix)).read_bytes()).hexdigest()} for suffix in ['stdout','stderr']}
          (out/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
          raise SystemExit(0 if report['passed'] else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-timeout-diagnostic-${{ github.run_id }}
          path: build/timeout-diagnostic/
          retention-days: 30
