name: Check case and call preparation with original customers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_SDK_SOURCE: 9a56192d430558317cb2b15b7b46255da3a3a6f4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 9a56192d430558317cb2b15b7b46255da3a3a6f4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare the optimized producer and retain its source
        id: producer-preparation
        run: |
          python3 - <<'PREPARE'
          from pathlib import Path
          import json,os,sys
          sys.path[:0]=[str(Path.cwd()/'tools/ci'),str(Path.cwd()/'tools')]
          import compiler_pilot
          source='9a56192d430558317cb2b15b7b46255da3a3a6f4';driver=os.environ['GITHUB_SHA']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          os.environ['GITHUB_SHA']=source
          assert os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          assert compiler_pilot.corpus_gate.host_target()=='linux_x86_64'
          positive=('pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/ownership/runtime_nested_projected_claim_return_exit', 'pass/ownership/runtime_selective_constructed_owner_custody_exit', 'pass/generics/runtime_generic_carrier_equation_exit', 'pass/core/aggregate_snapshot_copy_exit', 'pass/ownership/linear_inline_constructed_argument_claims_exit', 'pass/ownership/runtime_constructed_child_claim_frontier_exit', 'pass/ownership/runtime_completed_case_claim_return_exit', 'pass/traits/public_method_callback_prefix_inference_exit');negative=('fail/ownership/whole_borrowed_missing_repair', 'fail/ownership/whole_linear_parent_move_keeps_unique_custody', 'fail/ownership/selected_linear_source_missing_drop', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority', 'fail/cases/constructor_subject_range_neighbor_not_evidence', 'fail/ownership/linear_array_constructor_duplicate_operand', 'fail/ownership/linear_array_member_scope_loss', 'fail/borrows/shared_observation_does_not_discharge_linear_owner', 'fail/traits/public_method_callback_prefix_wrong_contract');checking_only=('pass/packages/rootless_numeric_provider_review', 'pass/packages/rootless_numeric_provider_consumer', 'pass/float/runtime_classification_result_categories_exit')
          output=Path('build/compiler-pilot/case-call');output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':driver},indent=2)+'\n')
          status=compiler_pilot.run_suite('compiler-pilot/case-call',positive,negative,checking_only=checking_only,phase='prepare')
          raise SystemExit(status)
          PREPARE
      - name: Upload preparation before any program observation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && !cancelled()
        with:
          name: core-float-case-call-preparation-${{ github.run_id }}
          path: build/compiler-pilot/case-call/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
      - name: Observe only the reviewed programs and controls
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        run: |
          python3 - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          sys.path[:0]=[str(Path.cwd()/'tools/ci'),str(Path.cwd()/'tools')]
          import compiler_pilot
          source='9a56192d430558317cb2b15b7b46255da3a3a6f4';driver=os.environ['GITHUB_SHA']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          os.environ['GITHUB_SHA']=source
          assert os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          assert compiler_pilot.corpus_gate.host_target()=='linux_x86_64'
          positive=('pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/ownership/runtime_nested_projected_claim_return_exit', 'pass/ownership/runtime_selective_constructed_owner_custody_exit', 'pass/generics/runtime_generic_carrier_equation_exit', 'pass/core/aggregate_snapshot_copy_exit', 'pass/ownership/linear_inline_constructed_argument_claims_exit', 'pass/ownership/runtime_constructed_child_claim_frontier_exit', 'pass/ownership/runtime_completed_case_claim_return_exit', 'pass/traits/public_method_callback_prefix_inference_exit');negative=('fail/ownership/whole_borrowed_missing_repair', 'fail/ownership/whole_linear_parent_move_keeps_unique_custody', 'fail/ownership/selected_linear_source_missing_drop', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority', 'fail/cases/constructor_subject_range_neighbor_not_evidence', 'fail/ownership/linear_array_constructor_duplicate_operand', 'fail/ownership/linear_array_member_scope_loss', 'fail/borrows/shared_observation_does_not_discharge_linear_owner', 'fail/traits/public_method_callback_prefix_wrong_contract');checking_only=('pass/packages/rootless_numeric_provider_review', 'pass/packages/rootless_numeric_provider_consumer', 'pass/float/runtime_classification_result_categories_exit')
          import base64,hashlib,signal,subprocess,time
          output=Path('build/compiler-pilot/case-call');preparation=json.loads((output/'preparation.json').read_text())
          assert preparation['passed'] and preparation['candidate']==source and preparation['source_exports']
          assert json.loads((output/'driver.json').read_text())=={'source':source,'driver':driver}
          producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
          core=Path('build/compiler-pilot/core');core.mkdir(exist_ok=False)
          payloads={'build.omg': '', 'main.omg': ''};hashes={'build.omg': '966cfcf6d6172db22cff4dad6d0ba4e5f814d149c515dbc30c9159bba6d2ddcf', 'main.omg': 'f5a41a2e939dc08726225562eabc939f7667a470f8a1c2b4a8de093db0a30854'}
          for name,payload in payloads.items():
           data=base64.b64decode(payload,validate=True);assert hashlib.sha256(data).hexdigest()==hashes[name];(core/name).write_bytes(data)
          row={'command':[str(producer.cli),'run','--both','--keep',str((core/'main.omg').resolve())],'budget_seconds':120,'oracle_exit':0,'producer':producer.record(),'inputs':hashes,'passed':False}
          start=time.monotonic()
          with (core/'both.stdout').open('wb') as stdout,(core/'both.stderr').open('wb') as stderr:
           process=subprocess.Popen(row['command'],stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,start_new_session=True)
           try:row['exit']=process.wait(timeout=120)
           except subprocess.TimeoutExpired:
            os.killpg(process.pid,signal.SIGKILL);process.wait();row.update(exit=None,error='Timed out; no passing engine observation.')
          row['seconds']=round(time.monotonic()-start,3)
          try:compiler_pilot.ordinary_cli_fixture.validate_exits(row['exit'],(core/'both.stderr').read_text(errors='replace'),0);row['passed']=True
          except ValueError as error:row['oracle_error']=str(error)
          row['channels']={suffix:{'path':'both.'+suffix,'sha256':hashlib.sha256((core/('both.'+suffix)).read_bytes()).hexdigest()} for suffix in ('stdout','stderr')}
          (core/'observation.json').write_text(json.dumps(row,indent=2)+'\n')
          producer.verify()
          for name,digest in hashes.items():assert hashlib.sha256((core/name).read_bytes()).hexdigest()==digest
          status=compiler_pilot.run_suite('compiler-pilot/case-call',positive,negative,checking_only=checking_only,phase='consume')
          producer.verify()
          ordinary=compiler_pilot.ordinary_cli_fixture.observe(Path.cwd(),producer,'pass/ownership/runtime_whole_borrowed_transform_exit',(Path.cwd()/'build/compiler-pilot/ordinary/0').resolve())
          producer.verify()
          passed=status==0 and row['passed'] and ordinary['passed']
          Path('build/compiler-pilot/scope.json').write_text(json.dumps({'source':source,'driver':driver,'producer':producer.record(),'source_exports':preparation['source_exports'],'suite_exit':status,'core':row,'ordinary':[ordinary],'passed':passed,'retained_prior_evidence':'Actual af5c aggregate-alias ordinary 0/0 stays at its original producer; conditional consumer applicability is independently reviewed. It is not a current-source execution.'},indent=2)+'\n')
          raise SystemExit(0 if passed else 1)
          OBSERVE
      - name: Retain actual observations even when a program fails
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-case-call-observations-${{ github.run_id }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/case-call/producer-*/**
          include-hidden-files: true
          retention-days: 30
