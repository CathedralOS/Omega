name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue.
concurrency:
  group: compiler-pilot-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '2'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check the exact integration candidate
        id: compiler-check
        run: cargo check --locked -p omega
      - name: Check resolved region identity substitution
        if: github.event_name == 'workflow_dispatch' && inputs.samples == '' && inputs.fixtures == '' && inputs.cli_fixtures == ''
        env:
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
          CARGO_PROFILE_TEST_DEBUG: '0'
        run: cargo test --locked -p typed-trees --lib resolved_region_substitution_is_scoped_and_simultaneous -- --nocapture
      - name: Optional executable observations
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python tools/ci/compiler_pilot.py
      - name: Retain strict selected sample engine observations
        if: always() && github.event_name == 'workflow_dispatch' && inputs.samples != '' && steps.compiler-check.outcome == 'success'
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: |
          python - <<'PYTHON'
          import hashlib, json, os, re, shutil, subprocess, sys
          from pathlib import Path
          from tools.ci.compiler_pilot import ROOT, select_samples
          from tools.ci.ordinary_cli_fixture import validate_exits
          from tools import qualification
          from sample_projects import project_at, rejection_verdict
          from sample_native_gate import oracle
          output = ROOT / 'build/compiler-pilot/strict-samples'
          output.mkdir()
          summary = json.loads((output.parent / 'summary.json').read_text())
          producer = summary['producer']
          cli = Path(producer['cli'])
          paths = select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES'])
          inputs = qualification.source_inputs(ROOT, producer['revision'], ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'omega-rust', 'source/library', *paths])
          input_bytes = (json.dumps(inputs, sort_keys=True, indent=2) + '\n').encode()
          (output / 'source-inputs.json').write_bytes(input_bytes)
          rows = []
          for relative in paths:
              project = project_at(ROOT / relative, ROOT)
              record = {'sample': relative, 'producer': producer, 'input_manifest_sha256': hashlib.sha256(input_bytes).hexdigest(), 'passed': False}
              rows.append(record)
              directory = output / relative
              directory.mkdir(parents=True)
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == producer['revision']
              assert not subprocess.check_output(['git', 'status', '--porcelain'])
              assert hashlib.sha256(cli.read_bytes()).hexdigest() == producer['cli_profile']['sha256']
              if project.role == 'intended-invalid':
                  command = [str(cli), '--check', str(project.entry)]
              else:
                  expected, contains = oracle(project.directory)
                  assert expected is not None and contains is None and not (project.directory / 'input.txt').exists()
                  command = [str(cli), 'run', '--both', '--keep', str(project.entry)]
                  record['expected_exit'] = expected
              completed = subprocess.run(command, cwd=directory, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=240)
              (directory / 'command.stdout').write_bytes(completed.stdout)
              (directory / 'command.stderr').write_bytes(completed.stderr)
              record.update(command=command, exit_code=completed.returncode)
              if project.role == 'intended-invalid':
                  passed, reason = rejection_verdict(project, completed.returncode, (completed.stdout + completed.stderr).decode(errors='replace'))
                  record.update(passed=passed, reason=reason)
              else:
                  try:
                      validate_exits(completed.returncode, completed.stderr.decode(errors='replace'), expected)
                      text = completed.stderr.decode(errors='replace')
                      kept = re.search(r'^build dir kept: (.+)$', text, re.MULTILINE)
                      assert kept, 'runtime products missing'
                      shutil.copytree(Path(kept.group(1).strip()), directory / 'products')
                      record['products'] = {path.relative_to(directory / 'products').as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in sorted((directory / 'products').rglob('*')) if path.is_file()}
                      assert (directory / 'products/program.oterm').is_file()
                      record.update(passed=True, native_exit=expected, terminal_exit=expected)
                  except (ValueError, AssertionError, OSError) as error:
                      record['error'] = str(error)
                  lock = project.directory / 'omega.lock'
                  if lock.exists():
                      shutil.copyfile(lock, directory / 'accepted.omega.lock')
              (directory / 'observation.json').write_text(json.dumps(record, indent=2) + '\n')
              print(json.dumps({key: value for key, value in record.items() if key != 'producer'}), flush=True)
          (output / 'observations.json').write_text(json.dumps(rows, indent=2) + '\n')
          assert not subprocess.check_output(['git', 'status', '--porcelain'])
          assert qualification.source_inputs(ROOT, producer['revision'], ['Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'omega-rust', 'source/library', *paths]) == inputs
          assert hashlib.sha256(cli.read_bytes()).hexdigest() == producer['cli_profile']['sha256']
          assert all(row['passed'] for row in rows), 'strict native/Terminal or rejection observation failed'
          PYTHON
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # A source/runtime fixture failure does not invalidate compiled Cargo
      # objects. Retain them for the next correction; check outcomes stay red.
      - name: Save build cache after fixture observations
        if: always() && !cancelled() && steps.compiler-check.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
