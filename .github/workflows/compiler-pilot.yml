name: Replay the independent native custody checks with the retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_COMPILER_CHECK_SITES: '1'
      RETAINED_HOST: linux_x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3a9eedd416e952cbeb70e784a3462d9934dee2d5
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Capture independent custody replay details without rebuilding Rust
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          settings={'source': '3a9eedd416e952cbeb70e784a3462d9934dee2d5', 'tree': '0e1210504972acdd7ea36e51e23facbc0af14f7a', 'inputs': {'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/build.omg': 'e0495d7cd603917ef5c158af669cb43c6c517025f1ce90e0da1c5d308b8efdd6', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/main.omg': 'bea1b52b3810aaacc0fc7868194466cc31f8987eef217e62e22f522d369c836b'}, 'fixtures': ['pass/facts/finite_family_returned_descriptor/saved_source'], 'hosts': {'linux_x86_64': {'run': 41771346652, 'artifact': 'compiler-pilot-linux_x86_64-3a9eedd416e952cbeb70e784a3462d9934dee2d5-1', 'cli_sha256': '9ebc2f592957e726f5f02ffb33d5ee692ad675986b4486dc0a630c83417694c6', 'runner_sha256': '5ef4d5b15c749f83c39d39f4243354c16f584e05fb4adb110409f7a084d3053a'}}}
          source=settings['source'];host=os.environ['RETAINED_HOST'];origin=settings['hosts'][host]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for path,digest in settings['inputs'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])],text=True))
          assert run['head_sha']==origin.get('driver',source) and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])+'/artifacts'],text=True))['artifacts']
          matches=[a for a in artifacts if a['name']==origin['artifact']];assert len(matches)==1
          retained=Path('build/descriptor-native-custody-replay-3a9-producer')
          subprocess.run(['gh','run','download',str(origin['run']),'--name',origin['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==source and original['tree']==settings['tree'] and original['target']==host
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          sys.path.insert(0,'tools/ci');import compiler_pilot
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve())
          assert profile['sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          if 'cli_sha256' in origin:assert profile['sha256']==origin['cli_sha256']
          runner=records[0].parent/Path(original['runner']).name;runner.chmod(0o755)
          runner_profile=compiler_pilot.corpus_gate.require_optimized(runner.resolve())
          assert runner_profile['sha256']==original['runner_profile']['sha256'] and runner_profile['profile']==original['runner_profile']['profile'] and runner_profile['profile']['opt_level']=='1'
          assert runner_profile['sha256']==origin['runner_sha256']
          producer=compiler_pilot.CompilerProducer(source,settings['tree'],host,original['toolchain'],cli.resolve(),runner.resolve(),profile,runner_profile)
          out=Path('build/descriptor-native-custody-replay-3a9');out.mkdir(parents=True,exist_ok=True)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'host':host,'origin_run':origin['run'],'origin_conclusion':run['conclusion'],'artifact':matches[0],'original_producer':original,'actual_profile':profile,'actual_runner_profile':runner_profile,'driver_sha':os.environ.get('GITHUB_SHA'),'actual_checkout':source},indent=2)+'\n')
          # The driver checks out this exact measured source. The workflow-only driver
          # revision remains separately recorded above; it is not a new producer.
          os.environ['GITHUB_SHA']=source
          env=dict(os.environ,OMEGA_CORPUS_ROOT=str(Path.cwd()),OMEGA_CORPUS_NATIVE='1',OMEGA_CORPUS_INTERPRET='1',OMEGA_CORPUS_NATIVE_TARGET=host,OMEGA_CORPUS_FIXTURE_FILTER=','.join(settings['fixtures']),OMEGA_CORPUS_RECORDS=str((out/'runner.records').resolve()))
          with (out/'runner.stdout').open('wb') as stdout,(out/'runner.stderr').open('wb') as stderr:
              observed=subprocess.run([str(runner.resolve())],env=env,stdout=stdout,stderr=stderr,timeout=360)
          rows=[line for line in (out/'runner.stderr').read_text().splitlines() if 'CHECKSITE returned-reference-contract' in line or 'CHECKSITE call-reference-result' in line]
          (out/'reference-mismatch.txt').write_text('\n'.join(rows)+'\n')
          (out/'runner-command.json').write_text(json.dumps({'command':[str(runner.resolve())],'exit':observed.returncode,'environment':{key:value for key,value in env.items() if key.startswith('OMEGA_CORPUS_') or key=='OMEGA_COMPILER_CHECK_SITES'}},indent=2)+'\n')
          assert compiler_pilot.corpus_gate.require_optimized(runner.resolve())==runner_profile
          result=observed.returncode
          assert compiler_pilot.corpus_gate.require_optimized(cli.resolve())==profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raise SystemExit(result)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: descriptor-native-custody-replay-3a9-${{ github.run_id }}
          path: build/descriptor-native-custody-replay-3a9/
          retention-days: 7
