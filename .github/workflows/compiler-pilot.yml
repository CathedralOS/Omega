name: Observe installed entry storage on retained current Mac compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-entry:
    runs-on: macos-15
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      INSTALLED_OBSERVER_DIR: ${{ runner.temp }}/installed-entry-observer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Preserve exact reviewed observer files outside the source checkout
        shell: python
        run: |
          from pathlib import Path
          import hashlib,json,os,subprocess
          root=Path.cwd();stage=Path(os.environ['INSTALLED_OBSERVER_DIR'])
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==os.environ['GITHUB_SHA']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          stage.mkdir(parents=True,exist_ok=False)
          names=['run_installed_entry_mac_retained.py','installed_entry_samples.py','installed_entry_mac_inputs.json','installed_entry_mac_recipe.json']
          digests={}
          for name in names:
              source=root/'.github'/name
              assert source.is_file() and not source.is_symlink()
              data=source.read_bytes();(stage/name).write_bytes(data)
              digests[name]=hashlib.sha256(data).hexdigest()
          (stage/'staged-observer.json').write_text(json.dumps({'observer':os.environ['GITHUB_SHA'],'files':digests},indent=2)+chr(10))
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 062d0753ff087261229656f1b646aaec2d0961f8
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin the published source boundary
        run: git fetch --no-tags --depth=1 origin c35f4550249860b906dc7819989f879b09acc66b:refs/remotes/origin/main
      - name: Authenticate original producer and observe the independent installed-entry scope
        shell: python
        run: |
          from pathlib import Path
          import os,subprocess,sys
          stage=Path(os.environ['INSTALLED_OBSERVER_DIR']);output=Path('build');output.mkdir(exist_ok=True)
          command=[sys.executable,str(stage/'run_installed_entry_mac_retained.py'),'--recipe',str(stage/'installed_entry_mac_recipe.json')]
          with (output/'installed-entry-macos-062.stdout').open('wb') as out,(output/'installed-entry-macos-062.stderr').open('wb') as err:
              result=subprocess.run(command,stdin=subprocess.DEVNULL,stdout=out,stderr=err)
          raise SystemExit(result.returncode)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-macos-062-observations-${{ github.run_id }}
          path: |
            build/installed-entry-macos-062/
            !build/installed-entry-macos-062/retained/**
            build/installed-entry-macos-062.stdout
            build/installed-entry-macos-062.stderr
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
