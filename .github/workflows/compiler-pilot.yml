name: Inspect retained native layout failure
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6faefa22775b2f7a3e8f2337b1fbf673af476ef1
          persist-credentials: false
      - name: Inspect exact retained artifact with its verified CLI
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,hashlib,subprocess,sys
          settings={'source': '6faefa22775b2f7a3e8f2337b1fbf673af476ef1', 'tree': 'a118d651e67f63d599f1d0251c5b794b5b1bb90e', 'run': 41723245716, 'artifact': 'compiler-pilot-linux_x86_64-6faefa22775b2f7a3e8f2337b1fbf673af476ef1-1', 'cli_sha256': '6eb32ae5afda220d1f0edce8cc82e2baa31734453d5d1cc966ff6b43e14fff73', 'terminal_suffix': 'both/pass/facts/selected_native_code_layout_through_local_exit/linux_x86_64/terminal.psi'}
          out=Path('build/code-layout-inspection');out.mkdir(parents=True,exist_ok=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==settings['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          retained=Path('build/retained-code-layout-inspection')
          subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          executables=list(retained.glob('**/omega'));assert len(executables)==1
          cli=executables[0].resolve();cli.chmod(0o755)
          sys.path.insert(0,'tools');import corpus_gate
          profile=corpus_gate.require_optimized(cli);assert profile['sha256']==settings['cli_sha256'] and profile['profile']['opt_level']=='1'
          artifacts=[p for p in retained.glob('**/terminal.psi') if str(p).endswith(settings['terminal_suffix'])];assert len(artifacts)==1
          artifact=artifacts[0]
          command=[str(cli),'inspect-terminal','--artifact',str(artifact.resolve())]
          with (out/'terminal.txt').open('w') as stdout,(out/'inspection.stderr').open('w') as stderr:
           result=subprocess.run(command,stdout=stdout,stderr=stderr)
          record=dict(settings=settings,profile=profile,command=command,exit=result.returncode,terminal_sha256=hashlib.sha256(artifact.read_bytes()).hexdigest())
          (out/'inspection.json').write_text(json.dumps(record,indent=2)+'\n')
          print(record,flush=True)
          assert result.returncode==0
          assert corpus_gate.require_optimized(cli)==profile
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: code-layout-retained-inspection-${{ github.run_id }}
          path: build/code-layout-inspection/
