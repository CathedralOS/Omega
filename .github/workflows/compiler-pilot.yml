name: Qualify selected Build execution and source reuse after main integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_SDK_SOURCE: 13c6c6688a7a4947bc95992ab37ef52a65d29a27
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 13c6c6688a7a4947bc95992ab37ef52a65d29a27
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and observe the existing SDK workflows
        run: |
          python3 - <<'SDK'
          """Observe all five public SDK workflows and retain every actual result."""
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          
          root=Path.cwd()
          sys.path.insert(0,str(root/'tools'))
          sys.path.insert(0,str(root/'tools/ci'))
          import build_consent_controls as controls
          import build_slot,compiler_profile
          
          output=root/'build/compiler-pilot/sdk-workflows'
          output.mkdir(parents=True,exist_ok=False)
          revision=controls.git('rev-parse','HEAD')
          assert revision==os.environ['OMEGA_SDK_SOURCE']
          assert not controls.git('status','--porcelain')
          report={'source':revision,'tree':controls.git('rev-parse','HEAD^{tree}'),'driver':os.environ['GITHUB_SHA'],'target':controls.host_target(),'toolchain':subprocess.check_output(['rustc','-Vv'],text=True).strip(),'passed':False,'observations':[],'trace_flags':{}}
          files=subprocess.check_output(['git','ls-files','source/library','omega-rust/omega/compilation/compiler/examples','omega-rust/omega/compilation/compiler/tests/support'],text=True).splitlines()
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          profiles={}
          binaries={}
          def verify():
              assert controls.git('rev-parse','HEAD')==revision and not controls.git('status','--porcelain')
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
              for name,binary in binaries.items():assert compiler_profile.require_optimized(binary)==profiles[name],name
          
          try:
              with build_slot.hold(root):
                  for name in ['default_build','build_charge']:
                      build_started=time.monotonic()
                      binary,cargo_profile=controls.build(output,name,['build','--locked','-p','compiler','--example',name])
                      binaries[name]=binary
                      profiles[name]=compiler_profile.require_optimized(binary)
                      report.setdefault('builds',[]).append({'example':name,'seconds':round(time.monotonic()-build_started,3)})
                      assert str(cargo_profile['opt_level'])==profiles[name]['profile']['opt_level']
              report['producer']={'revision':revision,'tree':report['tree'],'executables':profiles}
              report['inputs']=inputs
              (output/'producer.json').write_text(json.dumps(report['producer'],indent=2)+'\n')
              scopes=[('default_build',[]),('build_charge',['--owned-activations']),('build_charge',['--restricted-consent']),('build_charge',['--one-shot']),('build_charge',['--accounting'])]
              for index,(name,args) in enumerate(scopes):
                  verify()
                  label=str(index)+'-'+name+('-'+args[0][2:] if args else '')
                  command=[str(binaries[name]),*args]
                  started=time.monotonic()
                  observation={'command':command,'label':label,'source':revision,'producer_profile':profiles[name]}
                  try:
                      controls.execute(binaries[name],args,output,label)
                      observation.update(exit=0)
                  except subprocess.CalledProcessError as error:
                      observation.update(exit=error.returncode,error='The existing SDK workflow failed; its raw channels are retained.')
                  except subprocess.TimeoutExpired as error:
                      for suffix,data in [('stdout',error.stdout),('stderr',error.stderr)]:
                          (output/(label+'.'+suffix)).write_bytes(data if isinstance(data,bytes) else (data or '').encode())
                      observation.update(exit=None,error='The existing SDK workflow timed out; no passing result is inferred.')
                  observation['seconds']=round(time.monotonic()-started,3)
                  observation['channels']={suffix:{'path':label+'.'+suffix,'sha256':hashlib.sha256((output/(label+'.'+suffix)).read_bytes()).hexdigest()} for suffix in ['stdout','stderr']}
                  report['observations'].append(observation)
                  verify()
              report['passed']=all(row['exit']==0 for row in report['observations'])
          finally:
              (output/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps({'source':revision,'passed':report['passed'],'observations':[{k:r[k] for k in ['label','exit','seconds']} for r in report['observations']]},indent=2))
          raise SystemExit(0 if report['passed'] else 1)
          SDK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-sdk-workflows-${{ github.run_id }}
          path: build/compiler-pilot/sdk-workflows/
          retention-days: 30
      - name: Observe the exact integrated controls, both engines and ordinary CLI
        if: always()
        env:
          OMEGA_CORPUS_JOBS: '1'
        run: |
          python3 - <<'FEATURE'
          from pathlib import Path
          import json,os,sys,time
          sys.path.insert(0,str(Path.cwd()/'tools/ci'))
          import compiler_pilot
          source='13c6c6688a7a4947bc95992ab37ef52a65d29a27'
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source
          assert not compiler_pilot.command(['git','status','--porcelain'])
          output=Path('build/compiler-pilot/selected-execution');output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':os.environ['GITHUB_SHA']},indent=2)+'\n')
          os.environ['GITHUB_SHA']=source
          producer=compiler_pilot.prepare_producer(output)
          producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/integrated-controls',('pass/traits/named_contract_arithmetic_refinement', 'pass/traits/float_contract_refinement_boundaries_exit', 'pass/providers/inline_member_generic_requirement_exit', 'pass/providers/generic_required_instance_roster_exit', 'pass/providers/canonical_inherited_provider_instances_exit', 'pass/providers/occurrence_region_binding_forwarding_exit', 'pass/build/runtime_opaque_by_value_selected_exit', 'pass/facts/exclusive_observation_exposure_through_local_exit', 'pass/float/runtime_classification_result_categories_exit'),('fail/traits/inline_boundary_member_unproved', 'fail/providers/provider_type_slot_unknown', 'fail/traits/member_omits_requirement_ensures', 'fail/traits/exact_application_keeps_parameter_types', 'fail/providers/inline_member_sibling_requirement_rejected', 'fail/providers/inherited_provider_erased_regions', 'fail/providers/occurrence_region_binding_conflicting_inputs', 'fail/build/float_default_wrong_value', 'fail/packages/rootless_numeric_provider_missing_satisfaction', 'fail/traits/conformance_reference_row_retired', 'fail/build/opaque_descriptor_host_type_use', 'fail/build/opaque_descriptor_invalid_carrier', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/core/content_conservation_changed_arrival', 'fail/facts/exclusive_observation_exposure_through_local_rejected'),checking_only=('pass/packages/rootless_numeric_provider_review',),producer=producer)
          summary=json.loads(Path('build/compiler-pilot/integrated-controls/summary.json').read_text())
          if not summary.get('source_exports') or not any(stage['name']=='retain measured source' and stage['passed'] for stage in summary['stages']):
              raise ValueError('Current-source export is incomplete; later observations cannot claim its custody')
          rows=[]
          for index,fixture in enumerate(['pass/traits/named_contract_arithmetic_refinement', 'pass/traits/float_contract_refinement_boundaries_exit', 'pass/providers/inline_member_generic_requirement_exit', 'pass/providers/occurrence_region_binding_forwarding_exit', 'pass/build/runtime_opaque_by_value_selected_exit', 'pass/facts/exclusive_observation_exposure_through_local_exit', 'pass/float/runtime_classification_result_categories_exit']):
              producer.verify()
              row=compiler_pilot.ordinary_cli_fixture.observe(Path.cwd(),producer,fixture,Path('build/compiler-pilot/ordinary')/str(index))
              rows.append(row)
              (output/'ordinary.json').write_text(json.dumps(rows,indent=2)+'\n')
          producer.verify()
          report={'source':source,'producer':producer.record(),'source_exports':summary['source_exports'],'source_suite_exit':status,'ordinary':[{k:r.get(k) for k in ['fixture','passed','error','native_exit','terminal_exit']} for r in rows],'passed':status==0 and all(r['passed'] for r in rows)}
          (output/'scope.json').write_text(json.dumps(report,indent=2)+'\n')
          raise SystemExit(0 if report['passed'] else 1)
          FEATURE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-pilot-integrated-${{ github.run_id }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/sdk-workflows/
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
