name: Observe owned-field programs with a retained optimized compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 17be13e1a9ff1489ac3a0422c1e011cef9591898
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the original producer and observe the frozen programs
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          settings={'label': 'owned-field-current-17be-83e', 'run': 41874695966, 'artifact': 'compiler-regression-Linux-X64-83e3d72bad8bd79a17111831811aaf3b975af8ab-1', 'producer_source': '83e3d72bad8bd79a17111831811aaf3b975af8ab', 'producer_tree': 'da8cb6538e3275b3c3db293eb6e759a2c7c9ce1d', 'program_source': '17be13e1a9ff1489ac3a0422c1e011cef9591898', 'program_tree': 'c132d08ebcfff5592ce2021d1765be213fafae52', 'original_producer': {'revision': '83e3d72bad8bd79a17111831811aaf3b975af8ab', 'tree': 'da8cb6538e3275b3c3db293eb6e759a2c7c9ce1d', 'target': 'linux_x86_64', 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\nbinary: rustc\ncommit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\ncommit-date: 2026-09-03\nhost: x86_64-unknown-linux-gnu\nrelease: 1.100.0-nightly\nLLVM version: 23.1.1', 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/omega', 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/corpus_runner', 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/omega', 'sha256': '9162b8cf05bd198c98d050020313325337bb4c40c9b06a794e2f5a3f4bbb0ced', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/corpus_runner', 'sha256': '5fdd1a44f3d57caa4124a4bf09c3f6716a52f75e6a959bde38f9986008fa517c', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}}, 'objects': {'omega-rust': '2ae0641a6a5e281ecd5cc6980e68ee885fa72647', 'source/library': 'c0f12a0920db3e54ed7efba46f5b8ec1a6d29765', 'tools': '68dd6fda8c6761a0adca970813d6429f695b9545', '.github': 'bae01e4f85b7173fa6cce374bf7bc9a924654a71', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'}, 'program_objects': {'omega-rust': '2ae0641a6a5e281ecd5cc6980e68ee885fa72647', 'source/library': 'c0f12a0920db3e54ed7efba46f5b8ec1a6d29765', 'tools': '68dd6fda8c6761a0adca970813d6429f695b9545', '.github': 'bae01e4f85b7173fa6cce374bf7bc9a924654a71', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'}, 'baseline': False, 'sample_root': 'samples/cli/facts/finite_family_owned_field', 'samples': ['samples/cli/facts/finite_family_owned_field/local', 'samples/cli/facts/finite_family_owned_field/local/invalid', 'samples/cli/facts/finite_family_owned_field/field', 'samples/cli/facts/finite_family_owned_field/field/invalid', 'samples/cli/facts/finite_family_owned_field/parameter', 'samples/cli/facts/finite_family_owned_field/parameter/invalid', 'samples/cli/facts/finite_family_owned_field/call_result', 'samples/cli/facts/finite_family_owned_field/call_result/invalid', 'samples/cli/facts/finite_family_owned_field/match_join', 'samples/cli/facts/finite_family_owned_field/match_join/invalid', 'samples/cli/facts/finite_family_owned_field/const_name', 'samples/cli/facts/finite_family_owned_field/const_name/invalid', 'samples/cli/facts/finite_family_owned_field/other_state', 'samples/cli/facts/finite_family_owned_field/other_state/invalid', 'samples/cli/facts/finite_family_owned_field/other_machine', 'samples/cli/facts/finite_family_owned_field/other_machine/invalid', 'samples/cli/facts/finite_family_owned_field/target_body', 'samples/cli/facts/finite_family_owned_field/target_body/invalid'], 'fixtures': ['pass/facts/finite_family_owned_field/local', 'pass/facts/finite_family_owned_field/field', 'pass/facts/finite_family_owned_field/parameter', 'pass/facts/finite_family_owned_field/call_result', 'pass/facts/finite_family_owned_field/match_join', 'pass/facts/finite_family_owned_field/const_name', 'pass/facts/finite_family_owned_field/other_state', 'pass/facts/finite_family_owned_field/other_machine', 'pass/facts/finite_family_owned_field/target_body', 'fail/facts/finite_family_owned_field/local', 'fail/facts/finite_family_owned_field/field', 'fail/facts/finite_family_owned_field/parameter', 'fail/facts/finite_family_owned_field/call_result', 'fail/facts/finite_family_owned_field/match_join', 'fail/facts/finite_family_owned_field/const_name', 'fail/facts/finite_family_owned_field/other_state', 'fail/facts/finite_family_owned_field/other_machine', 'fail/facts/finite_family_owned_field/target_body'], 'meaning': 'Retained original compiler identity and original producer record. Program source is separate. Source checking and sample BOTH observations are fresh; no Rust build or relabeled producer.'}
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_source'] and run['status']=='completed'
          retained=out/'retained';subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.rglob('producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']=='linux_x86_64'
          sys.path.insert(0,'tools/ci');import compiler_pilot
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=subprocess.check_output(['git','ls-files','source/library',settings['sample_root'],'tests/omega/pass/facts/finite_family_owned_field','tests/omega/fail/facts/finite_family_owned_field'],text=True).splitlines()
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=SimpleNamespace(cli=cli,runner=runner,target='linux_x86_64',verify=verify,record=lambda:original)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          refusals=[]
          fixtures=tuple(settings['fixtures'])
          positives=tuple(p for p in fixtures if p.startswith('pass/'))
          for leg,selection,both in [('checking',fixtures,False),('both',positives,True)]:
              report=out/(leg+'.json')
              command=[sys.executable,'tools/corpus_gate.py','--runner',str(runner),'--filter',','.join(selection),'--json',str(report),'--golden',str(compiler_pilot.observation_golden(out,both=both,target='linux_x86_64'))]
              if both:command.append('--both')
              result=subprocess.run(command,env=dict(os.environ,OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_SWEEP='1',OMEGA_CORPUS_CAPTURE_ARTIFACTS=str(out/(leg+'-artifacts'))))
              try:
                  assert result.returncode in [0,1]
                  compiler_pilot.validate_report(json.loads(report.read_text()),selection,both=both,revision=settings['program_source'],target='linux_x86_64')
              except (AssertionError,ValueError,OSError) as error:refusals.append(leg+': '+str(error))
              verify()
          report=out/'samples.json'
          result=subprocess.run([sys.executable,'tools/sample_native_gate.py','--cli',str(cli),'--facts','--jobs','1','--target','linux_x86_64','--filter',','.join(settings['samples']),'--write-results',str(report)])
          try:
              rows=json.loads(report.read_text());assert result.returncode==0 and len(rows)==len(settings['samples']) and {r['sample'] for r in rows}==set(settings['samples'])
              for row in rows:
                  if row['sample'].endswith('/invalid'):
                      assert row.get('role')=='intended-invalid' and row.get('state')=='rejected' and row.get('detail')=='intended rejection matched' and 'execution' not in row
                  else:
                      assert row.get('state')=='pass' and row.get('execution')=={'native_exit':0,'interpreter_exit':0}
          except (AssertionError,ValueError,OSError) as error:refusals.append('Samples: '+str(error))
          verify()
          (out/'summary.json').write_text(json.dumps({'passed':not refusals,'refusals':refusals,'program_source':settings['program_source'],'producer_source':settings['producer_source'],'producer':original,'driver':os.environ['GITHUB_SHA'],'input_count':len(inputs),'builds_rust':False},indent=2)+'\n')
          raise SystemExit(bool(refusals))
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-field-current-17be-83e-${{ github.run_id }}
          path: |
            build/owned-field-current-17be-83e/*.json
            build/owned-field-current-17be-83e/checking-artifacts/
            build/owned-field-current-17be-83e/both-artifacts/
            build/owned-field-current-17be-83e/ordinary-cli/
          retention-days: 7
