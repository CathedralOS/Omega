name: Compiler pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-caller-diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      CARGO_TARGET_DIR: D:/ot
      OMEGA_CORPUS_FIXTURE_SECS: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preserve the exact observer outside the source checkout
        shell: python
        run: |
          from pathlib import Path
          import hashlib, os
          dst = Path(os.environ['RUNNER_TEMP']) / 'atomic-source-caller-observer'
          dst.mkdir(exist_ok=False)
          files = {
              '.github/observers/windows_source_callers_cc7.py': ('observer.py', '6222d4ce0d461bf7621fc792cd9f2ec0c5e2564f7eaff4a3762bf69c75d9efbd'),
              '.github/observers/windows-source-callers-cc7-recipe.json': ('recipe.json', 'e189846b1585a816326634e4f1a6e1bb40a3be2f7db94624790abd54623afa07'),
          }
          for source, (target, expected) in files.items():
              data = Path(source).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected
              (dst / target).write_bytes(data)
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write('OMEGA_DEBUG_START_DIRECTORY=' + str(dst) + '\n')
      - name: Restore the exact compiled source without rebuilding
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cc7dad262fd756c3ea8eae3244a7e357823d018a
          persist-credentials: false
      - name: Restore only the exact retained compiler cache
        id: symbols-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            D:/ot
          key: compiler-pilot-Windows-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-cc7dad262fd756c3ea8eae3244a7e357823d018a
          fail-on-cache-miss: true
      - name: Capture two acknowledged Source runner caller snapshots
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OMEGA_DEBUG_START_OBSERVER: ${{ github.sha }}
          OMEGA_DEBUG_START_CACHE_HIT: ${{ steps.symbols-cache.outputs.cache-hit }}
          OMEGA_DEBUG_START_CACHE_KEY: ${{ steps.symbols-cache.outputs.cache-matched-key }}
        shell: python
        run: |
          from pathlib import Path
          import os, subprocess, sys
          root = Path(os.environ['OMEGA_DEBUG_START_DIRECTORY'])
          raise SystemExit(subprocess.call([sys.executable, str(root / 'observer.py'), str(root / 'recipe.json')]))
      - name: Retain all setup and debugger findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atomic-windows-source-callers-cc7-${{ github.run_id }}
          path: build/atomic-windows-source-callers-cc7/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
