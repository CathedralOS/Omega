name: Check the remaining SDK paths and exact inline formation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_SDK_SOURCE: 0f249c862b93b0989a28e99904bba3f33125fa9a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0f249c862b93b0989a28e99904bba3f33125fa9a
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and observe the existing SDK workflows
        run: |
          python3 - <<'SDK'
          """Observe all five public SDK workflows and retain every actual result."""
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          
          root=Path.cwd()
          sys.path.insert(0,str(root/'tools'))
          sys.path.insert(0,str(root/'tools/ci'))
          import build_consent_controls as controls
          import build_slot,compiler_profile
          
          output=root/'build/compiler-pilot/sdk-workflows'
          output.mkdir(parents=True,exist_ok=False)
          revision=controls.git('rev-parse','HEAD')
          assert revision==os.environ['OMEGA_SDK_SOURCE']
          assert not controls.git('status','--porcelain')
          report={'source':revision,'tree':controls.git('rev-parse','HEAD^{tree}'),'driver':os.environ['GITHUB_SHA'],'target':controls.host_target(),'toolchain':subprocess.check_output(['rustc','-Vv'],text=True).strip(),'passed':False,'observations':[],'trace_flags':{}}
          provider_fixture='tests/omega/pass/providers/occurrence_region_binding_forwarding_exit'
          files=subprocess.check_output(['git','ls-files','source/library','omega-rust/omega/compilation/compiler/examples','omega-rust/omega/compilation/compiler/tests/support'],text=True).splitlines()
          files.extend([provider_fixture+'/main.omg',provider_fixture+'/build.omg'])
          ''
          files.extend(['tests/omega/fail/proofs/quotient_representative_admitted_closure_rejected/main.omg', 'tests/omega/fail/proofs/quotient_representative_admitted_closure_rejected/expected.txt', 'tests/omega/fail/traits/member_omits_requirement_ensures/main.omg', 'tests/omega/fail/traits/member_omits_requirement_ensures/expected.txt', 'tests/omega/pass/traits/named_contract_arithmetic_refinement/main.omg', 'tests/omega/pass/traits/named_contract_arithmetic_refinement/build.omg', 'tests/omega/pass/traits/named_contract_arithmetic_refinement/expected_native_exit.txt'])
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          objects={p:controls.git('rev-parse',revision+':'+p) for p in ['omega-rust','source/library','tools','.github','Cargo.toml','Cargo.lock','rust-toolchain.toml','tests/omega']}
          report['source_objects']=objects
          profiles={}
          binaries={}
          def verify():
              assert controls.git('rev-parse','HEAD')==revision and not controls.git('status','--porcelain')
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
              for p,obj in objects.items():assert controls.git('rev-parse',revision+':'+p)==obj,p
              for name,binary in binaries.items():assert compiler_profile.require_optimized(binary)==profiles[name],name
          
          try:
              with build_slot.hold(root):
                  for name in ['default_build','build_charge','omega']:
                      build_started=time.monotonic()
                      binary,cargo_profile=controls.build(output,name,['build','--locked','-p','omega'] if name=='omega' else ['build','--locked','-p','compiler','--example',name])
                      binaries[name]=binary
                      profiles[name]=compiler_profile.require_optimized(binary)
                      report.setdefault('builds',[]).append({'example':name,'seconds':round(time.monotonic()-build_started,3)})
                      assert str(cargo_profile['opt_level'])==profiles[name]['profile']['opt_level']
              report['producer']={'revision':revision,'tree':report['tree'],'executables':profiles}
              report['inputs']=inputs
              (output/'producer.json').write_text(json.dumps(report['producer'],indent=2)+'\n')
              scopes=[{'label': '0-default_build', 'binary': 'default_build', 'arguments': [], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}, {'label': '1-build_charge-owned-activations', 'binary': 'build_charge', 'arguments': ['--owned-activations'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}, {'label': '2-build_charge-restricted-consent', 'binary': 'build_charge', 'arguments': ['--restricted-consent'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}, {'label': '3-build_charge-one-shot', 'binary': 'build_charge', 'arguments': ['--one-shot'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}, {'label': '4-build_charge-accounting', 'binary': 'build_charge', 'arguments': ['--accounting'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}, {'label': '5-borrowed-provider-runtime', 'binary': 'omega', 'arguments': ['run', '--both', '--target', 'linux_x86_64', 'tests/omega/pass/providers/occurrence_region_binding_forwarding_exit/main.omg'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {'OMEGA_PROVIDER_DEBUG': '1'}}, {'label': '6-inline-body-formation', 'binary': 'omega', 'arguments': ['--check', 'tests/omega/fail/proofs/quotient_representative_admitted_closure_rejected/main.omg'], 'expected_exit': 1, 'required_stderr': ['inline member `ObservationRoute::observe` requires a checked body or an admitted external realization'], 'trace_flags': {}}, {'label': '7-omitted-public-guarantee', 'binary': 'omega', 'arguments': ['--check', 'tests/omega/fail/traits/member_omits_requirement_ensures/main.omg'], 'expected_exit': 1, 'required_stderr': ['machine `Grow::shrink` realizes `Shrink::shrink` but does not guarantee its `ensures result <= value`'], 'trace_flags': {}}, {'label': '8-forwarding-runtime', 'binary': 'omega', 'arguments': ['run', '--both', '--target', 'linux_x86_64', 'tests/omega/pass/traits/named_contract_arithmetic_refinement/main.omg'], 'expected_exit': 0, 'required_stderr': [], 'trace_flags': {}}]
              for scope in scopes:
                  name=scope["binary"];args=scope["arguments"]
                  verify()
                  label=scope['label']
                  trace_flags=scope['trace_flags']
                  assert not any(key.startswith('OMEGA_') and 'TRACE' in key for key in os.environ)
                  assert 'OMEGA_PROVIDER_DEBUG' not in os.environ
                  os.environ.update(trace_flags)
                  command=[str(binaries[name]),*args]
                  started=time.monotonic()
                  observation={'command':command,'label':label,'source':revision,'producer_profile':profiles[name],'trace_flags':trace_flags,'oracle':{'exit':scope['expected_exit'],'required_stderr':scope['required_stderr']}}
                  try:
                      controls.execute(binaries[name],args,output,label)
                      observation.update(exit=0)
                  except subprocess.CalledProcessError as error:
                      observation.update(exit=error.returncode,error='The existing SDK workflow failed; its raw channels are retained.')
                  except subprocess.TimeoutExpired as error:
                      for suffix,data in [('stdout',error.stdout),('stderr',error.stderr)]:
                          (output/(label+'.'+suffix)).write_bytes(data if isinstance(data,bytes) else (data or '').encode())
                      observation.update(exit=None,error='The existing SDK workflow timed out; no passing result is inferred.')
                  assert all(os.environ.get(k)==v for k,v in trace_flags.items())
                  for key in trace_flags:del os.environ[key]
                  observation['seconds']=round(time.monotonic()-started,3)
                  observation['channels']={suffix:{'path':label+'.'+suffix,'sha256':hashlib.sha256((output/(label+'.'+suffix)).read_bytes()).hexdigest()} for suffix in ['stdout','stderr']}
                  stderr=(output/(label+'.stderr')).read_text()
                  observation['passed']=observation['exit']==scope['expected_exit'] and all(fragment in stderr for fragment in scope['required_stderr'])
                  report['observations'].append(observation)
                  verify()
              report['passed']=all(row['passed'] for row in report['observations'])
          finally:
              (output/'summary.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps({'source':revision,'passed':report['passed'],'observations':[{k:r[k] for k in ['label','exit','seconds']} for r in report['observations']]},indent=2))
          raise SystemExit(0 if report['passed'] else 1)
          SDK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-vacant-home-${{ github.run_id }}
          path: build/compiler-pilot/sdk-workflows/
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
