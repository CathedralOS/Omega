name: Diagnose unresolved returned-reference cleanup

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue.
concurrency:
  group: compiler-pilot-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '2'
      RUST_MIN_STACK: '67108864'
      OMEGA_COMPILER_CHECK_SITES: '1'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 96983d0c9d33223683d699cb524c27e7427c9620
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && inputs.cli_fixtures != ''
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the exact integration candidate
        id: compiler-check
        run: cargo check --locked -p omega
      - name: Optional executable observations
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        run: |
          mkdir -p build/compiler-pilot
          python -c "import json,os; from pathlib import Path; Path('build/compiler-pilot/driver-source.json').write_text(json.dumps({'driver':os.environ['GITHUB_SHA'],'source':'96983d0c9d33223683d699cb524c27e7427c9620','purpose':'Diagnostic output only; the compiler is built from the exact checked-out source.'})+'\n')"
          GITHUB_SHA=96983d0c9d33223683d699cb524c27e7427c9620 python tools/ci/compiler_pilot.py
      - name: Preserve the exact return cleanup observations
        if: always()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import gzip,hashlib,json,os,subprocess,sys
          out=Path('build/compiler-pilot');summary=json.loads((out/'summary.json').read_text());producer=summary['producer']
          assert producer['revision']=='96983d0c9d33223683d699cb524c27e7427c9620' and producer['tree']=='10881b273f73858bf7fe369e9454bd52670a15b6'
          sys.path.insert(0,'tools/ci');import compiler_pilot
          runner=Path(producer['runner']);profile=compiler_pilot.corpus_gate.require_optimized(runner)
          assert profile==producer['runner_profile']
          fixtures=['pass/facts/finite_family_returned_descriptor/replaced_source','pass/facts/finite_family_returned_descriptor/saved_source']
          env=dict(os.environ,OMEGA_CORPUS_ROOT=str(Path.cwd()),OMEGA_CORPUS_NATIVE='1',OMEGA_CORPUS_INTERPRET='1',OMEGA_CORPUS_NATIVE_TARGET='linux_x86_64',OMEGA_CORPUS_FIXTURE_FILTER=','.join(fixtures),OMEGA_CORPUS_RECORDS=str((out/'cleanup-runner.records').resolve()))
          stderr=out/'cleanup-runner.stderr'
          with (out/'cleanup-runner.stdout').open('wb') as stdout,stderr.open('wb') as errors:
              observed=subprocess.run([str(runner.resolve())],env=env,stdout=stdout,stderr=errors,timeout=360)
          raw=stderr.read_bytes();compressed=gzip.compress(raw,mtime=0)
          (out/'cleanup-runner.stderr.gz').write_bytes(compressed)
          (out/'reference-mismatch.txt').write_text('\n'.join(line for line in raw.decode().splitlines() if 'CHECKSITE returned-reference-completion' in line)+'\n')
          (out/'cleanup-runner-command.json').write_text(json.dumps({'source':'96983d0c9d33223683d699cb524c27e7427c9620','tree':'10881b273f73858bf7fe369e9454bd52670a15b6','command':[str(runner)],'exit':observed.returncode,'fixtures':fixtures,'raw_stderr_sha256':hashlib.sha256(raw).hexdigest(),'raw_stderr_bytes':len(raw),'gzip_sha256':hashlib.sha256(compressed).hexdigest(),'gzip_bytes':len(compressed),'profile':profile},indent=2)+'\n')
          stderr.unlink()
          assert compiler_pilot.corpus_gate.require_optimized(runner)==profile
          PYTHON
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7
      # A source/runtime fixture failure does not invalidate compiled Cargo
      # objects. Retain them for the next correction; check outcomes stay red.
      - name: Save build cache after fixture observations
        if: always() && !cancelled() && steps.compiler-check.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
