name: Retained returned-field baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4c693b8b0f429a49b3f2d77a331bad656d8cda4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe one existing program with the authenticated baseline producer
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys,time
          settings={'source': 'd4c693b8b0f429a49b3f2d77a331bad656d8cda4', 'tree': '3e808847cdc3b58c75b290bf676dc14429628983', 'run': 41705562039, 'artifact': 'compiler-pilot-linux_x86_64-d4c693b8b0f429a49b3f2d77a331bad656d8cda4-1', 'profile': {'sha256': 'ed4923cc2b62ab7e7195f49be018f45dcc6978d5172955231ee4b11ffc695fbe', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'fixture': 'pass/borrows/returned_record_byte_field_store_exit', 'inputs': {'tests/omega/pass/borrows/returned_record_byte_field_store_exit/build.omg': '82bc85509ef6ec38be4c5a1c8c4ae9cf04df1896c45b8ac97a29021a842dfad3', 'tests/omega/pass/borrows/returned_record_byte_field_store_exit/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0', 'tests/omega/pass/borrows/returned_record_byte_field_store_exit/main.omg': 'f64a33baee43452e5e2fd7690a6e0a1c6cad465ab3456dd1675d63d7a35258f8'}}
          out=Path('build/returned-field-published');out.mkdir(parents=True,exist_ok=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==settings['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for p,h in settings['inputs'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          retained=Path('build/retained-baseline-producer')
          subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          runners=list(retained.glob('**/corpus_runner'));assert len(runners)==1
          runner=runners[0].resolve();runner.chmod(0o755)
          sys.path.insert(0,'tools');import corpus_gate
          profile=corpus_gate.require_optimized(runner)
          assert profile['sha256']==settings['profile']['sha256'] and profile['profile']['opt_level']=='1'
          (out/'producer.json').write_text(json.dumps({'settings':settings,'actual_profile':profile,'platform':platform.platform()},indent=2)+'\n')
          command=[sys.executable,'tools/corpus_gate.py','--runner',str(runner),'--both','--filter',settings['fixture'],'--json',str(out/'both.json')]
          start=time.monotonic()
          with (out/'both.stdout').open('w') as stdout,(out/'both.stderr').open('w') as stderr:
           result=subprocess.run(command,env=dict(os.environ,OMEGA_CORPUS_JOBS='1'),stdout=stdout,stderr=stderr)
          record={'command':command,'exit':result.returncode,'seconds':time.monotonic()-start,'actual_source':settings['source'],'producer_profile':profile,'workers':1,'fixture_timeout_seconds':120}
          (out/'observation.json').write_text(json.dumps(record,indent=2)+'\n')
          assert corpus_gate.require_optimized(runner)==profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          print(json.dumps(record),flush=True)
          print('The recorded compiler result, not this workflow exit, determines the baseline outcome.',flush=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-returned-field-published-${{ github.run_id }}
          path: |
            build/returned-field-published/*.json
            build/returned-field-published/*.stdout
            build/returned-field-published/*.stderr
