name: Observe the older forwarding call with retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 83e3d72bad8bd79a17111831811aaf3b975af8ab
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate original compiler and observe exact call arguments
        shell: bash
        run: |
          python3 - <<'REPLAY'
          """Observe authored forwarding inputs with the original retained 83e producer."""
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, re, stat, subprocess, sys, time, zipfile
          
          settings = {'label': 'forwarding-arguments-baseline-83e', 'run': 41874695966, 'artifact_id': 13346612611, 'artifact': 'compiler-regression-Linux-X64-83e3d72bad8bd79a17111831811aaf3b975af8ab-1', 'artifact_size': 477522236, 'artifact_digest': 'sha256:738a24f45ed72f9b9c343684f38f94ebef69e1feae8e74f8ed95e91d7b12a57a', 'producer_source': '83e3d72bad8bd79a17111831811aaf3b975af8ab', 'producer_tree': 'da8cb6538e3275b3c3db293eb6e759a2c7c9ce1d', 'original_producer': {'revision': '83e3d72bad8bd79a17111831811aaf3b975af8ab', 'tree': 'da8cb6538e3275b3c3db293eb6e759a2c7c9ce1d', 'target': 'linux_x86_64', 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\nbinary: rustc\ncommit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\ncommit-date: 2026-09-03\nhost: x86_64-unknown-linux-gnu\nrelease: 1.100.0-nightly\nLLVM version: 23.1.1', 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/omega', 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/corpus_runner', 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/omega', 'sha256': '9162b8cf05bd198c98d050020313325337bb4c40c9b06a794e2f5a3f4bbb0ced', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-tte2ebq8/corpus_runner', 'sha256': '5fdd1a44f3d57caa4124a4bf09c3f6716a52f75e6a959bde38f9986008fa517c', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}}, 'objects': {'omega-rust': '2ae0641a6a5e281ecd5cc6980e68ee885fa72647', 'source/library': 'c0f12a0920db3e54ed7efba46f5b8ec1a6d29765', 'tools': '68dd6fda8c6761a0adca970813d6429f695b9545', '.github': 'bae01e4f85b7173fa6cce374bf7bc9a924654a71', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'}, 'program_source': 'b6f59629f837f146f5011f6b26aa6135eca5e599', 'source_checkpoint': 'cdfb47f180a4d08f4ba71a4d0eaab3106f88d00b', 'old_forwarding_helpers_sha256': 'ad15ed27ccd2ff5ed9903e68496a9e7a11e9c63933708be4c6afc815292cba52', 'meaning': 'One old-source compiler and its original library, two separately sealed authored programs, no Rust build. The full fixture may reveal an earlier unsupported source construct; the isolated call retains the exact new LiteralRead/echo/LiteralRoute block without the independent-edge fixture. Every actual refusal stays in raw channels.'}
          programs = {'full-fixture': {'main.omg': {'text': '// Expected exit: 0\nboundary trait ExactRead {\n    machine read(value: u8) -> u8\n    reaches\n    ensures result == value;\n}\nboundary trait SecondRead {\n    machine observe(value: u8) -> u8\n    reaches\n    ensures result == value;\n}\ntrait LocalForward {\n    machine forward(value: u8) -> u8\n    ensures result == value;\n}\nReadRoute satisfies LocalForward {\n    machine forward(value: u8) -> u8\n    satisfies ExactRead::read, SecondRead::observe\n    ensures result == value\n    { value }\n}\n// The member passes 7 to echo even when its public caller passes 42.\nboundary trait LiteralRead {\n    machine read(value: u8) -> u8 reaches;\n}\nmachine echo(value: u8) -> u8 satisfies LiteralRead::read reaches { value }\nLiteralRoute satisfies LiteralRead {\n    machine read(value: u8) -> u8 reaches { echo(7u8) }\n}\nmachine main() crashes Trap {\n    let result: u8 = ExactRead::read(7u8);\n    let second: u8 = SecondRead::observe(9u8);\n    let literal: u8 = LiteralRead::read(42u8);\n    transition result == 7u8 && second == 9u8 && literal == 7u8 { true -> done() _ -> bad() }\n    machine done() {}\n    machine bad() { crash Trap; }\n}\n', 'sha256': '077f879ae140fefb5801385ad413e2a9d299ac39093ef509ad3919d23cbd2123'}, 'build.omg': {'text': 'machine build(builder: &mut Build) {\n    Build::application(builder, "inline_exact_boundary_provider");\n    Build::select_provider<ExactRead, ReadRoute>(builder, linux_x86_64);\n    Build::select_provider<SecondRead, ReadRoute>(builder, linux_x86_64);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, linux_x86_64);\n    Build::bind(builder, linux_x86_64::ProgramEntry, main);\n    Build::select_provider<ExactRead, ReadRoute>(builder, linux_arm64);\n    Build::select_provider<SecondRead, ReadRoute>(builder, linux_arm64);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, linux_arm64);\n    Build::bind(builder, linux_arm64::ProgramEntry, main);\n    Build::select_provider<ExactRead, ReadRoute>(builder, macos_arm64);\n    Build::select_provider<SecondRead, ReadRoute>(builder, macos_arm64);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, macos_arm64);\n    Build::bind(builder, macos_arm64::ProgramEntry, main);\n    Build::select_provider<ExactRead, ReadRoute>(builder, windows_x86_64);\n    Build::select_provider<SecondRead, ReadRoute>(builder, windows_x86_64);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, windows_x86_64);\n    Build::bind(builder, windows_x86_64::ProgramEntry, main);\n}\n', 'sha256': '6c3b5d2e525c43949d2299875c281574483d24a2edb0fb092b65a18771f12050'}}, 'isolated-call': {'main.omg': {'text': '// Expected exit: 0\n// The member passes 7 to echo even when its public caller passes 42.\nboundary trait LiteralRead {\n    machine read(value: u8) -> u8 reaches;\n}\nmachine echo(value: u8) -> u8 satisfies LiteralRead::read reaches { value }\nLiteralRoute satisfies LiteralRead {\n    machine read(value: u8) -> u8 reaches { echo(7u8) }\n}\nmachine main() crashes Trap {\n    let literal: u8 = LiteralRead::read(42u8);\n    transition literal == 7u8 { true -> done() _ -> bad() }\n    machine done() {}\n    machine bad() { crash Trap; }\n}\n', 'sha256': 'b47fec6cd301da7502a0900f5876fb233f2e865ba13e23dd7ad1e35cd9be849a'}, 'build.omg': {'text': 'machine build(builder: &mut Build) {\n    Build::application(builder, "inline_exact_boundary_provider");\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, linux_x86_64);\n    Build::bind(builder, linux_x86_64::ProgramEntry, main);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, linux_arm64);\n    Build::bind(builder, linux_arm64::ProgramEntry, main);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, macos_arm64);\n    Build::bind(builder, macos_arm64::ProgramEntry, main);\n    Build::select_provider<LiteralRead, LiteralRoute>(builder, windows_x86_64);\n    Build::bind(builder, windows_x86_64::ProgramEntry, main);\n}\n', 'sha256': '758bed268c1b59e984affe8304e86f02e9ebfb198904ab274cd84b84c0b01aa5'}}}
          root = Path.cwd()
          out = root / 'build/forwarding-arguments-baseline-83e'
          out.mkdir(parents=True, exist_ok=False)
          
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          assert git('rev-parse', 'HEAD') == settings['producer_source']
          assert git('rev-parse', 'HEAD^{tree}') == settings['producer_tree']
          assert not git('status', '--porcelain')
          objects = {p: git('rev-parse', 'HEAD:' + p) for p in settings['objects']}
          assert objects == settings['objects']
          run = json.loads(subprocess.check_output([
              'gh', 'api', 'repos/CathedralOS/Omega/actions/runs/' + str(settings['run'])
          ], text=True))
          (out / 'authenticated-origin-run.json').write_text(json.dumps(run, indent=2) + '\n')
          assert run['head_sha'] == settings['producer_source'] and run['status'] == 'completed'
          endpoint = 'repos/CathedralOS/Omega/actions/artifacts/' + str(settings['artifact_id'])
          meta = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          assert meta['id'] == settings['artifact_id'] and meta['name'] == settings['artifact']
          assert meta['size_in_bytes'] == settings['artifact_size'] and not meta['expired']
          assert meta['workflow_run']['id'] == settings['run']
          assert meta['workflow_run']['head_sha'] == settings['producer_source']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', meta['digest'])
          assert meta['digest'] == settings['artifact_digest']
          archive = root / 'build/forwarding-arguments-baseline-83e.zip'
          with archive.open('wb') as stream:
              subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=stream, check=True)
          actual_archive_digest = digest(archive)
          assert 'sha256:' + actual_archive_digest == meta['digest']
          retained = out / 'retained'
          with zipfile.ZipFile(archive) as zipped:
              for member in zipped.infolist():
                  path = PurePosixPath(member.filename)
                  assert not path.is_absolute() and '..' not in path.parts
                  assert ':' not in member.filename and not stat.S_ISLNK(member.external_attr >> 16)
              zipped.extractall(retained)
          archive.unlink()
          (out / 'artifact-authentication.json').write_text(json.dumps({
              'metadata': meta, 'actual_archive_sha256': actual_archive_digest
          }, indent=2) + '\n')
          records = list(retained.rglob('producer.json'))
          assert len(records) == 1
          original = json.loads(records[0].read_text())
          assert original == settings['original_producer']
          assert original['revision'] == settings['producer_source']
          assert original['tree'] == settings['producer_tree'] and original['target'] == 'linux_x86_64'
          (out / 'original-producer.json').write_text(json.dumps(original, indent=2) + '\n')
          cli = (records[0].parent / Path(original['cli']).name).resolve()
          cli.chmod(0o755)
          sys.path.insert(0, str(root / 'tools'))
          import compiler_profile
          profile = compiler_profile.require_optimized(cli)
          
          def profile_identity(observed):
              result = {k: v for k, v in observed.items() if k != 'binary'}
              if isinstance(result.get('build_receipt'), dict):
                  result['build_receipt'] = {k: v for k, v in result['build_receipt'].items() if k != 'path'}
              return result
          
          assert profile_identity(profile) == profile_identity(original['cli_profile'])
          library_paths = subprocess.check_output(['git', 'ls-files', 'source/library'], text=True).splitlines()
          inputs = {p: digest(Path(p)) for p in library_paths}
          for name, files in programs.items():
              for filename, payload in files.items():
                  assert filename in ['main.omg', 'build.omg']
                  path = out / 'projects' / name / filename
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(payload['text'])
                  assert digest(path) == payload['sha256']
                  inputs[str(path.relative_to(root))] = payload['sha256']
          
          def verify():
              assert git('rev-parse', 'HEAD') == settings['producer_source']
              assert not git('status', '--porcelain')
              assert {p: git('rev-parse', 'HEAD:' + p) for p in objects} == objects
              assert compiler_profile.require_optimized(cli) == profile
              for path, expected in inputs.items():
                  assert digest(root / path) == expected, path
          
          verify()
          (out / 'retained-origin.json').write_text(json.dumps({
              'settings': settings, 'driver': os.environ['GITHUB_SHA'],
              'original_run_conclusion': run['conclusion'], 'actual_cli': str(cli),
              'actual_profile': profile, 'inputs': inputs, 'builds_rust': False,
              'meaning': 'Producer and original library remain 83e. Full input is copied from the separately named fixture revision; the isolated input is an explicitly authored reduced composition. Neither is execution of that newer compiler or its defaults route.'
          }, indent=2) + '\n')
          observations = []
          try:
              for name in programs:
                  entry = out / 'projects' / name / 'main.omg'
                  for leg, arguments in [('source', ['--check', str(entry)]),
                                         ('both', ['run', '--both', str(entry)])]:
                      verify()
                      command = [str(cli), *arguments]
                      started = time.monotonic()
                      label = name + '-' + leg
                      try:
                          result = subprocess.run(command, capture_output=True, timeout=600)
                          stdout, stderr, code = result.stdout, result.stderr, result.returncode
                      except subprocess.TimeoutExpired as failure:
                          stdout, stderr, code = failure.stdout or b'', failure.stderr or b'', None
                      channels = {}
                      for suffix, data in [('stdout', stdout), ('stderr', stderr)]:
                          path = out / (label + '.' + suffix)
                          path.write_bytes(data)
                          channels[suffix] = {'path': path.name, 'sha256': digest(path), 'bytes': len(data)}
                      observations.append({'program': name, 'leg': leg, 'command': command,
                                           'cli_exit': code, 'seconds': round(time.monotonic() - started, 3),
                                           'channels': channels})
                      verify()
          finally:
              (out / 'summary.json').write_text(json.dumps({
                  'passed': len(observations) == 2 * len(programs) and all(r['cli_exit'] == 0 for r in observations),
                  'producer': original, 'program_source': settings['program_source'],
                  'driver': os.environ['GITHUB_SHA'], 'target': 'linux_x86_64',
                  'observations': observations, 'builds_rust': False,
                  'limits': 'CLI channels require inspection for actual engine results. A red baseline remains red; this run does not qualify the newer source, its defaults route, SDK behavior or another host.'
              }, indent=2) + '\n')
          raise SystemExit(0 if all(row['cli_exit'] == 0 for row in observations) else 1)
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: forwarding-arguments-baseline-83e-${{ github.run_id }}
          path: |
            build/forwarding-arguments-baseline-83e/*.json
            build/forwarding-arguments-baseline-83e/*.stdout
            build/forwarding-arguments-baseline-83e/*.stderr
            build/forwarding-arguments-baseline-83e/projects/*/*.omg
          retention-days: 30
