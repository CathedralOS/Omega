name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      phase_profile:
        description: Record compiler phase timings for a focused attribution run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false
      bound_frozen_controls:
        description: Qualify the exact frozen98 controls without unrelated program consumers
        type: boolean
        default: false
      installed_empty_component:
        description: Test one omitted forwarding requirement using the existing captured producer and artifact
        type: boolean
        default: false
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue. Manual revisions use isolated
# runners and may proceed while an earlier revision finishes its consumers.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    if: github.event_name != 'workflow_dispatch' || !inputs.installed_empty_component
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.bound_frozen_controls && 120 || inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      FROZEN_CONTROL_SOURCE_MAP: tools/ci/bound_frozen_controls_source_map.json
      FROZEN_CONTROL_SOURCE_MAP_SHA256: 'a14931f8beffcb6c9e977178c8d0a104b1a273a457f9dad9d2d5f2576eadaca4'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate the finite complete98 request
        if: github.event_name == 'workflow_dispatch' && inputs.bound_frozen_controls
        env:
          BOUND_FROZEN_REQUEST: ${{ toJSON(inputs) }}
        run: >-
          python -c "import os,json; r=json.loads(os.environ['BOUND_FROZEN_REQUEST']);
          assert r['native_host'] in ('linux_x86_64','linux_arm64','windows_x86_64','macos_arm64');
          assert not any(r.get(k) for k in ('smoke','checking_only','phase_profile','build_consent','frozen_controls','body_controls','frozen_source_diagnostics'));
          assert not any(r.get(k,'') for k in ('fixtures','samples','cli_fixtures'))"
      - name: Authenticate frozen source inputs before any Rust build
        id: bound-frozen-preflight
        if: github.event_name == 'workflow_dispatch' && inputs.bound_frozen_controls
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'tools/ci/run_bound_frozen_controls.py',
                          '--source-map', os.environ['FROZEN_CONTROL_SOURCE_MAP'],
                          '--source-map-sha256', os.environ['FROZEN_CONTROL_SOURCE_MAP_SHA256'],
                          '--preflight-receipt', 'build/compiler-pilot/bound-frozen-input-preflight.json',
                          '--preflight-only'], check=True)
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Select the retained compiler cache from its validated plan
        id: replay-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "import os; from tools.ci import compiler_pilot; compiler_pilot.write_replay_cache_key(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'], os.environ['GITHUB_OUTPUT'])"
      - name: Restore the exact retained compiler cache
        id: replay-build-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.replay-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Refuse an absent or partial retained compiler cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@') && steps.replay-build-cache.outputs.cache-hit != 'true'
        run: python -c "raise SystemExit('The exact retained compiler cache was not restored; no rebuild was attempted')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare the exact producer and qualify both frozen groups under one hold
        id: bound-frozen-chain
        if: github.event_name == 'workflow_dispatch' && inputs.bound_frozen_controls && steps.bound-frozen-preflight.outcome == 'success'
        env:
          BOUND_FROZEN_PREFLIGHT_SHA256: ${{ steps.bound-frozen-preflight.outputs.preflight_sha256 }}
        shell: python
        run: |
          import json, os, subprocess, sys, time
          from pathlib import Path
          root = Path.cwd().resolve()
          sys.path[:0] = [str(root), str(root / 'tools')]
          import build_slot, compiler_profile
          from tools.ci import compiler_pilot
          from tools.ci import qualify_current_frozen_controls as control
          output = root / 'build/compiler-pilot'
          output.mkdir(parents=True, exist_ok=True)
          preparation_path = output / 'preparation.json'
          assert not preparation_path.exists() and not (output / 'producer.json').exists()
          summary = dict(schema='omega-compiler-preparation-v1', passed=False,
                         scope='Producer preparation for exact98 frozen controls; acceptance is in the full consumer report.',
                         full98_accepted=False, required_controls=dict(checks=98, actual_BOTH_and_same_artifact=54, intended_rejects=44))
          environment = compiler_profile.optimized_environment()
          overrides = ('RUSTFLAGS','CARGO_ENCODED_RUSTFLAGS','RUSTC_WRAPPER',
                       'RUSTC_WORKSPACE_WRAPPER','RUSTC','RUSTDOC','CARGO_BUILD_RUSTC')
          summary['compiler_overrides'] = {key: environment.get(key) for key in overrides}
          assert not any(environment.get(key) for key in overrides), 'unreviewed compiler override'
          started = time.monotonic()
          try:
              with build_slot.hold(root) as (slot, waited):
                  assert slot is not None
                  summary['slot'] = dict(path=str(slot), wait_seconds=waited, one_hold_for_chain=True)
                  # Standard compiler-check remains in this mode, inside the same lane hold.
                  stdout, stderr = output / 'bound-frozen-compiler-check.stdout', output / 'bound-frozen-compiler-check.stderr'
                  with stdout.open('xb') as out, stderr.open('xb') as err:
                      process = subprocess.Popen(['cargo','check','--locked','-p','omega'],
                          stdin=subprocess.DEVNULL, stdout=out, stderr=err, env=environment,
                          start_new_session=os.name != 'nt',
                          creationflags=(subprocess.CREATE_NEW_PROCESS_GROUP | 0x4) if os.name == 'nt' else 0)
                      with control.owned_process_tree(process):
                          process.wait(timeout=1800)
                  summary['compiler_check_exit'] = process.returncode
                  assert process.returncode == 0, 'standard compiler-check failed'
                  with Path(os.environ['GITHUB_OUTPUT']).open('a') as output_record:
                      output_record.write('compiler_checked=true\n')
                  producer = compiler_pilot.prepare_producer(output, need_runner=True)
                  summary.update(candidate=producer.revision, tree=producer.tree, target=producer.target,
                                 toolchain=producer.toolchain, producer=producer.record(), passed=True)
                  compiler_pilot.write_new_record(output / 'producer.json',
                      dict(schema='omega-compiler-producer-v1', producer=producer.record()))
                  preparation_path.write_text(json.dumps(summary, indent=2) + '\n')
                  # The wrapper retains package failures and observes the complete98 controls.
                  result = subprocess.run([sys.executable, 'tools/ci/run_bound_frozen_controls.py',
                      '--source-map', os.environ['FROZEN_CONTROL_SOURCE_MAP'],
                      '--source-map-sha256', os.environ['FROZEN_CONTROL_SOURCE_MAP_SHA256'],
                      '--preflight-receipt', 'build/compiler-pilot/bound-frozen-input-preflight.json',
                      '--preflight-sha256', os.environ['BOUND_FROZEN_PREFLIGHT_SHA256'],
                      '--preparation', str(preparation_path)], check=False)
                  summary['frozen_controls_consumer_exit'] = result.returncode
                  assert result.returncode == 0, 'complete98 retains a refusal/setup failure or unpinned rejection'
          except BaseException as error:
              summary['chain_error'] = type(error).__name__ + ': ' + str(error)
              raise
          finally:
              summary['seconds'] = round(time.monotonic() - started, 3)
              # Producer preparation success is distinct from complete consumer acceptance.
              if not preparation_path.exists():
                  preparation_path.write_text(json.dumps(summary, indent=2) + '\n')
              (output / 'bound-frozen-chain.json').write_text(json.dumps(summary, indent=2) + '\n')
      - name: Retain full98 producer, preparation and complete frozen results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bound_frozen_controls
        with:
          name: compiler-pilot-bound-full98-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            build/supplied-output-loan/ci-bound-frozen-observations/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
      - name: Retain bounded full98 records separately from producer images
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.bound_frozen_controls
        with:
          name: compiler-pilot-bound-full98-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/*.json
            build/compiler-pilot/*.stdout
            build/compiler-pilot/*.stderr
            build/compiler-pilot/bound-frozen-controls/
            build/compiler-pilot/producer-*/*.json
            build/compiler-pilot/producer-*/*.stderr
            build/supplied-output-loan/ci-bound-frozen-observations/*.json
            build/supplied-output-loan/ci-bound-frozen-observations/*-check.stdout
            build/supplied-output-loan/ci-bound-frozen-observations/*-check.stderr
            build/supplied-output-loan/ci-bound-frozen-observations/*-both.stdout
            build/supplied-output-loan/ci-bound-frozen-observations/*-both.stderr
            build/supplied-output-loan/ci-bound-frozen-observations/*-inspect.stderr
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
      - name: Check the exact integration candidate
        id: compiler-check
        if: github.event_name != 'workflow_dispatch' || !inputs.bound_frozen_controls
        run: cargo check --locked -p omega
      - name: Prepare and retain the optimized producer
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        run: python tools/ci/compiler_pilot.py --phase prepare
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Save the build's compiled objects. Full frozen-control mode has already
      # run its program observations inside the build chain above.
      # A failed preparation still retains useful objects and keeps the job red.
      - name: Retain compiled objects after the build chain
        if: always() && !cancelled() && (steps.compiler-check.outcome == 'success' || steps.bound-frozen-chain.outputs.compiler_checked == 'true') && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler phase timings
        if: github.event_name == 'workflow_dispatch' && inputs.phase_profile
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PHASE_PROFILE=1\n')"
      - name: Optional executable observations
        if: ${{ !cancelled() && !inputs.bound_frozen_controls && steps.producer-preparation.outcome == 'success' }}
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        run: python tools/ci/compiler_pilot.py --phase consume
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('preparation.json', 'summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json', 'build-consent-controls.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-observations-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7

  installed-empty-component:
    if: github.event_name == 'workflow_dispatch' && inputs.installed_empty_component
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate this one captured-artifact request before Rust or downloads
        env:
          INSTALLED_EMPTY_REQUEST: ${{ toJSON(inputs) }}
        run: >-
          python -c "import json,os;
          r=json.loads(os.environ['INSTALLED_EMPTY_REQUEST']);
          assert r['native_host']=='linux_x86_64' and r['installed_empty_component'];
          assert not any(r.get(k) for k in ('smoke','checking_only','phase_profile','build_consent','bound_frozen_controls'));
          assert not any(r.get(k,'') for k in ('fixtures','samples','cli_fixtures'))"
      - name: Authenticate the exact source and capture transport plan
        run: python tools/ci/installed_empty_component/run_component.py --preflight-only
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Restore the exact positive capture and run only the ignored omission test
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/ci/installed_empty_component/run_component.py
      - name: Retain the codec image and exact component artifact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-empty-component-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/supplied-output-loan/ci-installed-empty-component/*.json
            build/supplied-output-loan/ci-installed-empty-component/codec-image/
            build/supplied-output-loan/ci-installed-empty-component/omission/
            build/supplied-output-loan/ci-installed-empty-component/capture/supplied-output-loan/ci-bound-frozen-observations/60-installed_empty_snapshot-artifacts/program.oterm
            build/supplied-output-loan/ci-installed-empty-component/capture/supplied-output-loan/ci-bound-frozen-observations/60-installed_empty_snapshot-inspect.stdout
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
      - name: Retain bounded component records separately from all images and containers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installed-empty-component-records-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/supplied-output-loan/ci-installed-empty-component/*.json
            build/supplied-output-loan/ci-installed-empty-component/codec-image/*.json
            build/supplied-output-loan/ci-installed-empty-component/codec-image/*.stdout
            build/supplied-output-loan/ci-installed-empty-component/codec-image/*.stderr
            build/supplied-output-loan/ci-installed-empty-component/omission/*.json
            build/supplied-output-loan/ci-installed-empty-component/omission/*.stdout
            build/supplied-output-loan/ci-installed-empty-component/omission/*.stderr
            build/supplied-output-loan/ci-installed-empty-component/transport/*.json
            build/supplied-output-loan/ci-installed-empty-component/transport/*-metadata.stdout
            build/supplied-output-loan/ci-installed-empty-component/transport/*.stderr
          compression-level: 6
          retention-days: 7
          if-no-files-found: warn
