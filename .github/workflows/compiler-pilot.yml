name: Qualify integrated computed-root and callback calls

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      phase_profile:
        description: Record compiler phase timings for a focused attribution run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue. Manual revisions use isolated
# runners and may proceed while an earlier revision finishes its consumers.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      OMEGA_WARM_CACHE_KEY: ${{ fromJSON('{"linux_x86_64":"compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-3e0188c4cdff3f96d4b39281f51c4efa05e9f2bd","macos_arm64":"compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-d58b8ab0f8fed8e2cd06c6fe4197fd20013334e2","windows_x86_64":"compiler-pilot-Windows-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-d58b8ab0f8fed8e2cd06c6fe4197fd20013334e2","linux_arm64":""}')[inputs.native_host] }}
      OMEGA_WARM_CACHE_ID: ${{ fromJSON('{"linux_x86_64":10115376050,"macos_arm64":10112441065,"windows_x86_64":10112894407,"linux_arm64":0}')[inputs.native_host] }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d32f1cbab4094e6ae280975fa0febb19b5ee4bc4
          fetch-depth: 64
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record the separate driver and exact compiler source
        shell: python
        env:
          OMEGA_WORKFLOW_DRIVER_REVISION: ${{ github.sha }}
          OMEGA_QUALIFICATION_HOST: ${{ inputs.native_host }}
        run: |
          import json, os, subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == 'd32f1cbab4094e6ae280975fa0febb19b5ee4bc4'
          assert os.environ['OMEGA_QUALIFICATION_HOST'] in ('linux_x86_64', 'linux_arm64', 'macos_arm64', 'windows_x86_64')
          fresh_arm = os.environ['OMEGA_QUALIFICATION_HOST'] == 'linux_arm64'
          assert bool(os.environ.get('OMEGA_WARM_CACHE_KEY')) != fresh_arm
          output = Path('build/compiler-pilot')
          output.mkdir(parents=True, exist_ok=False)
          record = dict(driver_revision=os.environ['OMEGA_WORKFLOW_DRIVER_REVISION'],
                        compiler_program_source=actual, target=os.environ['OMEGA_QUALIFICATION_HOST'],
                        warm_cache_key=os.environ['OMEGA_WARM_CACHE_KEY'],
                        warm_cache_id=int(os.environ['OMEGA_WARM_CACHE_ID']),
                        warm_cache_ref=(None if fresh_arm else ('refs/heads/work/qual-proof-invocation-hosts-20261105' if os.environ['OMEGA_QUALIFICATION_HOST'] == 'linux_x86_64' else 'refs/heads/work/qualified-source-reference-contract-20261105')),
                        warm_cache_source=(None if fresh_arm else ('3e0188c4cdff3f96d4b39281f51c4efa05e9f2bd' if os.environ['OMEGA_QUALIFICATION_HOST'] == 'linux_x86_64' else 'd58b8ab0f8fed8e2cd06c6fe4197fd20013334e2')),
                        cache_use=('One fresh ARM build: no restored repository cache, borrowed active ref, fallback or retry.' if fresh_arm else 'Build objects only; no prior compiler execution is reused.'))
          (output / 'driver.json').write_text(json.dumps(record, indent=2) + chr(10))
          print(json.dumps(record, sort_keys=True))
      - name: Retain the fixed published source prerequisite
        run: git fetch --no-tags --depth=1 origin c417f61c95ba2b5078d36f367dc9b3c8e2ea0e30:refs/remotes/origin/main
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Select the retained compiler cache from its validated plan
        id: replay-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "import os; from tools.ci import compiler_pilot; compiler_pilot.write_replay_cache_key(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'], os.environ['GITHUB_OUTPUT'])"
      - name: Restore the exact retained compiler cache
        id: replay-build-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.replay-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Refuse an absent or partial retained compiler cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@') && steps.replay-build-cache.outputs.cache-hit != 'true'
        run: python -c "raise SystemExit('The exact retained compiler cache was not restored; no rebuild was attempted')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        if: inputs.native_host != 'linux_arm64' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@'))
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ env.OMEGA_WARM_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Verify the exact restored warm cache before Cargo
        if: github.event_name == 'workflow_dispatch' && inputs.native_host != 'linux_arm64' && !startsWith(inputs.fixtures, '@')
        env:
          OMEGA_RESTORED_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python -c "import os; expected = os.environ['OMEGA_WARM_CACHE_KEY']; observed = os.environ.get('OMEGA_RESTORED_CACHE_KEY'); assert observed == expected, f'Restored cache {observed!r} differs from the required retained cache {expected!r}'; print('Verified exact retained warm cache:', observed)"
      - name: Declare the single necessary fresh ARM build
        if: inputs.native_host == 'linux_arm64'
        run: python -c "print('No normally visible completed-ref/default-main ARM cache exists. One fresh build is required for changed integrated source; no cache fallback, active branch borrowing or automatic retry. Prior cold ARM preparation took about 18 minutes; fixture limits remain unchanged.')"
      - name: Check and prepare the optimized producer under one build slot
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        shell: python
        run: |
          import datetime, hashlib, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          import build_slot
          output = Path('build/compiler-pilot')
          driver = json.loads((output / 'driver.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == driver['compiler_program_source'] == 'd32f1cbab4094e6ae280975fa0febb19b5ee4bc4'
          tool = shutil.which('mbx') or 'cargo'
          def command(name, arguments, environment):
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              clock = time.monotonic()
              print(json.dumps(dict(stage=name, command=arguments, started=started,
                                    source=source, driver=driver['driver_revision'])), flush=True)
              stdout = output / (name + '.stdout')
              stderr = output / (name + '.stderr')
              with stdout.open('xb') as out, stderr.open('xb') as err:
                  try:
                      result = subprocess.run(arguments, env=environment, stdin=subprocess.DEVNULL,
                                              stdout=out, stderr=err)
                      code = result.returncode
                  except OSError as error:
                      err.write((str(error) + chr(10)).encode())
                      code = 1
              record = dict(command=arguments, exit_code=code, seconds=time.monotonic() - clock,
                            started=started, finished=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            source=source, driver=driver['driver_revision'],
                            source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                            stdout=dict(file=stdout.name, bytes=stdout.stat().st_size,
                                        sha256=hashlib.sha256(stdout.read_bytes()).hexdigest()),
                            stderr=dict(file=stderr.name, bytes=stderr.stat().st_size,
                                        sha256=hashlib.sha256(stderr.read_bytes()).hexdigest()))
              (output / (name + '.json')).write_text(json.dumps(record, indent=2) + chr(10))
              print(json.dumps(dict(stage=name, **record)), flush=True)
              return code
          # The child inherits the held-slot marker, so canonical preparation
          # uses this same hold instead of taking a second slot.
          with build_slot.hold(Path.cwd()):
              environment = dict(os.environ, GITHUB_SHA=source)
              code = command('compiler-check', [tool, 'check', '--locked', '-p', 'omega'], environment)
              if code:
                  raise SystemExit(code)
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
                  stream.write('compiler_check=success' + chr(10))
              code = command('producer-command', [sys.executable, 'tools/ci/compiler_pilot.py',
                                                 '--phase', 'prepare'], environment)
              if code:
                  raise SystemExit(code)
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Save compiled objects before any program consumer can use the job budget.
      # A failed preparation still retains useful objects and keeps the job red.
      - name: Save build cache before fixture observations
        if: always() && !cancelled() && steps.producer-preparation.outputs.compiler_check == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Retain the fresh ARM build objects before consumers
        if: always() && !cancelled() && inputs.native_host == 'linux_arm64' && steps.producer-preparation.outputs.compiler_check == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler phase timings
        if: github.event_name == 'workflow_dispatch' && inputs.phase_profile
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PHASE_PROFILE=1\n')"
      - name: Optional executable observations
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        shell: python
        run: |
          import os, subprocess
          environment = dict(os.environ, GITHUB_SHA='d32f1cbab4094e6ae280975fa0febb19b5ee4bc4')
          subprocess.run(['python', 'tools/ci/compiler_pilot.py', '--phase', 'consume'], env=environment, check=True)
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('preparation.json', 'summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json', 'build-consent-controls.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-observations-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7
