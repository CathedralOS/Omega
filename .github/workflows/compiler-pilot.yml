          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          changed=subprocess.check_output(['git','diff','--name-only',compiled,source],text=True).splitlines()
          assert set(changed)==set(settings['corrected_paths'])
          for path in changed:
              before=subprocess.check_output(['git','show',compiled+':'+path],text=True)
              after=Path(path).read_text()
              assert before.count('reaches SelectedBodyCheck invokes SelectedBodyCheck')==3
              assert before.replace('reaches SelectedBodyCheck invokes SelectedBodyCheck','reaches invokes SelectedBodyCheck')==after
          for path,digest in settings['input_hashes'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])],text=True))
          assert run['head_sha']==compiled and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])+'/artifacts'],text=True))['artifacts']
          matches=[a for a in artifacts if a['name']==origin['artifact']];assert len(matches)==1
