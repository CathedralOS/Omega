name: Retired scalar pin observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recover only the original official producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/CathedralOS/Omega/actions/artifacts/13549815218 > "$RUNNER_TEMP/suffix-producer-artifact.json"
          gh api repos/CathedralOS/Omega/actions/artifacts/13549815218/zip > "$RUNNER_TEMP/suffix-producer.zip"
      - name: Check only the unchanged retired-syntax negative
        run: |
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, time, zipfile
          from pathlib import Path
          from types import SimpleNamespace
          sys.path[:0] = ['tools', 'tools/ci']
          import corpus_gate, corpus_records
          from compiler_replay_plan import check_origin, check_inputs
          from compiler_pilot import CompilerProducer
          from qualification import source_inputs
          from sample_projects import Project, rejection_verdict
          from corpus_pin_audit import expected_fragments
          root = Path.cwd()
          output = root / 'build/suffix-pin-check'
          output.mkdir(parents=True, exist_ok=False)
          expected = {'revision': 'ba4089082c391ab225f77b8364325c1e18bdec8c',
           'tree': 'd4f54bf3ee41ed62c540df313defdd1b8999d96d',
           'target': 'linux_x86_64',
           'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\n'
                        'binary: rustc\n'
                        'commit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\n'
                        'commit-date: 2026-09-03\n'
                        'host: x86_64-unknown-linux-gnu\n'
                        'release: 1.100.0-nightly\n'
                        'LLVM version: 23.1.1',
           'input_objects': {'omega-rust': '2b3e537acbe04df166cde7208044f004f7bc3739',
                             'source/library': 'f30f0ff53227a4d1dc76f8cdd0d54094ec745761',
                             'source/psi': '400feb4e6c0c556f0fd5d6b44043e92f93d7f30c',
                             'source/omega': '96169168741fcd8265771a647ba3bfadd2bc7e8c',
                             'bootstrap': '42230c0aa7138a175590d9dd6a57d8ee71934df1',
                             'tools/benchmark': '22bb2e294131c9ad20e0475bc21c227570438f32',
                             'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                             'Cargo.lock': '4a3ff7451873c432739f2f5799395d207fc40bee',
                             'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929',
                             '.cargo': '152f54b1593e9a8e1c5139fc5a4373a14bbc0701'},
           'executables': {'cli': {'sha256': 'd2a7663e7397e149e42559e3b34100719a1d94b1c1a7e7ebb163547b5dcf9257',
                                   'profile': {'schema': 'omega-compiler-build-profile-v1',
                                               'opt_level': '1'}},
                           'runner': None},
           'origin_run': 42310690605,
           'cache_key': 'compiler-regression-Linux-X64-007cfa9f9b9c5d5e53ace1acb6a69af709124dce0e0b01a2858a95408d3db9ac-ba4089082c391ab225f77b8364325c1e18bdec8c'}
          check_origin(root, expected)
          check_inputs(root, 'HEAD', expected['input_objects'])
          metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / 'suffix-producer-artifact.json').read_text())
          archive = Path(os.environ['RUNNER_TEMP']) / 'suffix-producer.zip'
          archive_sha = '0bd5e2ba9fb7a0857f0bd1445603f93e57309d43e4e95afed42e08e429168480'
          assert metadata['id'] == 13549815218 and not metadata['expired']
          assert metadata['workflow_run']['id'] == expected['origin_run']
          assert metadata['workflow_run']['head_sha'] == expected['revision']
          assert metadata['digest'] == 'sha256:' + archive_sha
          assert archive.stat().st_size == metadata['size_in_bytes'] == 243380862
          with archive.open('rb') as stream:
              assert hashlib.file_digest(stream, 'sha256').hexdigest() == archive_sha
          cli = Path(os.environ['RUNNER_TEMP']) / 'suffix-original-omega'
          with zipfile.ZipFile(archive) as packed:
              member = 'producer-q7920grn/omega'
              assert len([info for info in packed.infolist() if info.filename == member]) == 1
              with packed.open(member) as source, cli.open('wb') as destination:
                  shutil.copyfileobj(source, destination)
          cli.chmod(0o700)
          profile = corpus_gate.require_optimized(cli)
          assert profile['sha256'] == expected['executables']['cli']['sha256']
          assert profile['profile'] == expected['executables']['cli']['profile']
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          producer = CompilerProducer(expected['revision'], expected['tree'], expected['target'],
              expected['toolchain'], cli, None, profile, None, revision, expected['input_objects'],
              dict(run=expected['origin_run'], artifact_id=metadata['id'], archive_sha256=archive_sha,
                   transport='original official producer artifact'))
          producer.verify()
          (output / 'artifact.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (output / 'producer.json').write_text(json.dumps(producer.record(), indent=2) + '\n')
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          fixture = 'fail/proofs/mathematical_constrained_scalar_formal'
          relative = 'tests/omega/' + fixture
          project = root / relative
          source = project / 'main.omg'
          assert source.read_text() == ('// Operand interval projection does not admit constrained mathematical formals.\n'
              'let same(value:i64 [0..=4]):core::Strict<0> = value == value;\n'
              'machine main() {}\n')
          fragments = tuple(expected_fragments(root, fixture))
          assert fragments == ('type brackets are retired',)
          inputs = source_inputs(root, revision, [relative, 'source/library', '.github/workflows/compiler-pilot.yml'])
          arguments = [str(producer.cli), '--check', str(source)]
          producer.verify()
          started = time.monotonic()
          process = subprocess.run(arguments, cwd=root, stdin=subprocess.DEVNULL,
              capture_output=True, text=True, timeout=120,
              env=dict(os.environ, OMEGA_LIBRARY_ROOT=str(root / 'source/library')))
          millis = round((time.monotonic() - started) * 1000)
          producer.verify()
          assert inputs == source_inputs(root, revision, list(inputs))
          (output / 'stdout.txt').write_text(process.stdout)
          (output / 'stderr.txt').write_text(process.stderr)
          diagnostic = process.stdout + process.stderr
          matched, reason = rejection_verdict(Project(project, source, 'intended-invalid', fragments),
              process.returncode, diagnostic)
          (output / 'invocation.json').write_text(json.dumps(dict(
              consumer_revision=revision, producer_revision=producer.revision,
              arguments=arguments, exit_code=process.returncode, millis=millis,
              source_inputs=inputs, matched=matched, reason=reason), indent=2) + '\n')
          row = dict(fixture=fixture, tier='fail',
              status='rejected' if process.returncode == 1 else 'checked' if process.returncode == 0 else 'errored',
              millis=millis, expected_satisfied=matched, facts={},
              diagnostics=[line for line in diagnostic.splitlines() if line.strip()],
              regressed_from=None, recorded_at=revision[:12])
          text = corpus_records.render([row])
          assert corpus_records.parse(text) == [row]
          (output / 'corpus-row.txt').write_text(text)
          options = SimpleNamespace(golden='tests/omega/corpus_outcomes.txt', filter=fixture, shard=None)
          report = corpus_gate.verdict_document(options, 'checked', None,
              'recorded' if matched else 'wrong_reason', 0 if matched else 1,
              [row], [], [] if matched else [reason], None)
          (output / 'checking.json').write_text(json.dumps(report, indent=2) + '\n')
          print(text, flush=True)
          assert matched, reason
          PY
      - name: Retain only the bounded observation records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: suffix-pin-check-${{ github.sha }}
          path: |
            build/suffix-pin-check/artifact.json
            build/suffix-pin-check/producer.json
            build/suffix-pin-check/invocation.json
            build/suffix-pin-check/checking.json
            build/suffix-pin-check/corpus-row.txt
            build/suffix-pin-check/stdout.txt
            build/suffix-pin-check/stderr.txt
          if-no-files-found: error
          retention-days: 7
