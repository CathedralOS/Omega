name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue.
concurrency:
  group: compiler-pilot-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  retained-public-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b3f00fd60e7f7abf613fde219da040e8e19fcf42
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore exact retained producer (no Cargo)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41390167139 -R CathedralOS/Omega -n compiler-pilot-linux_x86_64-b3f00fd60e7f7abf613fde219da040e8e19fcf42-1 -D build/compiler-pilot
      - name: Observe explicit public native and Terminal exits
        env:
          QUALIFICATION_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          root=Path.cwd(); retained=root/'build/compiler-pilot'; out=root/'build/public-both-replay';out.mkdir()
          sys.path.insert(0,str(root/'tools'))
          from compiler_profile import require_optimized
          import sample_native_gate
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          summary=json.loads((retained/'summary.json').read_text());producer=summary['producer'];source=producer['revision']
          assert source=='b3f00fd60e7f7abf613fde219da040e8e19fcf42' and git('rev-parse','HEAD')==source and not git('status','--porcelain')
          cli=Path(producer['cli']);cli.chmod(0o755)
          profile=require_optimized(cli);assert profile==producer['cli_profile']
          manifest=json.loads((retained/'compound-index-extra/source-inputs.json').read_text())['files']
          assert all(sha(root/p)==value for p,value in manifest.items())
          os.environ['OMEGA_LIBRARY_ROOT']=str(root/'source/library')
          projects=[r['sample'] for r in summary['sample_observations'] if r['state']=='pass'];assert len(projects)==10
          rows=[]
          for project in projects:
              name=Path(project).name;directory=out/name;directory.mkdir()
              failure,review=sample_native_gate.accept_review(str(cli),str(root/project),'linux_x86_64',180)
              (directory/'review.txt').write_text(review);assert failure is None,(project,failure,review)
              command=[str(cli),'run','--both',str(root/project/'main.omg')];started=time.monotonic()
              result=subprocess.run(command,capture_output=True,text=True,stdin=subprocess.DEVNULL,timeout=180)
              (directory/'stdout.txt').write_text(result.stdout);(directory/'stderr.txt').write_text(result.stderr)
              lines=result.stderr.splitlines();native='native exit 0' in lines;terminal='interp exit: 0' in lines
              row=dict(project=project,command=command,returncode=result.returncode,native_zero=native,Terminal_zero=terminal,seconds=time.monotonic()-started,main_sha256=sha(root/project/'main.omg'),Build_sha256=sha(root/project/'build.omg'))
              rows.append(row);(out/'observations.json').write_text(json.dumps(rows,indent=2)+'\n')
              print(project,result.returncode,native,terminal,flush=True)
              assert result.returncode==0 and native and terminal,(project,result.stdout,result.stderr)
          assert all(sha(root/p)==value for p,value in manifest.items()) and require_optimized(cli)==profile
          assert git('rev-parse','HEAD')==source and not git('status','--porcelain')
          (out/'verdict.json').write_text(json.dumps(dict(passed=True,actual_source_revision=source,workflow_revision=os.environ['QUALIFICATION_WORKFLOW_SHA'],actual_producer=producer,compiler_inputs=len(manifest),projects=rows,scope='Exact retained b3 CLI/SDK, ten ordinary public preparations and raw BOTH native0/Terminal0, no Rust build.'),indent=2)+'\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compound-public-raw-b3-${{ github.run_id }}
          path: build/public-both-replay/
          retention-days: 7
