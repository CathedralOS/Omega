name: Qualify current constructor comparisons on Mac
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  matching-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos_arm64
            runner: macos-15
            target_dir: /tmp/ot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      NATIVE_HOST: ${{ matrix.host }}
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 062d0753ff087261229656f1b646aaec2d0961f8
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-4d8d121ecafb73581b6ddbbe1b980ce89d522cb4
      - name: Require the exact prepared Mac cache
        env:
          OBSERVED_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        shell: python
        run: |
          import os
          assert os.environ['OBSERVED_CACHE_KEY'] == 'compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-4d8d121ecafb73581b6ddbbe1b980ce89d522cb4', 'the exact saved e0ff cache is required; no cold build was attempted'
      - name: Prepare the exact optimized compiler
        id: preparation
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='062d0753ff087261229656f1b646aaec2d0961f8';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive=['pass/generics/runtime_generic_carrier_equation_exit',
           'pass/ownership/runtime_whole_borrowed_transform_exit',
           'pass/arithmetic/runtime_composite_bound_arrivals_exit',
           'pass/core/aggregate_snapshot_copy_exit',
           'pass/float/constructed_ieee_predicates_exit',
           'pass/contracts/saved_call_case_guarantee_requires_exit',
           'pass/contracts/completed_unit_call_post_case',
           'pass/generics/omitted_data_binder_range_equation',
           'pass/borrows/runtime_case_descriptor_retirement_exit',
           'pass/contracts/nested_case_guarantee_disjunction_exit',
           'pass/generics/runtime_phantom_owned_constructor_exit']
          negative=['fail/arithmetic/composite_bound_arrival_unbounded_predecessor',
           'fail/borrows/private_arrival_default_domain_weak_bound',
           'fail/references/rebound_parameter_reference_drops_referent_bound',
           'fail/contracts/mutable_owned_call_ensures_keeps_poststate',
           'fail/ownership/whole_borrowed_missing_repair',
           'fail/generics/generic_carrier_equation_mismatch',
           'fail/data/constructor_distinct_field_versions',
           'fail/data/constructor_prior_operand_write',
           'fail/borrows/empty_array_snapshot_requires_read_authority',
           'fail/float/constructed_ieee_unknown_nan',
           'fail/float/mathematical_generic_ieee_equality_requires_non_nan',
           'fail/float/public_class_contract_ieee_equality_retains_zero_sign',
           'fail/contracts/executable_float_box_equality_not_identity',
           'fail/contracts/saved_call_case_guarantee_replaced_by_call',
           'fail/proofs/runtime_case_guarantee_wrong_return',
           'fail/proofs/selected_case_equality_does_not_establish_membership',
           'fail/cases/nested_payload_read_after_case_replacement',
           'fail/contracts/nested_case_guarantee_unselected_sibling',
           'fail/generics/phantom_owned_constructor_unproved']
          output=root/'build/compiler-pilot/constructor-identity-integration-host'
          output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':driver,'target':target},indent=2)+'\n')
          import build_slot,hashlib,re,shutil,signal,subprocess,time
          with build_slot.hold(root,timeout=900):
              preparation_status=compiler_pilot.run_suite('compiler-pilot/constructor-identity-integration-host',positive,negative,phase='prepare')
              if preparation_status:raise SystemExit(preparation_status)
              scopes=[('term-identity',
                'term_identity::resolution_payload_tests',
                2,
                ['proof_contracts::contract_entailment::structural_judgment::term_identity::resolution_payload_tests::repeated_array_traversal_and_substitution_are_independent_of_extent',
                 'proof_contracts::contract_entailment::structural_judgment::term_identity::resolution_payload_tests::payload_comparison_keeps_hidden_descriptors_and_nested_authority']),
               ('resolution-queries',
                'resolution_queries::',
                19,
                ['proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::completed_queries_keep_full_authority_depth_and_premise_context',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::bucket_collisions_preserve_capture_proofs_and_recurrence_inputs',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::static_selection_landings_survive_completed_query_reuse',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::static_selection_landings_remain_distinct_recurrence_inputs',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::recurrence_reads_allow_unrelated_frames_but_reject_changed_cycle_answers',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::cached_child_reads_reach_the_parent_without_exporting_local_cycles',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::changed_query_inputs_decline_dependency_reuse',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::conditional_reuse_matches_uncached_queries_for_every_three_question_stack',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::field_dependency_recording_reuses_only_the_same_accumulating_trace',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::body_reads_reach_current_and_ancestor_field_observers',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::tests::changing_field_observers_invalidates_enclosing_queries_not_recurrence',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::work_domain_tests::bucket_eviction_keeps_recent_queries_and_removes_old_indices',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::work_domain_tests::cheap_leaf_queries_do_not_evict_completed_applications',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::predicate_tests::value_resolution_and_predicate_answers_remain_distinct',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::depth_tests::nested_arithmetic_queries_keep_the_active_resolution_budget',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::guard_depth_tests::completed_guards_keep_the_active_resolution_depth',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::term_mode_tests::entering_a_question_preserves_its_caller_term_mode',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::term_mode_tests::completed_reads_keep_the_observed_mode_across_caller_mode_changes',
                 'proof_contracts::contract_entailment::structural_judgment::resolution_queries::term_mode_tests::cached_child_reads_replay_their_original_mode_into_the_parent']),
               ('stored-values',
                'stored_values::tests',
                6,
                ['proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::finds_each_slot_and_no_absent_one',
                 'proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::walks_past_unequal_coordinates_that_share_a_key',
                 'proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::updates_reach_the_first_equal_value',
                 'proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::repeated_coordinate_resolves_to_first_position',
                 'proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::removal_keeps_lookups_exact',
                 'proof_contracts::contract_entailment::structural_judgment::storage_effects::stored_values::tests::values_at_yields_each_equal_value_in_stored_order'])]
              aggregate={'source':source,'driver':driver,'expected_existing_tests':27,'no_new_tests':True,'scopes':[],'passed':False}
              all_began=time.monotonic()
              for label,filter_text,expected,names in scopes:
                  command=(['mbx','nextest','run','-p','validation','--status-level','pass','-E','test('+filter_text+')'] if shutil.which('mbx') else ['cargo','test','-p','validation','--lib',filter_text])
                  began=time.monotonic();test={'source':source,'driver':driver,'command':command,'filter':filter_text,'expected_existing_tests':expected,'expected_names':names,'no_new_tests':True,'started':True};process=None
                  def stop_test_process():
                      if process is None or process.poll() is not None:return
                      os.killpg(process.pid,signal.SIGTERM)
                      try:process.wait(timeout=5)
                      except subprocess.TimeoutExpired:os.killpg(process.pid,signal.SIGKILL);process.wait(timeout=5)
                  stdout_name=label+'-tests.stdout';stderr_name=label+'-tests.stderr'
                  try:
                      with (output/stdout_name).open('wb') as stdout,(output/stderr_name).open('wb') as stderr:
                          process=subprocess.Popen(command,cwd=root,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,start_new_session=True)
                          test['exit']=process.wait(timeout=1200)
                      output_text=(output/stdout_name).read_text(errors='replace')+(output/stderr_name).read_text(errors='replace')
                      test['existing_test_count_confirmed']=bool(re.search(r'test result: ok[.] '+str(expected)+r' passed; 0 failed|'+str(expected)+r' tests run: '+str(expected)+r' passed',output_text))
                      test['named_existing_tests_confirmed']=all(name in output_text for name in names)
                      test['passed']=test['exit']==0 and test['existing_test_count_confirmed'] and test['named_existing_tests_confirmed']
                  except Exception as error:
                      test['passed']=False;test['error']=str(error)
                  finally:
                      stop_test_process()
                      test['seconds']=round(time.monotonic()-began,3)
                      test['channels']={name:{'bytes':(output/name).stat().st_size,'sha256':hashlib.sha256((output/name).read_bytes()).hexdigest()} for name in [stdout_name,stderr_name] if (output/name).exists()}
                      aggregate['scopes'].append(test)
                      aggregate['seconds']=round(time.monotonic()-all_began,3)
                      aggregate['passed']=len(aggregate['scopes'])==3 and all(item['passed'] for item in aggregate['scopes'])
                      (output/'term-comparison-tests.json').write_text(json.dumps(aggregate,indent=2)+'\n')
                  if not test['passed']:break
              producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
              raise SystemExit(0 if aggregate['passed'] else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-constructor-identity-integration-preparation-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/constructor-identity-integration-host/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.preparation.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe the original customers and case controls
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='062d0753ff087261229656f1b646aaec2d0961f8';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive=['pass/generics/runtime_generic_carrier_equation_exit',
           'pass/ownership/runtime_whole_borrowed_transform_exit',
           'pass/arithmetic/runtime_composite_bound_arrivals_exit',
           'pass/core/aggregate_snapshot_copy_exit',
           'pass/float/constructed_ieee_predicates_exit',
           'pass/contracts/saved_call_case_guarantee_requires_exit',
           'pass/contracts/completed_unit_call_post_case',
           'pass/generics/omitted_data_binder_range_equation',
           'pass/borrows/runtime_case_descriptor_retirement_exit',
           'pass/contracts/nested_case_guarantee_disjunction_exit',
           'pass/generics/runtime_phantom_owned_constructor_exit']
          negative=['fail/arithmetic/composite_bound_arrival_unbounded_predecessor',
           'fail/borrows/private_arrival_default_domain_weak_bound',
           'fail/references/rebound_parameter_reference_drops_referent_bound',
           'fail/contracts/mutable_owned_call_ensures_keeps_poststate',
           'fail/ownership/whole_borrowed_missing_repair',
           'fail/generics/generic_carrier_equation_mismatch',
           'fail/data/constructor_distinct_field_versions',
           'fail/data/constructor_prior_operand_write',
           'fail/borrows/empty_array_snapshot_requires_read_authority',
           'fail/float/constructed_ieee_unknown_nan',
           'fail/float/mathematical_generic_ieee_equality_requires_non_nan',
           'fail/float/public_class_contract_ieee_equality_retains_zero_sign',
           'fail/contracts/executable_float_box_equality_not_identity',
           'fail/contracts/saved_call_case_guarantee_replaced_by_call',
           'fail/proofs/runtime_case_guarantee_wrong_return',
           'fail/proofs/selected_case_equality_does_not_establish_membership',
           'fail/cases/nested_payload_read_after_case_replacement',
           'fail/contracts/nested_case_guarantee_unselected_sibling',
           'fail/generics/phantom_owned_constructor_unproved']
          output=root/'build/compiler-pilot/constructor-identity-integration-host'
          prepared=json.loads((output/'preparation.json').read_text())
          assert prepared['passed'] and prepared['candidate']==source and prepared['target']==target
          assert json.loads((output/'driver.json').read_text())=={'source':source,'driver':driver,'target':target}
          producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/constructor-identity-integration-observations',positive,negative,producer=producer)
          producer.verify();observed=root/'build/compiler-pilot/constructor-identity-integration-observations'
          latency=all(row['millis']<=120000 for name in ['checking.json','both.json'] for row in json.loads((observed/name).read_text())['observations']) if all((observed/name).exists() for name in ['checking.json','both.json']) else False
          expected_exits={'pass/arithmetic/runtime_composite_bound_arrivals_exit': '0',
           'pass/borrows/runtime_case_descriptor_retirement_exit': '0',
           'pass/contracts/completed_unit_call_post_case': '0',
           'pass/contracts/nested_case_guarantee_disjunction_exit': '0',
           'pass/contracts/saved_call_case_guarantee_requires_exit': '0',
           'pass/core/aggregate_snapshot_copy_exit': '0',
           'pass/float/constructed_ieee_predicates_exit': '0',
           'pass/generics/omitted_data_binder_range_equation': '92',
           'pass/generics/runtime_generic_carrier_equation_exit': '7',
           'pass/generics/runtime_phantom_owned_constructor_exit': '0',
           'pass/ownership/runtime_whole_borrowed_transform_exit': '42'}
          engine_rows=json.loads((observed/'both.json').read_text())['observations'] if (observed/'both.json').exists() else []
          authored_results=len(engine_rows)==len(expected_exits) and all(row['status']=='built' and row['facts'].get('exit')==expected_exits.get(row['fixture']) and row['facts'].get('interpreter-exit')==expected_exits.get(row['fixture']) and row['facts'].get('interpreter')=='agrees' for row in engine_rows)
          (observed/'scope.json').write_text(json.dumps({'source':source,'driver':driver,'target':target,'producer':producer.record(),'positive':positive,'negative':negative,'suite_exit':status,'latency_within_original_limit':latency,'passed':status==0 and latency and authored_results,'authored_results_confirmed':authored_results,'expected_exits':expected_exits,'limits':'Original 120-second Source/BOTH limits; one worker; profiling off. Preserving published constructor identity in the shared comparison; original controls plus the existing phantom-owner pair. Historical f006 and stock failures retain their exact identities; no earlier SDK/ordinary/host results are relabeled.'},indent=2)+'\n')
          raise SystemExit(0 if status==0 and latency and authored_results else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-constructor-identity-integration-observations-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/constructor-identity-integration-observations/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
