name: Validate integrated core defaults and original customers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  CARGO_TARGET_DIR: /tmp/ot
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      compiler_status: ${{ steps.compiler.outcome }}
      sdk_status: ${{ steps.sdk.outcome }}
      artifact_id: ${{ steps.retained.outputs.artifact-id }}
