name: Private fixed-06af file merge inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the exact reviewed module bodies without a checkout or build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import collections
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import urllib.error
          import urllib.request
          
          INPUT = "cfc7ec50ef6b85a004af544899fa5fcd46dc746d"
          PACKED_BYTES = 5608300
          PACKED_SHA256 = "5684ba2406be6a60e2127191d4f898b783f967e8a26f0bd6ba7c6dcedb24a529"
          RAW_BYTES = 39852817
          RAW_SHA256 = "fe167835ed1855a75d0c37abf6dc2ee56b379a68a9bb09a94415408052b9417f"
          request = urllib.request.Request(
              "https://api.github.com/repos/CathedralOS/Omega/git/blobs/" + INPUT,
              headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                       "Accept": "application/vnd.github+json"})
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, stream, code, message, headers, url):
                  return None
          
          try:
              with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as stream:
                  response = json.load(stream)
          except urllib.error.HTTPError as error:
              raise RuntimeError("Fixed Git input API refused: HTTP " + str(error.code)) from None
          except urllib.error.URLError as error:
              raise RuntimeError("Fixed Git input API failed: " + type(error.reason).__name__) from None
          assert response["sha"] == INPUT
          packed = base64.b64decode(response["content"])
          assert len(packed) == PACKED_BYTES and hashlib.sha256(packed).hexdigest() == PACKED_SHA256
          assert hashlib.sha1(b"blob " + str(len(packed)).encode() + b"\0" + packed).hexdigest() == INPUT
          raw = gzip.decompress(packed)
          assert len(raw) == RAW_BYTES and hashlib.sha256(raw).hexdigest() == RAW_SHA256
          packet = json.loads(raw)
          assert packet["schema"] == "omega-fixed06af-file-merge-inputs-v1"
          assert len(packet["rows"]) == 21
          assert packet["refs"] == {'base': 'ad3cf2407872ee6ed049f8d4c13ac744c00cf0b5', 'feature': 'e30a9a2d546730ab5bd40462f2fcb216d917c711', 'main': '06af8fee3fe1183a2d61f3b3488b359e6e6fcdb7'}
          results = []
          counts = collections.Counter()
          with tempfile.TemporaryDirectory(prefix="case-06af-merge-", dir=os.environ["RUNNER_TEMP"]) as temporary:
              directory = Path(temporary)
              for index, row in enumerate(packet["rows"]):
                  values = row["canonical"]
                  conflict_hunks = 0
                  input_receipts = {name: dict(bytes=len(text.encode()), sha256=hashlib.sha256(text.encode()).hexdigest())
                                    for name, text in values.items()}
                  base, feature, main = (values[key] for key in ("base", "feature", "main"))
                  if base == feature:
                      result, status = main, "unchanged"
                  elif row["row"]["main"] is None:
                      assert row["row"]["old"]["base"] is None
                      result, status = feature, "new-feature-module"
                  elif main == base:
                      result, status = feature, "feature"
                  elif main == feature:
                      result, status = main, "same"
                  else:
                      paths = []
                      for name, text in (("main", main), ("base", base), ("feature", feature)):
                          content = text.encode()
                          path = directory / name
                          path.write_bytes(content)
                          assert path.stat().st_size == len(content)
                          readback = path.read_bytes()
                          assert readback == content
                          assert hashlib.sha256(readback).hexdigest() == hashlib.sha256(content).hexdigest()
                          paths.append(str(path))
                      process = subprocess.run(
                          ["git", "merge-file", "-p", "-L", "fixed-main-06af",
                           "-L", "base-ad3", "-L", "feature-e30", *paths],
                          capture_output=True, timeout=30)
                      assert 0 <= process.returncode <= 127, process.stderr.decode(errors="replace")
                      conflict_hunks = process.returncode
                      result = process.stdout.decode()
                      status = "clean-three-way" if process.returncode == 0 else "text-conflict"
                  counts[status] += 1
                  results.append(dict(index=index, row=row["row"], canonical=values,
                                      result=result, status=status, conflict_hunks=conflict_hunks,
                                      input_receipts=input_receipts))
          output = Path(os.environ["RUNNER_TEMP"]) / "case-06af-merge-output"
          output.mkdir(exist_ok=False)
          record = dict(schema="omega-fixed06af-full-byte-git-file-merge-v1",
                        fixed_base="ad3cf2407872ee6ed049f8d4c13ac744c00cf0b5",
                        fixed_feature="e30a9a2d546730ab5bd40462f2fcb216d917c711",
                        fixed_main="06af8fee3fe1183a2d61f3b3488b359e6e6fcdb7",
                        input_blob=INPUT, input_sha256=RAW_SHA256,
                        packed_bytes=PACKED_BYTES, packed_sha256=PACKED_SHA256, counts=dict(counts),
                        git=subprocess.check_output(["git", "--version"], text=True).strip(),
                        rows=results,
                        limits="Read-only merge inspection; no checkout, index, compiler, program, test or ref changes.")
          serialized = (json.dumps(record, sort_keys=True) + "\n").encode()
          archive = gzip.compress(serialized, mtime=0)
          (output / "body-merges.json.gz").write_bytes(archive)
          summary = dict(input_blob=INPUT, counts=dict(counts), raw_bytes=len(serialized),
                         raw_sha256=hashlib.sha256(serialized).hexdigest(),
                         gzip_bytes=len(archive), gzip_sha256=hashlib.sha256(archive).hexdigest(),
                         conflicts=[dict(index=row["index"], crate=row["row"]["crate"],
                                         module=row["row"]["old_module"], conflict_hunks=row["conflict_hunks"])
                                    for row in results if row["status"] == "text-conflict"])
          (output / "summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fixed-06af-file-merge
          path: ${{ runner.temp }}/case-06af-merge-output/
          if-no-files-found: error
