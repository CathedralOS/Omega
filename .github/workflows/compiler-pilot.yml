name: Qualify Build-selected finite progress
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TARGET_DIR: /tmp/ot
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pin the unchanged published producer boundary
        run: git fetch --no-tags --depth=1 origin 2a74eb21cdb4ff7bdfded0a75cf0dabd89b62ff0:refs/remotes/origin/main
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: retained
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-2a74eb21cdb4ff7bdfded0a75cf0dabd89b62ff0
          fail-on-cache-miss: true
      - name: Require the exact original compiler cache
        env:
          CACHE_HIT: ${{ steps.retained.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.retained.outputs.cache-matched-key }}
        shell: python
        run: |
          import os
          assert os.environ['CACHE_HIT']=='true'
          assert os.environ['CACHE_MATCH']=='compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-2a74eb21cdb4ff7bdfded0a75cf0dabd89b62ff0'
      - name: Qualify the nine places and original stale-value controls
        run: python tools/ci/compiler_pilot.py --fixtures @.github/progress_selector_qualification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progress-selector-build-linux-${{ github.run_id }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-replay-*/**
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
