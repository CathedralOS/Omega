name: Attribute empty-owned checking against published c417
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  empty-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage the exact observer before selecting its compiled source
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'ee357443d61244a8a5f27b29383f912e97fc6cbd'
          stage = Path(os.environ['RUNNER_TEMP']) / 'installed-entry-empty-baseline-observer'
          stage.mkdir(exist_ok=False)
          files = {}
          for name in ['run_installed_entry_empty_baseline.py', 'installed_entry_empty_baseline_recipe.json', 'installed_entry_empty_baseline_inputs.json']:
              data = (Path('.github') / name).read_bytes()
              (stage / name).write_bytes(data)
              files[name] = hashlib.sha256(data).hexdigest()
          (stage / 'staged-observer.json').write_text(json.dumps({'observer':os.environ['GITHUB_SHA'], 'files':files}, indent=2) + '\n')
      - name: Select the exact published compiler and program source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c417f61c95ba2b5078d36f367dc9b3c8e2ea0e30
          fetch-depth: 1
          persist-credentials: false
      - name: Authenticate the complete immutable producer remotely without compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/installed-entry-empty-baseline-observer/run_installed_entry_empty_baseline.py" materialize --recipe "$RUNNER_TEMP/installed-entry-empty-baseline-observer/installed_entry_empty_baseline_recipe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-c417-attribution-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-c417-attribution/preparation.json
            build/installed-entry-c417-attribution/producer.json
            build/installed-entry-c417-attribution/retained/compiler-pilot/summary.json
            build/installed-entry-c417-attribution/retained/compiler-pilot/source/manifest.json
            build/installed-entry-c417-attribution/retained/compiler-pilot/producer-*/*.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Check exactly the empty-owned positive and scalar-alias negative
        run: python "$RUNNER_TEMP/installed-entry-empty-baseline-observer/run_installed_entry_empty_baseline.py" check --recipe "$RUNNER_TEMP/installed-entry-empty-baseline-observer/installed_entry_empty_baseline_recipe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-c417-attribution-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-c417-attribution/*.json
            build/installed-entry-c417-attribution/*.stdout
            build/installed-entry-c417-attribution/*.stderr
            build/installed-entry-c417-attribution/source/
            build/installed-entry-c417-attribution/artifacts-*/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
