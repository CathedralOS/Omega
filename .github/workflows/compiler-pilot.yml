ers/inherited_provider_phantom_arguments', 'fail/ownership/selected_linear_source_missing_drop', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority', 'fail/cases/constructor_subject_range_neighbor_not_evidence', 'fail/ownership/linear_array_constructor_duplicate_operand', 'fail/ownership/linear_array_member_scope_loss', 'fail/borrows/shared_observation_does_not_discharge_linear_owner', 'fail/traits/public_method_callback_prefix_wrong_contract');checking_only=('pass/packages/rootless_numeric_provider_review', 'pass/packages/rootless_numeric_provider_consumer', 'pass/float/runtime_classification_result_categories_exit')
          import build_consent_controls as controls
          import build_slot,compiler_profile,subprocess,time
          assert json.loads((output/'preparation.json').read_text())['passed']
          sdk=output/'sdk';sdk.mkdir(exist_ok=False)
          files=subprocess.check_output(['git','ls-files','source/library','omega-rust/omega/compilation/compiler/examples','omega-rust/omega/compilation/compiler/tests/support'],text=True).splitlines()
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}
          objects={p:controls.git('rev-parse',source+':'+p) for p in ['omega-rust','source/library','tools','.github','Cargo.toml','Cargo.lock','rust-toolchain.toml','tests/omega']}
          report={'source':source,'tree':controls.git('rev-parse','HEAD^{tree}'),'driver':driver,'target':controls.host_target(),'toolchain':subprocess.check_output(['rustc','-Vv'],text=True).strip(),'passed':False,'inputs':inputs,'source_objects':objects,'profiles':{},'binaries':{},'builds':[]}
          try:
           with build_slot.hold(root):
            for name in ['default_build','build_charge']:
             started=time.monotonic();binary,cargo_profile=controls.build(sdk,name,['build','--locked','-p','compiler','--example',name])
             profile=compiler_profile.require_optimized(binary);assert str(cargo_profile['opt_level'])==profile['profile']['opt_level']
             report['profiles'][name]=profile;report['binaries'][name]=str(binary);report['builds'].append({'example':name,'seconds':round(time.monotonic()-started,3)})
           for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h
           report['passed']=True
          finally:(sdk/'preparation.json').write_text(json.dumps(report,indent=2)+'\n')
          raise SystemExit(0 if report['passed'] else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: retained
        if: always()
        with:
          name: core-float-integrated-preparation-${{ github.run_id }}
          path: build/compiler-pilot/integrated/
          include-hidden-files: true
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
  corpus:
