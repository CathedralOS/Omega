name: Check vacant structural local registration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_FIXTURE_SECS: '600'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_SDK_SOURCE: 689df3fa3944e437d82d1ad9b476c3d65af2a553
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 689df3fa3944e437d82d1ad9b476c3d65af2a553
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and observe the unchanged ownership programs
        run: |
          python3 - <<'SDK'
          """Observe vacant-home registration through the existing compiler pilot."""
          from pathlib import Path
          import hashlib,json,os,sys
          sys.path[:0]=[str(Path.cwd()/'tools/ci'),str(Path.cwd()/'tools')]
          import build_slot,compiler_pilot
          source='689df3fa3944e437d82d1ad9b476c3d65af2a553'
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          output=Path('build/compiler-pilot/vacant-home');output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':os.environ['GITHUB_SHA']},indent=2)+'\n')
          os.environ['GITHUB_SHA']=source
          assert os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='600'
          with build_slot.hold(Path.cwd()):
           producer=compiler_pilot.prepare_producer(output)
          producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/vacant-home-observations',('pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/ownership/runtime_selective_constructed_owner_custody_exit', 'pass/ownership/runtime_nested_projected_claim_return_exit'),('fail/ownership/whole_borrowed_missing_repair', 'fail/ownership/whole_linear_parent_move_keeps_unique_custody', 'fail/ownership/selected_linear_source_missing_drop'),producer=producer,checking_only=('pass/packages/rootless_numeric_provider_review', 'pass/packages/rootless_numeric_provider_consumer', 'pass/float/runtime_classification_result_categories_exit'),cli_fixtures=('pass/ownership/runtime_whole_borrowed_transform_exit',))
          producer.verify()
          summary=json.loads(Path('build/compiler-pilot/vacant-home-observations/summary.json').read_text())
          assert summary['producer']==producer.record() and summary['candidate']==source
          (output/'scope.json').write_text(json.dumps({'source':source,'producer':producer.record(),'suite_exit':status,'fixture_budget_seconds':600,'source_exports':summary['source_exports'],'passed':summary['passed']},indent=2)+'\n')
          raise SystemExit(status)
          SDK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-vacant-home-${{ github.run_id }}
          path: build/compiler-pilot/
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
