name: Installed entry target migration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_TARGET_DIR: /tmp/ot
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate completed published producer and migration inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'CHECK'
          import hashlib, json, os, subprocess
          from pathlib import Path
          output = Path('build/installed-entry-migration')
          output.mkdir(parents=True, exist_ok=False)
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path], text=True))
          run = api('repos/CathedralOS/Omega/actions/runs/42159698659')
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          assert run['head_sha'] == '0b53c8a4e109e8d6ef3a9bbabc29c52529317a48'
          artifact = api('repos/CathedralOS/Omega/actions/artifacts/13477766469')
          assert not artifact['expired'] and artifact['workflow_run']['id'] == run['id']
          assert artifact['workflow_run']['head_sha'] == run['head_sha']
          assert artifact['size_in_bytes'] == 564769040
          assert artifact['digest'] == 'sha256:779a859071009316756a6ba2a4f6ffe33bc698017f63192801bc81b4f4483c58'
          assert os.environ['OMEGA_CORPUS_FIXTURE_SECS'] == '120'
          assert os.environ['OMEGA_CORPUS_JOBS'] == '1' and not os.environ.get('OMEGA_PHASE_PROFILE')
          inputs = json.loads(Path('.github/installed_entry_inputs.json').read_text())
          assert all(hashlib.sha256(Path(p).read_bytes()).hexdigest() == h for p, h in inputs['inputs'].items())
          assert subprocess.check_output(['git', 'status', '--porcelain'], text=True).strip() == ''
          (output / 'origin.json').write_text(json.dumps({'run':run, 'artifact':artifact, 'observer':os.environ['GITHUB_SHA'], 'program_inputs':inputs['program_source']}, indent=2) + '\n')
          CHECK
      - name: Pin the published source boundary
        run: git fetch --no-tags --depth=1 origin 0b53c8a4e109e8d6ef3a9bbabc29c52529317a48:refs/remotes/origin/main
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: retained-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-0b53c8a4e109e8d6ef3a9bbabc29c52529317a48
          fail-on-cache-miss: true
      - name: Require the exact cache; never build a replacement
        run: |
          python - <<'CACHE'
          assert '${{ steps.retained-cache.outputs.cache-hit }}' == 'true'
          CACHE
      - name: Observe migrated target checks and engine backing
        run: |
          python - <<'CORPUS'
          from tools.ci.compiler_pilot import run_suite
          raise SystemExit(run_suite('installed-entry-migration', (), (), fixtures='@.github/installed_entry_plan.json'))
          CORPUS
      - name: Retain the original corpus budgets
        if: ${{ !cancelled() && steps.retained-cache.outputs.cache-hit == 'true' }}
        run: |
          python - <<'BUDGET'
          import json
          from pathlib import Path
          root = Path('build/installed-entry-migration')
          checking = json.loads((root / 'checking.json').read_text())
          both = json.loads((root / 'both.json').read_text())
          rows = checking['observations'] + both['observations']
          assert len(checking['observations']) == 1 and len(both['observations']) == 1
          passed = all(type(row.get('millis')) is int and 0 <= row['millis'] <= 120000 for row in rows)
          (root / 'budgets.json').write_text(json.dumps({'limit_ms':120000, 'passed':passed, 'checking':checking['observations'], 'both':both['observations']}, indent=2) + '\n')
          assert passed, 'Original corpus budget remains unmet; reports retained unchanged'
          BUDGET
      - name: Observe ordinary target entry RAM and its invalid twin
        if: ${{ !cancelled() && steps.retained-cache.outputs.cache-hit == 'true' }}
        run: |
          python - <<'SAMPLES'
          import json, os, subprocess, sys
          from pathlib import Path
          output = Path('build/installed-entry-migration')
          summary = json.loads((output / 'summary.json').read_text())
          cli = summary['producer']['cli']
          command = [sys.executable, '.github/installed_entry_samples.py', '--cli', cli,
                     '--source', os.environ['GITHUB_SHA'], '--manifest', '.github/installed_entry_inputs.json',
                     '--output', str(output / 'samples')]
          result = subprocess.run(command, stdin=subprocess.DEVNULL)
          if result.returncode:
              raise SystemExit(result.returncode)
          rows = json.loads((output / 'samples/samples.json').read_text())
          expected = json.loads(Path('.github/installed_entry_inputs.json').read_text())['samples']
          assert len(rows) == len(expected) == 2 and {r['sample'] for r in rows} == set(expected)
          assert all(r['state'] == ('rejected' if r['sample'].endswith('/invalid') else 'pass') for r in rows)
          SAMPLES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-migration-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-migration/*.json
            build/installed-entry-migration/source/
            build/installed-entry-migration/producer-replay-*/cache-inputs.json
            build/installed-entry-migration/artifacts-*/
            build/installed-entry-migration/samples/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
