name: Qualify progress receipt and signature preservation
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TARGET_DIR: /tmp/ot
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Restore the authenticated exact base cache for the necessary rebuild
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: warm
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-2a74eb21cdb4ff7bdfded0a75cf0dabd89b62ff0
          fail-on-cache-miss: true
      - name: Require the exact warm base without a cold fallback
        env:
          CACHE_HIT: ${{ steps.warm.outputs.cache-hit }}
          CACHE_MATCH: ${{ steps.warm.outputs.cache-matched-key }}
        shell: python
        run: |
          import os
          assert os.environ['CACHE_HIT'] == 'true'
          assert os.environ['CACHE_MATCH'] == 'compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-2a74eb21cdb4ff7bdfded0a75cf0dabd89b62ff0'
      - name: Check, test evidence algebra and prepare the actual repaired compiler
        id: preparation
        run: python tools/build_slot.py -- python .github/progress_repair_prepare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progress-selector-repair-preparation-${{ github.run_id }}
          path: build/compiler-pilot/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Save the actual repaired cache before consumers
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: progress-selector-repair-Linux-X64-${{ github.sha }}
      - name: Observe the unchanged full row and original controls
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        run: python .github/progress_repair_prepare.py --consume
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progress-selector-repair-observations-${{ github.run_id }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
