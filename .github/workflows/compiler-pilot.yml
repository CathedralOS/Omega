name: Check published callable associations on Linux

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      phase_profile:
        description: Record compiler phase timings for a focused attribution run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue. Manual revisions use isolated
# runners and may proceed while an earlier revision finishes its consumers.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}-callable-association-linux
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: /tmp/ot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: edd05427fd02b135bf896c3633dc55fb59bf73e2
          fetch-depth: 64
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record the separate driver and exact compiler source
        shell: python
        env:
          OMEGA_WORKFLOW_DRIVER_REVISION: ${{ github.sha }}
          OMEGA_QUALIFICATION_HOST: linux_x86_64
        run: |
          import json, os, subprocess
          from pathlib import Path
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == 'edd05427fd02b135bf896c3633dc55fb59bf73e2'
          assert os.environ['OMEGA_QUALIFICATION_HOST'] == 'linux_x86_64'
          output = Path('build/compiler-pilot')
          output.mkdir(parents=True, exist_ok=False)
          record = dict(driver_revision=os.environ['OMEGA_WORKFLOW_DRIVER_REVISION'],
                        compiler_program_source=actual, target='linux_x86_64',
                        warm_cache_key='compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-07301d6612988eacde667d9e8be12a60800600a9', warm_cache_id=10117333984,
                        warm_cache_ref='refs/heads/main',
                        warm_cache_source='07301d6612988eacde667d9e8be12a60800600a9',
                        cache_use='Normally visible completed default-main build objects only. Fixed source remains edd0; no historical execution is reused.')
          record['unit_tests'] = {'table-tests': {'filter': 'callable_applications::table::tests::', 'expected_names': ['typed_trees::callable_applications::table::tests::invocation_generations_keep_separate_rows_in_arena_order', 'typed_trees::callable_applications::table::tests::recycled_row_slots_return_to_their_arena_position', 'typed_trees::callable_applications::table::tests::clones_replacement_and_record_recovery_keep_their_own_associations', 'typed_trees::callable_applications::table::tests::signature_and_requirement_updates_cannot_change_invocation_ownership', 'typed_trees::callable_applications::table::tests::absent_invocations_and_trait_only_tables_have_no_machine_rows', 'typed_trees::callable_applications::table::tests::record_recovery_budgets_association_before_allocating_for_handles', 'typed_trees::callable_applications::table::tests::small_record_recovery_charges_every_preallocated_association_buffer']}, 'contract-record-test': {'filter': 'callable_applications::machine_selections::record_tests::', 'expected_names': ['typed_trees::callable_applications::machine_selections::record_tests::selected_contract_records_keep_caller_bindings_and_completion_state']}}
          (output / 'driver.json').write_text(json.dumps(record, indent=2) + chr(10))
          print(json.dumps(record, sort_keys=True))
      - name: Retain the fixed published source prerequisite
        run: git fetch --no-tags --depth=1 origin c417f61c95ba2b5078d36f367dc9b3c8e2ea0e30:refs/remotes/origin/main
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Restore the exact visible default-main build objects
        id: build-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-07301d6612988eacde667d9e8be12a60800600a9
          fail-on-cache-miss: true
      - name: Refuse any different cache before Cargo
        env:
          OMEGA_MATCHED_CACHE: ${{ steps.build-cache.outputs.cache-matched-key }}
        run: python -c "import os; assert os.environ['OMEGA_MATCHED_CACHE'] == 'compiler-regression-Linux-X64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-07301d6612988eacde667d9e8be12a60800600a9'"
      - name: Check, prepare and test the callable table under one build slot
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        shell: python
        run: |
          import datetime, hashlib, json, os, re, shutil, subprocess, sys, time
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / 'tools'))
          import build_slot
          output = Path('build/compiler-pilot')
          driver = json.loads((output / 'driver.json').read_text())
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == driver['compiler_program_source'] == 'edd05427fd02b135bf896c3633dc55fb59bf73e2'
          tool = shutil.which('mbx') or 'cargo'
          def command(name, arguments, environment):
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              clock = time.monotonic()
              print(json.dumps(dict(stage=name, command=arguments, started=started,
                                    source=source, driver=driver['driver_revision'])), flush=True)
              stdout = output / (name + '.stdout')
              stderr = output / (name + '.stderr')
              with stdout.open('xb') as out, stderr.open('xb') as err:
                  try:
                      result = subprocess.run(arguments, env=environment, stdin=subprocess.DEVNULL,
                                              stdout=out, stderr=err)
                      code = result.returncode
                  except OSError as error:
                      err.write((str(error) + chr(10)).encode())
                      code = 1
              record = dict(command=arguments, exit_code=code, seconds=time.monotonic() - clock,
                            started=started, finished=datetime.datetime.now(datetime.timezone.utc).isoformat(),
                            source=source, driver=driver['driver_revision'],
                            source_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                            stdout=dict(file=stdout.name, bytes=stdout.stat().st_size,
                                        sha256=hashlib.sha256(stdout.read_bytes()).hexdigest()),
                            stderr=dict(file=stderr.name, bytes=stderr.stat().st_size,
                                        sha256=hashlib.sha256(stderr.read_bytes()).hexdigest()))
              (output / (name + '.json')).write_text(json.dumps(record, indent=2) + chr(10))
              print(json.dumps(dict(stage=name, **record)), flush=True)
              return code
          # The child inherits the held-slot marker, so canonical preparation
          # uses this same hold instead of taking a second slot.
          with build_slot.hold(Path.cwd()):
              environment = dict(os.environ, GITHUB_SHA=source)
              code = command('compiler-check', [tool, 'check', '--locked', '-p', 'omega'], environment)
              if code:
                  raise SystemExit(code)
              with Path(os.environ['GITHUB_OUTPUT']).open('a') as stream:
                  stream.write('compiler_check=success' + chr(10))
              code = command('producer-command', [sys.executable, 'tools/ci/compiler_pilot.py',
                                                 '--phase', 'prepare'], environment)
              if code:
                  raise SystemExit(code)
              for name, unit in driver['unit_tests'].items():
                  selected = unit['filter']
                  arguments = ([tool, 'nextest', 'run', '--locked', '-p', 'typed-trees',
                                '--color', 'never', '--status-level', 'pass', '--retries', '0', selected]
                               if Path(tool).stem == 'mbx' else
                               [tool, 'test', '--locked', '-p', 'typed-trees', '--lib', selected, '--', '--nocapture'])
                  code = command(name, arguments, environment)
                  if code:
                      raise SystemExit(code)
                  text = (output / (name + '.stdout')).read_text() + chr(10) + (output / (name + '.stderr')).read_text()
                  text = re.sub(r'\x1b\[[0-9;]*m', '', text)
                  if Path(tool).stem == 'mbx':
                      passed = {line.split()[-1] for line in text.splitlines()
                                if re.match(r'^\s*PASS(?:\s|$)', line)}
                      summaries = [(int(total), int(success)) for total, success in
                                   re.findall(r'(\d+) tests? run:\s*(\d+) passed', text)]
                  else:
                      passed = set(re.findall(r'^test (\S+) \.\.\. ok$', text, re.MULTILINE))
                      summaries = [(int(total), int(total)) for total in
                                   re.findall(r'test result: ok\. (\d+) passed; 0 failed; 0 ignored; 0 measured;', text)]
                  expected = set(unit['expected_names'])
                  verified = passed == expected and summaries == [(len(expected), len(expected))]
                  receipt = dict(passed=verified, expected_names=sorted(expected),
                                 actual_passing_names=sorted(passed), summaries=summaries,
                                 source=source, driver=driver['driver_revision'])
                  (output / (name + '-verification.json')).write_text(json.dumps(receipt, indent=2) + chr(10))
                  print(json.dumps(dict(unit=name, **receipt)), flush=True)
                  if not verified:
                      raise SystemExit('Unit names/count differ from the frozen expected passing roster')
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-linux_x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Save useful objects after the held check/preparation chain and before consumers.
      - name: Retain the prepared build even when a later table test fails
        if: always() && !cancelled() && steps.producer-preparation.outputs.compiler_check == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler phase timings
        if: github.event_name == 'workflow_dispatch' && inputs.phase_profile
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PHASE_PROFILE=1\n')"
      - name: Check all sources and run the two affected execution pairs
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        shell: python
        run: |
          import json, os, sys, traceback
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd()))
          from tools.ci import compiler_pilot as pilot
          os.environ['GITHUB_SHA'] = 'edd05427fd02b135bf896c3633dc55fb59bf73e2'
          positives, negatives = pilot.select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'])
          runtime = ('pass/borrows/runtime_static_callback_snapshot_exit',
                     'pass/facts/match_computed_root_through_target_body_exit')
          assert set(runtime) <= set(positives)
          checking = tuple(item for item in positives if item not in runtime)
          ordinary = pilot.select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES'])
          assert (len(positives), len(negatives), len(checking), len(ordinary)) == (17, 30, 15, 2)
          output = Path('build/compiler-pilot')
          preparation = json.loads((output / 'preparation.json').read_text())
          assert preparation['passed']
          assert set(preparation['consumers']['positives']) == set(positives)
          assert set(preparation['consumers']['negatives']) == set(negatives)
          assert set(preparation['consumers']['cli_fixtures']) == set(ordinary)
          summary = dict(schema='omega-compiler-pilot-v1', passed=False)
          try:
              producer = pilot.load_producer(output / 'producer.json')
              pilot.execute(output, summary, positives=runtime, negatives=negatives,
                            checking_only=checking, producer=producer, samples=(), cli_fixtures=ordinary)
              summary['passed'] = True
          except Exception as error:
              summary['error'] = str(error)
              traceback.print_exc()
          finally:
              (output / 'summary.json').write_text(json.dumps(summary, indent=2) + chr(10))
          raise SystemExit(0 if summary['passed'] else 1)
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('preparation.json', 'summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json', 'build-consent-controls.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-observations-linux_x86_64-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-records-linux_x86_64-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7
