name: Sample CPU cost of one unchanged structural generic customer
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 64c05c0020023f6177e01f44fc9050585cc72741
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare standard CPU sampling tools
        run: sudo apt-get -qq update && sudo apt-get -qq install -y linux-tools-generic
      - name: Sample the actual retained compiler under the existing corpus bound
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          settings={'label': 'structural-generic-customer-cpu-env-5fe-linux',
           'target': 'linux_x86_64',
           'run': 41937731433,
           'artifact': 'compiler-regression-Linux-X64-5fe672430be9a1c5560d74bb5102f4f70ddfba68-1',
           'producer_source': '5fe672430be9a1c5560d74bb5102f4f70ddfba68',
           'producer_tree': '6fd79706fc598283d3654f1f51f1ea4e029193d1',
           'program_source': '64c05c0020023f6177e01f44fc9050585cc72741',
           'program_tree': '6fd79706fc598283d3654f1f51f1ea4e029193d1',
           'original_producer': {'revision': '5fe672430be9a1c5560d74bb5102f4f70ddfba68',
                                 'tree': '6fd79706fc598283d3654f1f51f1ea4e029193d1',
                                 'target': 'linux_x86_64',
                                 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\n'
                                              'binary: rustc\n'
                                              'commit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\n'
                                              'commit-date: 2026-09-03\n'
                                              'host: x86_64-unknown-linux-gnu\n'
                                              'release: 1.100.0-nightly\n'
                                              'LLVM version: 23.1.1',
                                 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-3orsggiy/omega',
                                 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-3orsggiy/corpus_runner',
                                 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-3orsggiy/omega',
                                                 'sha256': '2ab4209042894a95e04189674eadb12827164b5f4ca020ed5f7395ffd100a0d5',
                                                 'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                             'opt_level': '1'}},
                                 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-3orsggiy/corpus_runner',
                                                    'sha256': '416fffaa2e37083b4f3a1d91802a3001c74daa2368679a782e5b379bcb304d64',
                                                    'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                                'opt_level': '1'}}},
           'objects': {'omega-rust': '0252b4bc9870f17529d0572347000aa426acf01e',
                       'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                       'tools': '4c4948a65a9394812dc40ce9de89ac90f03cf46e',
                       '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                       'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                       'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                       'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'program_objects': {'omega-rust': '0252b4bc9870f17529d0572347000aa426acf01e',
                               'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                               'tools': '4c4948a65a9394812dc40ce9de89ac90f03cf46e',
                               '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                               'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                               'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                               'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'baseline': False,
           'input_hashes': {'tests/omega/fail/generics/generic_carrier_equation_index_conflict/expected.txt': 'ce99563d1a8412aa9ea9a7d31b937258f0b18a6467b6293d20b9feed2736ecdb',
                            'tests/omega/fail/generics/generic_carrier_equation_index_conflict/main.omg': '44a38f9d85ac3153cab27d763e0cc9448255dac0c64a75096820fc882e28c342',
                            'tests/omega/fail/generics/generic_carrier_equation_mismatch/expected.txt': '939f57ebe8efbf566e9c828f9bd48396bed403e50fa700509a7b8d54851cc6f7',
                            'tests/omega/fail/generics/generic_carrier_equation_mismatch/main.omg': '8934cb90b2dd25bd3efabaa5bc92b0222672ac9772552dfd057086622e176788',
                            'tests/omega/fail/generics/generic_carrier_equation_repeated_carrier_conflict/expected.txt': '939f57ebe8efbf566e9c828f9bd48396bed403e50fa700509a7b8d54851cc6f7',
                            'tests/omega/fail/generics/generic_carrier_equation_repeated_carrier_conflict/main.omg': '7d803ea6f061537697ed41c8e76ffb884b250c54e5c41f7e32064a18a4a70529',
                            'tests/omega/fail/generics/generic_carrier_equation_repeated_index_conflict/expected.txt': '939f57ebe8efbf566e9c828f9bd48396bed403e50fa700509a7b8d54851cc6f7',
                            'tests/omega/fail/generics/generic_carrier_equation_repeated_index_conflict/main.omg': '831f48a75080edc61d7367a3510c4623080b25db9daf56f412615439af64bc69',
                            'tests/omega/fail/generics/omitted_data_binder_explicit_conflict/expected.txt': '1751a64bbf4c37e7cac504861933177c4977feb9607a0f25e42d47b5273b5bcc',
                            'tests/omega/fail/generics/omitted_data_binder_explicit_conflict/main.omg': 'de621adec4292e558dbbca83722ab2c5ecade4f0a535e9978a5e91fd94f02c52',
                            'tests/omega/fail/generics/omitted_data_binder_underdetermined/expected.txt': '2f37ed6d553b1a62c7fa3bcae52890456302fe00ac883c38bb7486b3da496f21',
                            'tests/omega/fail/generics/omitted_data_binder_underdetermined/main.omg': 'a0d363bdd43d62c20784f55fe472c358ed11e6ef829e279b4f5b808dba922a3e',
                            'tests/omega/pass/generics/omitted_data_binder_range_equation/build.omg': 'aa37cf0e6c0ab081c71c6c174fbfd01b43066386da636acb54fd72ad1a450a15',
                            'tests/omega/pass/generics/omitted_data_binder_range_equation/expected_native_exit.txt': '13c1dc569ae4a0d7f90d8f83d22fc9c8fa526e133f8fea0f9526c8533c4d8da3',
                            'tests/omega/pass/generics/omitted_data_binder_range_equation/main.omg': '836a91eb9644eda9320269203dc09d464f134db13f034e8913cf6506f24dde42',
                            'tests/omega/pass/generics/runtime_generic_carrier_equation_exit/README.md': '661fab92aa01bab89746f912a9b2094c25d49d819740c886ef65a45b7a127b8c',
                            'tests/omega/pass/generics/runtime_generic_carrier_equation_exit/build.omg': '7a7baea772c6c8f1863abb9731aa725a204d474414405645e09559ae0df6199b',
                            'tests/omega/pass/generics/runtime_generic_carrier_equation_exit/expected_native_exit.txt': '10159baf262b43a92d95db59dae1f72c645127301661e0a3ce4e38b295a97c58',
                            'tests/omega/pass/generics/runtime_generic_carrier_equation_exit/main.omg': '504a673682bb074ef9b7ea0f9b4c735c54256e523f34ce0d6248e1a03b589f4a'},
           'fixtures': ['pass/generics/runtime_generic_carrier_equation_exit'],
           'samples': [],
           'sample_roles': {},
           'sample_root': None,
           'meaning': 'One exact retained5fe customer, cpu-clock sampling only, existing corpusBOTH120s cap; no new '
                      'feature verdict or Rust build.',
           'cli_fixtures': {}}
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']==settings['producer_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_source'] and run['status']=='completed'
          retained=out/'retained';subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.rglob('producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']==settings['target']
          sys.path.insert(0,'tools/ci');import compiler_pilot,platform
          assert compiler_pilot.corpus_gate.host_target()==settings['target']
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=sorted(set(settings['input_hashes']) | set(subprocess.check_output(['git','ls-files','source/library'],text=True).splitlines()))
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          for p,h in settings['input_hashes'].items():assert inputs[p]==h,p
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=SimpleNamespace(cli=cli,runner=runner,target=settings['target'],verify=verify,record=lambda:original)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'host':{'system':platform.system(),'machine':platform.machine(),'version':platform.version()},'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          report=out/'both.json'
          perfs=[p for p in Path('/usr/lib/linux-tools').glob('*/perf') if p.is_file() and os.access(p,os.X_OK)]
          assert perfs,'No installed perf executable; no compiler ran.'
          perf=sorted(perfs)[-1]
          perf_identity={'path':str(perf),'sha256':hashlib.sha256(perf.read_bytes()).hexdigest(),'version':subprocess.check_output([str(perf),'--version'],text=True).strip()}
          workload=[sys.executable,'tools/corpus_gate.py','--runner',str(runner),'--filter',settings['fixtures'][0],'--both','--json',str(report),'--golden',str(compiler_pilot.observation_golden(out,both=True,target=settings['target']))]
          import getpass
          workload_environment={'OMEGA_PHASE_PROFILE':'0','OMEGA_CORPUS_JOBS':'1','OMEGA_CORPUS_SWEEP':'1','OMEGA_CORPUS_CAPTURE_ARTIFACTS':str(out/'both-artifacts'),'RUST_MIN_STACK':os.environ['RUST_MIN_STACK'],'OMEGA_LIBRARY_ROOT':str(root/'source/library')}
          for key in ['PATH','HOME','USER','LOGNAME','SHELL','CARGO_HOME','RUSTUP_HOME','RUSTUP_TOOLCHAIN','LD_LIBRARY_PATH','TMPDIR','XDG_CACHE_HOME','XDG_CONFIG_HOME','XDG_DATA_HOME']:
              if key in os.environ:workload_environment[key]=os.environ[key]
          ordinary_workload=['sudo','--non-interactive','--preserve-env','-u',getpass.getuser(),'env','-u','SUDO_COMMAND','-u','SUDO_UID','-u','SUDO_GID','-u','SUDO_USER']+[key+'='+value for key,value in workload_environment.items()]+workload
          command=['sudo','--non-interactive','--preserve-env',str(perf),'record','-e','cpu-clock:u','-F','49','--call-graph','dwarf,8192','-o',str(out/'perf.data'),'--']+ordinary_workload
          environment=dict(os.environ,OMEGA_PHASE_PROFILE='0',OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_SWEEP='1',OMEGA_CORPUS_CAPTURE_ARTIFACTS=str(out/'both-artifacts'))
          with (out/'cpu.stdout').open('w') as stdout,(out/'cpu.stderr').open('w') as stderr:
              result=subprocess.run(command,env=environment,stdout=stdout,stderr=stderr)
          if (out/'perf.data').exists():subprocess.run(['sudo','--non-interactive','chown',str(os.getuid())+':'+str(os.getgid()),str(out/'perf.data')],check=True)
          verify()
          observed=json.loads(report.read_text()) if report.is_file() else None
          if observed:
              assert observed['leg']=='both' and observed['target']==settings['target']
              assert [row['fixture'] for row in observed['observations']]==settings['fixtures']
          decodes=[]
          for name,arguments in [('perf-self.txt',['--no-children','--sort','symbol','--percent-limit','0.3']),('perf-callers.txt',['--call-graph','graph,1,caller','--percent-limit','1'])]:
              with (out/name).open('w') as stdout,(out/(name+'.stderr')).open('w') as stderr:
                  decoded=subprocess.run([str(perf),'report','--stdio','-i',str(out/'perf.data')]+arguments,stdout=stdout,stderr=stderr)
              decodes.append({'name':name,'exit':decoded.returncode})
          (out/'summary.json').write_text(json.dumps({'measurement_only':True,'sampler_user':'root','workload_user':getpass.getuser(),'sysctl_changed':False,'command':command,'command_exit':result.returncode,'perf':perf_identity,'decoded':decodes,'observation_available':observed is not None,'producer':original,'program_source':settings['program_source'],'driver':os.environ['GITHUB_SHA'],'builds_rust':False,'limits_changed':False,'phase_profile':False,'input_count':len(inputs)},indent=2)+'\n')
          if observed:print(json.dumps(observed,indent=2))
          print((out/'cpu.stderr').read_text())
          print((out/'perf-self.txt').read_text()[:25000])
          raise SystemExit(result.returncode)
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: structural-generic-customer-cpu-env-5fe-linux-${{ github.run_id }}
          path: |
            build/structural-generic-customer-cpu-env-5fe-linux/*.json
            build/structural-generic-customer-cpu-env-5fe-linux/*.txt
            build/structural-generic-customer-cpu-env-5fe-linux/*.stdout
            build/structural-generic-customer-cpu-env-5fe-linux/*.stderr
            build/structural-generic-customer-cpu-env-5fe-linux/perf.data
            build/structural-generic-customer-cpu-env-5fe-linux/both-artifacts/
          retention-days: 7
