name: Qualify the remaining customers after main integration
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  matching-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos_arm64
            runner: macos-15
            target_dir: /tmp/ot
          - host: linux_arm64
            runner: ubuntu-24.04-arm
            target_dir: /tmp/ot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 160
    env:
      NATIVE_HOST: ${{ matrix.host }}
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f00661dbe2a16882c56756b15549d1316477ae46
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Prepare the exact optimized compiler
        id: preparation
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='f00661dbe2a16882c56756b15549d1316477ae46';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive={'macos_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit'), 'linux_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit')}[target];negative=('fail/arithmetic/composite_bound_arrival_unbounded_predecessor', 'fail/borrows/private_arrival_default_domain_weak_bound', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/ownership/whole_borrowed_missing_repair', 'fail/generics/generic_carrier_equation_mismatch', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority')
          output=root/'build/compiler-pilot/coherent-lexical-host'
          output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':driver,'target':target},indent=2)+'\n')
          raise SystemExit(compiler_pilot.run_suite('compiler-pilot/coherent-lexical-host',positive,negative,phase='prepare'))
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-coherent-lexical-preparation-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/coherent-lexical-host/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.preparation.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe the remaining customers and snapshot controls
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='f00661dbe2a16882c56756b15549d1316477ae46';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive={'macos_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit'), 'linux_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit')}[target];negative=('fail/arithmetic/composite_bound_arrival_unbounded_predecessor', 'fail/borrows/private_arrival_default_domain_weak_bound', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/ownership/whole_borrowed_missing_repair', 'fail/generics/generic_carrier_equation_mismatch', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority')
          output=root/'build/compiler-pilot/coherent-lexical-host'
          prepared=json.loads((output/'preparation.json').read_text())
          assert prepared['passed'] and prepared['candidate']==source and prepared['target']==target
          assert json.loads((output/'driver.json').read_text())=={'source':source,'driver':driver,'target':target}
          producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/coherent-lexical-observations',positive,negative,producer=producer)
          producer.verify();observed=root/'build/compiler-pilot/coherent-lexical-observations'
          latency=all(row['millis']<=120000 for name in ['checking.json','both.json'] for row in json.loads((observed/name).read_text())['observations']) if all((observed/name).exists() for name in ['checking.json','both.json']) else False
          (observed/'scope.json').write_text(json.dumps({'source':source,'driver':driver,'target':target,'producer':producer.record(),'positive':positive,'negative':negative,'suite_exit':status,'latency_within_original_limit':latency,'passed':status==0 and latency,'limits':'Original 120-second Source/BOTH limits; one worker; profiling off. Prior 6b passing physical, ordinary and SDK results retain their own identities.'},indent=2)+'\n')
          raise SystemExit(0 if status==0 and latency else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-coherent-lexical-observations-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/coherent-lexical-observations/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
