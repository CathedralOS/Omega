name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/group/name and fail/group/name IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      phase_profile:
        description: Record compiler phase timings for a focused attribution run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; never cancel a merge-group check
# merely because another PR entered the queue. Manual revisions use isolated
# runners and may proceed while an earlier revision finishes its consumers.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Select the retained compiler cache from its validated plan
        id: replay-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "import os; from tools.ci import compiler_pilot; compiler_pilot.write_replay_cache_key(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'], os.environ['GITHUB_OUTPUT'])"
      - name: Restore the exact retained compiler cache
        id: replay-build-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.replay-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Refuse an absent or partial retained compiler cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@') && steps.replay-build-cache.outputs.cache-hit != 'true'
        run: python -c "raise SystemExit('The exact retained compiler cache was not restored; no rebuild was attempted')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the exact integration candidate
        id: compiler-check
        run: cargo check --locked -p omega
      - name: Prepare and retain the optimized producer
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        run: python tools/ci/compiler_pilot.py --phase prepare
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
      # Save compiled objects before any program consumer can use the job budget.
      # A failed preparation still retains useful objects and keeps the job red.
      - name: Save build cache before fixture observations
        if: always() && !cancelled() && steps.compiler-check.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler phase timings
        if: github.event_name == 'workflow_dispatch' && inputs.phase_profile
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PHASE_PROFILE=1\n')"
      - name: Optional executable observations
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
        run: |
          python3 - <<'PROOF_INPUTS'
          from pathlib import Path
          import json,sys
          sys.path[:0]=['tools','tools/ci']
          import compiler_pilot
          out=Path('build/compiler-pilot')
          producer=compiler_pilot.load_producer(out/'producer.json')
          summary=dict(schema='omega-compiler-pilot-v1',passed=False)
          try:
              compiler_pilot.execute(out,summary,positives=('pass/facts/finite_family_static_inline_result/local', 'pass/facts/finite_family_static_inline_result/field', 'pass/facts/finite_family_static_inline_result/parameter', 'pass/facts/finite_family_static_inline_result/call_result', 'pass/facts/finite_family_static_inline_result/match_join', 'pass/facts/finite_family_static_inline_result/const_name', 'pass/facts/finite_family_static_inline_result/other_state', 'pass/facts/finite_family_static_inline_result/other_machine', 'pass/facts/finite_family_static_inline_result/target_body', 'pass/generics/runtime_index_carrier_argument_equal_exit', 'pass/facts/source_indexed_family_alpha_positive', 'pass/facts/source_indexed_family_capture_roster_positive', 'pass/facts/source_indexed_family_recursive_index_positive', 'pass/facts/source_indexed_binary_tree_distinct_exit', 'pass/facts/source_indexed_binary_tree_empty_children_exit', 'pass/generics/runtime_index_carrier_call_saved_capture_exit'),negatives=('fail/facts/finite_family_static_inline_result/local', 'fail/facts/finite_family_static_inline_result/field', 'fail/facts/finite_family_static_inline_result/parameter', 'fail/facts/finite_family_static_inline_result/call_result', 'fail/facts/finite_family_static_inline_result/match_join', 'fail/facts/finite_family_static_inline_result/const_name', 'fail/facts/finite_family_static_inline_result/other_state', 'fail/facts/finite_family_static_inline_result/other_machine', 'fail/facts/finite_family_static_inline_result/target_body', 'fail/generics/runtime_index_carrier_cast_stale', 'fail/generics/runtime_index_carrier_argument_unequal', 'fail/facts/source_indexed_binary_tree_distinct_rejected', 'fail/facts/source_indexed_binary_tree_empty_children_rejected', 'fail/generics/runtime_index_carrier_call_stale_capture', 'fail/generics/runtime_index_carrier_argument_effect', 'fail/generics/runtime_index_carrier_call_selected_mutated', 'fail/generics/runtime_index_carrier_call_selected_stale', 'fail/generics/runtime_index_carrier_argument_repeated_mismatch', 'fail/generics/runtime_index_carrier_explicit_argument_effect', 'fail/facts/source_indexed_binary_tree_child_swap_rejected', 'fail/facts/source_indexed_family_changed_capture', 'fail/facts/source_indexed_family_wrong_payload_carrier', 'fail/facts/source_indexed_family_illegal_runtime_elimination', 'fail/generics/runtime_index_carrier_array_mismatch', 'fail/generics/runtime_index_carrier_nested_mismatch', 'fail/generics/runtime_index_carrier_nested_payload_effect', 'fail/generics/runtime_index_carrier_constructor_wrong_payload', 'fail/relevance/erased_reference_runtime_guard', 'fail/relevance/erased_parameter_runtime_read'),
                  checking_only=('pass/generics/runtime_index_carrier_mutable_survival', 'pass/generics/runtime_index_carrier_parameter', 'pass/generics/runtime_index_carrier_array_valid', 'pass/generics/runtime_index_carrier_nested_valid', 'pass/generics/runtime_index_carrier_match_valid', 'pass/generics/runtime_index_carrier_call_result', 'pass/generics/runtime_index_carrier_direct_call_result', 'pass/generics/runtime_index_carrier_call_selected_index', 'pass/generics/runtime_index_carrier_call_selected_preserved', 'pass/generics/runtime_index_carrier_call_selected_replacement', 'pass/relevance/erased_array_transition', 'pass/relevance/erased_parameter_named_transition_forward', 'pass/relevance/erased_state_param', 'pass/proofs/erased_mathematical_initializers'),producer=producer,samples=('samples/cli/facts/finite_family_static_inline_result/call_result', 'samples/cli/facts/finite_family_static_inline_result/call_result/invalid', 'samples/cli/facts/finite_family_static_inline_result/const_name', 'samples/cli/facts/finite_family_static_inline_result/const_name/invalid', 'samples/cli/facts/finite_family_static_inline_result/field', 'samples/cli/facts/finite_family_static_inline_result/field/invalid', 'samples/cli/facts/finite_family_static_inline_result/local', 'samples/cli/facts/finite_family_static_inline_result/local/invalid', 'samples/cli/facts/finite_family_static_inline_result/match_join', 'samples/cli/facts/finite_family_static_inline_result/match_join/invalid', 'samples/cli/facts/finite_family_static_inline_result/other_machine', 'samples/cli/facts/finite_family_static_inline_result/other_machine/invalid', 'samples/cli/facts/finite_family_static_inline_result/other_state', 'samples/cli/facts/finite_family_static_inline_result/other_state/invalid', 'samples/cli/facts/finite_family_static_inline_result/parameter', 'samples/cli/facts/finite_family_static_inline_result/parameter/invalid', 'samples/cli/facts/finite_family_static_inline_result/target_body', 'samples/cli/facts/finite_family_static_inline_result/target_body/invalid'),cli_fixtures=('pass/facts/finite_family_static_inline_result/local',))
              summary['passed']=True
          except Exception as error:
              summary['error']=str(error)
              raise
          finally:
              (out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          PROOF_INPUTS
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('preparation.json', 'summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json', 'build-consent-controls.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-observations-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          if-no-files-found: warn
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7
