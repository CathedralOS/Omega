name: Exact fixed-baseline numeric attribution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '2'
      RETAINED_HOST: linux_arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4637c6da3b4843292581b9b04f7c39b43675a75e
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Qualify the complete row with its authenticated optimized producer
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          settings={'source': '4637c6da3b4843292581b9b04f7c39b43675a75e', 'tree': '51109e4361795221e45f5615b48bcf6a95174771', 'inputs': {'tests/omega/fail/arithmetic/immutable_unsigned_mask_false_floor_rejected/expected.txt': 'da234398c10b7077a7772aecb1ac4cfb79c3870f3f2b68720754e8d8a2df44c5', 'tests/omega/fail/arithmetic/immutable_unsigned_mask_false_floor_rejected/main.omg': '02bf017b6374ce66e358a6ff7dbc495ac7e2dd8e2d4c939593905288428338bd', 'tests/omega/pass/arithmetic/runtime_immutable_unsigned_bitwise_bounds_exit/build.omg': 'dcaaf9b5d2ed9f57f38cb492877146257440f51d25f1368e2fb691ef8b6f350f', 'tests/omega/pass/arithmetic/runtime_immutable_unsigned_bitwise_bounds_exit/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/arithmetic/runtime_immutable_unsigned_bitwise_bounds_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/arithmetic/runtime_immutable_unsigned_bitwise_bounds_exit/main.omg': 'de8a293e784a3ebc51cb17add64f456407eec819b4b784e2188d3cb9d837ab36', 'tests/omega/pass/proofs/scalar_state_return_keeps_byte_class/main.omg': '7aac04080c36a5cc68c3888a2a8f0c766c2e1b0e4178fecf4df817467b48fc30'}, 'fixtures': ['pass/arithmetic/runtime_immutable_unsigned_bitwise_bounds_exit', 'pass/proofs/scalar_state_return_keeps_byte_class', 'fail/arithmetic/immutable_unsigned_mask_false_floor_rejected'], 'hosts': {'linux_arm64': {'run': 41778920756, 'artifact': 'compiler-pilot-linux_arm64-4637c6da3b4843292581b9b04f7c39b43675a75e-1', 'cli_sha256': 'dce3a09e25440bb6875adfc0ef2bd0d8791b2eaece2fb82e7a4d0c00cefbb40e', 'runner_sha256': '5a20f68f9df5b1208e1ba8a038c554a064dfebe274b62a254c6a42174d9cc95c'}}}
          source=settings['source'];host=os.environ['RETAINED_HOST'];origin=settings['hosts'][host]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for path,digest in settings['inputs'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])],text=True))
          assert run['head_sha']==source and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])+'/artifacts'],text=True))['artifacts']
          matches=[a for a in artifacts if a['name']==origin['artifact']];assert len(matches)==1
          retained=Path('build/retained-fetch-numeric-baseline-producer')
          subprocess.run(['gh','run','download',str(origin['run']),'--name',origin['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==source and original['tree']==settings['tree'] and original['target']==host
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          sys.path.insert(0,'tools/ci');import compiler_pilot
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve())
          assert profile['sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          if 'cli_sha256' in origin:assert profile['sha256']==origin['cli_sha256']
          runner=records[0].parent/Path(original['runner']).name;runner.chmod(0o755)
          runner_profile=compiler_pilot.corpus_gate.require_optimized(runner.resolve())
          assert runner_profile['sha256']==original['runner_profile']['sha256'] and runner_profile['profile']==original['runner_profile']['profile'] and runner_profile['profile']['opt_level']=='1'
          assert runner_profile['sha256']==origin['runner_sha256']
          producer=compiler_pilot.CompilerProducer(source,settings['tree'],host,original['toolchain'],cli.resolve(),runner.resolve(),profile,runner_profile)
          out=Path('build/retained-fetch-numeric-baseline');out.mkdir(parents=True,exist_ok=True)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'host':host,'origin_run':origin['run'],'origin_conclusion':run['conclusion'],'artifact':matches[0],'original_producer':original,'actual_profile':profile,'actual_runner_profile':runner_profile,'driver_sha':os.environ.get('GITHUB_SHA'),'actual_checkout':source},indent=2)+'\n')
          # The driver checks out this exact measured source. The workflow-only driver
          # revision remains separately recorded above; it is not a new producer.
          os.environ['GITHUB_SHA']=source
          result=compiler_pilot.run_suite('retained-fetch-numeric-baseline',(),(),producer=producer,fixtures=','.join(settings['fixtures']),check_only=True)
          assert compiler_pilot.corpus_gate.require_optimized(cli.resolve())==profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raise SystemExit(result)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-fetch-numeric-baseline-${{ github.run_id }}
          path: build/retained-fetch-numeric-baseline/
          retention-days: 7
