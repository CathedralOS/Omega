name: Installed entry current Source callers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  current-callers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage the exact observer before selecting its compiled source
        shell: python
        run: |
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'ac6900a36b75086117e2d204cc3705ade0f545a7'
          stage = Path(os.environ['RUNNER_TEMP']) / 'installed-entry-current-observer'
          stage.mkdir(exist_ok=False)
          files = {}
          for name in ['run_installed_entry_current_resource.py', 'installed_entry_current_recipe.json', 'installed_entry_current_inputs.json', 'run_installed_entry_current_gdb.py', 'installed_entry_current_gdb_recipe.json', 'setup_installed_entry_current_gdb.py']:
              data = (Path('.github') / name).read_bytes()
              (stage / name).write_bytes(data)
              files[name] = hashlib.sha256(data).hexdigest()
          (stage / 'staged-observer.json').write_text(json.dumps({'observer':os.environ['GITHUB_SHA'], 'files':files}, indent=2) + '\n')
      - name: Select the exact published compiler and program source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c417f61c95ba2b5078d36f367dc9b3c8e2ea0e30
          fetch-depth: 1
          persist-credentials: false
      - name: Prefer existing GNU GDB or install signed official Ubuntu package
        timeout-minutes: 5
        run: python "$RUNNER_TEMP/installed-entry-current-observer/setup_installed_entry_current_gdb.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-current-callers-setup-${{ github.sha }}-${{ github.run_attempt }}
          path: build/installed-entry-current-gdb-setup/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Authenticate the complete immutable producer remotely without compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/installed-entry-current-observer/run_installed_entry_current_resource.py" materialize --recipe "$RUNNER_TEMP/installed-entry-current-observer/installed_entry_current_recipe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-current-resource-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-current-resource/preparation.json
            build/installed-entry-current-resource/producer.json
            build/installed-entry-current-resource/retained/compiler-pilot/summary.json
            build/installed-entry-current-resource/retained/compiler-pilot/source/manifest.json
            build/installed-entry-current-resource/retained/compiler-pilot/producer-*/*.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Observe active Source frames with the same bounded RSS stop and cleanup
        run: python "$RUNNER_TEMP/installed-entry-current-observer/run_installed_entry_current_gdb.py" --recipe "$RUNNER_TEMP/installed-entry-current-observer/installed_entry_current_gdb_recipe.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-current-callers-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-current-callers/observation.json
            build/installed-entry-current-callers/gdb.stdout
            build/installed-entry-current-callers/gdb.stderr
            build/installed-entry-current-callers/source.records.txt
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
