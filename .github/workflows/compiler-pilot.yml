name: Sample unchanged shared atomic receiver with the retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_PHASE_PROFILE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1f129fff28874cbd36369d539ddde3f49b674b02
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install debugger in the temporary measurement runner
        run: sudo apt-get -qq update && sudo apt-get -qq install -y gdb
      - name: Authenticate the retained compiler and observe the unchanged shared atomic receiver
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          settings={'label': 'atomic-shared-receiver-integrated-route-samples',
           'target': 'linux_x86_64',
           'run': 42037775344,
           'artifact': 'compiler-pilot-linux_x86_64-1f129fff28874cbd36369d539ddde3f49b674b02-1',
           'artifact_id': 13420840534,
           'artifact_bytes': 478822007,
           'artifact_digest': 'sha256:a45ce5b34a03545c968c3be1017a52ac137d5d0cb3f1b46d2d7e6f5dc27fe3c8',
           'producer_source': '1f129fff28874cbd36369d539ddde3f49b674b02',
           'producer_tree': 'cb537d411cfb9b9b578cc6977f1adb914f74b326',
           'program_source': '1f129fff28874cbd36369d539ddde3f49b674b02',
           'program_tree': 'cb537d411cfb9b9b578cc6977f1adb914f74b326',
           'original_producer': {'revision': '1f129fff28874cbd36369d539ddde3f49b674b02',
                                 'tree': 'cb537d411cfb9b9b578cc6977f1adb914f74b326',
                                 'target': 'linux_x86_64',
                                 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\n'
                                              'binary: rustc\n'
                                              'commit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\n'
                                              'commit-date: 2026-09-03\n'
                                              'host: x86_64-unknown-linux-gnu\n'
                                              'release: 1.100.0-nightly\n'
                                              'LLVM version: 23.1.1',
                                 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-fhuegndd/omega',
                                 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-fhuegndd/corpus_runner',
                                 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-fhuegndd/omega',
                                                 'sha256': '0bb93156108630b4fdc935887458059c5d51632b40f8e2f9d9619eb3fe51a487',
                                                 'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                             'opt_level': '1'}},
                                 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-fhuegndd/corpus_runner',
                                                    'sha256': '1e9c466b59755580a3b396585e6135315b935220c645200755752de97875c9fd',
                                                    'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                                'opt_level': '1'}}},
           'objects': {'omega-rust': 'cd0ec8b1e519401733194509c686169aef332925',
                       'source/library': '936ad8db05921ad1f7edb092bac738c1dcd6224d',
                       'tools': 'ae03b9737f7ae59c30af32a41714ad9444072686',
                       '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                       'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                       'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                       'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'program_objects': {'omega-rust': 'cd0ec8b1e519401733194509c686169aef332925',
                               'source/library': '936ad8db05921ad1f7edb092bac738c1dcd6224d',
                               'tools': 'ae03b9737f7ae59c30af32a41714ad9444072686',
                               '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                               'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                               'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                               'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'baseline': False,
           'input_hashes': {'tests/omega/pass/atomics/shared_receiver_atomic_store/README.md': 'fa96ded59762fdbe188856d60f57b1cecf1d46716b9f902d9ea8a08ed123fb77',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/build.omg': '886d82f6dd6a57006a8b3a449fa1221f3e93abf43c0898ef6bac34b09ad9eded',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/main.omg': '9ce411bd197a6ca04c1d38cea62a09c3f07561d8e31b23d1c32c5c3915b4e551'},
           'fixtures': ['pass/atomics/shared_receiver_atomic_store'],
           'samples': [],
           'sample_roles': {},
           'meaning': 'Diagnostic-only current coherent1f12 BOTH/update snapshots after actual normal120/600 '
                      'timeouts. Current Core inputs; no Rust build, source/oracle/cap change or '
                      'fixture/engine/performance inference.',
           'producer_driver': '1f129fff28874cbd36369d539ddde3f49b674b02',
           'replay_inputs': {'omega-rust': 'cd0ec8b1e519401733194509c686169aef332925',
                             'source/library': '936ad8db05921ad1f7edb092bac738c1dcd6224d',
                             'source/psi': '400feb4e6c0c556f0fd5d6b44043e92f93d7f30c',
                             'source/omega': '96169168741fcd8265771a647ba3bfadd2bc7e8c',
                             'bootstrap': 'cfb29e665d301b5ad7dabdb8cb16177c164ab035',
                             'tools/benchmark': '6c1a4399e3f037c808a23ad59825e76664482e2f',
                             'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                             'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                             'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929',
                             '.cargo': None}}
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_driver'] and run['status']=='completed'
          artifact=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/artifacts/'+str(settings['artifact_id'])],text=True))
          assert artifact['name']==settings['artifact'] and artifact['size_in_bytes']==settings['artifact_bytes'] and artifact['digest']==settings['artifact_digest'] and not artifact['expired']
          assert artifact['workflow_run']['id']==settings['run'] and artifact['workflow_run']['head_sha']==settings['producer_driver']
          retained=out/'retained';subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          producer_parent=Path(settings['original_producer']['cli']).parent.name
          records=[retained/producer_parent/'producer.json'];assert records[0].is_file()
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          donor_summary=json.loads((retained/'preparation.json').read_text())
          assert donor_summary['candidate']==settings['producer_source'] and donor_summary['target']==settings['target'] and donor_summary['producer']==original
          for kind in ['cli','runner']:
              name=Path(original[kind]).name+'.verified-profile.json'
              saved=json.loads((records[0].parent/name).read_text())
              assert saved['source_revision']==settings['producer_source'] and saved['source_tree']==settings['producer_tree'] and saved['observation']==original[kind+'_profile']
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']==settings['target']
          sys.path.insert(0,'tools/ci');import compiler_pilot,platform
          assert compiler_pilot.corpus_gate.host_target()==settings['target']
          compiler_pilot.compiler_replay_plan.check_inputs(root,settings['producer_source'],settings['replay_inputs'])
          compiler_pilot.compiler_replay_plan.check_inputs(root,settings['program_source'],settings['replay_inputs'])
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=sorted(set(settings['input_hashes']) | set(subprocess.check_output(['git','ls-files','source/library'],text=True).splitlines()))
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          for p,h in settings['input_hashes'].items():assert inputs[p]==h,p
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=compiler_pilot.CompilerProducer(original['revision'],original['tree'],original['target'],original['toolchain'],cli,runner,actual_profiles['cli_profile'],actual_profiles['runner_profile'],settings['program_source'],settings['replay_inputs'],dict(run=settings['run'],driver=settings['producer_driver'],transport='authenticated original producer artifact'))
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'artifact':artifact,'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'host':{'system':platform.system(),'machine':platform.machine(),'version':platform.version()},'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          import shutil,time,threading,signal,gzip
          assert shutil.which('gdb')
          fixture=settings['fixtures'][0];assert compiler_pilot.ordinary_cli_fixture.expected_exit(root,fixture,settings['target'])==70
          workspace=(out/'workspace').resolve();workspace.mkdir();copied_inputs={}
          for name,digest in inputs.items():
              src=root/name;dst=workspace/name;assert not src.is_symlink();dst.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(src,dst);copied_inputs[name]=hashlib.sha256(dst.read_bytes()).hexdigest()
          assert copied_inputs==inputs
          project=workspace/compiler_pilot.ordinary_cli_fixture.relative_project(root,fixture)
          assert os.environ.get('OMEGA_PHASE_PROFILE')=='0'
          record=dict(sampling_only=True,qualification=False,phase_profile_environment=os.environ.get('OMEGA_PHASE_PROFILE'),driver=os.environ['GITHUB_SHA'],compiled_source=settings['producer_source'],program_source=settings['program_source'],producer=producer.record(),inputs=inputs,copied_inputs=copied_inputs,fixture=fixture,legs=[],limits='Separate wall snapshots, not CPU shares or speed comparisons. Timers interrupt owned debugger only and quit before unchanged120/600 caps. No fixture verdict or engine acceptance.')
          (out/'route-samples.json').write_text(json.dumps(record,indent=2)+'\n')
          def sample(name,args,cwd,env,delays,ceiling):
              cache=(out/(name+'-cache')).resolve();cache.mkdir();env=dict(env,XDG_CACHE_HOME=str(cache))
              command=['gdb','--batch','-nx','--quiet','-ex','set disable-randomization off','-ex','set debuginfod enabled off','-ex','set print thread-events off','-ex','set pagination off','-ex','set confirm off','-ex','run']
              for i in range(len(delays)):command+=['-ex','thread apply all bt 20','-ex','continue' if i+1<len(delays) else 'quit']
              command+=['--args',*args]
              leg=dict(name=name,command=command,child_command=args,sample_delays_seconds=delays,timeout_seconds=ceiling,qualification=False);record['legs'].append(leg)
              digest=hashlib.sha256();decoded=[0];interrupts=[];timers=[];started=time.monotonic();verify()
              with (out/(name+'.stderr')).open('wb') as stderr:
                  proc=subprocess.Popen(command,cwd=cwd,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=stderr,start_new_session=True)
                  def save():
                      with gzip.open(out/(name+'.stdout.gz'),'wb') as saved:
                          while True:
                              chunk=proc.stdout.read(65536)
                              if not chunk:break
                              saved.write(chunk);digest.update(chunk);decoded[0]+=len(chunk)
                  reader=threading.Thread(target=save);reader.start()
                  def interrupt():
                      if proc.poll() is None:
                          interrupts.append(round(time.monotonic()-started,3))
                          try:os.kill(proc.pid,signal.SIGINT)
                          except ProcessLookupError:pass
                  try:
                      for delay in delays:
                          timer=threading.Timer(delay,interrupt);timer.start();timers.append(timer)
                      leg['debugger_exit']=proc.wait(timeout=ceiling)
                  except subprocess.TimeoutExpired:
                      leg['timed_out']=True;os.killpg(proc.pid,signal.SIGKILL);proc.wait()
                  finally:
                      for timer in timers:timer.cancel()
                      leg['seconds']=round(time.monotonic()-started,3);leg['actual_interrupts_seconds']=interrupts
              reader.join(timeout=20);assert not reader.is_alive() and decoded[0]<128*1024*1024
              leg.update(decoded_stdout_bytes=decoded[0],decoded_stdout_sha256=digest.hexdigest(),compressed_stdout_sha256=hashlib.sha256((out/(name+'.stdout.gz')).read_bytes()).hexdigest())
              verify()
              for path,h in copied_inputs.items():assert hashlib.sha256((workspace/path).read_bytes()).hexdigest()==h
              leg['profiles_verified_after']=True;(out/'route-samples.json').write_text(json.dumps(record,indent=2)+'\n')
              print('Diagnostic leg finished',name,leg['seconds'],flush=True)
          env=dict(os.environ,OMEGA_LIBRARY_ROOT=str(root/'source/library'),OMEGA_CORPUS_ROOT=str(root),OMEGA_CORPUS_FIXTURE_FILTER=fixture,OMEGA_CORPUS_FIXTURE_SECS='120',OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_RECORDS=str((out/'both.records.txt').resolve()),OMEGA_CORPUS_SWEEP='1',OMEGA_CORPUS_NATIVE='1',OMEGA_CORPUS_INTERPRET='1',OMEGA_CORPUS_NATIVE_TARGET=settings['target'])
          for key in ['NEXTEST','OMEGA_CORPUS_CHECKED_INTERPRETER']:env.pop(key,None)
          sample('both',[str(runner)],root,env,[30,65,95,115],120)
          env=dict(os.environ,OMEGA_LIBRARY_ROOT=str(workspace/'source/library'))
          sample('update',[str(cli),'update','--project',str(project),'--target',settings['target']],workspace,env,[95,300,550],600)
          record['profiles_verified_after']=True;(out/'route-samples.json').write_text(json.dumps(record,indent=2)+'\n');print('Sampling only; no qualification result.',flush=True)
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-shared-receiver-integrated-route-samples-${{ github.run_id }}
          path: |
            build/atomic-shared-receiver-integrated-route-samples/
            !build/atomic-shared-receiver-integrated-route-samples/retained/**
            !build/atomic-shared-receiver-integrated-route-samples/workspace/**
            !build/atomic-shared-receiver-integrated-route-samples/diagnostic-cache/**
            !build/atomic-shared-receiver-integrated-route-samples/both-cache/**
            !build/atomic-shared-receiver-integrated-route-samples/update-cache/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
