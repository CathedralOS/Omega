name: Observe early installed entry Source callers on ARM
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-entry:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      INSTALLED_ENTRY_HOST: linux_arm64
      CARGO_TARGET_DIR: /tmp/ot
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe the existing Swift debugger without installing tools
        run: python -u .github/run_installed_entry_arm_early_callers.py tools
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-arm-early-tool-${{ github.sha }}-${{ github.run_attempt }}
          path: build/installed-entry-arm-debugger-tool.json
          if-no-files-found: warn
          retention-days: 7
      - name: Authenticate the immutable original preparation and unchanged scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/run_installed_entry_arm_replay.py preflight
      - name: Retain the published source boundary for canonical source export
        run: git fetch --no-tags --depth=1 origin fa40bd63e9b31194ff85545a94fb53001f2f0c70:refs/remotes/origin/main
      - name: Retain the exact original compiler source for source and profile checks
        run: git fetch --no-tags --depth=1 origin 63c75ba6ad0e978d540e3ca9af29f9c95c079766
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: retained-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-Linux-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-63c75ba6ad0e978d540e3ca9af29f9c95c079766
          fail-on-cache-miss: true
      - name: Refuse a missing exact cache without building
        shell: python
        run: |
          from pathlib import Path
          import json
          exact='${{ steps.retained-cache.outputs.cache-hit }}'
          output=Path('build/installed-entry-linux_arm64')
          (output/'cache-replay.json').write_text(json.dumps({
              'exact_hit':exact,
              'matched_key':'${{ steps.retained-cache.outputs.cache-matched-key }}',
              'policy':'Only exact normally visible original cache. No compiler build or fallback.'},indent=2)+chr(10))
          assert exact == 'true', 'Exact retained ARM cache missing; no build attempted'
      - name: Authenticate and copy the original optimized executables without compiling
        id: materialize
        run: python .github/run_installed_entry_arm_replay.py materialize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-arm-early-preparation-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-linux_arm64/*.json
            build/installed-entry-linux_arm64/producer-replay-*/*.json
            build/installed-entry-linux_arm64/source/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Observe the first Source fixture at fifteen twenty-five and thirty-five seconds
        if: ${{ !cancelled() && steps.materialize.outcome == 'success' }}
        run: python -u .github/run_installed_entry_arm_early_callers.py observe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-arm-early-observations-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-linux_arm64/*.json
            build/installed-entry-linux_arm64/*.stdout
            build/installed-entry-linux_arm64/*.stderr
            build/installed-entry-linux_arm64/source/
            build/installed-entry-linux_arm64/artifacts-*/
            build/installed-entry-linux_arm64/early-source.records.txt
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
