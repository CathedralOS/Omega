              report=out/'samples.json'
              result=subprocess.run([sys.executable,'tools/sample_native_gate.py','--cli',str(cli.resolve()),'--facts','--jobs','2','--target',host,'--filter',origin['samples'],'--write-results',str(report)],stdin=subprocess.DEVNULL)
              rows=json.loads(report.read_text())
              assert len(rows)==len(selected) and {r['sample'] for r in rows}==set(selected)
              if result.returncode or any(r.get('state') not in ('pass','rejected') for r in rows):raise ValueError('public cases lack actual intended outcomes')
          stage('ordinary public cases',public)
          if host in ('macos_arm64','windows_x86_64'):
