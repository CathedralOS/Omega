          out=Path('build/target-reach-replay-'+host);out.mkdir(parents=True,exist_ok=True)
          summary={'schema':'omega-qualified-input-gate-replay-v1','candidate':source,'target':host,'producer':original,'passed':False,'stages':[]}
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver_sha':os.environ['GITHUB_SHA'],'actual_program_source':source,'actual_compiled_source':compiled,'origin_run':origin['run'],'origin_conclusion':run['conclusion'],'artifact':matches[0],'original_producer':original,'actual_profile':profile,'actual_runner_profile':runner_profile,'compiler_input_applicability':'The complete compiler-source to program-source delta is exactly the reviewed eight authored Main files. All Rust, library, Cargo, toolchain, workflow and gate bytes are identical. The actual compiled producer revision remains unchanged; only program inputs have a new source identity.'},indent=2)+'\n')
          def stage(name,operation):
              row={'name':name,'passed':False};summary['stages'].append(row);started=time.monotonic()
              try:operation();row['passed']=True
              except (ValueError,OSError,subprocess.CalledProcessError) as error:row['error']=str(error)
              finally:row['seconds']=round(time.monotonic()-started,3)
          def corpus(name,fixtures,both=False):
              report=out/(name+'.json')
              args=[sys.executable,'tools/corpus_gate.py','--runner',str(runner.resolve()),'--filter',','.join(fixtures),'--json',str(report),'--golden',str(pilot.observation_golden(out,both=both,target=host))]
              if both:args.append('--both')
              result=subprocess.run(args,stdin=subprocess.DEVNULL)
              if result.returncode not in (0,1):raise ValueError(name+': corpus gate exited '+str(result.returncode))
              pilot.validate_report(json.loads(report.read_text()),fixtures,both=both,revision=source,target=host)
          positives,negatives=pilot.select_fixtures(','.join(settings['fixtures']))
          stage('corrected target checking',lambda:corpus('checking',positives+negatives))
