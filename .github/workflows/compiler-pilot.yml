name: Qualify captured byte observations and installed-entry on Linux
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  installed-entry:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux_x86_64
            runner: ubuntu-24.04
            minutes: 90
            target_dir: /tmp/ot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.minutes }}
    env:
      INSTALLED_ENTRY_HOST: ${{ matrix.host }}
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_CORPUS_FIXTURE_SECS: '120'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate unchanged source inputs and complete existing scope
        run: python .github/run_installed_entry_missing_hosts.py preflight
      - name: Retain the fixed published source boundary for source export
        run: git fetch --no-tags --depth=1 origin 43c8f36b15697ba9db3bec4cb6f7c8ee9dd9d5df:refs/remotes/origin/main
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Record actual cache disposition before the declared build
        shell: python
        run: |
          from pathlib import Path
          import json,os
          output=Path('build')/('installed-entry-'+os.environ['INSTALLED_ENTRY_HOST'])
          (output/'cache.json').write_text(json.dumps({
              'primary_key':'${{ steps.build-cache.outputs.cache-primary-key }}',
              'matched_key':'${{ steps.build-cache.outputs.cache-matched-key }}',
              'exact_hit':'${{ steps.build-cache.outputs.cache-hit }}',
              'policy':'Normal current-ref/default-main lookup only. A miss permits the explicitly declared fresh hosted build; no retained binary is relabeled.'},indent=2)+chr(10))
      - name: Build one optimized compiler and run three existing retention and index tests
        id: producer-preparation
        run: python .github/run_installed_entry_missing_hosts.py prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-preparation-${{ matrix.host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/installed-entry-${{ matrix.host }}/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ !cancelled() && steps.producer-preparation.outputs.compiler_prepared == 'true' && steps.build-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe forty-six source checks and twenty real engine pairs
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        run: python .github/run_installed_entry_missing_hosts.py corpus
      - name: Grade the original limit for every source and execution observation
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        run: python .github/run_installed_entry_missing_hosts.py budgets
      - name: Retain corpus results before sample execution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        with:
          name: installed-entry-corpus-report-${{ matrix.host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-${{ matrix.host }}/checking.json
            build/installed-entry-${{ matrix.host }}/both.json
            build/installed-entry-${{ matrix.host }}/summary.json
            build/installed-entry-${{ matrix.host }}/budgets.json
            build/installed-entry-${{ matrix.host }}/producer.json
            build/installed-entry-${{ matrix.host }}/input-binding.json
            build/installed-entry-${{ matrix.host }}/cache.json
            build/installed-entry-${{ matrix.host }}/structural-tests.json
            build/installed-entry-${{ matrix.host }}/retained-structural-tests.json
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Observe installed-entry and saved-byte sample programs and reject controls
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        run: python .github/run_installed_entry_missing_hosts.py samples
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: installed-entry-observations-${{ matrix.host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/installed-entry-${{ matrix.host }}/*.json
            build/installed-entry-${{ matrix.host }}/*.stdout
            build/installed-entry-${{ matrix.host }}/*.stderr
            build/installed-entry-${{ matrix.host }}/source/
            build/installed-entry-${{ matrix.host }}/artifacts-*/
            build/installed-entry-${{ matrix.host }}/samples/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
