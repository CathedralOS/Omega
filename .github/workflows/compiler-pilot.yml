name: Inspect selected-call Terminal contracts with the retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_COMPILER_CHECK_SITES: '1'
      RETAINED_HOST: linux_x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e46c33e3c75a055c41e48fbc53c7ead8c2548e8b
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect the recorded Terminal return contracts without rebuilding Rust
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          settings={'source': 'e46c33e3c75a055c41e48fbc53c7ead8c2548e8b', 'tree': '9b564761f4f4730a7dcbc82606f48d3e53295953', 'inputs': {'tests/omega/pass/facts/finite_family_returned_descriptor/caller_view/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/caller_view/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/caller_view/build.omg': '608c6399f1dd5a572aa7409f6a771424c04b8e2340583606d5ee8ae0635ca15c', 'tests/omega/pass/facts/finite_family_returned_descriptor/caller_view/main.omg': '1f7359c7de787fb868739ed7ceb96927cfd4bd58a5f2d44643c0ab858a189c8a', 'tests/omega/pass/facts/finite_family_returned_descriptor/incoming_join/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/incoming_join/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/incoming_join/build.omg': '1bad49a39b556902febd0b4a1d5b86101f248dd4eed5ec5cd5ebf18fff78551d', 'tests/omega/pass/facts/finite_family_returned_descriptor/incoming_join/main.omg': '17a173c70cc54df60c6a4110db2df10dfa89e4abca8faef2094fc2a60f7f52ad', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/build.omg': 'e0495d7cd603917ef5c158af669cb43c6c517025f1ce90e0da1c5d308b8efdd6', 'tests/omega/pass/facts/finite_family_returned_descriptor/saved_source/main.omg': 'bea1b52b3810aaacc0fc7868194466cc31f8987eef217e62e22f522d369c836b'}, 'fixtures': ['pass/facts/finite_family_returned_descriptor/caller_view', 'pass/facts/finite_family_returned_descriptor/incoming_join', 'pass/facts/finite_family_returned_descriptor/saved_source'], 'hosts': {'linux_x86_64': {'run': 41763942681, 'artifact': 'compiler-pilot-linux_x86_64-e46c33e3c75a055c41e48fbc53c7ead8c2548e8b-1', 'cli_sha256': '0040a46eb7b5b43d5634ce72f6eceb3bf41c6ec17ccc1b34d489229bc54fe2f9', 'runner_sha256': 'a213efec91a1c59a1132496b2724ccee694d1fea1ace081b718af3320e5d2ee5'}}}
          source=settings['source'];host=os.environ['RETAINED_HOST'];origin=settings['hosts'][host]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for path,digest in settings['inputs'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])],text=True))
          assert run['head_sha']==source and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])+'/artifacts'],text=True))['artifacts']
          matches=[a for a in artifacts if a['name']==origin['artifact']];assert len(matches)==1
          retained=Path('build/descriptor-input-view-e46-diagnostics-producer')
          subprocess.run(['gh','run','download',str(origin['run']),'--name',origin['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==source and original['tree']==settings['tree'] and original['target']==host
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          sys.path.insert(0,'tools/ci');import compiler_pilot
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve())
          assert profile['sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          if 'cli_sha256' in origin:assert profile['sha256']==origin['cli_sha256']
          runner=records[0].parent/Path(original['runner']).name;runner.chmod(0o755)
          runner_profile=compiler_pilot.corpus_gate.require_optimized(runner.resolve())
          assert runner_profile['sha256']==original['runner_profile']['sha256'] and runner_profile['profile']==original['runner_profile']['profile'] and runner_profile['profile']['opt_level']=='1'
          assert runner_profile['sha256']==origin['runner_sha256']
          producer=compiler_pilot.CompilerProducer(source,settings['tree'],host,original['toolchain'],cli.resolve(),runner.resolve(),profile,runner_profile)
          out=Path('build/descriptor-input-view-e46-diagnostics');out.mkdir(parents=True,exist_ok=True)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'host':host,'origin_run':origin['run'],'origin_conclusion':run['conclusion'],'artifact':matches[0],'original_producer':original,'actual_profile':profile,'actual_runner_profile':runner_profile,'driver_sha':os.environ.get('GITHUB_SHA'),'actual_checkout':source},indent=2)+'\n')
          # The driver checks out this exact measured source. The workflow-only driver
          # revision remains separately recorded above; it is not a new producer.
          os.environ['GITHUB_SHA']=source
          commands=[('caller_view','viewed_dispatch'),('incoming_join','joined'),('incoming_join','incoming'),('saved_source','replace_and_dispatch')]
          results=[]
          for folder,machine in commands:
              root='tests/omega/pass/facts/finite_family_returned_descriptor/'+folder+'/main.omg'
              name=folder+'-'+machine
              command=[str(cli.resolve()),'inspect-terminal','--machine',machine,'--output',str(out/(name+'.psiterm')),root]
              with (out/(name+'.stdout')).open('wb') as stdout,(out/(name+'.stderr')).open('wb') as stderr:
                  observed=subprocess.run(command,stdout=stdout,stderr=stderr,timeout=120)
              results.append({'command':command,'exit':observed.returncode})
          (out/'inspection-commands.json').write_text(json.dumps(results,indent=2)+'\n')
          result=0 if all(row['exit']==0 for row in results) else 1
          assert compiler_pilot.corpus_gate.require_optimized(cli.resolve())==profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raise SystemExit(result)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: descriptor-input-view-e46-diagnostics-${{ github.run_id }}
          path: build/descriptor-input-view-e46-diagnostics/
          retention-days: 7
