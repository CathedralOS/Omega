name: Attribute Linux ARM atomic publication refusal
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 06899beec3ffc28ee0af5084c6752585f0a3bb73
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b0fa0866008e6a0189192d9446005437a471af29
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare the frozen atomic control with authenticated retained producers
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,hashlib,subprocess,os,sys,time
          settings=[{'label': 'baseline', 'source': '06899beec3ffc28ee0af5084c6752585f0a3bb73', 'tree': 'e21461da4e7534eb400ed4f0a83ad1dd4b3cdec2', 'run': 41736100240, 'artifact': 'compiler-pilot-linux_arm64-06899beec3ffc28ee0af5084c6752585f0a3bb73-1', 'profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-pwlz11x4/corpus_runner', 'sha256': '061667cbcd02282a640613c246fd9cd35570b9486e4a3bab0d7ad1b2754340ea', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'fixture': 'pass/facts/atomic_compare_exchange_once_local_exit', 'inputs': {'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/build.omg': 'ef91ae2576401646f76f827c2a9ac46f52110b046c9548e681e1aa4a4fe9150e', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/main.omg': 'e79be1662614533301411e8cf2a51c1aae08928f5b9767e3a746293a0c0cb845'}}, {'label': 'candidate', 'source': 'b0fa0866008e6a0189192d9446005437a471af29', 'tree': '2b5353e52a8cb2c5d9528f00ac90e5c6e7d62a83', 'run': 41746709614, 'artifact': 'compiler-pilot-linux_arm64-b0fa0866008e6a0189192d9446005437a471af29-1', 'profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-2x8rnuxc/corpus_runner', 'sha256': '3045a5714c7ce61043a430705ddc1e28a3d5b29333307373ea76e041432c4fce', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'fixture': 'pass/facts/atomic_compare_exchange_once_local_exit', 'inputs': {'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/build.omg': 'ef91ae2576401646f76f827c2a9ac46f52110b046c9548e681e1aa4a4fe9150e', 'tests/omega/pass/facts/atomic_compare_exchange_once_local_exit/main.omg': 'e79be1662614533301411e8cf2a51c1aae08928f5b9767e3a746293a0c0cb845'}}]
          workspace=Path.cwd();out=workspace/'atomic-arm-comparison';out.mkdir()
          rows=[]
          for item in settings:
           root=workspace/item['label'];assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()==item['source'];assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],cwd=root,text=True).strip()==item['tree']
           for p,h in item['inputs'].items():assert hashlib.sha256((root/p).read_bytes()).hexdigest()==h,p
           retained=workspace/('retained-'+item['label']);subprocess.run(['gh','run','download',str(item['run']),'--name',item['artifact'],'--dir',str(retained)],check=True)
           runners=list(retained.glob('**/corpus_runner'));assert len(runners)==1;runner=runners[0].resolve();runner.chmod(0o755)
           if not rows:sys.path.insert(0,str(root/'tools'));import corpus_gate,corpus_records
           profile=corpus_gate.require_optimized(runner);assert profile['sha256']==item['profile']['sha256'] and profile['profile']['opt_level']=='1'
           cache=out/(item['label']+'-cache');cache.mkdir()
           env=dict(os.environ,OMEGA_COMPILER_CHECK_SITES='1',OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_ROOT=str(root),OMEGA_LIBRARY_ROOT=str(root/'source/library'),OMEGA_CORPUS_FIXTURE_FILTER=item['fixture'],OMEGA_CORPUS_RECORDS=str(out/(item['label']+'.records.txt')),OMEGA_CORPUS_NATIVE='1',OMEGA_CORPUS_INTERPRET='1',OMEGA_CORPUS_NATIVE_TARGET='linux_arm64',XDG_CACHE_HOME=str(cache))
           for k in ['NEXTEST','OMEGA_CORPUS_CHECKED_INTERPRETER']:env.pop(k,None)
           start=time.monotonic()
           with (out/(item['label']+'.stdout')).open('w') as stdout,(out/(item['label']+'.stderr')).open('w') as stderr:r=subprocess.run([str(runner)],cwd=root,env=env,stdout=stdout,stderr=stderr)
           actual=corpus_records.read(out/(item['label']+'.records.txt'));assert len(actual)==1
           rows.append({'settings':item,'actual_profile':profile,'exit':r.returncode,'seconds':time.monotonic()-start,'observations':actual});(out/'observations.json').write_text(json.dumps(rows,indent=2)+'\n');print(item['label'],actual,flush=True)
           assert corpus_gate.require_optimized(runner)==profile
           for p,h in item['inputs'].items():assert hashlib.sha256((root/p).read_bytes()).hexdigest()==h,p
           assert not subprocess.check_output(['git','status','--porcelain'],cwd=root,text=True).strip()
          print('These are actual separate-source observations, not a success assertion.',flush=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-arm-comparison-${{ github.run_id }}
          path: |
            atomic-arm-comparison/*.json
            atomic-arm-comparison/*.txt
            atomic-arm-comparison/*.stdout
            atomic-arm-comparison/*.stderr
