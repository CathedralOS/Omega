name: Trace operator uses and inherited exit bindings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_DIAGNOSTIC_SOURCE: 29b4d919ab2c3a2e215a4e8de24f27d7c2756104
      OMEGA_COMPILER_CHECK_SITES: '1'
      OMEGA_DIAGNOSTIC_DRIVER: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 29b4d919ab2c3a2e215a4e8de24f27d7c2756104
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Build one producer and retain exact Source diagnostics
        run: |
          GITHUB_SHA=29b4d919ab2c3a2e215a4e8de24f27d7c2756104 python3 - <<'SDK'
          """Observe exact operator-use and exit bindings with one ordinary producer."""
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          root=Path.cwd()
          sys.path.insert(0,str(root/'tools/ci'))
          import compiler_pilot
          out=root/'build/binding-diagnostics'
          out.mkdir(parents=True,exist_ok=False)
          source=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          driver=os.environ.get('OMEGA_DIAGNOSTIC_DRIVER',source)
          assert os.environ['GITHUB_SHA']==source
          assert os.environ['OMEGA_COMPILER_CHECK_SITES']=='1'
          fixtures=['pass/facts/exclusive_observation_exposure_through_float_build_use','pass/traits/inline_exact_boundary_provider']
          paths=subprocess.check_output(['git','ls-files','source/library',*[str(Path('tests/omega')/f) for f in fixtures]],text=True).splitlines()
          def digest(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          inputs={p:digest(p) for p in paths}
          producer=compiler_pilot.prepare_producer(out,need_runner=False)
          def verify():
              producer.verify()
              assert os.environ['OMEGA_COMPILER_CHECK_SITES']=='1'
              assert {p:digest(p) for p in paths}==inputs
          (out/'inputs.json').write_text(json.dumps(inputs,indent=2)+'\n')
          rows=[]
          try:
              for fixture in fixtures:
                  verify()
                  command=[str(producer.cli),'--check',str(root/'tests/omega'/fixture/'main.omg')]
                  started=time.monotonic()
                  try:
                      result=subprocess.run(command,capture_output=True,timeout=600)
                      stdout,stderr,code=result.stdout,result.stderr,result.returncode
                  except subprocess.TimeoutExpired as error:
                      stdout,stderr,code=error.stdout or b'',error.stderr or b'',None
                  label=fixture.rsplit('/',1)[1]
                  channels={}
                  for suffix,data in [('stdout',stdout),('stderr',stderr)]:
                      path=out/(label+'.'+suffix);path.write_bytes(data)
                      channels[suffix]={'path':path.name,'sha256':digest(path),'bytes':len(data)}
                  rows.append({'fixture':fixture,'command':command,'cli_exit':code,'seconds':round(time.monotonic()-started,3),'channels':channels})
                  verify()
          finally:
              (out/'summary.json').write_text(json.dumps({'source':source,'driver':driver,'producer':producer.record(),'trace_flags':{'OMEGA_COMPILER_CHECK_SITES':'1'},'observations':rows,'limits':'Source diagnostics only. Existing refusals stay red. No engine, SDK, counter or feature acceptance.'},indent=2)+'\n')
          raise SystemExit(0 if len(rows)==len(fixtures) and all(r['cli_exit']==0 for r in rows) else 1)
          SDK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-bindings-${{ github.run_id }}
          path: build/binding-diagnostics/
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
