name: Measure unchanged returned-descriptor programs with a retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      RETAINED_HOST: linux_x86_64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0d2886a26e6b17ede96f1accbb6501a2a85fbd30
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the existing case pair with the earlier retained compiler
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          settings={'source': '0d2886a26e6b17ede96f1accbb6501a2a85fbd30', 'tree': 'b33a9d862d2704fa45ef4af1c01c4e3a89313042', 'inputs': {'tests/omega/fail/borrows/returned_case_descriptor_unselected_source/expected.txt': '01074c399cc46d39cf849daa8123fd7ebcd393aea92e60e12566c096e1c6b1ab', 'tests/omega/fail/borrows/returned_case_descriptor_unselected_source/main.omg': '26d22d48c73833998ab01b4af5537e61bbb2e8f65dda2bc7de3039f1aec01e29', 'tests/omega/fail/borrows/returned_stored_view_reborrow_parent_write_rejected/build.omg': '816f5ea03710818bd1b5151256ed816d9e047671b20209a5012eab720510716f', 'tests/omega/fail/borrows/returned_stored_view_reborrow_parent_write_rejected/expected.txt': '5abea4ea8df32196ebd990960241419351d1517db47b383f3a99c407cf7152bb', 'tests/omega/fail/borrows/returned_stored_view_reborrow_parent_write_rejected/main.omg': 'c6f5a45087fc7182193288d2380b62703419a7242406bd7145a0b7ade8e569a3', 'tests/omega/pass/borrows/returned_case_descriptor_formation/build.omg': '66df408dae1928177179e8e9bf141985cb2b1f649a669036cd3363813f666433', 'tests/omega/pass/borrows/returned_case_descriptor_formation/main.omg': '6000e0de6f5eb01d6db812e5f2e43bfa9515bdab1c3c3cb8767e8882c00e50f8', 'tests/omega/pass/borrows/runtime_returned_stored_view_reborrow_exit/build.omg': '816f5ea03710818bd1b5151256ed816d9e047671b20209a5012eab720510716f', 'tests/omega/pass/borrows/runtime_returned_stored_view_reborrow_exit/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/borrows/runtime_returned_stored_view_reborrow_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/borrows/runtime_returned_stored_view_reborrow_exit/main.omg': 'd16faf350271240a1f89126383cffd5e196c223fefc549d8b544c2779eed02a7', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/README.md': '854fa12d803022e9abf09eb8695d4704a5b473b79c55e8a737e0e3a1ccebf069', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/build.omg': '314c94208a17521fcaceb643c9fe4c59580af7017a81cb448870161e4c4daa65', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/main.omg': '509624fcbc19851e4517d467ea09f2ee23b5e20b64f1b8c36e7c88d2e69825bb'}, 'fixtures': ['pass/borrows/runtime_returned_stored_view_reborrow_exit', 'fail/borrows/returned_stored_view_reborrow_parent_write_rejected', 'pass/slices/runtime_shared_subslice_return_exit', 'pass/borrows/returned_case_descriptor_formation', 'fail/borrows/returned_case_descriptor_unselected_source'], 'samples': [], 'hosts': {'linux_x86_64': {'run': 41677057139, 'artifact': 'compiler-pilot-linux_x86_64-0d2886a26e6b17ede96f1accbb6501a2a85fbd30-1', 'cli_sha256': '1935962a81963475ec50d2a3d5aa80a7ff73fdf8972ad252c3befbe6513a6103', 'runner_sha256': '9d5a7419bcfb7dd5c7c4a0c620b0e95492573c330825ab3d3ed769252021bdb8'}}}
          source=settings['source'];host=os.environ['RETAINED_HOST'];origin=settings['hosts'][host]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for path,digest in settings['inputs'].items():assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])],text=True))
          assert run['head_sha']==source and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(origin['run'])+'/artifacts'],text=True))['artifacts']
          matches=[a for a in artifacts if a['name']==origin['artifact']];assert len(matches)==1
          retained=Path('build/return-frontiers-baseline-0d-producer')
          subprocess.run(['gh','run','download',str(origin['run']),'--name',origin['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==source and original['tree']==settings['tree'] and original['target']==host
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          sys.path.insert(0,'tools/ci');import compiler_pilot
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve())
          assert profile['sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          if 'cli_sha256' in origin:assert profile['sha256']==origin['cli_sha256']
          runner=records[0].parent/Path(original['runner']).name;runner.chmod(0o755)
          runner_profile=compiler_pilot.corpus_gate.require_optimized(runner.resolve())
          assert runner_profile['sha256']==original['runner_profile']['sha256'] and runner_profile['profile']==original['runner_profile']['profile'] and runner_profile['profile']['opt_level']=='1'
          assert runner_profile['sha256']==origin['runner_sha256']
          producer=compiler_pilot.CompilerProducer(source,settings['tree'],host,original['toolchain'],cli.resolve(),runner.resolve(),profile,runner_profile)
          out=Path('build/return-frontiers-baseline-0d');out.mkdir(parents=True,exist_ok=True)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'host':host,'origin_run':origin['run'],'origin_conclusion':run['conclusion'],'artifact':matches[0],'original_producer':original,'actual_profile':profile,'actual_runner_profile':runner_profile,'driver_sha':os.environ.get('GITHUB_SHA'),'actual_checkout':source},indent=2)+'\n')
          # The driver checks out this exact measured source. The workflow-only driver
          # revision remains separately recorded above; it is not a new producer.
          os.environ['GITHUB_SHA']=source
          result=compiler_pilot.run_suite('return-frontiers-baseline-0d',(),(),producer=producer,fixtures=','.join(settings['fixtures']),check_only=True)
          assert compiler_pilot.corpus_gate.require_optimized(cli.resolve())==profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          raise SystemExit(result)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: return-frontiers-baseline-0d-${{ github.run_id }}
          path: build/return-frontiers-baseline-0d/
          retention-days: 7
