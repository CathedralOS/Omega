name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/..., run/... and fail/... IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      record_results:
        description: Record the selected corpus source checks for review, without changing the published golden
        type: boolean
        default: false
      compiler_diagnostics:
        description: Enable verbose compiler diagnostics for a focused run
        type: boolean
        default: false
      structural_trace:
        description: Include full ownership and state traces for a focused diagnostic run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false
      inspection_machine:
        description: Nonexecuting named Terminal inspection of one retained CLI fixture
        type: string
        default: ''
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read
  actions: read

# A new PR revision supersedes its old check; merge-group checks keep running.
# Retained @plan requests run independently. Ordinary manual builds still share
# one revision and host group.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.fixtures, '@') && github.run_id || github.sha) || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Validate the retained inspection request
        if: github.event_name == 'workflow_dispatch' && inputs.inspection_machine != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_INSPECTION_MACHINE: ${{ inputs.inspection_machine }}
          OMEGA_COMPILER_PILOT_RECORD_RESULTS: ${{ inputs.record_results }}
        run: |
          python - <<'PY'
          import os
          from tools.ci import compiler_pilot
          selected, replay = compiler_pilot.selected_consumers(
              (), (), (), fixtures=os.environ['OMEGA_COMPILER_PILOT_FIXTURES'],
              samples=None, cli_fixtures=None, check_only=False)
          compiler_pilot.inspection_selection(selected, retained=replay is not None)
          PY
      - name: Select the retained compiler cache from its validated plan
        id: replay-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "import os; from tools.ci import compiler_pilot; compiler_pilot.write_replay_cache_key(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'], os.environ['GITHUB_OUTPUT'])"
      - name: Recover the exact retained producer from its original authenticated artifact
        id: replay-artifact
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import stat
          import subprocess
          import sys
          import tempfile
          import urllib.error
          import urllib.parse
          import urllib.request
          import zipfile
          
          root = Path.cwd().resolve()
          sys.path.insert(0, str(root / "tools"))
          from tools.ci import compiler_replay_plan
          
          plan = compiler_replay_plan.load(root, os.environ["OMEGA_COMPILER_PILOT_FIXTURES"])
          revision = "9af3eb514e1665328bbdbbc875be077276c47869"
          tree = "7c2eb47ec3bcd4832cb85e4e6a6c2aae94b2d59a"
          artifact_id = 13609474119
          archive_bytes = 515661564
          archive_sha256 = "494a6155165842267f79f59b57beb442915ba1ff90c9de5c266800cfb5bd63bf"
          if (plan.producer["revision"], plan.producer["tree"], plan.producer["origin_run"]) != (revision, tree, 42460884915):
              raise SystemExit("Artifact recovery requires the exact reviewed 9af producer plan")
          expected = {
              "omega": ("cli", "c2ef7288a0d034c9a006368381fd1e75db2d16328265b5078cb21e0a698a5cd8",
                        "67ca819f2c1a5ac71cd071f4ea3787a28edd354b878cd6e590a38cdee1dc87cb", 253346128),
              "corpus_runner": ("runner", "f4ceb42bd12d22254fc4ff90e0d04f5f405ffce9076ed4f93ec672b3af35cb8c",
                                "2d111d6e932b17b50426bfe07176aa68234cb6661e5c421ea99aba51f6f01d94", 258374816),
          }
          for kind, digest, receipt, size in expected.values():
              if plan.producer["executables"][kind] != {"sha256": digest, "profile": {"schema": "omega-compiler-build-profile-v1", "opt_level": "1"}}:
                  raise SystemExit("Artifact recovery plan executable/profile differs")
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, newurl):
                  return None
          
          token = os.environ["GH_TOKEN"]
          base = "https://api.github.com/repos/CathedralOS/Omega/actions/artifacts/" + str(artifact_id)
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"}
          try:
              with urllib.request.urlopen(urllib.request.Request(base, headers=headers), timeout=30) as response:
                  metadata = json.loads(response.read(65537))
              if (metadata["expired"] or metadata["size_in_bytes"] != archive_bytes
                      or metadata["digest"] != "sha256:" + archive_sha256
                      or metadata["workflow_run"]["id"] != 42460884915
                      or metadata["workflow_run"]["head_sha"] != revision):
                  raise SystemExit("Original prepared artifact metadata differs or expired")
              try:
                  urllib.request.build_opener(NoRedirect).open(
                      urllib.request.Request(base + "/zip", headers=headers), timeout=30)
              except urllib.error.HTTPError as response:
                  if response.code != 302:
                      raise SystemExit("Prepared artifact archive did not provide the expected redirect")
                  location = response.headers.get("Location", "")
                  response.close()
              else:
                  raise SystemExit("Prepared artifact archive did not provide a redirect")
              parsed = urllib.parse.urlsplit(location)
              if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
                  raise SystemExit("Prepared artifact redirect is not an authenticated HTTPS archive location")
          except (OSError, ValueError, KeyError) as error:
              raise SystemExit("Prepared artifact metadata/redirect failed: " + type(error).__name__) from None
          
          output = root / "build/compiler-pilot"
          output.mkdir(parents=True, exist_ok=True)
          cache = Path(os.environ["CARGO_TARGET_DIR"])
          if not cache.is_absolute():
              cache = root / cache
          debug = cache / "debug"
          debug.mkdir(parents=True, exist_ok=True)
          from compiler_profile import require_optimized
          observations = {}
          with tempfile.TemporaryDirectory(prefix="omega-9af-artifact-", dir=os.environ.get("RUNNER_TEMP")) as temporary:
              temporary = Path(temporary)
              archive = temporary / "prepared.zip"
              digest = hashlib.sha256()
              count = 0
              try:
                  # The authorization header is never forwarded to the signed archive host.
                  with urllib.request.urlopen(urllib.request.Request(location), timeout=60) as response, archive.open("wb") as target:
                      while chunk := response.read(1024 * 1024):
                          count += len(chunk)
                          if count > archive_bytes:
                              raise SystemExit("Prepared artifact archive exceeds its exact recorded size")
                          digest.update(chunk)
                          target.write(chunk)
              except OSError as error:
                  raise SystemExit("Prepared artifact transfer failed: " + type(error).__name__) from None
              if count != archive_bytes or digest.hexdigest() != archive_sha256:
                  raise SystemExit("Prepared artifact archive failed its exact size/SHA256 guard")
              with zipfile.ZipFile(archive) as bundle:
                  names = bundle.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit("Prepared artifact contains duplicate member names")
                  source_record = json.loads(bundle.read("producer-vm9bgrmd/producer.json"))
                  if (source_record["revision"], source_record["tree"]) != (revision, tree):
                      raise SystemExit("Prepared artifact producer identity differs")
                  for filename, (kind, binary_digest, receipt_digest, size) in expected.items():
                      member = "producer-vm9bgrmd/" + filename
                      info = bundle.getinfo(member)
                      if info.file_size != size or stat.S_ISLNK(info.external_attr >> 16):
                          raise SystemExit("Prepared artifact executable member shape differs")
                      staged = temporary / filename
                      with bundle.open(info) as source, staged.open("wb") as target:
                          shutil.copyfileobj(source, target, 1024 * 1024)
                      staged.chmod(0o755)
                      with staged.open("rb") as stream:
                          if hashlib.file_digest(stream, "sha256").hexdigest() != binary_digest:
                              raise SystemExit("Prepared artifact executable digest differs")
                      receipt = bundle.read(member + ".compiler-profile.json")
                      if hashlib.sha256(receipt).hexdigest() != receipt_digest:
                          raise SystemExit("Prepared artifact Cargo profile receipt differs")
                      Path(str(staged) + ".compiler-profile.json").write_bytes(receipt)
                      observed = require_optimized(staged)
                      if {key: observed[key] for key in ("sha256", "profile")} != plan.producer["executables"][kind]:
                          raise SystemExit("Prepared artifact optimized profile differs")
                      destination = debug / filename
                      if destination.is_symlink() or Path(str(destination) + ".compiler-profile.json").is_symlink():
                          raise SystemExit("Prepared artifact destination must be real retained storage")
                      shutil.copy2(staged, destination)
                      shutil.copy2(str(staged) + ".compiler-profile.json", str(destination) + ".compiler-profile.json")
                      restored = require_optimized(destination)
                      if {key: restored[key] for key in ("sha256", "profile")} != plan.producer["executables"][kind]:
                          raise SystemExit("Prepared artifact executable changed during restoration")
                      observations[kind] = dict(path=str(destination), sha256=binary_digest,
                                                profile=restored["profile"], cargo_receipt_sha256=receipt_digest)
          record = dict(schema="omega-private-artifact-producer-recovery-v1", transport="original prepared GitHub Actions artifact",
                        github_cache_hit=False, cache_miss_runs=[42499901511, 42500163045],
                        artifact=artifact_id, artifact_origin_run=42460884915, revision=revision, tree=tree,
                        archive_bytes=count, archive_sha256=digest.hexdigest(), executables=observations,
                        compiler_inputs=plan.producer["input_objects"], fresh_build=False,
                        helper_note="Unchanged replay helper calls its local executable lookup existing workflow cache. This receipt identifies the actual archive transport; no GitHub cache hit is claimed.")
          (output / "artifact-recovery.json").write_text(json.dumps(record, indent=2) + "\n")
          print(json.dumps(record, indent=2))
          PY
      # Only this workflow publishes prepared-v1 entries, after authenticated
      # preparation. Cargo-only caches remain useful restore fallbacks, but
      # cannot occupy an immutable producer key. A CLI-only producer also
      # cannot occupy the key a later corpus run needs for its runner.
      - name: Restore compiler build objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}-prepared-v1-${{ inputs.fixtures != '' && 'with-runner' || (inputs.samples != '' || inputs.cli_fixtures != '') && 'cli' || 'with-runner' }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Install and verify the pinned Linux build tool
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@'))
        shell: bash
        run: |
          set -euo pipefail
          mbx_version=1.29.2
          if [ "$(mbx --version 2>/dev/null)" != "mbx $mbx_version" ]; then
            work=$(mktemp -d)
            trap 'rm -rf "$work"' EXIT
            archive="mbx-$(uname -m)-unknown-linux-gnu.tar.gz"
            release="https://github.com/jdx/mr-boxington/releases/download/v$mbx_version"
            (cd "$work" &&
              curl -fsSLO "$release/$archive" && curl -fsSLO "$release/SHA256SUMS" &&
              grep " $archive\$" SHA256SUMS | sha256sum --check --strict - &&
              tar -xzf "$archive" -C "$HOME/.cargo/bin" mbx)
          fi
          test "$(mbx --version)" = "mbx $mbx_version"
          mbx --version
      - name: Check the exact integration candidate
        id: compiler-check
        if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@')
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            mbx check --locked -p omega
          else
            cargo check --locked -p omega
          fi
      - name: Prepare and retain the optimized producer
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
          OMEGA_COMPILER_PILOT_RECORD_RESULTS: ${{ inputs.record_results }}
          OMEGA_COMPILER_PILOT_INSPECTION_MACHINE: ${{ inputs.inspection_machine }}
        run: python tools/ci/compiler_pilot.py --phase prepare
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Save the verified producer before consumers can use the job budget.
      # Failed or skipped preparation must leave this immutable key available
      # for a later attempt that actually produces its executable roster.
      - name: Save build cache before fixture observations
        if: always() && !cancelled() && steps.compiler-check.outcome == 'success' && steps.producer-preparation.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.compiler_diagnostics
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PROVIDER_DEBUG=1\nOMEGA_COMPILER_CHECK_SITES=1\n')"
      - name: Enable requested ownership and state tracing
        if: github.event_name == 'workflow_dispatch' && inputs.structural_trace
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_STRUCT_TRACE=1\n')"
      - name: Install the debugger for the retained host caller probe
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: |
          if ! command -v gdb >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
          gdb --version
      - name: Capture the retained host missing-home caller
        if: ${{ !cancelled() && steps.producer-preparation.outcome == 'success' }}
        timeout-minutes: 4
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import sys
          
          root = Path.cwd().resolve()
          output = root / "build/compiler-pilot"
          producer = json.loads((output / "producer.json").read_text())["producer"]
          expected_revision = "9af3eb514e1665328bbdbbc875be077276c47869"
          if producer["revision"] != expected_revision:
              raise SystemExit("Host caller probe requires the reviewed retained 9af producer")
          if platform.machine() != "x86_64" or sys.platform != "linux":
              raise SystemExit("Host caller probe requires the existing Linux x86-64 debugger route")
          runner = Path(producer["runner"])
          expected = "f4ceb42bd12d22254fc4ff90e0d04f5f405ffce9076ed4f93ec672b3af35cb8c"
          with runner.open("rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != expected:
              raise SystemExit("Host caller probe runner digest differs")
          cli = Path(producer["cli"])
          with cli.open("rb") as stream:
              cli_digest = hashlib.file_digest(stream, "sha256").hexdigest()
          if cli_digest != "c2ef7288a0d034c9a006368381fd1e75db2d16328265b5078cb21e0a698a5cd8":
              raise SystemExit("Host caller probe CLI digest differs")
          sys.path.insert(0, str(root / "tools"))
          from compiler_profile import require_optimized
          require_optimized(runner)
          require_optimized(cli)
          fixture = "pass/host/runtime_descriptor_nested_case_array_exit"
          folder = subprocess.check_output(["git", "rev-parse", "HEAD:tests/omega/" + fixture], text=True).strip()
          if folder != "c70e459a59fb0d283bec967c2758602961425ff3":
              raise SystemExit("Host caller probe source, Build, input or stream oracle differs")
          library = subprocess.check_output(["git", "rev-parse", "HEAD:source/library"], text=True).strip()
          if library != "b40f44024dc87743a5faab6ad403a4681115cb40":
              raise SystemExit("Host caller probe library differs")
          debugger = shutil.which("gdb")
          if debugger is None:
              raise SystemExit("gdb is unavailable on this runner")
          sections = subprocess.check_output(["readelf", "-S", str(runner)], text=True, timeout=10)
          if ".symtab" not in sections:
              raise SystemExit("Host caller probe requires the retained symbol table")
          environment = dict(os.environ)
          environment.pop("NEXTEST", None)
          environment.pop("OMEGA_PROVIDER_DEBUG", None)
          environment.update(OMEGA_CORPUS_ROOT=str(root), OMEGA_LIBRARY_ROOT=str(root / "source/library"),
                             OMEGA_CORPUS_FIXTURE_FILTER=fixture, OMEGA_COMPILER_CHECK_SITES="1",
                             OMEGA_CORPUS_RECORDS=str(output / "host-caller-probe-records.txt"))
          for name in ("OMEGA_CORPUS_NATIVE", "OMEGA_CORPUS_INTERPRET", "OMEGA_CORPUS_CHECKED_INTERPRETER"):
              if name in environment:
                  raise SystemExit("Host caller probe requires ordinary source checking without engines")
          script = output / "host-caller-probe.gdb"
          script.write_text("set pagination off\nset confirm off\nset print thread-events off\nset print frame-arguments none\nset debuginfod enabled off\nset $omega_host_marker_seen = 0\npython\nimport gdb\n\n_omega_tails = {}\n_omega_marker = b\"CHECKSITE computed-borrow-home-missing\"\n\ndef omega_probe_write():\n    # Linux x86-64 syscall-entry stops expose -ENOSYS before write executes.\n    if int(gdb.parse_and_eval(\"$rax\")) != -38:\n        return\n    if int(gdb.parse_and_eval(\"$rdi\")) != 2:\n        return\n    number = int(gdb.parse_and_eval(\"$orig_rax\"))\n    inferior = gdb.selected_inferior()\n    address = int(gdb.parse_and_eval(\"$rsi\"))\n    count = int(gdb.parse_and_eval(\"$rdx\"))\n    if number == 1:\n        payload = bytes(inferior.read_memory(address, min(count, 4096)))\n    elif number == 20:\n        pieces = []\n        remaining = 4096\n        for index in range(min(count, 32)):\n            iovec_bytes = bytes(inferior.read_memory(address + index * 16, 16))\n            pointer = int.from_bytes(iovec_bytes[:8], byteorder=\"little\", signed=False)\n            length = int.from_bytes(iovec_bytes[8:], byteorder=\"little\", signed=False)\n            take = min(length, remaining)\n            if take:\n                pieces.append(bytes(inferior.read_memory(pointer, take)))\n                remaining -= take\n            if not remaining:\n                break\n        payload = b\"\".join(pieces)\n    else:\n        raise gdb.GdbError(\"Unexpected syscall at the write catchpoint\")\n    thread = gdb.selected_thread()\n    key = thread.ptid\n    joined = _omega_tails.get(key, b\"\") + payload\n    if _omega_marker in joined:\n        gdb.write(\"OMEGA_HOST_MISSING_HOME_MARKER_MATCHED\\n\")\n        gdb.write(\"Observed stderr prefix: \" + repr(joined[-512:]) + \"\\n\")\n        gdb.execute(\"set $omega_host_marker_seen = 1\")\n    _omega_tails[key] = joined[-128:]\nend\ncatch syscall write writev\ncommands\nsilent\npython omega_probe_write()\nif $omega_host_marker_seen != 0\nprintf \"OMEGA_HOST_MISSING_HOME_STACK_BEGIN\\n\"\nbt 24\nprintf \"OMEGA_HOST_MISSING_HOME_STACK_END\\n\"\nquit 0\nend\ncontinue\nend\ninfo breakpoints\nrun > /dev/null 2>&1\npython raise gdb.GdbError(\"The retained runner exited without the required host failure marker\")\n")
          arguments = [debugger, "-nx", "-batch", "-x", str(script), "--args", str(runner)]
          log = output / "host-caller-backtrace.txt"
          returncode = None
          timed_out = False
          try:
              with log.open("w") as stream:
                  result = subprocess.run(arguments, cwd=root, env=environment, stdout=stream,
                                          stderr=subprocess.STDOUT, timeout=180)
              returncode = result.returncode
          except subprocess.TimeoutExpired:
              timed_out = True
          size = log.stat().st_size
          if size > 4 * 1024 * 1024:
              raise SystemExit("Host caller debugger output exceeded its bounded text limit")
          data = log.read_bytes()
          matched = b"OMEGA_HOST_MISSING_HOME_MARKER_MATCHED" in data
          stack = b"OMEGA_HOST_MISSING_HOME_STACK_BEGIN" in data and b"OMEGA_HOST_MISSING_HOME_STACK_END" in data and b"#0 " in data
          metadata = dict(kind="diagnostic-only", producer=expected_revision, runner_sha256=expected,
                          cli_sha256=cli_digest, fixture=fixture, source_folder=folder, library=library,
                          debugger_returncode=returncode, timeout_seconds=180, timed_out=timed_out,
                          marker_matched=matched, stack_captured=stack, log_bytes=size,
                          log_sha256=hashlib.sha256(data).hexdigest())
          (output / "host-caller-backtrace.json").write_text(json.dumps(metadata, indent=2) + "\n")
          print("Diagnostic caller stack only; the source verdict remains the previously recorded rejection.", flush=True)
          print(data[-32000:].decode("utf-8", errors="replace"))
          if timed_out or returncode != 0 or not matched or not stack:
              raise SystemExit("The retained host caller probe did not capture its exact failure stack")
          PY
