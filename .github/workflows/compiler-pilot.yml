name: Replay only missing integrated corpus and filtered tests
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  CARGO_TARGET_DIR: /tmp/ot
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
