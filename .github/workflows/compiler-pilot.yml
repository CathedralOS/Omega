name: Observe the owned-field baseline with its retained compiler
on:
  push:
    branches: [evidence/owned-field-baseline-a205-4075]
permissions:
  contents: read
  actions: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a205ef374f9bbb34464aa0300c0cf5fde551ecf5
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate exact original artifacts and observe the unchanged local pair
        shell: bash
        run: |
          python3 - <<'REPLAY'
          import json,hashlib,re,stat,subprocess,zipfile
          from pathlib import Path,PurePosixPath
          settings={'label': 'owned-field-baseline-a205-4075', 'run': 41859185711, 'artifact': 'compiler-pilot-linux_x86_64-4075afd33d6b15bf822f188a8c054bb8595e4648-1', 'artifact_id': 13339674830, 'artifact_size': 528831876, 'records_id': 13341845263, 'records_size': 6822, 'producer_source': '4075afd33d6b15bf822f188a8c054bb8595e4648', 'producer_tree': '35bdbb9efecc367de7be05543eca615c54d7cea9', 'program_source': 'a205ef374f9bbb34464aa0300c0cf5fde551ecf5', 'program_tree': '3709f1d7be3d05935720d4f0e9cb0b187a120e06', 'objects': {'omega-rust': 'e6a27e6548eae709061c2cec2a175a058574ad03', 'source/library': 'cb7373fa74a8ce647aefbe4cbc781fe19fa6ec3c', 'tools': '68dd6fda8c6761a0adca970813d6429f695b9545', '.github': 'bae01e4f85b7173fa6cce374bf7bc9a924654a71', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'}, 'program_objects': {'omega-rust': 'a9be8820e4073d8445e61bc41d6fc3a5c5598c0d', 'source/library': 'cb7373fa74a8ce647aefbe4cbc781fe19fa6ec3c', 'tools': '68dd6fda8c6761a0adca970813d6429f695b9545', '.github': 'bae01e4f85b7173fa6cce374bf7bc9a924654a71', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'}, 'baseline': True, 'sample_root': 'samples/cli/facts/finite_family_owned_field', 'samples': ['samples/cli/facts/finite_family_owned_field/local', 'samples/cli/facts/finite_family_owned_field/local/invalid'], 'fixtures': ['pass/facts/finite_family_owned_field/local', 'fail/facts/finite_family_owned_field/local'], 'meaning': 'Fresh local-pair baseline using the exact published-eb62 compiler inputs retained at4075. Original producer, program source and push driver remain separate. Existing read-only Actions token authenticates exact artifact IDs and archive digests; the user API quota remains exhausted. No Rust build and no result claim before raw independent review.'}
          initial_out=Path.cwd()/'build'/settings['label'];initial_out.mkdir(parents=True,exist_ok=True)
          origin_run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          (initial_out/'authenticated-origin-run.json').write_text(json.dumps(origin_run,indent=2)+'\n')
          assert origin_run['head_sha']==settings['producer_source'] and origin_run['status']=='completed'
          def download_artifact(artifact_id,name,size,destination):
              endpoint='repos/CathedralOS/Omega/actions/artifacts/'+str(artifact_id)
              meta=json.loads(subprocess.check_output(['gh','api',endpoint],text=True))
              assert meta['id']==artifact_id and meta['name']==name and meta['size_in_bytes']==size and not meta['expired']
              assert meta['workflow_run']['id']==settings['run'] and meta['workflow_run']['head_sha']==settings['producer_source']
              assert re.fullmatch(r'sha256:[0-9a-f]{64}',meta['digest'])
              archive=Path('build')/(settings['label']+'-'+str(artifact_id)+'.zip')
              with archive.open('wb') as stream:subprocess.run(['gh','api',endpoint+'/zip'],stdout=stream,check=True)
              digest=hashlib.sha256(archive.read_bytes()).hexdigest();assert 'sha256:'+digest==meta['digest']
              with zipfile.ZipFile(archive) as zipped:
                  for member in zipped.infolist():
                      path=PurePosixPath(member.filename)
                      assert not path.is_absolute() and '..' not in path.parts and ':' not in member.filename
                      assert not stat.S_ISLNK(member.external_attr>>16)
                  zipped.extractall(destination)
              (initial_out/('artifact-'+str(artifact_id)+'-authentication.json')).write_text(json.dumps({'metadata':meta,'actual_archive_sha256':digest},indent=2)+'\n')
              archive.unlink()
          records_dir=initial_out/'origin-records'
          download_artifact(settings['records_id'],'compiler-pilot-records-linux_x86_64-'+settings['producer_source']+'-1',settings['records_size'],records_dir)
          original_summary=json.loads((records_dir/'summary.json').read_text());settings['original_producer']=original_summary['producer']
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_source'] and run['status']=='completed'
          retained=out/'retained';download_artifact(settings['artifact_id'],settings['artifact'],settings['artifact_size'],retained)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']=='linux_x86_64'
          sys.path.insert(0,'tools/ci');import compiler_pilot
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=subprocess.check_output(['git','ls-files','source/library',settings['sample_root'],'tests/omega/pass/facts/finite_family_owned_field','tests/omega/fail/facts/finite_family_owned_field'],text=True).splitlines()
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=SimpleNamespace(cli=cli,runner=runner,target='linux_x86_64',verify=verify,record=lambda:original)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          refusals=[]
          fixtures=tuple(settings['fixtures'])
          checking=out/'checking.json'
          command=[sys.executable,'tools/corpus_gate.py','--runner',str(runner),'--filter',','.join(fixtures),'--json',str(checking),'--golden',str(compiler_pilot.observation_golden(out,both=False,target='linux_x86_64'))]
          result=subprocess.run(command,env=dict(os.environ,OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_SWEEP='1',OMEGA_CORPUS_CAPTURE_ARTIFACTS=str(out/'source-artifacts')))
          try:
              assert result.returncode in [0,1]
              compiler_pilot.validate_report(json.loads(checking.read_text()),fixtures,both=False,revision=settings['program_source'],target='linux_x86_64')
          except (AssertionError,ValueError,OSError) as error:refusals.append('Source: '+str(error))
          verify()
          report=out/'samples.json'
          result=subprocess.run([sys.executable,'tools/sample_native_gate.py','--cli',str(cli),'--facts','--jobs','1','--target','linux_x86_64','--filter',','.join(settings['samples']),'--write-results',str(report)])
          try:
              rows=json.loads(report.read_text());assert result.returncode==0 and len(rows)==len(settings['samples']) and {r['sample'] for r in rows}==set(settings['samples'])
              for row in rows:
                  if row['sample'].endswith('/invalid'):
                      assert row.get('role')=='intended-invalid' and row.get('state')=='rejected' and row.get('detail')=='intended rejection matched' and 'execution' not in row
                  else:
                      assert row.get('state')=='pass' and row.get('execution')=={'native_exit':0,'interpreter_exit':0}
          except (AssertionError,ValueError,OSError) as error:refusals.append('Samples: '+str(error))
          verify()
          (out/'summary.json').write_text(json.dumps({'passed':not refusals,'refusals':refusals,'program_source':settings['program_source'],'producer_source':settings['producer_source'],'producer':original,'driver':os.environ['GITHUB_SHA'],'input_count':len(inputs),'builds_rust':False},indent=2)+'\n')
          raise SystemExit(bool(refusals))
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: owned-field-baseline-a205-4075-${{ github.run_id }}
          path: |
            build/owned-field-baseline-a205-4075/*.json
            build/owned-field-baseline-a205-4075/origin-records/
            build/owned-field-baseline-a205-4075/source-artifacts/
          retention-days: 7
