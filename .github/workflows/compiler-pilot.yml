name: Run the admitted returned-slice program with its retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 845a43cb4fe3bf5535efd3068b34f84820466ade
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Replay package acceptance and both engines without a compiler build
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          settings={'source': '845a43cb4fe3bf5535efd3068b34f84820466ade', 'tree': '3cd34bbb3adfc3ad2ea3b0189090df2fc9452194', 'inputs': {'tests/omega/pass/slices/runtime_shared_subslice_return_exit/main.omg': '509624fcbc19851e4517d467ea09f2ee23b5e20b64f1b8c36e7c88d2e69825bb', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/README.md': '854fa12d803022e9abf09eb8695d4704a5b473b79c55e8a737e0e3a1ccebf069', 'tests/omega/pass/slices/runtime_shared_subslice_return_exit/build.omg': '314c94208a17521fcaceb643c9fe4c59580af7017a81cb448870161e4c4daa65'}, 'origin_run': 41811077683, 'origin_driver': '37730f002504f7fe9765c60843cd31929923cd73', 'artifact': 'compiler-pilot-linux_x86_64-37730f002504f7fe9765c60843cd31929923cd73-1', 'cli_sha256': 'a945c8a1745742c4e041aaca57ee3cf1874487124c37bd23e1d252f96ea82886'}
          source=settings['source'];out=Path('build/slice-public-845a');out.mkdir(parents=True,exist_ok=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for p,h in settings['inputs'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['origin_run'])],text=True))
          assert run['head_sha']==settings['origin_driver'] and run['status']=='completed'
          retained=Path('build/slice-public-845a-producer')
          subprocess.run(['gh','run','download',str(settings['origin_run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==source and original['tree']==settings['tree'] and original['target']=='linux_x86_64' and original['runner'] is None
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          sys.path.insert(0,'tools/ci');import compiler_pilot
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve())
          assert profile['sha256']==settings['cli_sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          producer=compiler_pilot.CompilerProducer(source,settings['tree'],'linux_x86_64',original['toolchain'],cli.resolve(),None,profile,None)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'original_producer':original,'actual_profile':profile,'driver':os.environ['GITHUB_SHA'],'builds_rust':False,'original_run_conclusion':run['conclusion']},indent=2)+'\n')
          os.environ['GITHUB_SHA']=source
          result=compiler_pilot.run_suite('slice-public-845a',(),(),producer=producer,cli_fixtures='pass/slices/runtime_shared_subslice_return_exit')
          producer.verify()
          raise SystemExit(result)
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: slice-public-845a-${{ github.run_id }}
          path: build/slice-public-845a/
          retention-days: 7
