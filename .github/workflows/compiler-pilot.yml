name: Retained provider checking profile
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a01810ff60d85b03bf5abb1f894dfc81f3a08d4d
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Measure existing retained producer without building Rust
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys,time
          settings={'source': 'a01810ff60d85b03bf5abb1f894dfc81f3a08d4d', 'tree': '8fbe321e9924d8b648486d818f2f07b23d74aa6e', 'run': 41697815800, 'artifact': 'compiler-pilot-linux_x86_64-a01810ff60d85b03bf5abb1f894dfc81f3a08d4d-1', 'runner_sha256': '2a56a8fbde1fa06ccf3fa04bdd1cf4d5b092e5b5c45c423c45d77a7aa144cb07', 'original_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-mtqwskoa/corpus_runner', 'sha256': '2a56a8fbde1fa06ccf3fa04bdd1cf4d5b092e5b5c45c423c45d77a7aa144cb07', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'fixtures': ['fail/facts/generic_calling_policy/missing_nested_provider', 'pass/facts/generic_calling_policy/inherited_helper_exit'], 'inputs': {'tests/omega/fail/build/provider_package_default_missing_rejected/build.omg': 'a52eb2ca909518b9cc42d31f6c3db8eff9fc0e27aab1aa5e0afb1dc677bcab50', 'tests/omega/fail/build/provider_package_default_missing_rejected/main.omg': 'a026f315af60f80ec2aff72c25be3269f032b7f4be90f554a8f929626b60fc28', 'tests/omega/fail/build/provider_package_default_missing_rejected/expected.txt': '795b434b2ef7f0b92b4de54c8f421bb9e583e4360909490745bcc4bfab42969a', 'tests/omega/fail/build/provider_package_default_missing_rejected/reading_provider/build.omg': '3b20ff87e0da40b4d58f21010f81b5a3f44d02043c158957470334b7b7c4fd51', 'tests/omega/fail/build/provider_package_default_missing_rejected/reading_provider/main.omg': '88c8caa96d659014e36c8c73f26cf6afb6ff043670e650b829366e216d8f694b', 'tests/omega/fail/build/provider_package_default_unselected_body_rejected/build.omg': '50da8567b7fb7b1f56a3f77664f72f7f7db09264a278f49b2534d5c4825a9056', 'tests/omega/fail/build/provider_package_default_unselected_body_rejected/main.omg': 'a026f315af60f80ec2aff72c25be3269f032b7f4be90f554a8f929626b60fc28', 'tests/omega/fail/build/provider_package_default_unselected_body_rejected/expected.txt': 'f5883317994118a49dc9424a156c72bbed2752c03f1ffd026b9d09fbb6f3f5ce', 'tests/omega/fail/build/provider_package_default_unselected_body_rejected/reading_provider/build.omg': '26d1b0a10107122a7f23063b836902263849de878917fb7043534fd002a76235', 'tests/omega/fail/build/provider_package_default_unselected_body_rejected/reading_provider/main.omg': 'bbe5807985ec4b9acbdb1215c6da9954bcb63e8ec3eb0bfe9f9e303366767fe1', 'tests/omega/fail/facts/generic_calling_policy/missing_nested_provider/build.omg': '968b43c7f95920400fa8b0bb77db15096bba19b84574ca0b179d4d4c35d72b53', 'tests/omega/fail/facts/generic_calling_policy/missing_nested_provider/main.omg': 'f7efe616c0617dfc95af866a6f2638105e6595dea8cef526cc65b8f6351cbd82', 'tests/omega/fail/facts/generic_calling_policy/missing_nested_provider/expected.txt': '085bfc74048bbdfd86a79e4b110c3167d7c1aa0b54cff2d49d442f4d7e09a526', 'tests/omega/fail/facts/generic_calling_policy/missing_policy_provider/build.omg': '36c033ae3f29ecc1c5c23dff2aa0980ffaf5df4f4992922de57900c3dec8e05c', 'tests/omega/fail/facts/generic_calling_policy/missing_policy_provider/main.omg': 'a2b16fe85620940709a4436e7fe7698652425ebba16ac8556970fde4d90f8761', 'tests/omega/fail/facts/generic_calling_policy/missing_policy_provider/expected.txt': '8520655baf40ebe962eb212d5a08981081af2a5995393e2f1f4ab8ca2222dc42', 'tests/omega/pass/facts/generic_calling_policy/inherited_helper_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/generic_calling_policy/inherited_helper_exit/build.omg': '98c794a0a23bbe3445fff62d26ed068bb66e000390b302af55d82f494cd0c13b', 'tests/omega/pass/facts/generic_calling_policy/inherited_helper_exit/main.omg': '665329788ab4a14a886c65c85a992f3ecd6e0905efa0f03acf5778b8c7d1b569', 'tests/omega/pass/facts/generic_calling_policy/unused_descendant_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/facts/generic_calling_policy/unused_descendant_exit/build.omg': '1cb0e5552525ecf15e0b063a08bc70cf843f5049dece75d675976d37fb091940', 'tests/omega/pass/facts/generic_calling_policy/unused_descendant_exit/main.omg': '36e1ad686bfb166ef82fa0d2929ee51386a11f487cddf84e2d61a4e0f5768b98'}}
          out=Path('build/provider-profile'); out.mkdir(parents=True,exist_ok=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==settings['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for name,digest in settings['inputs'].items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          retained=Path('build/retained-profile-producer')
          subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          runners=list(retained.glob('**/corpus_runner')); assert len(runners)==1
          runner=runners[0].resolve(); runner.chmod(0o755)
          sys.path.insert(0,'tools'); import corpus_gate
          profile=corpus_gate.require_optimized(runner)
          assert profile['sha256']==settings['runner_sha256'] and profile['profile']['opt_level']=='1'
          (out/'producer.json').write_text(json.dumps(dict(settings=settings,actual_profile=profile,platform=platform.platform(),cpu=Path('/proc/cpuinfo').read_text()),indent=2)+'\n')
          rows=[]
          for fixture in settings['fixtures']:
           name=fixture.rsplit('/',1)[1]; cache=(out/('cache-'+name)).resolve(); assert not cache.exists(); cache.mkdir()
           env=dict(os.environ,OMEGA_CORPUS_JOBS='1',OMEGA_PHASE_PROFILE='1',XDG_CACHE_HOME=str(cache))
           command=['/usr/bin/time','-v','-o',str(out/(name+'.time.txt')),sys.executable,'tools/corpus_gate.py','--runner',str(runner),'--filter',fixture,'--json',str(out/(name+'.checking.json'))]
           start=time.monotonic()
           with (out/(name+'.stdout')).open('w') as stdout,(out/(name+'.stderr')).open('w') as stderr:
            result=subprocess.run(command,env=env,stdout=stdout,stderr=stderr)
           row=dict(fixture=fixture,command=command,exit=result.returncode,seconds=time.monotonic()-start,source=settings['source'],cache=str(cache),workers=1,fixture_timeout_seconds=120)
           report=out/(name+'.checking.json'); row['report']=json.loads(report.read_text()) if report.is_file() else None
           rows.append(row); (out/'observations.json').write_text(json.dumps(rows,indent=2)+'\n')
           print(fixture,'gate exit',result.returncode,'seconds',round(row['seconds'],3),flush=True)
           assert corpus_gate.require_optimized(runner)==profile
           assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          print('Measurement reports retain actual gate exits and outcomes; this is not an acceptance claim for stale negative expectations.',flush=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: retained-provider-profile-a018-${{ github.run_id }}
          path: |
            build/provider-profile/*.json
            build/provider-profile/*.stdout
            build/provider-profile/*.stderr
            build/provider-profile/*.txt
