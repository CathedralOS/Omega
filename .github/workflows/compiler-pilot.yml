name: Validate integrated progress selector on remaining hosts
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  qualification:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos_arm64
            runner: macos-15
            target_dir: /tmp/ot
          - host: windows_x86_64
            runner: windows-2022
            target_dir: D:/ot
          - host: linux_arm64
            runner: ubuntu-24.04-arm
            target_dir: /tmp/ot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.host == 'windows_x86_64' && 120 || 60 }}
    env:
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Provision Windows rooted temporary directory for hosted applications
        if: matrix.host == 'windows_x86_64'
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Record the explicit required fresh host preparation
        shell: python
        run: |
          import json, os
          from pathlib import Path
          output = Path('build/compiler-pilot')
          output.mkdir(parents=True, exist_ok=True)
          record = {'source': os.environ['GITHUB_SHA'], 'host': '${{ matrix.host }}',
                    'workflow_cache_restore': False, 'fallback': False,
                    'reason': 'The exact d58 host caches and normally visible default-main host/toolchain caches are absent. One required optimized build is planned explicitly; actual Cargo receipts will report reused and rebuilt artifacts.'}
          (output / 'explicit-host-preparation.json').write_text(json.dumps(record, indent=2) + chr(10))
          print(json.dumps(record))
      - name: Check, test evidence algebra and prepare the actual repaired compiler
        id: preparation
        run: python tools/build_slot.py -- python .github/progress_repair_prepare.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progress-selector-integrated-${{ matrix.host }}-preparation-${{ github.run_id }}
          path: build/compiler-pilot/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
      - name: Save the actual repaired cache before consumers
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: progress-selector-integrated-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Observe the unchanged full row and original controls
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        run: python .github/progress_repair_prepare.py --consume
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: progress-selector-integrated-${{ matrix.host }}-observations-${{ github.run_id }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
