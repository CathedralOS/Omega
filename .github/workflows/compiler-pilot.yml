name: Fixed-base computed const policy comparison
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ffc4d649fa8c2244d87091f8b8a694db7a181036
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the frozen affected projects with the original optimized compiler
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          settings={'input_source': 'ffc4d649fa8c2244d87091f8b8a694db7a181036', 'input_tree': 'bc9e17054b684de5447d999b557751f6cd18350b', 'producer_source': '2035ca5b0be69997a05f6d9e0d9c6c1672e2ab12', 'producer_tree': 'de05df6c35559f51ea6f926fd4c42537646d4fe5', 'producer_closure': {'omega-rust': '41e80af27105c3b4594f2a741eb3651461535263', 'source/library': '6c22d2f78cc09e8ed186b2ab3cc2f78da223daee', 'tools': '0d881d337906b127f1e3dc8dd0b09380c72a2f25', 'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9', 'Cargo.lock': 'ec37bd14debbefe5a3a1aec66488b6a28c908447', 'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929', '.github/workflows/compiler-pilot.yml': 'a6f083310ce5b538ed12559eab75a96a80faf432'}, 'inputs': {'samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy/build.omg': 'd8c12d4e1dc0de130207f2abfacc00046664629e87ffe8b2c9b4c4ec40cad571', 'samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy/invalid/build.omg': 'd8c12d4e1dc0de130207f2abfacc00046664629e87ffe8b2c9b4c4ec40cad571', 'samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy/invalid/main.omg': '4f31c402bd23120c709059bf37a2ea60a2bd841d6e1262b92403da245bc7bfaa', 'samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy/main.omg': 'eb12a679670e4f4481cc6788d93e134df6d813ce672580bb2fdc586c52956a8d', 'tests/omega/fail/layouts/fixed_layout_computed_const_policy_rejected/build.omg': 'd8c12d4e1dc0de130207f2abfacc00046664629e87ffe8b2c9b4c4ec40cad571', 'tests/omega/fail/layouts/fixed_layout_computed_const_policy_rejected/expected.txt': '6d49febb2458769189568814b07ec159be8a6ca1e18cad78be710e074766b04e', 'tests/omega/fail/layouts/fixed_layout_computed_const_policy_rejected/main.omg': '4f31c402bd23120c709059bf37a2ea60a2bd841d6e1262b92403da245bc7bfaa', 'tests/omega/pass/layouts/fixed_layout_computed_const_policy_exit/build.omg': 'd8c12d4e1dc0de130207f2abfacc00046664629e87ffe8b2c9b4c4ec40cad571', 'tests/omega/pass/layouts/fixed_layout_computed_const_policy_exit/expected_interpreter_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/layouts/fixed_layout_computed_const_policy_exit/expected_native_exit.txt': '9a271f2a916b0b6ee6cecb2426f0b3206ef074578be55d9bc94f6f3fe3ab86aa', 'tests/omega/pass/layouts/fixed_layout_computed_const_policy_exit/main.omg': 'eb12a679670e4f4481cc6788d93e134df6d813ce672580bb2fdc586c52956a8d'}, 'origin_run': 41771275006, 'origin_artifact': 'compiler-pilot-linux_x86_64-2035ca5b0be69997a05f6d9e0d9c6c1672e2ab12-1', 'cli_sha256': '7774ae2b03921ff23ca5de911e919bc624fe53c101f94d524bab867687308fd8', 'runner_sha256': '3f4988fda99d689845dc215b09e700846bb9028a4afaacc1385f1a0240e3c943', 'scope': {'positives': ['pass/layouts/fixed_layout_computed_const_policy_exit'], 'negatives': ['fail/layouts/fixed_layout_computed_const_policy_rejected'], 'samples': ['samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy', 'samples/cli/facts/fixed_layout_storage/compositions/computed_const_policy/invalid']}, 'name': 'baseline_computed_const'}
          source=settings['input_source']; actual_driver=os.environ['GITHUB_SHA']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['input_tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for p,h in settings['inputs'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          for p,h in settings['producer_closure'].items():
              assert subprocess.check_output(['git','rev-parse',source+':'+p],text=True).strip()==h,p
              assert subprocess.check_output(['git','rev-parse',settings['producer_source']+':'+p],text=True).strip()==h,p
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['origin_run'])],text=True))
          assert run['head_sha']==settings['producer_source'] and run['status']=='completed'
          artifacts=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['origin_run'])+'/artifacts'],text=True))['artifacts']
          matching=[a for a in artifacts if a['name']==settings['origin_artifact']];assert len(matching)==1
          retained=Path('build/retained-provider-producer')
          subprocess.run(['gh','run','download',str(settings['origin_run']),'--name',settings['origin_artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']=='linux_x86_64'
          sys.path.insert(0,'tools/ci');import compiler_pilot
          cli=records[0].parent/Path(original['cli']).name;cli.chmod(0o755)
          runner=records[0].parent/Path(original['runner']).name;runner.chmod(0o755)
          profile=compiler_pilot.corpus_gate.require_optimized(cli.resolve()); runner_profile=compiler_pilot.corpus_gate.require_optimized(runner.resolve())
          for p,record,key in [(profile,original['cli_profile'],'cli_sha256'),(runner_profile,original['runner_profile'],'runner_sha256')]:
              assert p['sha256']==record['sha256']==settings[key] and p['profile']==record['profile'] and p['profile']['opt_level']=='1'
          out=Path('build/provider-'+settings['name']);out.mkdir(parents=True)
          receipt={'settings':settings,'driver_revision':actual_driver,'input_revision':source,'input_tree':settings['input_tree'],'producer_revision':settings['producer_source'],'producer_tree':settings['producer_tree'],'origin_run_conclusion':run['conclusion'],'origin_artifact':matching[0],'original_producer':original,'actual_cli_profile':profile,'actual_runner_profile':runner_profile,'reason':'Fixed published-base comparison with original program, Build and oracle inputs. Compiler, library and tools are byte-identical to measured producer2035. The original sample invalid has no expectation and stays unscored.'}
          (out/'retained-origin.json').write_text(json.dumps(receipt,indent=2)+'\n')
          summary={'input_revision':source,'producer_revision':settings['producer_source'],'stages':[],'passed':False}
          scope=settings['scope']; checking=scope['positives']+scope['negatives']
          for name,fixtures,both in [('checking',checking,False),('both',scope['positives'],True)]:
              report=out/(name+'.json');argv=[sys.executable,'tools/corpus_gate.py','--runner',str(runner.resolve()),'--filter',','.join(fixtures),'--json',str(report)]
              if both:argv+=['--both']
              start=time.monotonic();result=subprocess.run(argv,env=dict(os.environ,OMEGA_CORPUS_SWEEP='1',OMEGA_CORPUS_CAPTURE_ARTIFACTS=str(out/'products'/name)))
              stage={'name':name,'exit_code':result.returncode,'seconds':round(time.monotonic()-start,3),'passed':False}
              try:
                  assert result.returncode in (0,1)
                  compiler_pilot.validate_report(json.loads(report.read_text()),fixtures,both=both,revision=source,target='linux_x86_64')
                  stage['passed']=True
              except Exception as e:stage['error']=str(e)
              summary['stages'].append(stage);(out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          start=time.monotonic();report=out/'samples.json'
          result=subprocess.run([sys.executable,'tools/sample_native_gate.py','--cli',str(cli.resolve()),'--facts','--jobs','2','--target','linux_x86_64','--filter',','.join(scope['samples']),'--write-results',str(report)])
          rows=json.loads(report.read_text());passed=result.returncode==0 and len(rows)==len(scope['samples']) and {r['sample'] for r in rows}==set(scope['samples']) and all(r['state'] in ('pass','rejected') for r in rows)
          summary['stages'].append({'name':'ordinary projects','exit_code':result.returncode,'seconds':round(time.monotonic()-start,3),'passed':passed})
          assert compiler_pilot.corpus_gate.require_optimized(cli.resolve())==profile
          assert compiler_pilot.corpus_gate.require_optimized(runner.resolve())==runner_profile
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for p,h in settings['inputs'].items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          summary['passed']=all(s['passed'] for s in summary['stages']);(out/'summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          raise SystemExit(0 if summary['passed'] else 1)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: explicit-provider-baseline_computed_const-${{ github.run_id }}
          path: build/provider-baseline_computed_const/
          retention-days: 7
