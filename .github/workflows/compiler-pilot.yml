name: Check one atomic store counterfactual with the retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 524d0e57db23d91fd5ba455f2d9f4ca54021e86c
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the retained compiler and check the atomic store counterfactual
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          settings={'label': 'atomic-bounded-store101-524d',
           'target': 'linux_x86_64',
           'run': 41942083684,
           'artifact': 'compiler-pilot-linux_x86_64-524d0e57db23d91fd5ba455f2d9f4ca54021e86c-1',
           'artifact_id': 13377372124,
           'artifact_bytes': 478712865,
           'artifact_digest': 'sha256:03007ed1545f4880aa5fee04e8013d4edc4932196b5a1826e973f050382cddde',
           'producer_source': '524d0e57db23d91fd5ba455f2d9f4ca54021e86c',
           'producer_tree': 'd75d1a3706d6d7e2f26212837f4a511c6e494a7c',
           'program_source': '524d0e57db23d91fd5ba455f2d9f4ca54021e86c',
           'program_tree': 'd75d1a3706d6d7e2f26212837f4a511c6e494a7c',
           'original_producer': {'revision': '524d0e57db23d91fd5ba455f2d9f4ca54021e86c',
                                 'tree': 'd75d1a3706d6d7e2f26212837f4a511c6e494a7c',
                                 'target': 'linux_x86_64',
                                 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\n'
                                              'binary: rustc\n'
                                              'commit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\n'
                                              'commit-date: 2026-09-03\n'
                                              'host: x86_64-unknown-linux-gnu\n'
                                              'release: 1.100.0-nightly\n'
                                              'LLVM version: 23.1.1',
                                 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-le0j0bpe/omega',
                                 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-le0j0bpe/corpus_runner',
                                 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-le0j0bpe/omega',
                                                 'sha256': '9405b3585d6977d2e1409d452ede0711691c288b0a4c8b734f4bcb53db6dda33',
                                                 'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                             'opt_level': '1'}},
                                 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-le0j0bpe/corpus_runner',
                                                    'sha256': 'a8c651f78a0130e951f7d1b24390c11fcbe26b1e77f5c61cf30990ce5d747bd8',
                                                    'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                                'opt_level': '1'}}},
           'objects': {'omega-rust': '2d27976dfaf31deda0e4d3720e49549a566d798a',
                       'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                       'tools': '4e442b33aacbaaa07762e5a90ea0bb570e00d0cb',
                       '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                       'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                       'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                       'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'program_objects': {'omega-rust': '2d27976dfaf31deda0e4d3720e49549a566d798a',
                               'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                               'tools': '4e442b33aacbaaa07762e5a90ea0bb570e00d0cb',
                               '.github': '28d646336b736ecc18904871833be8d8a26847d7',
                               'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                               'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                               'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'baseline': False,
           'input_hashes': {'tests/omega/fail/facts/atomic_bounded_resident/local/main.omg': '9fd65c7574efac1c3245cedb5a8fa012f660e5ad67820930ab971b6a75b6f485',
                            'tests/omega/fail/facts/atomic_bounded_resident/local/expected.txt': '334f8d9bcac9de7037fee445a51c96466d6dca804a2392289dd748d15707980d'},
           'fixtures': [],
           'samples': [],
           'sample_roles': {},
           'meaning': 'Source-only old privatecall41 and samebodycall101 counterfactual. No Rust build or '
                      'engine observation; original failed full scope remains red.',
           'counterfactual': '// Expected exit: 0.\n'
                             '// A shared atomic store preserves its resident bound and ordering, and a load '
                             'carries that bound into Exact subtraction.\n'
                             'use omega::language::core::atomic;\n'
                             'data Cell requires value <= 100 { value: AtomicU32; }\n'
                             'machine publish(cell: &Cell, value: u32) requires value <= 101 { '
                             'cell.value.store(value, Publish); }\n'
                             'machine main() crashes Trap {\n'
                             '    let cell: Cell;\n'
                             '    publish(&cell, 101);\n'
                             '    Atomic::fence(FenceOrdering::Receive);\n'
                             '    let observed: u32 = cell.value.load(Receive);\n'
                             '    let remaining: u32 = 100 - observed;\n'
                             '    transition remaining == 59 { true -> done() _ -> bad() }\n'
                             '    machine done() {}\n'
                             '    machine bad() { crash Trap; }\n'
                             '}\n',
           'counterfactual_sha256': 'e88ced76f3fdcf1edc70f103bf4d4fd29af0e2617791f8b5d46bbcf83a2d6d16'}
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_source'] and run['status']=='completed'
          artifact=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/artifacts/'+str(settings['artifact_id'])],text=True))
          assert artifact['name']==settings['artifact'] and artifact['size_in_bytes']==settings['artifact_bytes'] and artifact['digest']==settings['artifact_digest'] and not artifact['expired']
          assert artifact['workflow_run']['id']==settings['run'] and artifact['workflow_run']['head_sha']==settings['producer_source']
          retained=out/'retained';subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          producer_parent=Path(settings['original_producer']['cli']).parent.name
          records=[retained/producer_parent/'producer.json'];assert records[0].is_file()
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          assert json.loads((retained/'producer.json').read_text())=={'schema':'omega-compiler-producer-v1','producer':original}
          prepared=json.loads((retained/'preparation.json').read_text());assert prepared['passed'] and prepared['candidate']==settings['producer_source'] and prepared['tree']==settings['producer_tree'] and prepared['producer']==original
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']==settings['target']
          sys.path.insert(0,'tools/ci');import compiler_pilot,platform
          assert compiler_pilot.corpus_gate.host_target()==settings['target']
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=sorted(set(settings['input_hashes']) | set(subprocess.check_output(['git','ls-files','source/library'],text=True).splitlines()))
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          for p,h in settings['input_hashes'].items():assert inputs[p]==h,p
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=SimpleNamespace(cli=cli,runner=runner,target=settings['target'],verify=verify,record=lambda:original)
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'artifact':artifact,'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'host':{'system':platform.system(),'machine':platform.machine(),'version':platform.version()},'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          refusals=[]
          rows=[]
          variant=out/'counterfactual'/'main.omg';variant.parent.mkdir(exist_ok=True);variant.write_text(settings['counterfactual']);assert hashlib.sha256(variant.read_bytes()).hexdigest()==settings['counterfactual_sha256']
          cases=[('original-private41',root/'tests/omega/fail/facts/atomic_bounded_resident/local/main.omg',False),('same-private101',variant,True)]
          import time
          for label,main,must_reject in cases:
              verify();assert hashlib.sha256(variant.read_bytes()).hexdigest()==settings['counterfactual_sha256'];started=time.monotonic()
              command=[str(cli),'--check',str(main)]
              with (out/(label+'.stdout')).open('wb') as stdout,(out/(label+'.stderr')).open('wb') as stderr:
                  result=subprocess.run(command,stdout=stdout,stderr=stderr,timeout=120)
              verify();actual_stderr=(out/(label+'.stderr')).read_text();fragment="assignment stores a value not provably within its data's `requires` facts"
              matched=(result.returncode!=0 and fragment in actual_stderr) if must_reject else result.returncode==0
              rows.append({'label':label,'command':command,'exit':result.returncode,'seconds':time.monotonic()-started,'main_sha256':hashlib.sha256(main.read_bytes()).hexdigest(),'must_reject':must_reject,'required_fragment':fragment if must_reject else None,'matched':matched})
              if not matched:refusals.append(label+': authored Source outcome unmet')
          (out/'checking.json').write_text(json.dumps({'producer':original,'program_source':settings['program_source'],'driver':os.environ['GITHUB_SHA'],'observations':rows,'passed':not refusals,'refusals':refusals,'builds_rust':False,'engines_observed':False},indent=2)+'\n')
          raise SystemExit(bool(refusals))
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-bounded-store101-524d-${{ github.run_id }}
          path: |
            build/atomic-bounded-store101-524d/*.json
            build/atomic-bounded-store101-524d/*.stdout
            build/atomic-bounded-store101-524d/*.stderr
            build/atomic-bounded-store101-524d/counterfactual/
          retention-days: 7
