          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          os.environ['GITHUB_SHA']=source
          assert compiler_pilot.corpus_gate.host_target()=='linux_x86_64'
          assert os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          output=root/'build/compiler-pilot/integrated'
