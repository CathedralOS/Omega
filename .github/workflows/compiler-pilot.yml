name: Diagnose stored-call statement effects with the retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 977be69fd10c786a77b1ebd7dd7ce0ef62a51c3d
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe the existing refusal diagnostics
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys,time
          settings={'source': '977be69fd10c786a77b1ebd7dd7ce0ef62a51c3d', 'tree': '55cdc8072b790f0b39f68d4a778794bde1aa0dfd', 'run': 41841704932, 'artifact': 'compiler-pilot-linux_x86_64-977be69fd10c786a77b1ebd7dd7ce0ef62a51c3d-1', 'cli_sha256': '22ca4beccc88c7c772f5b1ef50ad82e41321deeab5c7d26e4e3e2cde9d2d2e2f', 'program': 'samples/cli/facts/finite_family_input_index/local/main.omg'}
          out=Path('build/stored-call-fallthrough-diagnostic');out.mkdir(parents=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==settings['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['status']=='completed' and run['head_sha']==settings['source']
          retained=Path('build/retained-stored-call-producer')
          subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          records=list(retained.glob('producer-*/producer.json'));assert len(records)==1
          original=json.loads(records[0].read_text());assert original['revision']==settings['source'] and original['tree']==settings['tree']
          cli=(records[0].parent/Path(original['cli']).name).resolve();cli.chmod(0o755)
          sys.path.insert(0,'tools');import corpus_gate
          profile=corpus_gate.require_optimized(cli);assert profile['sha256']==settings['cli_sha256']==original['cli_profile']['sha256'] and profile['profile']['opt_level']=='1'
          env=dict(os.environ,OMEGA_LIBRARY_ROOT=str(Path('source/library').resolve()),OMEGA_COMPILER_CHECK_SITES='1')
          start=time.monotonic();result=subprocess.run([str(cli),'--check',settings['program']],env=env,stdin=subprocess.DEVNULL,capture_output=True,text=True,timeout=120)
          (out/'check.stdout').write_text(result.stdout);(out/'check.stderr').write_text(result.stderr)
          assert corpus_gate.require_optimized(cli)==profile
          record={'settings':settings,'driver':os.environ['GITHUB_SHA'],'original_run_conclusion':run['conclusion'],'producer':original,'actual_profile':profile,'argv':[str(cli),'--check',settings['program']],'exit':result.returncode,'seconds':time.monotonic()-start,'checksite_lines':[line for line in result.stderr.splitlines() if 'stored-reference-statement-transfer-refusal' in line],'meaning':'Diagnostic of an already failed producer. No successful source or engine claim and no Rust build.'}
          (out/'observation.json').write_text(json.dumps(record,indent=2)+chr(10))
          print('Diagnostic exit',result.returncode,'refusal sites',len(record['checksite_lines']))

          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: stored-call-fallthrough-diagnostic-${{ github.run_id }}
          path: build/stored-call-fallthrough-diagnostic/
          retention-days: 7
