name: Qualify complete term comparisons on Mac
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  matching-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos_arm64
            runner: macos-15
            target_dir: /tmp/ot
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      NATIVE_HOST: ${{ matrix.host }}
      CARGO_TARGET_DIR: ${{ matrix.target_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 39036dd4c946783922851eaeac6f5703410ca7b6
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-4d8d121ecafb73581b6ddbbe1b980ce89d522cb4
      - name: Require the exact prepared Mac cache
        env:
          OBSERVED_CACHE_KEY: ${{ steps.build-cache.outputs.cache-matched-key }}
        shell: python
        run: |
          import os
          assert os.environ['OBSERVED_CACHE_KEY'] == 'compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-4d8d121ecafb73581b6ddbbe1b980ce89d522cb4', 'the exact saved e0ff cache is required; no cold build was attempted'
      - name: Prepare the exact optimized compiler
        id: preparation
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='39036dd4c946783922851eaeac6f5703410ca7b6';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive={'macos_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit', 'pass/float/constructed_ieee_predicates_exit', 'pass/contracts/saved_call_case_guarantee_requires_exit', 'pass/contracts/completed_unit_call_post_case', 'pass/generics/omitted_data_binder_range_equation', 'pass/borrows/runtime_case_descriptor_retirement_exit', 'pass/contracts/nested_case_guarantee_disjunction_exit')}[target];negative=('fail/arithmetic/composite_bound_arrival_unbounded_predecessor', 'fail/borrows/private_arrival_default_domain_weak_bound', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/ownership/whole_borrowed_missing_repair', 'fail/generics/generic_carrier_equation_mismatch', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority', 'fail/float/constructed_ieee_unknown_nan', 'fail/float/mathematical_generic_ieee_equality_requires_non_nan', 'fail/float/public_class_contract_ieee_equality_retains_zero_sign', 'fail/contracts/executable_float_box_equality_not_identity', 'fail/contracts/saved_call_case_guarantee_replaced_by_call', 'fail/proofs/runtime_case_guarantee_wrong_return', 'fail/proofs/selected_case_equality_does_not_establish_membership', 'fail/cases/nested_payload_read_after_case_replacement', 'fail/contracts/nested_case_guarantee_unselected_sibling')
          output=root/'build/compiler-pilot/single-pass-term-identity-host'
          output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':driver,'target':target},indent=2)+'\n')
          import build_slot,hashlib,re,shutil,signal,subprocess,time
          with build_slot.hold(root,timeout=900):
              preparation_status=compiler_pilot.run_suite('compiler-pilot/single-pass-term-identity-host',positive,negative,phase='prepare')
              if preparation_status:raise SystemExit(preparation_status)
              scopes=[('term-identity','term_identity::resolution_payload_tests',2),('resolution-queries','resolution_queries::tests',19),('stored-values','stored_values::tests',6)]
              aggregate={'source':source,'driver':driver,'expected_existing_tests':27,'no_new_tests':True,'scopes':[],'passed':False}
              all_began=time.monotonic()
              for label,filter_text,expected in scopes:
                  command=(['mbx','nextest','run','-p','validation','-E','test('+filter_text+')'] if shutil.which('mbx') else ['cargo','test','-p','validation','--lib',filter_text])
                  began=time.monotonic();test={'source':source,'driver':driver,'command':command,'filter':filter_text,'expected_existing_tests':expected,'no_new_tests':True,'started':True};process=None
                  def stop_test_process():
                      if process is None or process.poll() is not None:return
                      os.killpg(process.pid,signal.SIGTERM)
                      try:process.wait(timeout=5)
                      except subprocess.TimeoutExpired:os.killpg(process.pid,signal.SIGKILL);process.wait(timeout=5)
                  stdout_name=label+'-tests.stdout';stderr_name=label+'-tests.stderr'
                  try:
                      with (output/stdout_name).open('wb') as stdout,(output/stderr_name).open('wb') as stderr:
                          process=subprocess.Popen(command,cwd=root,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,start_new_session=True)
                          test['exit']=process.wait(timeout=1200)
                      output_text=(output/stdout_name).read_text(errors='replace')+(output/stderr_name).read_text(errors='replace')
                      test['existing_test_count_confirmed']=bool(re.search(r'test result: ok[.] '+str(expected)+r' passed; 0 failed|'+str(expected)+r' tests run: '+str(expected)+r' passed',output_text))
                      test['passed']=test['exit']==0 and test['existing_test_count_confirmed']
                  except Exception as error:
                      test['passed']=False;test['error']=str(error)
                  finally:
                      stop_test_process()
                      test['seconds']=round(time.monotonic()-began,3)
                      test['channels']={name:{'bytes':(output/name).stat().st_size,'sha256':hashlib.sha256((output/name).read_bytes()).hexdigest()} for name in [stdout_name,stderr_name] if (output/name).exists()}
                      aggregate['scopes'].append(test)
                      aggregate['seconds']=round(time.monotonic()-all_began,3)
                      aggregate['passed']=len(aggregate['scopes'])==3 and all(item['passed'] for item in aggregate['scopes'])
                      (output/'term-comparison-tests.json').write_text(json.dumps(aggregate,indent=2)+'\n')
                  if not test['passed']:break
              producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
              raise SystemExit(0 if aggregate['passed'] else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-single-pass-term-identity-preparation-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/single-pass-term-identity-host/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.preparation.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Observe the original customers and case controls
        if: ${{ !cancelled() && steps.preparation.outcome == 'success' }}
        shell: bash
        run: |
          python - <<'OBSERVE'
          from pathlib import Path
          import json,os,sys
          root=Path.cwd();sys.path[:0]=[str(root/'tools/ci'),str(root/'tools')]
          import compiler_pilot
          source='39036dd4c946783922851eaeac6f5703410ca7b6';driver=os.environ['GITHUB_SHA'];target=os.environ['NATIVE_HOST']
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source and not compiler_pilot.command(['git','status','--porcelain'])
          assert compiler_pilot.corpus_gate.host_target()==target
          assert os.environ['OMEGA_CORPUS_JOBS']=='1' and os.environ['OMEGA_CORPUS_FIXTURE_SECS']=='120' and not os.environ.get('OMEGA_PHASE_PROFILE')
          os.environ['GITHUB_SHA']=source
          positive={'macos_arm64': ('pass/generics/runtime_generic_carrier_equation_exit', 'pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/arithmetic/runtime_composite_bound_arrivals_exit', 'pass/core/aggregate_snapshot_copy_exit', 'pass/float/constructed_ieee_predicates_exit', 'pass/contracts/saved_call_case_guarantee_requires_exit', 'pass/contracts/completed_unit_call_post_case', 'pass/generics/omitted_data_binder_range_equation', 'pass/borrows/runtime_case_descriptor_retirement_exit', 'pass/contracts/nested_case_guarantee_disjunction_exit')}[target];negative=('fail/arithmetic/composite_bound_arrival_unbounded_predecessor', 'fail/borrows/private_arrival_default_domain_weak_bound', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/ownership/whole_borrowed_missing_repair', 'fail/generics/generic_carrier_equation_mismatch', 'fail/data/constructor_distinct_field_versions', 'fail/data/constructor_prior_operand_write', 'fail/borrows/empty_array_snapshot_requires_read_authority', 'fail/float/constructed_ieee_unknown_nan', 'fail/float/mathematical_generic_ieee_equality_requires_non_nan', 'fail/float/public_class_contract_ieee_equality_retains_zero_sign', 'fail/contracts/executable_float_box_equality_not_identity', 'fail/contracts/saved_call_case_guarantee_replaced_by_call', 'fail/proofs/runtime_case_guarantee_wrong_return', 'fail/proofs/selected_case_equality_does_not_establish_membership', 'fail/cases/nested_payload_read_after_case_replacement', 'fail/contracts/nested_case_guarantee_unselected_sibling')
          output=root/'build/compiler-pilot/single-pass-term-identity-host'
          prepared=json.loads((output/'preparation.json').read_text())
          assert prepared['passed'] and prepared['candidate']==source and prepared['target']==target
          assert json.loads((output/'driver.json').read_text())=={'source':source,'driver':driver,'target':target}
          producer=compiler_pilot.load_producer(output/'producer.json');producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/single-pass-term-identity-observations',positive,negative,producer=producer)
          producer.verify();observed=root/'build/compiler-pilot/single-pass-term-identity-observations'
          latency=all(row['millis']<=120000 for name in ['checking.json','both.json'] for row in json.loads((observed/name).read_text())['observations']) if all((observed/name).exists() for name in ['checking.json','both.json']) else False
          (observed/'scope.json').write_text(json.dumps({'source':source,'driver':driver,'target':target,'producer':producer.record(),'positive':positive,'negative':negative,'suite_exit':status,'latency_within_original_limit':latency,'passed':status==0 and latency,'limits':'Original 120-second Source/BOTH limits; one worker; profiling off. Checking complete term comparisons with the same frozen controls. Historical f006 and stock failures retain their exact identities; no earlier SDK/ordinary/host results are relabeled.'},indent=2)+'\n')
          raise SystemExit(0 if status==0 and latency else 1)
          OBSERVE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-single-pass-term-identity-observations-${{ matrix.host }}-${{ github.run_id }}
          path: build/compiler-pilot/single-pass-term-identity-observations/
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
