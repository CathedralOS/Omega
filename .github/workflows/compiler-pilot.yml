name: Compiler queue pilot

on: workflow_dispatch

permissions:
  contents: read
  actions: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      OMEGA_COMPILER_CHECK_SITES: '1'
      OMEGA_PHASE_PROFILE: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Provision the stack observer
        run: |
          for observer in lldb lldb-18 lldb-19 lldb-20; do
            if command -v "$observer"; then
              exit 0
            fi
          done
          timeout 60s sudo apt-get install --no-install-recommends --yes lldb-18
      - name: Authenticate the original compiler and observe one source check
        run: python tools/ci/observe_retained_provider.py
      - name: Retain actual observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-provider-stack-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-probe/
            !build/compiler-probe/producer/**
            !build/compiler-probe/*.zip
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
