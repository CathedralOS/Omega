          import os
          assert os.environ['OBSERVED_CACHE_KEY'] == 'compiler-regression-macos15-macOS-ARM64-7135618a4bfe730430fbfc3d26f5b93b503943b2d582e8596952657b4775c4f5-e6b0d4543384250358d0891c3ff5532faa37ccf0', 'the exact saved 1831 cache is required; no cold build was attempted'
