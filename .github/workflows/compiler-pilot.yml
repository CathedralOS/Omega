name: Check the current Stable field migration
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  RUST_MIN_STACK: '67108864'
  OMEGA_CORPUS_JOBS: '1'
  OMEGA_CORPUS_FIXTURE_SECS: '120'
jobs:
  original:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retain the exact historical compiler source
        run: git fetch --no-tags --depth=1 origin dfb79c300aae3917c2681b51c319f58741f2664c:refs/qualification-evidence/placed-stable-original-producer
      - name: Authenticate the immutable producer and check only the current pair
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/run_placed_stable_source_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: placed-stable-unified-source-linux-${{ github.run_id }}
          path: |
            build/placed-stable-unified-source-acquisition/
            build/placed-stable-unified-source-probe/
          include-hidden-files: true
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
