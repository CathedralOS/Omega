name: Check the provider application roles
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
      OMEGA_SDK_SOURCE: 69ec9f80599b6dc0a38cb7c555545895eb2810b1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 69ec9f80599b6dc0a38cb7c555545895eb2810b1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: build-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Check and execute the retained provider programs
        run: |
          python3 - <<'SDK'
          from pathlib import Path
          import json,os,sys,time,subprocess,shutil,hashlib
          sys.path.insert(0,str(Path.cwd()/'tools/ci'))
          sys.path.insert(0,str(Path.cwd()/'tools'))
          import build_slot
          import compiler_pilot
          """Check the exact application-role repair through the existing compiler pilot."""
          source='69ec9f80599b6dc0a38cb7c555545895eb2810b1'
          assert compiler_pilot.command(['git','rev-parse','HEAD'])==source
          assert not compiler_pilot.command(['git','status','--porcelain'])
          output=Path('build/compiler-pilot/selected-execution');output.mkdir(parents=True,exist_ok=False)
          (output/'driver.json').write_text(json.dumps({'source':source,'driver':os.environ['GITHUB_SHA']},indent=2)+'\n')
          os.environ['GITHUB_SHA']=source
          unit_results=[]
          with build_slot.hold(Path.cwd()):
              producer=compiler_pilot.prepare_producer(output)
              test_requests=[
                  ('backend-plan','target_providers::tests'),
                  ('terminal-codec','numeric_intrinsic_tests'),
                  ('register-homes','normal_qualification_tests'),
                  ('register-homes','codec::tests::golden'),
              ]
              for index,(package,selected_tests) in enumerate(test_requests):
                  if shutil.which('mbx'):
                      arguments=['mbx','nextest','run','--locked','-p',package,'--lib',selected_tests]
                  else:
                      arguments=['cargo','test','--locked','-p',package,'--lib',selected_tests]
                  row={'package':package,'filter':selected_tests,'command':arguments,'source':source}
                  started=time.monotonic()
                  paths={suffix:output/('rust-'+str(index)+'.'+suffix) for suffix in ['stdout','stderr']}
                  try:
                      with paths['stdout'].open('wb') as stdout,paths['stderr'].open('wb') as stderr:
                          result=subprocess.run(arguments,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,timeout=600)
                      row['exit']=result.returncode
                  except subprocess.TimeoutExpired:
                      row.update(exit=None,error='Existing affected Rust test request timed out; raw channels remain.')
                  row['seconds']=round(time.monotonic()-started,3)
                  row['channels']={suffix:{'path':path.name,'sha256':hashlib.sha256(path.read_bytes()).hexdigest()} for suffix,path in paths.items()}
                  row['passed']=row['exit']==0
                  unit_results.append(row)
                  (output/'rust-tests.json').write_text(json.dumps(unit_results,indent=2)+'\n')
          producer.verify()
          status=compiler_pilot.run_suite('compiler-pilot/integrated-controls',('pass/traits/named_contract_arithmetic_refinement', 'pass/traits/float_contract_refinement_boundaries_exit', 'pass/providers/inline_member_generic_requirement_exit', 'pass/providers/generic_required_instance_roster_exit', 'pass/providers/canonical_inherited_provider_instances_exit', 'pass/providers/occurrence_region_binding_forwarding_exit', 'pass/ownership/runtime_whole_borrowed_transform_exit', 'pass/build/provider_applied_static_capture_exit'),('fail/proofs/quotient_representative_admitted_closure_rejected', 'fail/traits/inline_requirement_inherited_false_ensures', 'fail/traits/member_omits_requirement_ensures', 'fail/providers/provider_type_slot_unknown', 'fail/traits/exact_application_keeps_parameter_types', 'fail/providers/inline_member_sibling_requirement_rejected', 'fail/providers/occurrence_region_binding_conflicting_inputs', 'fail/build/float_default_wrong_value', 'fail/packages/rootless_numeric_provider_missing_satisfaction', 'fail/traits/conformance_reference_row_retired', 'fail/contracts/mutable_owned_call_ensures_keeps_poststate', 'fail/references/rebound_parameter_reference_drops_referent_bound', 'fail/ownership/whole_borrowed_missing_repair', 'fail/ownership/whole_linear_parent_move_keeps_unique_custody', 'fail/borrows/whole_referent_store_through_shared_loan', 'fail/traits/ordinary_selection_name_missing_conformance_region', 'fail/traits/explicit_implementation_missing_const_argument', 'fail/build/provider_structural_type_application_conflict', 'fail/providers/inherited_provider_phantom_arguments'),checking_only=('pass/packages/rootless_numeric_provider_review',),producer=producer)
          summary=json.loads(Path('build/compiler-pilot/integrated-controls/summary.json').read_text())
          if not summary.get('source_exports') or not any(stage['name']=='retain measured source' and stage['passed'] for stage in summary['stages']):
              raise ValueError('Current-source export is incomplete; later observations cannot claim its custody')
          rows=[]
          for index,fixture in enumerate(['pass/traits/named_contract_arithmetic_refinement', 'pass/traits/float_contract_refinement_boundaries_exit', 'pass/providers/inline_member_generic_requirement_exit', 'pass/providers/occurrence_region_binding_forwarding_exit', 'pass/borrows/runtime_aliased_record_byte_field_window_exit', 'pass/borrows/runtime_reference_aggregate_alias_replacement_exit']):
              producer.verify()
              row=compiler_pilot.ordinary_cli_fixture.observe(Path.cwd(),producer,fixture,(Path.cwd()/'build/compiler-pilot/ordinary'/str(index)).resolve())
              rows.append(row)
              (output/'ordinary.json').write_text(json.dumps(rows,indent=2)+'\n')
          producer.verify()
          report={'source':source,'producer':producer.record(),'source_exports':summary['source_exports'],'source_suite_exit':status,'ordinary':[{k:r.get(k) for k in ['fixture','passed','error','native_exit','terminal_exit']} for r in rows],'rust_tests':unit_results,'passed':status==0 and all(r['passed'] for r in rows) and all(r['passed'] for r in unit_results)}
          (output/'scope.json').write_text(json.dumps(report,indent=2)+'\n')
          raise SystemExit(0 if report['passed'] else 1)
          SDK
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: core-float-application-roles-${{ github.run_id }}
          path: build/compiler-pilot/
          retention-days: 30
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
