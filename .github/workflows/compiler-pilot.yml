name: Check existing resolver metadata and storage history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      CARGO_TARGET_DIR: /tmp/ot
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 3c9baa41cf28298c08857767660823675a941180
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/ot
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-
      - name: Run seven existing metadata and storage-history tests
        shell: bash
        run: |
          python3 - <<'TESTS'
          from pathlib import Path
          import json,os,shutil,subprocess,sys,time
          sys.path.insert(0,'tools')
          import build_slot,corpus_gate
          root=Path.cwd();out=root/'build/resolver-tests-fixed-history';out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')=='3c9baa41cf28298c08857767660823675a941180' and git('rev-parse','HEAD^{tree}')=='d11a81f866bd2b968f65a7635f4e8cb85cf59969' and not git('status','--porcelain')
          origin=dict(source=git('rev-parse','HEAD'),tree=git('rev-parse','HEAD^{tree}'),driver=os.environ['GITHUB_SHA'],toolchain=subprocess.check_output(['rustc','-Vv'],text=True),builds_cli=False,tests='Seven existing Rust IR/metadata tests only; no Omega source compiler/runner invocation')
          (out/'origin.json').write_text(json.dumps(origin,indent=2)+'\n')
          filters=['resolution_payload_tests','completed_queries_keep_full_authority_depth_and_premise_context','bucket_collisions_preserve_capture_proofs_and_recurrence_inputs','static_selection_landings_','completed_observation_of_incoming_storage_survives_only_preserved_cuts']
          records=[]
          with build_slot.hold(root):
              for index,selection in enumerate(filters):
                  command=['mbx','nextest','run','--locked','-p','validation',selection] if shutil.which('mbx') else ['cargo','test','--locked','-p','validation','--lib',selection,'--','--nocapture']
                  started=time.monotonic()
                  with (out/(str(index)+'.stdout')).open('wb') as stdout,(out/(str(index)+'.stderr')).open('wb') as stderr:
                      result=subprocess.run(command,stdin=subprocess.DEVNULL,stdout=stdout,stderr=stderr,env=corpus_gate.optimized_environment())
                  records.append(dict(filter=selection,command=command,exit=result.returncode,seconds=round(time.monotonic()-started,3)))
                  (out/'tests.json').write_text(json.dumps(records,indent=2)+'\n');print(records[-1],flush=True)
                  assert git('rev-parse','HEAD')=='3c9baa41cf28298c08857767660823675a941180' and not git('status','--porcelain')
                  if result.returncode:raise SystemExit(result.returncode)
          TESTS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: resolver-tests-fixed-history-${{ github.run_id }}
          path: build/resolver-tests-fixed-history/
          if-no-files-found: warn
          retention-days: 7
