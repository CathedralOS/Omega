name: Sample shared atomic Source checking with the repaired retained compiler
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
      OMEGA_CORPUS_JOBS: '1'
      OMEGA_PHASE_PROFILE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2378f5416fadc3bfb01486715da88950a5690f08
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install debugger in the temporary measurement runner
        run: sudo apt-get -qq update && sudo apt-get -qq install -y gdb
      - name: Authenticate the retained compiler and observe the unchanged shared atomic receiver
        shell: bash
        run: |
          python3 - <<'REPLAY'
          from pathlib import Path
          from types import SimpleNamespace
          import hashlib,json,os,subprocess,sys
          settings={'label': 'atomic-shared-receiver-source-samples',
           'target': 'linux_x86_64',
           'run': 41983446417,
           'artifact': 'compiler-pilot-linux_x86_64-2378f5416fadc3bfb01486715da88950a5690f08-1',
           'artifact_id': 13395831333,
           'artifact_bytes': 479147194,
           'artifact_digest': 'sha256:7e624bd547a8f82ea0b957c857887c4abd84d90166a28b4e42a717b10b2179ae',
           'producer_source': '2378f5416fadc3bfb01486715da88950a5690f08',
           'producer_tree': '6821ce6ff701255fcfa549bce6c0d722e049a171',
           'program_source': '2378f5416fadc3bfb01486715da88950a5690f08',
           'program_tree': '6821ce6ff701255fcfa549bce6c0d722e049a171',
           'original_producer': {'revision': '2378f5416fadc3bfb01486715da88950a5690f08',
                                 'tree': '6821ce6ff701255fcfa549bce6c0d722e049a171',
                                 'target': 'linux_x86_64',
                                 'toolchain': 'rustc 1.100.0-nightly (a69a63265 2026-09-03)\n'
                                              'binary: rustc\n'
                                              'commit-hash: a69a63265cfd9e006d43137f98301b8d274ad4c9\n'
                                              'commit-date: 2026-09-03\n'
                                              'host: x86_64-unknown-linux-gnu\n'
                                              'release: 1.100.0-nightly\n'
                                              'LLVM version: 23.1.1',
                                 'cli': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-1xunqn7e/omega',
                                 'runner': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-1xunqn7e/corpus_runner',
                                 'cli_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-1xunqn7e/omega',
                                                 'sha256': 'e71000555e4c19e316ea1aa36ed86e5f313366b37790a93bf81230dfe98e798a',
                                                 'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                             'opt_level': '1'}},
                                 'runner_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-1xunqn7e/corpus_runner',
                                                    'sha256': '16d34e4affed99af0022b5872ea4af3b5258a58cc21ce613d6b220f13e432896',
                                                    'profile': {'schema': 'omega-compiler-build-profile-v1',
                                                                'opt_level': '1'}}},
           'objects': {'omega-rust': '6e5c4c9083a513545aa9bd34112be544c95c6be0',
                       'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                       'tools': '100230e60fd4bf00878ca558cfe8a783b0573a3d',
                       '.github': 'd2ef5af85b2b48201529a91d65f25782327d18d7',
                       'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                       'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                       'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'program_objects': {'omega-rust': '6e5c4c9083a513545aa9bd34112be544c95c6be0',
                               'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                               'tools': '100230e60fd4bf00878ca558cfe8a783b0573a3d',
                               '.github': 'd2ef5af85b2b48201529a91d65f25782327d18d7',
                               'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                               'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                               'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929'},
           'baseline': False,
           'input_hashes': {'tests/omega/pass/atomics/shared_receiver_atomic_store/README.md': 'fa96ded59762fdbe188856d60f57b1cecf1d46716b9f902d9ea8a08ed123fb77',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/build.omg': '886d82f6dd6a57006a8b3a449fa1221f3e93abf43c0898ef6bac34b09ad9eded',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0',
                            'tests/omega/pass/atomics/shared_receiver_atomic_store/main.omg': '9ce411bd197a6ca04c1d38cea62a09c3f07561d8e31b23d1c32c5c3915b4e551'},
           'fixtures': ['pass/atomics/shared_receiver_atomic_store'],
           'samples': [],
           'sample_roles': {},
           'meaning': 'Diagnostic-only Source stack samples every5s through115s within unchanged120s cap '
                      'after exact c1/2378 borrowed metadata traversal. Failed qualification41983446417 '
                      'remains failed; verified prepared opt1 CLI/runner reused. Same program and library '
                      'bytes; no Rust build/semantic edit/engine acceptance/speed claim.',
           'producer_driver': '2378f5416fadc3bfb01486715da88950a5690f08',
           'replay_inputs': {'omega-rust': '6e5c4c9083a513545aa9bd34112be544c95c6be0',
                             'source/library': 'e3e1296eab03464c3ca08a0c419c76e25c24ec6a',
                             'source/psi': '400feb4e6c0c556f0fd5d6b44043e92f93d7f30c',
                             'source/omega': '96169168741fcd8265771a647ba3bfadd2bc7e8c',
                             'bootstrap': 'cfb29e665d301b5ad7dabdb8cb16177c164ab035',
                             'tools/benchmark': '6c1a4399e3f037c808a23ad59825e76664482e2f',
                             'Cargo.toml': '2699e0a8d0be49c789639cbd3c603521634145d9',
                             'Cargo.lock': 'b9590ac649fdf234e519f0197a05372d3fe65df5',
                             'rust-toolchain.toml': '34677fc928123970d13e8b81641724e2a9e6f929',
                             '.cargo': None}}
          root=Path.cwd();out=root/'build'/settings['label'];out.mkdir(parents=True,exist_ok=True)
          def git(*args):return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD')==settings['program_source']
          assert git('rev-parse','HEAD^{tree}')==settings['program_tree']
          assert not git('status','--porcelain')
          subprocess.run(['git','fetch','--no-tags','--depth=1','origin',settings['producer_source']],check=True)
          objects={p:git('rev-parse',settings['producer_source']+':'+p) for p in settings['objects']}
          assert objects==settings['objects']
          for p,expected in settings['program_objects'].items():assert git('rev-parse','HEAD:'+p)==expected
          run=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/runs/'+str(settings['run'])],text=True))
          assert run['head_sha']==settings['producer_driver'] and run['status']=='completed'
          artifact=json.loads(subprocess.check_output(['gh','api','repos/CathedralOS/Omega/actions/artifacts/'+str(settings['artifact_id'])],text=True))
          assert artifact['name']==settings['artifact'] and artifact['size_in_bytes']==settings['artifact_bytes'] and artifact['digest']==settings['artifact_digest'] and not artifact['expired']
          assert artifact['workflow_run']['id']==settings['run'] and artifact['workflow_run']['head_sha']==settings['producer_driver']
          retained=out/'retained';subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          producer_parent=Path(settings['original_producer']['cli']).parent.name
          records=[retained/producer_parent/'producer.json'];assert records[0].is_file()
          original=json.loads(records[0].read_text());assert original==settings['original_producer']
          donor_summary=json.loads((retained/'preparation.json').read_text())
          assert donor_summary['candidate']==settings['producer_source'] and donor_summary['target']==settings['target'] and donor_summary['producer']==original
          for kind in ['cli','runner']:
              name=Path(original[kind]).name+'.verified-profile.json'
              saved=json.loads((records[0].parent/name).read_text())
              assert saved['source_revision']==settings['producer_source'] and saved['source_tree']==settings['producer_tree'] and saved['observation']==original[kind+'_profile']
          assert original['revision']==settings['producer_source'] and original['tree']==settings['producer_tree'] and original['target']==settings['target']
          sys.path.insert(0,'tools/ci');import compiler_pilot,platform
          assert compiler_pilot.corpus_gate.host_target()==settings['target']
          compiler_pilot.compiler_replay_plan.check_inputs(root,settings['producer_source'],settings['replay_inputs'])
          compiler_pilot.compiler_replay_plan.check_inputs(root,settings['program_source'],settings['replay_inputs'])
          cli=(records[0].parent/Path(original['cli']).name).resolve();runner=(records[0].parent/Path(original['runner']).name).resolve()
          for p in [cli,runner]:p.chmod(0o755)
          tracked=sorted(set(settings['input_hashes']) | set(subprocess.check_output(['git','ls-files','source/library'],text=True).splitlines()))
          inputs={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in tracked}
          for p,h in settings['input_hashes'].items():assert inputs[p]==h,p
          actual_profiles={key:compiler_pilot.corpus_gate.require_optimized(binary) for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]}
          def profile_identity(profile):
              identity={k:v for k,v in profile.items() if k!='binary'}
              if isinstance(identity.get('build_receipt'),dict):
                  identity['build_receipt']={k:v for k,v in identity['build_receipt'].items() if k!='path'}
              return identity
          for key,observed in actual_profiles.items():
              assert profile_identity(observed)==profile_identity(original[key])
          def verify():
              assert git('rev-parse','HEAD')==settings['program_source'] and not git('status','--porcelain')
              for binary,key in [(cli,'cli_profile'),(runner,'runner_profile')]:assert compiler_pilot.corpus_gate.require_optimized(binary)==actual_profiles[key]
              for p,h in inputs.items():assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==h,p
          verify()
          producer=compiler_pilot.CompilerProducer(original['revision'],original['tree'],original['target'],original['toolchain'],cli,runner,actual_profiles['cli_profile'],actual_profiles['runner_profile'],settings['program_source'],settings['replay_inputs'],dict(run=settings['run'],driver=settings['producer_driver'],transport='authenticated original producer artifact'))
          (out/'retained-origin.json').write_text(json.dumps({'settings':settings,'driver':os.environ['GITHUB_SHA'],'program_source':settings['program_source'],'original_producer':original,'original_run_conclusion':run['conclusion'],'artifact':artifact,'actual_cli':str(cli),'actual_runner':str(runner),'actual_profiles':actual_profiles,'host':{'system':platform.system(),'machine':platform.machine(),'version':platform.version()},'inputs':inputs,'builds_rust':False},indent=2)+'\n')
          import shutil,time,threading,signal,gzip
          cache=(out/'diagnostic-cache').resolve();cache.mkdir()
          assert shutil.which('gdb')
          env=dict(os.environ,OMEGA_LIBRARY_ROOT=str(root/'source/library'),XDG_CACHE_HOME=str(cache),OMEGA_CORPUS_ROOT=str(root),OMEGA_CORPUS_FIXTURE_FILTER=settings['fixtures'][0],OMEGA_CORPUS_FIXTURE_SECS='120',OMEGA_CORPUS_JOBS='1',OMEGA_CORPUS_RECORDS=str((out/'source.records.txt').resolve()),OMEGA_CORPUS_SWEEP='1')
          for name in ['NEXTEST','OMEGA_CORPUS_NATIVE','OMEGA_CORPUS_INTERPRETED','OMEGA_CORPUS_NATIVE_TARGET']:env.pop(name,None)
          delays=list(range(5,116,5))
          command=['gdb','--batch','-nx','--quiet','-ex','set disable-randomization off','-ex','set debuginfod enabled off','-ex','set print thread-events off','-ex','set pagination off','-ex','set confirm off','-ex','run']
          for position in range(len(delays)):
              command+=['-ex','thread apply all bt 12','-ex','continue' if position+1<len(delays) else 'quit']
          command+=['--args',str(runner)]
          record=dict(sampling_only=True,qualification=False,driver=os.environ['GITHUB_SHA'],compiled_source=settings['producer_source'],program_source=settings['program_source'],producer=producer.record(),fixture=settings['fixtures'][0],inputs=inputs,command=command,timeout_seconds=120,sample_delays_seconds=delays,observations=[],note='Cold checked-leg runner samples only; Last snapshot deliberately ends compilation before120s; repeated wall snapshots are not exact CPU-share measurements. No verdict/engine/performance comparison.')
          (out/'source-samples-observation.json').write_text(json.dumps(record,indent=2)+'\n')
          started=time.monotonic();timers=[];interrupts=[]
          decoded_digest=hashlib.sha256();decoded_size=[0]
          with (out/'source-samples.stderr').open('wb') as stderr:
              process=subprocess.Popen(command,cwd=root,env=env,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=stderr,start_new_session=True)
              def save_stdout():
                  with gzip.open(out/'source-samples.stdout.gz','wb') as saved:
                      while True:
                          chunk=process.stdout.read(65536)
                          if not chunk:break
                          saved.write(chunk);decoded_digest.update(chunk);decoded_size[0]+=len(chunk)
              reader=threading.Thread(target=save_stdout);reader.start()
              def interrupt():
                  if process.poll() is None:
                      interrupts.append(round(time.monotonic()-started,3))
                      try:os.kill(process.pid,signal.SIGINT)
                      except ProcessLookupError:pass
              try:
                  for delay in record['sample_delays_seconds']:
                      timer=threading.Timer(delay,interrupt);timer.start();timers.append(timer)
                  record['debugger_exit']=process.wait(timeout=120)
              except subprocess.TimeoutExpired:
                  record['timed_out']=True;os.killpg(process.pid,signal.SIGKILL);process.wait()
              finally:
                  for timer in timers:timer.cancel()
                  record['seconds']=round(time.monotonic()-started,3);record['actual_interrupts_seconds']=interrupts
          reader.join(timeout=20);assert not reader.is_alive()
          assert decoded_size[0]<128*1024*1024
          record['decoded_stdout_bytes']=decoded_size[0];record['decoded_stdout_sha256']=decoded_digest.hexdigest()
          record['compressed_stdout_sha256']=hashlib.sha256((out/'source-samples.stdout.gz').read_bytes()).hexdigest()
          verify();record['profiles_verified_after']=True
          (out/'source-samples-observation.json').write_text(json.dumps(record,indent=2)+'\n');print('Sampling complete; no fixture verdict.',record['seconds'],flush=True)
          REPLAY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-shared-receiver-source-samples-${{ github.run_id }}
          path: |
            build/atomic-shared-receiver-source-samples/
            !build/atomic-shared-receiver-source-samples/retained/**
            !build/atomic-shared-receiver-source-samples/workspace/**
            !build/atomic-shared-receiver-source-samples/diagnostic-cache/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
