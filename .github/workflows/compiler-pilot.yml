name: Atomic width checking stack sample
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 417a79072379c23b3301bdbd1e6a6694d3223e73
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install debugger in the temporary measurement runner
        run: sudo apt-get -qq update && sudo apt-get -qq install -y gdb
      - name: Measure existing retained producer without building Rust
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys,time,signal,threading,shutil
          settings={'source': '417a79072379c23b3301bdbd1e6a6694d3223e73', 'tree': 'a56a6cbd57b3b3c40c74b08b2b8365eb504e22e2', 'run': 41801734130, 'artifact': 'compiler-pilot-linux_x86_64-417a79072379c23b3301bdbd1e6a6694d3223e73-1', 'runner_sha256': '2e26cdded74e027a2832921839661969996127341efa45ef16642691440a7d8a', 'original_profile': {'binary': '/home/runner/work/Omega/Omega/build/compiler-pilot/producer-n7mahyem/corpus_runner', 'sha256': '2e26cdded74e027a2832921839661969996127341efa45ef16642691440a7d8a', 'profile': {'schema': 'omega-compiler-build-profile-v1', 'opt_level': '1'}}, 'fixtures': ['pass/atomics/runtime_atomic_bitwise_widths_exit'], 'inputs': {'tests/omega/pass/atomics/runtime_atomic_bitwise_widths_exit/build.omg': '783e348f53c2ff3e002aaf889487ec79f2d6e68e5d00c7ba2f009067d49e140e', 'tests/omega/pass/atomics/runtime_atomic_bitwise_widths_exit/expected_native_exit.txt': '6442bc26a7c562f5afe6467dab36365c709909f6a81afcecfc0c25cff0f1bab0', 'tests/omega/pass/atomics/runtime_atomic_bitwise_widths_exit/main.omg': '14d46ddae04208e684ce591c9d26ed91655521354a2a062676cc959c932efd0c'}}
          out=Path('build/atomic-widths-capability-profile'); out.mkdir(parents=True,exist_ok=True)
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==settings['source']
          assert subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()==settings['tree']
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          for name,digest in settings['inputs'].items(): assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          retained=Path('build/retained-widths-capability-producer')
          subprocess.run(['gh','run','download',str(settings['run']),'--name',settings['artifact'],'--dir',str(retained)],check=True)
          runners=list(retained.glob('**/corpus_runner')); assert len(runners)==1
          runner=runners[0].resolve(); runner.chmod(0o755)
          sys.path.insert(0,'tools'); import corpus_gate
          profile=corpus_gate.require_optimized(runner)
          assert profile['sha256']==settings['runner_sha256'] and profile['profile']['opt_level']=='1'
          (out/'producer.json').write_text(json.dumps(dict(settings=settings,actual_profile=profile,platform=platform.platform(),cpu=Path('/proc/cpuinfo').read_text()),indent=2)+'\n')
          rows=[]
          for fixture in settings['fixtures']:
           name=fixture.rsplit('/',1)[1]; cache=(out/('cache-'+name)).resolve(); assert not cache.exists(); cache.mkdir()
           env=dict(os.environ,OMEGA_CORPUS_JOBS='1',OMEGA_PHASE_PROFILE='0',XDG_CACHE_HOME=str(cache),OMEGA_CORPUS_ROOT=str(Path.cwd()),OMEGA_LIBRARY_ROOT=str(Path('source/library').resolve()),OMEGA_CORPUS_FIXTURE_FILTER=fixture,OMEGA_CORPUS_RECORDS=str((out/(name+'.records.txt')).resolve()))
           env.pop('NEXTEST',None)
           assert shutil.which('gdb'), 'The hosted image has no gdb; no permission or package change is made.'
           command=['gdb','--batch','-nx','--quiet','-ex','set disable-randomization off','-ex','set debuginfod enabled off','-ex','set print thread-events off','-ex','set pagination off','-ex','set confirm off','-ex','run','-ex','thread apply all bt 36','-ex','continue','-ex','thread apply all bt 36','-ex','quit','--args',str(runner)]
           start=time.monotonic()
           with (out/(name+'.stdout')).open('w') as stdout,(out/(name+'.stderr')).open('w') as stderr:
            process=subprocess.Popen(command,env=env,stdout=stdout,stderr=stderr)
            timers=[threading.Timer(delay,lambda:os.kill(process.pid,signal.SIGINT)) for delay in (95,115)]
            for timer in timers: timer.start()
            result_code=process.wait(timeout=180)
            for timer in timers: timer.cancel()
           row=dict(fixture=fixture,command=command,exit=result_code,seconds=time.monotonic()-start,source=settings['source'],cache=str(cache),workers=1,fixture_timeout_seconds=120)
           row['sampling_only']=True
           row['observations']=[]
           row['sampling_note']='Debugger samples at 95 and 115 seconds, then ends the compile. This is not a fixture verdict or a test acceptance.'
           rows.append(row); (out/'observations.json').write_text(json.dumps(rows,indent=2)+'\n')
           print(fixture,'debugger exit',result_code,'seconds',round(row['seconds'],3),flush=True)
           assert corpus_gate.require_optimized(runner)==profile
           assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          print('Stack sampling does not establish a fixture outcome or acceptance.',flush=True)
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-widths-stack-417a-${{ github.run_id }}
          path: |
            build/atomic-widths-capability-profile/*.json
            build/atomic-widths-capability-profile/*.stdout
            build/atomic-widths-capability-profile/*.stderr
            build/atomic-widths-capability-profile/*.txt
