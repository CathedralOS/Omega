name: Compiler queue pilot

on:
  pull_request:
    branches: [integration-pilot]
  merge_group:
    branches: [integration-pilot]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      smoke:
        description: Also build executables and run the native/Terminal smoke (not admission)
        type: boolean
        default: false
      fixtures:
        description: Optional comma-separated exact pass/..., run/... and fail/... IDs; replaces smoke
        type: string
        default: ''
      checking_only:
        description: Check only the exact fixtures and rejection controls, without repeating runtime observations
        type: boolean
        default: false
      record_results:
        description: Record the selected corpus source checks for review, without changing the published golden
        type: boolean
        default: false
      compiler_diagnostics:
        description: Enable verbose compiler diagnostics for a focused run
        type: boolean
        default: false
      structural_trace:
        description: Include full ownership and state traces for a focused diagnostic run
        type: boolean
        default: false
      phase_profile:
        description: Record compiler phase timings for a focused attribution run
        type: boolean
        default: false
      samples:
        description: Optional comma-separated exact samples/cli/facts project paths (with descendants); replaces smoke
        type: string
        default: ''
      cli_fixtures:
        description: Optional exact pass/... or samples/cli/... normal-exit projects through ordinary CLI package review and both engines
        type: string
        default: ''
      build_consent:
        description: Run public source-produced Build consent and filesystem isolation controls
        type: boolean
        default: false
      build_count_checks:
        description: Temporary Build reuse and calling-policy qualification using a retained @plan
        type: boolean
        default: false
      native_host:
        description: Matching native host for manual executable observations
        type: choice
        options:
          - linux_x86_64
          - linux_arm64
          - windows_x86_64
          - macos_arm64
        default: linux_x86_64

permissions:
  contents: read

# A new PR revision supersedes its old check; merge-group checks keep running.
# Retained @plan requests run independently. Ordinary manual builds still share
# one revision and host group.
concurrency:
  group: compiler-pilot-${{ github.event_name == 'workflow_dispatch' && (startsWith(inputs.fixtures, '@') && github.run_id || github.sha) || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.native_host || 'linux_x86_64' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-pilot:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && fromJSON('{"linux_x86_64":"ubuntu-24.04","linux_arm64":"ubuntu-24.04-arm","windows_x86_64":"windows-2022","macos_arm64":"macos-15"}')[inputs.native_host] || 'ubuntu-24.04' }}
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && (inputs.native_host == 'windows_x86_64' && 120 || 60) || 30 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      # Large calling-policy checks use about 2.8 GiB each. Run one fixture
      # at a time to reduce concurrent memory pressure.
      OMEGA_CORPUS_JOBS: '1'
      RUST_MIN_STACK: '67108864'
      # Match Linux/macOS post-merge storage; Windows keeps its short target path.
      CARGO_TARGET_DIR: ${{ github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && 'D:/ot' || '/tmp/ot' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the gate's refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Test Build control evidence refusal paths
        run: python tools/tests/test_build_consent_controls.py -v
      - name: Validate the retained Build count request
        if: github.event_name == 'workflow_dispatch' && inputs.build_count_checks
        env:
          COUNTER_PLAN: ${{ inputs.fixtures }}
          COUNTER_HOST: ${{ inputs.native_host }}
        run: |
          python - <<'PYTEST'
          import os
          if not os.environ['COUNTER_PLAN'].startswith('@') or os.environ['COUNTER_HOST'] != 'linux_x86_64':
              raise SystemExit('Build count checks require Linux and an exact retained @plan')
          PYTEST
      - name: Validate exact fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_fixtures; import os; print(select_fixtures(os.environ['OMEGA_COMPILER_PILOT_FIXTURES']))"
      - name: Validate exact fact sample selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.samples != ''
        env:
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
        run: python -c "from tools.ci.compiler_pilot import select_samples; import os; print(select_samples(os.environ['OMEGA_COMPILER_PILOT_SAMPLES']))"
      - name: Validate exact ordinary CLI fixture selection before building
        if: github.event_name == 'workflow_dispatch' && inputs.cli_fixtures != ''
        env:
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
        run: python -c "from tools.ci.compiler_pilot import select_cli_fixtures; import os; print(select_cli_fixtures(os.environ['OMEGA_COMPILER_PILOT_CLI_FIXTURES']))"
      - name: Provision Windows rooted temporary directory for hosted applications
        if: github.event_name == 'workflow_dispatch' && inputs.native_host == 'windows_x86_64' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        run: python -c "from pathlib import Path; root = Path(Path.cwd().anchor) / 'tmp'; root.mkdir(exist_ok=True); print('Provisioned current-drive rooted temporary directory:', root)"
      - name: Select the retained compiler cache from its validated plan
        id: replay-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
        run: python -c "import os; from tools.ci import compiler_pilot; compiler_pilot.write_replay_cache_key(os.environ['OMEGA_COMPILER_PILOT_FIXTURES'], os.environ['GITHUB_OUTPUT'])"
      - name: Restore the exact retained compiler cache
        id: replay-build-cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.replay-cache.outputs.key }}
          fail-on-cache-miss: true
      - name: Refuse an absent or partial retained compiler cache
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.fixtures, '@') && steps.replay-build-cache.outputs.cache-hit != 'true'
        run: python -c "raise SystemExit('The exact retained compiler cache was not restored; no rebuild was attempted')"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: build-cache
        if: github.event_name != 'workflow_dispatch' || !startsWith(inputs.fixtures, '@')
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
            ${{ runner.os == 'Windows' && 'compiler-pilot' || runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the exact integration candidate
        id: compiler-check
        run: cargo check --locked -p omega
      - name: Prepare and retain the optimized producer
        id: producer-preparation
        if: github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
          OMEGA_COMPILER_PILOT_RECORD_RESULTS: ${{ inputs.record_results }}
        run: python tools/ci/compiler_pilot.py --phase prepare
      - name: Upload the prepared producer and build receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '')
        with:
          name: compiler-pilot-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # Save compiled objects before any program consumer can use the job budget.
      # A failed preparation still retains useful objects and keeps the job red.
      - name: Save build cache before fixture observations
        if: always() && !cancelled() && steps.compiler-check.outcome == 'success' && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Check Build execution counts for this qualification
        if: ${{ !cancelled() && inputs.build_count_checks && steps.producer-preparation.outcome == 'success' }}
        run: |
          python tools/build_slot.py -- python - <<'PYTEST'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from tools.ci import build_consent_controls as controls
          import compiler_profile
          output = Path('build/compiler-pilot/build-count-checks')
          output.mkdir(parents=True, exist_ok=True)
          report = dict(candidate=controls.git('rev-parse', 'HEAD'), passed=False, outcomes=[])
          binary = None
          units = None
          try:
              if controls.git('status', '--porcelain') or os.environ['GITHUB_SHA'] != report['candidate']:
                  raise ValueError('Build count checks require the clean exact source')
              binary, profile = controls.build(output, 'build_charge',
                  ['build', '--locked', '-p', 'compiler', '--example', 'build_charge'])
              report.update(cargo_profile=profile, reported_profile=compiler_profile.require_optimized(binary),
                  binary_sha256=hashlib.sha256(binary.read_bytes()).hexdigest(), target=controls.host_target())
              # These are existing assertion groups from the ordinary example.
              # Its passed prefix, one-shot mode and exact calling test have
              # retained source-bound observations; execute only its tail here.
              selectors = ['settled-product-contexts', 'anonymous-generator',
                  'default-context', 'owned-activations', 'source-inputs', 'accounting']
              for name in selectors:
                  arguments = ['--' + name]
                  row = dict(name=name, arguments=arguments, passed=False)
                  try:
                      controls.execute(binary, arguments, output, name)
                      row['passed'] = True
                  except subprocess.TimeoutExpired as error:
                      for stream in ('stdout', 'stderr'):
                          data = getattr(error, stream) or ''
                          if isinstance(data, bytes):
                              data = data.decode('utf-8', errors='replace')
                          (output / (name + '.' + stream)).write_text(data)
                      row['error'] = str(error)
                  except (OSError, subprocess.SubprocessError) as error:
                      row['error'] = str(error)
                  report['outcomes'].append(row)
              if controls.git('status', '--porcelain') or controls.git('rev-parse', 'HEAD') != report['candidate']:
                  raise ValueError('Source changed during Build count checks')
              if hashlib.sha256(binary.read_bytes()).hexdigest() != report['binary_sha256']:
                  raise ValueError('Build count executable changed during its checks')
              report['passed'] = all(row['passed'] for row in report['outcomes'])
          except (OSError, ValueError, subprocess.SubprocessError) as error:
              report['error'] = str(error)
          finally:
              text = json.dumps(report, indent=2) + '\n'
              (output / 'results.json').write_text(text)
              (output.parent / 'build-count-checks.json').write_text(text)
              # The test receipt retains its identity; the optimized compiler was uploaded earlier.
              if binary is not None:
                  binary.unlink(missing_ok=True)
              if units is not None:
                  units.unlink(missing_ok=True)
          if not report['passed']:
              raise SystemExit(1)
          PYTEST
      - name: Observe public Build consent and filesystem isolation
        if: github.event_name == 'workflow_dispatch' && inputs.build_consent
        run: python tools/ci/build_consent_controls.py
      - name: Enable requested compiler diagnostics
        if: github.event_name == 'workflow_dispatch' && inputs.compiler_diagnostics
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PROVIDER_DEBUG=1\nOMEGA_COMPILER_CHECK_SITES=1\n')"
      - name: Enable requested compiler phase timings
        if: github.event_name == 'workflow_dispatch' && inputs.phase_profile
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_PHASE_PROFILE=1\n')"
      - name: Enable requested ownership and state tracing
        if: github.event_name == 'workflow_dispatch' && inputs.structural_trace
        run: python -c "import os; from pathlib import Path; Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8').write('OMEGA_STRUCT_TRACE=1\n')"
      - name: Optional executable observations
        if: ${{ !cancelled() && !inputs.build_count_checks && steps.producer-preparation.outcome == 'success' }}
        env:
          OMEGA_COMPILER_PILOT_FIXTURES: ${{ inputs.fixtures }}
          OMEGA_COMPILER_PILOT_SAMPLES: ${{ inputs.samples }}
          OMEGA_COMPILER_PILOT_CLI_FIXTURES: ${{ inputs.cli_fixtures }}
          OMEGA_COMPILER_PILOT_CHECKING_ONLY: ${{ inputs.checking_only }}
          OMEGA_COMPILER_PILOT_RECORD_RESULTS: ${{ inputs.record_results }}
        run: python tools/ci/compiler_pilot.py --phase consume
      - name: Report actual producer and fixture observations
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        run: python -c "from pathlib import Path; root = Path('build/compiler-pilot'); [print(name + '\n' + (root / name).read_text(encoding='utf-8')) for name in ('preparation.json', 'summary.json', 'checking.json', 'both.json', 'samples.json', 'cli.json', 'build-consent-controls.json') if (root / name).is_file()]"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-observations-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            !build/compiler-pilot/producer-*/**
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # The corpus reports alone, so `corpus_gate.py --compare --remote` reads
      # rows without downloading the retained producer (350-520 MB).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && (inputs.smoke || inputs.fixtures != '' || inputs.samples != '' || inputs.cli_fixtures != '' || inputs.build_consent)
        with:
          name: compiler-pilot-records-${{ inputs.native_host }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/compiler-pilot/*.json
          if-no-files-found: warn
          retention-days: 7
