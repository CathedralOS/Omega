name: Check package review storage
on:
  push:
    branches: [work/verify-compiled-review-retirement]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Install the pinned build tool
        run: bash tools/xtask/bootstrap-mbx.sh --install-dir "$RUNNER_TEMP/bin"
      - name: Check package handoff and lock identities
        run: "$RUNNER_TEMP/bin/mbx test --locked -p package-compilation --lib package::"
      - name: Run a real Build and package review with damaged compiler directories
        if: always()
        run: "$RUNNER_TEMP/bin/mbx test --locked -p omega --test compiler_storage"
      - name: Verify that the dependency still publishes its generated entry
        if: always()
        run: "$RUNNER_TEMP/bin/mbx test --locked -p omega --test build_staged_dependency_calls a_dependency_publishes_source_bytes_under_the_name_the_product_imports"
      - name: Check Build observations and output capture
        if: always()
        run: |
          "$RUNNER_TEMP/bin/mbx" test --locked -p package-compilation --lib build_execution::
          "$RUNNER_TEMP/bin/mbx" test --locked -p build-output --lib
      - name: Lint the packages which changed
        if: always()
        run: "$RUNNER_TEMP/bin/mbx clippy --locked --no-deps -p build-output -p build-declarations -p package-compilation -p project-build -p package-manager -p omega --all-targets -- -D warnings"

      - name: Retain the compiler and timing reports for a focused retry
        if: always() && hashFiles('target/debug/omega') != ''
        run: tar -C target/debug -czf "$RUNNER_TEMP/omega-compiler.tar.gz" omega
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compiler-and-review-reports
          path: |
            ${{ runner.temp }}/omega-compiler.tar.gz
            ${{ runner.temp }}/compiler-review-measurement/*.log
            ${{ runner.temp }}/compiler-review-measurement/*.time
          retention-days: 1
