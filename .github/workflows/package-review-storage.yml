name: Check package review storage
on:
  push:
    branches: [work/verify-compiled-review-retirement]
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Get the fixed candidate compiler used for the same-input measurements
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45116916998 --name compiler-and-review-reports --dir "$RUNNER_TEMP/candidate-download"
          mkdir -p target/debug
          tar -C target/debug -xzf "$RUNNER_TEMP/candidate-download/omega-compiler.tar.gz"
          test -x target/debug/omega
      - name: Get the baseline compiler for an actual populated store
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45115989652 --name compiler-and-review-reports --dir "$RUNNER_TEMP/baseline-download"
          mkdir "$RUNNER_TEMP/baseline-compiler"
          tar -C "$RUNNER_TEMP/baseline-compiler" -xzf "$RUNNER_TEMP/baseline-download/omega-compiler.tar.gz"
          test -x "$RUNNER_TEMP/baseline-compiler/omega"
          if ! command -v strace >/dev/null; then
            sudo apt-get -qq update
            sudo apt-get -y -qq install strace
          fi
      - name: Get the baseline compiler's matching library sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05fd3604eb770a454064e3db1832d39f070c0d2b
          path: fixed-baseline
          persist-credentials: false
          sparse-checkout: source/library
      - name: Trace an independent candidate package update over genuine old review records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          import sys
          
          repo = Path.cwd().resolve()
          binary = repo / "target/debug/omega"
          work = Path(os.environ["RUNNER_TEMP"]) / "landed-package-review-trace"
          work.mkdir(mode=0o700)
          project = work / "program"
          cache = work / "cache"
          cache.mkdir(mode=0o700)
          source = (repo / "source-rust/application/tests/build_staged_dependency_calls.rs").read_text()
          start = source.index("fn a_build_binds_its_products_file_without_being_able_to_call_it")
          start = source.index('let build = r#"', start) + len('let build = r#"')
          end = source.index('"#.replace("HOST"', start)
          authored = {
              "build.omg": source[start:end].replace("HOST", "linux_x86_64"),
              "main.omg": "machine unreachable() crashes Trap { crash Trap; }",
              "vendor/build.omg": 'machine build(builder: @mutable Build) { Build::package(builder, "kit"); }',
              "vendor/entry.omg": "public machine start() {}",
          }
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          
          def prepare():
              if project.exists():
                  shutil.rmtree(project)
              for name, text in authored.items():
                  p = project/name
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(text)
          
          prepare()
          temp=Path(os.environ["RUNNER_TEMP"])
          args=["packages","update","--project",str(project),"--target","linux_x86_64","--offline","--dangerously-accept-all"]
          def invoke(binary, library, prefix=()):
              env=dict(os.environ, OMEGA_LIBRARY_ROOT=str(library), XDG_CACHE_HOME=str(cache))
              r=subprocess.run([*prefix,str(binary),*args], cwd=project, env=env, stdin=subprocess.DEVNULL, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(r.stdout,flush=True)
              assert r.returncode==0
          invoke(temp/"baseline-compiler/omega",repo/"fixed-baseline/source/library")
          old=cache/"CathedralOS/Omega/source/v1/external-local-sources/compiled-review-cache"
          records=sorted(old.glob("*.rec"))
          assert records, "the baseline compiler did not populate the old review directory"
          snap=lambda: sorted((p.name, sha(p), p.stat().st_size,p.stat().st_mtime_ns) for p in old.iterdir())
          before=snap()
          print("populated review records:",before,flush=True)
          for p in records: p.chmod(0o400)
          old.chmod(0o500)
          old_lock=(project/"omega.lock").read_text().splitlines()
          (project/"omega.lock").unlink()
          trace=work/"package-update.trace"
          invoke(binary,repo/"source/library",["strace","-f","-yy","-s","4096","-e","trace=%file","-o",str(trace)])
          operations=trace.read_text(errors="replace").splitlines()
          forbidden=[x for x in operations if "compiled-review-cache" in x or "checked-source-cache" in x]
          print("file syscalls",len(operations),"obsolete directory accesses",len(forbidden),flush=True)
          assert not forbidden, forbidden
          assert snap()==before
          assert (project/"omega.lock").is_file()
          import difflib
          fresh_lock=(project/"omega.lock").read_text().splitlines()
          changes=[line for line in difflib.unified_diff(old_lock,fresh_lock,n=0) if line[:1] in ("+","-") and not line.startswith(("+++","---"))]
          print("lock changed rows at identical project and source paths",len(changes),flush=True)
          for line in changes[:40]:
              print(line[:400],flush=True)
          print("candidate lock",sha(project/"omega.lock"),flush=True)
          PY
