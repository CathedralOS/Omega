name: Check exact file imports
on:
  push:
    branches: [work/verify-logical-file-imports]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Install the pinned adapter
        run: bash tools/xtask/bootstrap-mbx.sh --install-dir "$RUNNER_TEMP/bin"
      - name: Run both staged file imports with their refusal controls and the root binding tests
        run: |
          mbx="$RUNNER_TEMP/bin/mbx"
          failures=0
          "$mbx" test --locked -p omega --test build_staged_dependency_calls a_build_resolves_its_file_alias_after_preparing -- --nocapture || failures=1
          "$mbx" test --locked -p omega --test build_staged_dependency_calls a_build_binds_its_products_file -- --nocapture || failures=1
          "$mbx" test --locked -p source-compiler --lib declaration_lookup::root_bindings::tests || failures=1
          exit "$failures"
