name: Check exact file imports
on:
  push:
    branches: [work/verify-logical-file-imports]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Install the pinned adapter
        run: bash tools/xtask/bootstrap-mbx.sh --install-dir "$RUNNER_TEMP/bin"
      - name: Check the resumed Build selects the file and rejects the missing sibling
        run: "$RUNNER_TEMP/bin/mbx test --locked -p omega --test build_staged_dependency_calls a_build_resolves_its_file_alias_after_preparing -- --nocapture"
      - name: Check package acquisition and generated imports
        if: always()
        run: "$RUNNER_TEMP/bin/mbx test --locked -p package-compilation --lib source_imports"
      - name: Check filename collisions before lookup and lint the changed crates
        if: always()
        run: |
          "$RUNNER_TEMP/bin/mbx" test --locked -p source-symbol-table --lib
          "$RUNNER_TEMP/bin/mbx" clippy --locked --no-deps -p source-parser -p syntax-trees -p package-compilation -p source-files -p source-symbol-table -p source-compiler -p syntax-trees-to-symbol-resolved-trees --all-targets -- -D warnings
