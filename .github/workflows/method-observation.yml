name: Verify selected array methods on main
on:
  push:
    branches: [work/observe-method-array-inference]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      MBX_GC_AUTO: 'false'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_INCREMENTAL: '0'
      OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check out the merged compiler
        run: |
          cp .github/method-observation/observe.py "$RUNNER_TEMP/observe.py"
          git checkout --detach 9f1b2470df7d603b702883da9ef4fc10645f44f0
          test "$(git rev-parse HEAD)" = 9f1b2470df7d603b702883da9ef4fc10645f44f0
      - name: Identify the build tool
        id: key
        run: echo "key=$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: /tmp/omega-mbx-install/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.key.outputs.key }}
      - name: Build the compiler
        run: |
          bash tools/xtask/bootstrap-mbx.sh --install-dir "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/mbx" build --locked -p omega --bin omega
      - name: Run the array programs and controls
        run: python3 "$RUNNER_TEMP/observe.py" after
      - name: Check the generic implementation declaration
        run: '"$RUNNER_TEMP/bin/mbx" test --locked -p lowered-program-to-checked-program --lib a_generic_array_implementation_can_return_one_of_its_elements'
