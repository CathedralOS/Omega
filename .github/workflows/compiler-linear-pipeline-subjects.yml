name: Compare lowered route subjects on the exact parent and merge

on:
  push:
    branches:
      - work/compiler-linear-pipeline-host-proof
    paths:
      - .github/workflows/compiler-linear-pipeline-subjects.yml

permissions:
  contents: read

concurrency:
  group: compiler-linear-pipeline-subjects-work-proof
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: /tmp/ot
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'

jobs:
  check:
    name: ${{ matrix.checkpoint }} lowered-route subjects
    env:
      OMEGA_MIGRATION_REVISION: ${{ matrix.revision }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - checkpoint: parent
            revision: '045a2345054bae0a1bad6ecd369675de4bae9fc3'
          - checkpoint: merged
            revision: '5b223b02120bd61405047779d801e819da466d2b'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OMEGA_MIGRATION_REVISION }}
          persist-credentials: false
      - name: Verify migration revision and pin library and corpus
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OMEGA_MIGRATION_REVISION"
          echo "Checked migration $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD:source/library)" = "04a3cbef3a6a053200594fb29ff5070331dc0c77"
          echo "Library tree $(git rev-parse HEAD:source/library)"
          echo "OMEGA_LIBRARY_ROOT=$GITHUB_WORKSPACE/source/library" >> "$GITHUB_ENV"
          echo "OMEGA_CORPUS_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore the upstream post-merge cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ env.OMEGA_MIGRATION_REVISION }}
          restore-keys: |
            post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Identify the pinned mbx recipe
        id: mbx-key
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the verified mbx cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/omega-mbx/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Install verified mbx
        id: install-mbx
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Run the full lowered route subjects binary with normal test parallelism
        shell: bash
        run: |
          test -z "${RUST_TEST_THREADS:-}" && test -z "${RAYON_NUM_THREADS:-}"
          mbx test --locked -p compiler --test lowered_route_subjects
