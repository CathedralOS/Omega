name: Warm build

# Publish main's compiler build so Claude Code cloud sessions start warm
# instead of compiling the whole compiler (12 minutes on their 4-CPU
# containers). The build runs as root on Ubuntu 24.04 at the exact path a
# session restores into, so Cargo reuses it there. tools/warm_build.py
# explains why the path and file times have to match.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build runs at a time; GitHub keeps only the newest waiting push, so a
# busy main still publishes instead of cancelling every build before it ends.
concurrency:
  group: warm-build
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
      WARM: /home/user/Omega/.agents/worktree/warm
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config python3 git curl ca-certificates zstd gh
      - name: Check out main at the session path
        run: |
          git config --global --add safe.directory '*'
          git clone -q --filter=blob:none "https://github.com/${{ github.repository }}" /home/user/Omega
          git -C /home/user/Omega worktree add -q --detach "$WARM" "${{ github.sha }}"
      - name: Install the pinned Rust toolchain
        working-directory: /home/user/Omega/.agents/worktree/warm
        run: |
          channel=$(python3 -c "import tomllib; print(tomllib.load(open('rust-toolchain.toml', 'rb'))['toolchain']['channel'])")
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain "$channel" -c clippy -c rustfmt
      - name: Start from the previous warm build
        working-directory: /home/user/Omega/.agents/worktree/warm
        run: |
          . "$HOME/.cargo/env"
          python3 tools/warm_build.py restore --worktree "$WARM" --to "${{ github.sha }}" || echo "No usable previous warm build; building cold."
          # A failed restore can leave the worktree on the previous commit.
          git checkout -q --detach "${{ github.sha }}"
      - name: Build the compiler and the corpus runner
        working-directory: /home/user/Omega/.agents/worktree/warm
        run: |
          . "$HOME/.cargo/env"
          cargo build --locked -p omega
          cargo test --locked --no-run -p compiler --test corpus_runner
      - name: Publish the build
        working-directory: /home/user/Omega/.agents/worktree/warm
        run: |
          . "$HOME/.cargo/env"
          python3 tools/warm_build.py publish --worktree "$WARM"
