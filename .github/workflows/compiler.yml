name: Compiler admission

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a description gains its `Agent:` line.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      test_package:
        description: Optional workspace package for focused Rust tests
        type: string
        default: ''
      test_filter:
        description: Required test name or module when test_package is set
        type: string
        default: ''
      test_target:
        description: Integration test target; leave empty for library unit tests
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: compiler-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-check:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.test_package != '' && 25 || 20 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      # Reuse the optimized smoke build's objects before a focused test uses
      # its execution budget. Cargo still checks the current source and features.
      CARGO_TARGET_DIR: /tmp/ot
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The candidate's first parent is the base it is compared with.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check rules that prose did not hold
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr_body.md"
            python tools/check_rules.py --base HEAD^1 --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md"
          else
            python tools/check_rules.py --base HEAD^1
          fi
      # Formatting is RC-REPOSITORY's first command and needs no build.
      - name: Check formatting
        run: python tools/fmt.py --check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          # New paths exclude legacy caches; focused tests also skip check-only entries.
          key: compiler-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ inputs.test_package && 'tests' || 'check' }}-${{ github.sha }}
          restore-keys: |
            compiler-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ inputs.test_package && 'tests' || 'check' }}-
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check production dependency boundaries
        run: python tools/check_native_boundary.py
      - name: Check and lint the exact integration candidate
        run: cargo clippy --locked -p omega -- -D warnings
      - name: Run requested focused Rust tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_package != ''
        env:
          TEST_PACKAGE: ${{ inputs.test_package }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_TARGET: ${{ inputs.test_target }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          package = os.environ['TEST_PACKAGE']
          selected = os.environ['TEST_FILTER']
          target = os.environ['TEST_TARGET']
          if not re.fullmatch(r'[A-Za-z0-9_-]+', package):
              raise SystemExit('Select one workspace package')
          if not re.fullmatch(r'[A-Za-z0-9_:]+', selected):
              raise SystemExit('Select a nonempty Rust test name or module')
          if target and not re.fullmatch(r'[A-Za-z0-9_-]+', target):
              raise SystemExit('Invalid integration test target')
          command = ['cargo', 'test', '--locked', '-p', package]
          command += ['--test', target] if target else ['--lib']
          command += [selected, '--', '--nocapture', '--test-threads=1']
          print('Source:', os.environ['GITHUB_SHA'], flush=True)
          print('Command:', command, flush=True)
          subprocess.run(['rustc', '--version', '--verbose'], check=True)
          process = subprocess.Popen(
              [sys.executable, 'tools/build_slot.py', '--', *command],
              stdin=subprocess.DEVNULL, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, text=True)
          passed = 0
          for line in process.stdout:
              print(line, end='', flush=True)
              result = re.search(r'test result: ok\. (\d+) passed;', line)
              if result:
                  passed += int(result.group(1))
          status = process.wait()
          if status:
              raise SystemExit(status)
          if passed == 0:
              raise SystemExit('The filter executed no passing tests')
          PY

