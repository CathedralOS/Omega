name: Compiler admission

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a description gains its `Agent:` line;
    # `ready_for_review` re-reads the corpus gate once a draft is marked ready.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      test_package:
        description: Optional workspace package for focused Rust tests
        type: string
        default: ''
      test_filter:
        description: Required test name or module when test_package is set
        type: string
        default: ''
      test_target:
        description: Integration test target; leave empty for library unit tests
        type: string
        default: ''
      prepare_tests_only:
        description: Compile and cache the selected test without executing it
        type: boolean
        default: false

permissions:
  contents: read
  # Read the corpus gate's run for this head (tools/ci/await_corpus_gate.sh).
  actions: read
  pull-requests: read

concurrency:
  group: compiler-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-check:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_tests_only && 'compiler-test-preparation' || 'compiler-check' }}
    runs-on: ubuntu-24.04
    # A pull request's check also waits for the corpus gate, about 25 minutes.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.test_package != '' && 25 || github.event_name == 'pull_request' && 70 || 20 }}
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      # Reuse the optimized smoke build's objects before a focused test uses
      # its execution budget. Cargo still checks the current source and features.
      CARGO_TARGET_DIR: /tmp/ot
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The candidate's first parent is the base it is compared with.
          fetch-depth: 2
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Validate focused test selection
        if: github.event_name == 'workflow_dispatch' && (inputs.test_package != '' || inputs.prepare_tests_only)
        env:
          TEST_PACKAGE: ${{ inputs.test_package }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_TARGET: ${{ inputs.test_target }}
        run: mbx xtask focused-test --validate
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: compiler_objects
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          # Test keys distinguish package and lib/integration target. The filter
          # selects execution only; compatible test objects remain a fallback.
          key: compiler-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ inputs.test_package && format('tests:{0}:{1}', inputs.test_package, inputs.test_target && format('integration:{0}', inputs.test_target) || 'lib') || 'check' }}-${{ github.sha }}
          restore-keys: |
            compiler-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ inputs.test_package && format('tests:{0}:{1}', inputs.test_package, inputs.test_target && format('integration:{0}', inputs.test_target) || 'lib') || 'check' }}-
            compiler-check-objects-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ inputs.test_package && 'tests:' || 'check-' }}
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check rules that prose did not hold
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr_body.md"
            mbx xtask check-rules --base HEAD^1 --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md"
          else
            mbx xtask check-rules --base HEAD^1
          fi
      - name: Check formatting
        run: mbx xtask fmt --check
      - name: Check production dependency boundaries
        run: mbx xtask check-boundary
      - name: Check and lint the exact integration candidate
        run: mbx clippy --locked -p omega -- -D warnings
      # Save completed objects before the test can fail or time out. A compile-only
      # dispatch can prepare a cold test; a later dispatch still runs Cargo again.
      - name: Compile requested focused Rust tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_package != ''
        id: prepare_tests
        env:
          TEST_PACKAGE: ${{ inputs.test_package }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_TARGET: ${{ inputs.test_target }}
        run: mbx xtask focused-test --prepare
      - name: Retain validated compiler objects
        if: steps.compiler_objects.outputs.cache-hit != 'true' && (!inputs.test_package || steps.prepare_tests.outcome == 'success')
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.compiler_objects.outputs.cache-primary-key }}
      - name: Run requested focused Rust tests
        if: github.event_name == 'workflow_dispatch' && inputs.test_package != '' && !inputs.prepare_tests_only
        env:
          TEST_PACKAGE: ${{ inputs.test_package }}
          TEST_FILTER: ${{ inputs.test_filter }}
          TEST_TARGET: ${{ inputs.test_target }}
          OMEGA_WINDOWS_HANDLE_PROFILE: ${{ inputs.test_package == 'compiler' && inputs.test_target == 'filesystem_receiver' && inputs.test_filter == 'windows_canonicalize_receiver' && '1' || '' }}
        run: mbx xtask focused-test
      # The required status carries the corpus gate's verdict, so a pull
      # request that breaks corpus rows cannot merge under main's existing
      # protection. The merge queue does not wait: the pull request's own run
      # already gated the change, and a 25-minute corpus run per queue entry
      # would serialize the queue. The nightly sweep covers what lands.
      - name: Wait for the corpus gate's verdict on this head
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tools/ci/await_corpus_gate.sh
