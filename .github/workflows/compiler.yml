name: Compiler admission

on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a description gains its `Agent:` line.
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [main]
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiler-check:
    runs-on: ubuntu-24.04
    # Clippy artifacts are not shared with the earlier `cargo check` cache, so
    # the first run after this change is cold. The queue waits 20 minutes.
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The candidate's first parent is the base it is compared with.
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check rules that prose did not hold
        env:
          EVENT: ${{ github.event_name }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr_body.md"
            python tools/check_rules.py --base HEAD^1 --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md"
          else
            python tools/check_rules.py --base HEAD^1
          fi
      # Formatting is RC-REPOSITORY's first command and needs no build.
      - name: Check formatting
        run: python tools/fmt.py --check
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: compiler-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check production dependency boundaries
        run: python tools/check_native_boundary.py
      # Clippy type-checks the same crates as `cargo check -p omega` and also
      # rejects warnings, so lint debt cannot reach main unnoticed. Test and
      # example targets are linted after merge in repository-lint.yml.
      - name: Check and lint the exact integration candidate
        run: cargo clippy --locked -p omega -- -D warnings

