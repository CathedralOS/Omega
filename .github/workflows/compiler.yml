name: Fixed Windows merge inspection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixed-merge-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 1e16f103344fa614a7d3508e5486598e52f309b2
          fetch-depth: 1
      - name: Inspect the fixed three-way merge without building
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess
          base = "db949a6db746b778aae864f229b1b5e0e1095174"
          head = "1e16f103344fa614a7d3508e5486598e52f309b2"
          main = "c0edec49f0189eb56b25898ca81c03dab7e94374"
          output = pathlib.Path("build/windows-fixed-merge")
          output.mkdir(parents=True, exist_ok=True)
          subprocess.run(["git", "fetch", "--no-tags", "--depth=1", "origin", base, head, main], check=True)
          result = subprocess.run(["git", "merge-tree", "--write-tree", "--messages", "--merge-base=" + base, head, main], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          (output / "merge-tree.stdout").write_bytes(result.stdout)
          (output / "merge-tree.stderr").write_bytes(result.stderr)
          if result.returncode not in (0, 1):
              raise RuntimeError("fixed merge inspection could not run: " + str(result.returncode))
          lines = result.stdout.decode().splitlines()
          tree = lines[0]
          if not re.fullmatch("[0-9a-f]{40}", tree):
              raise RuntimeError("merge output has no exact tree identity")
          paths = subprocess.check_output(["git", "diff", "--name-only", base, head], text=True).splitlines()
          if len(paths) != 59:
              raise RuntimeError("candidate path roster changed")
          paths += [
              "omega-rust/omega/compilation/realization/provider-admission/src/provider_admission.rs",
              "omega-rust/omega/compilation/realization/provider-admission/src/provider_admission/terminal_authority_policy.rs",
          ]
          stages = {}
          for line in lines[1:]:
              match = re.fullmatch(r"([0-7]{6}) ([0-9a-f]{40}) ([123])\t(.+)", line)
              if match:
                  mode, oid, stage, path = match.groups()
                  stages.setdefault(path, []).append(dict(mode=mode, oid=oid, stage=int(stage)))
                  if path not in paths:
                      raise RuntimeError("conflict escaped the candidate and renamed-module roster")
          def oid_at(revision, path):
              result = subprocess.run(["git", "rev-parse", "--verify", revision + ":" + path], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True)
              return result.stdout.strip() if result.returncode == 0 else None
          rows = []
          for ordinal, path in enumerate(paths):
              row = dict(path=path, base=oid_at(base, path), head=oid_at(head, path), main=oid_at(main, path), merged=oid_at(tree, path), conflict_stages=stages.get(path, []))
              if row["merged"] and (row["conflict_stages"] or row["merged"] not in {row["head"], row["main"]}):
                  name = str(ordinal) + "-merged.txt"
                  (output / name).write_bytes(subprocess.check_output(["git", "cat-file", "blob", row["merged"]]))
                  row["merged_file"] = name
              for stage in row["conflict_stages"]:
                  name = str(ordinal) + "-stage-" + str(stage["stage"]) + ".txt"
                  (output / name).write_bytes(subprocess.check_output(["git", "cat-file", "blob", stage["oid"]]))
                  stage["file"] = name
              rows.append(row)
          receipt = dict(schema="windows-fixed-merge-inspection-v1", base=base, head=head, main=main, merged_tree=tree, merge_exit=result.returncode, conflict_paths=sorted(stages), rows=rows, validation="Read-only Git inspection only. No Rust build or tests executed; conflict markers are not a feature candidate.")
          (output / "inspection.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps({key:receipt[key] for key in ["base","head","main","merged_tree","merge_exit","conflict_paths","validation"]}, indent=2))
          
          PY
      - name: Retain only bounded candidate merge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-fixed-merge-db949-1e16-c0ed
          path: build/windows-fixed-merge/
          retention-days: 7
          if-no-files-found: error
