name: Restore alpha.3 release bundles

on:
  push:
    branches: ['release-recovery/alpha3']
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

concurrency:
  group: release-v0.1.0-alpha.3
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: v0.1.0-alpha.3
  CARGO_BUILD_JOBS: '2'
  RUST_MIN_STACK: '67108864'

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      commit: ${{ steps.prepare.outputs.commit }}
      matrix: ${{ steps.runners.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4736ebd55d61dbbb463a43131e77eeb7d043ce0c
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pin source and refuse an existing release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/github_release.py prepare
      - name: Replace the retired macOS runner
        id: runners
        env:
          MATRIX: ${{ steps.prepare.outputs.matrix }}
        run: |
          # The pinned source names macos-14, which GitHub no longer starts
          # (its jobs are cancelled at once). macos-15 is the same arm64 host
          # target; only the runner label changes, never the release source.
          echo "matrix=${MATRIX//\"macos-14\"/\"macos-15\"}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check packaging and release controls
        run: |
          python tools/tests/test_release_package.py -v
          python tools/tests/test_release_workflow.py -v
          python tools/tests/test_release_notices.py -v
      - name: Build and test the relocated host bundle
        run: python tools/release/package.py --version "$RELEASE_VERSION" --output build/releases
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.host }}
          path: build/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: build/release-assets
          merge-multiple: true
      - name: Verify all four identities and create the draft
        run: python tools/release/github_release.py publish

  verify-download:
    needs: [prepare, publish]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    # GitHub requires push access to see a draft release. Supply that token
    # only to the download step, never to the installed compiler's smoke.
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
      RELEASE_HOST: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Download the actual draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/github_release.py download
      - name: Test the downloaded installation without release credentials
        run: python tools/release/github_release.py verify

  ready:
    needs: [prepare, verify-download]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record successful download verification (keep draft)
        run: python tools/release/github_release.py finish
