name: Trace retained slice window
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 45c23b543577c22b7a592d109a91fe371ad27832
          path: measured
          persist-credentials: false
      - name: Restore the exact retained producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41640292831 --repo CathedralOS/Omega --name compiler-pilot-linux_x86_64-45c23b543577c22b7a592d109a91fe371ad27832-1 --dir "$RUNNER_TEMP/retained-slice-producer"
      - name: Authenticate and replay the unchanged failing program
        working-directory: measured
        run: |
          python3 - <<'PYTRACE'
          from pathlib import Path
          import hashlib,json,os,subprocess,sys
          sys.path.insert(0, 'tools')
          import corpus_gate
          root=Path.cwd();retained=Path(os.environ['RUNNER_TEMP'])/'retained-slice-producer'
          output=Path(os.environ['RUNNER_TEMP'])/'slice-window-trace';output.mkdir()
          source='45c23b543577c22b7a592d109a91fe371ad27832'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          assert not subprocess.check_output(['git','status','--porcelain'],text=True).strip()
          producer_path=next(retained.glob('producer-*/producer.json'))
          original=json.loads(producer_path.read_text());cli=producer_path.parent/'omega';cli.chmod(0o755)
          profile=corpus_gate.require_optimized(cli)
          assert original['revision']==source and original['tree']==subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          assert profile['sha256']==original['cli_profile']['sha256'] and profile['profile']==original['cli_profile']['profile'] and profile['profile']['opt_level']=='1'
          project=root/'samples/cli/facts/computed_subslice_extent/call_result'
          paths=subprocess.check_output(['git','ls-files','source/library',str(project.relative_to(root))],text=True).splitlines()
          inputs={p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in paths}
          env=dict(os.environ,OMEGA_STRUCT_TRACE='1',OMEGA_LIBRARY_ROOT=str(root/'source/library'))
          with (output/'trace.stdout').open('wb') as out,(output/'trace.stderr').open('wb') as err:
              result=subprocess.run([str(cli),'--check',str(project/'main.omg')],cwd=root,env=env,stdout=out,stderr=err,timeout=240)
          for p,digest in inputs.items():assert hashlib.sha256((root/p).read_bytes()).hexdigest()==digest
          record={'diagnostic_replay':True,'measured_source':source,'producer_run':41640292831,'producer':original,'restored_profile':profile,'inputs':inputs,'exit_code':result.returncode,'runtime':'No engine observation requested or claimed.'}
          (output/'replay.json').write_text(json.dumps(record,indent=2)+'\n')
          print('Authenticated retained optimized compiler and replayed frozen source; diagnostic exit',result.returncode)
          PYTRACE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: slice-window-trace-${{ github.run_id }}
          path: ${{ runner.temp }}/slice-window-trace
          if-no-files-found: error
