name: Corpus sweep

# Measure every corpus fixture on main each night and keep the ledger honest.
#
# The pull request gate (corpus-gate.yml) checks a sample of rows, and the
# ledger drifted while nothing ran the whole corpus: a triage on 2026-11-11
# found 941 rows whose recorded outcome main no longer produced. This sweep
# runs all of tests/omega in shards on main's head, then opens (or replaces)
# one pull request that changes only tests/omega/corpus_outcomes.txt and
# records every row whose outcome differs from it. Such a pull request may
# record red rows (tools/testing.md, "Who may record a regression"), so its
# description lists every must-reject fixture the compiler now accepts first,
# as soundness alerts, before a table of the worse rows by first diagnostic.
#
# The sweep also publishes its observations as the `observed.txt` asset of the
# `corpus-sweep-main` release. The gate reads it so a row main already lost is
# not charged to an unrelated pull request.
#
# Owner settings (tools/ci/README.md, "Corpus gate"): a pull request opened
# with the default GITHUB_TOKEN starts no workflows, so its checks never run.
# Store a token that may push branches and open pull requests as the
# CORPUS_SWEEP_TOKEN secret; without it the sweep still opens the pull
# request, and the repository must allow GitHub Actions to create pull requests.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-sweep
  cancel-in-progress: false

env:
  SHARDS: '64'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      commit: ${{ steps.shards.outputs.commit }}
    steps:
      - id: shards
        run: |
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($SHARDS))))")" >> "$GITHUB_OUTPUT"
          # Every shard measures the same commit even if main moves meanwhile.
          echo "commit=${{ github.sha }}" >> "$GITHUB_OUTPUT"

  shard:
    needs: plan
    name: shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    # A shard holds about 270 fixtures, about 14 minutes on 4 CPUs.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
      OMEGA_CORPUS_JOBS: '4'
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git curl ca-certificates zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check out main at the session path
        run: |
          git config --global --add safe.directory '*'
          git clone -q --filter=blob:none "https://github.com/${{ github.repository }}" /home/user/Omega
          git -C /home/user/Omega checkout -q --detach "${{ needs.plan.outputs.commit }}"
      - name: Set up the host and restore main's warm build
        run: cd /home/user/Omega && bash tools/ci/corpus_host.sh
      - name: Observe this shard
        run: |
          cd /home/user/Omega
          mkdir -p build/corpus-sweep
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS \
            mbx xtask corpus-gate sweep-shard --shard "${{ matrix.shard }}/$SHARDS" \
            --out "build/corpus-sweep/records-${{ matrix.shard }}.txt" < /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corpus-sweep-records-${{ matrix.shard }}
          path: /home/user/Omega/build/corpus-sweep/records-${{ matrix.shard }}.txt
          retention-days: 14

  report:
    needs: [plan, shard]
    # A failed shard leaves its rows unmeasured; the rows the other shards
    # measured are still true of this commit, and the description says which
    # shards are missing.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.CORPUS_SWEEP_TOKEN || github.token }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      BRANCH: work/tests-nightly-corpus-sweep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.commit }}
          token: ${{ secrets.CORPUS_SWEEP_TOKEN || github.token }}
          fetch-depth: 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: corpus-sweep-records-*
          path: build/corpus-sweep/records
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Splice every moved row into the ledger
        id: report
        run: |
          mbx xtask corpus-gate sweep-report --records build/corpus-sweep/records --shards "$SHARDS" \
            --body build/corpus-sweep/body.md --observed build/corpus-sweep/observed.txt
      - name: Publish main's observations for the pull request gate
        run: |
          gh release view corpus-sweep-main --repo "${{ github.repository }}" >/dev/null 2>&1 ||
            gh release create corpus-sweep-main --repo "${{ github.repository }}" --prerelease \
              --title "Corpus observations of main" --notes "Written by .github/workflows/corpus-sweep.yml."
          gh release upload corpus-sweep-main build/corpus-sweep/observed.txt --clobber --repo "${{ github.repository }}"
          gh release edit corpus-sweep-main --repo "${{ github.repository }}" --notes \
            "observed.txt holds every corpus row the nightly sweep (.github/workflows/corpus-sweep.yml) measured on main at $COMMIT. The pull request gate reads it so a row main already lost is not charged to an unrelated change."
      - name: Open or update the ledger pull request
        if: steps.report.outputs.changed != '0'
        env:
          CHANGED: ${{ steps.report.outputs.changed }}
          SOUNDNESS: ${{ steps.report.outputs.soundness }}
        run: |
          short=${COMMIT:0:12}
          if [ "$SOUNDNESS" != 0 ]; then
            title="tests: record $CHANGED moved corpus rows at $short ($SOUNDNESS accepted fail rows)"
          else
            title="tests: record $CHANGED corpus rows whose outcomes moved on main at $short"
          fi
          created=$(gh run view "${{ github.run_id }}" --repo "${{ github.repository }}" --json createdAt --jq .createdAt)
          seconds=$(( $(date +%s) - $(date -d "$created" +%s) ))
          {
            cat build/corpus-sweep/body.md
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            printf 'Agent: Corpus sweep | Model: none | Effort: none | Tokens: 0 in (0 cached), 0 out | Steps: %s | Time: %dh%02dm | Steers: 0\n' \
              "$SHARDS" $((seconds / 3600)) $((seconds % 3600 / 60))
          } > build/corpus-sweep/pr-body.md
          printf '%s\n\n' "$title" > build/corpus-sweep/commit.txt
          head -c 60000 build/corpus-sweep/pr-body.md >> build/corpus-sweep/commit.txt
          git config user.name "corpus-sweep"
          git config user.email "corpus-sweep@users.noreply.github.com"
          git checkout -q -B "$BRANCH"
          git add tests/omega/corpus_outcomes.txt
          git commit -q -F build/corpus-sweep/commit.txt
          git push -q --force origin "HEAD:refs/heads/$BRANCH"
          existing=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "${{ github.repository }}" --title "$title" --body-file build/corpus-sweep/pr-body.md
          else
            gh pr create --repo "${{ github.repository }}" --base main --head "$BRANCH" \
              --title "$title" --body-file build/corpus-sweep/pr-body.md
          fi
