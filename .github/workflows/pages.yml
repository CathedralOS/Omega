name: Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki/learn/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wiki/learn
      - name: Stage Pages site
        run: |
          mkdir -p _site/learn
          for item in index.html styles.css book.js fonts assets; do
            cp -r "wiki/learn/$item" "_site/$item"
            cp -r "wiki/learn/$item" "_site/learn/$item"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
