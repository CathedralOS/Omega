name: Pages

# Publish the language book and preserve the existing /atlas/ URLs from the archived static site.
on:
  push:
    branches: [main]
    paths:
      - "wiki/learn/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # One deploy at a time, and none cancelled.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            wiki/learn
            _recycling/tools/atlas
      - id: pages
        uses: actions/configure-pages@v5
      - name: Stage Pages site
        run: |
          mkdir -p _site/learn
          for item in index.html styles.css book.js fonts assets; do
            cp -r "wiki/learn/$item" "_site/$item"
            cp -r "wiki/learn/$item" "_site/learn/$item"
          done
          # The atlas is static already: its landing page, its pages and the
          # design kit they load (tokens, fonts, component styles).
          mkdir -p _site/atlas
          cp _recycling/tools/atlas/index.html _site/atlas/
          cp -r _recycling/tools/atlas/pages _recycling/tools/atlas/design _site/atlas/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
