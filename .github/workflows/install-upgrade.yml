name: Installation upgrade

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Previously verified prerelease to install first
        required: true
        type: string
      tag:
        description: New verified prerelease to upgrade to
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            manager: homebrew
            host: aarch64-apple-darwin
          - runner: windows-2025
            manager: winget
            host: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            manager: homebrew
            host: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    # Required only to download drafts. The token is not supplied to installers.
    permissions:
      contents: write
    env:
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      RELEASE_TAG: ${{ inputs.tag }}
      INSTALL_MANAGER: ${{ matrix.manager }}
      INSTALL_HOST: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check installation controls
        run: python tools/tests/test_release_install.py -v
      - name: Download and verify both releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/install_upgrade.py download --manager "$INSTALL_MANAGER" --host "$INSTALL_HOST" --previous-tag "$PREVIOUS_TAG" --tag "$RELEASE_TAG"
      - name: Expose the Linux runner's installed Homebrew
        if: runner.os == 'Linux'
        run: echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Prepare WinGet on the disposable Windows host
        if: matrix.manager == 'winget'
        shell: pwsh
        run: |
          Install-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380 -Scope CurrentUser -Repository PSGallery -Force
          Import-Module Microsoft.WinGet.Client -RequiredVersion 1.29.380
          Repair-WinGetPackageManager -Version 1.29.380
          winget --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          winget settings --enable LocalManifestFiles
          exit $LASTEXITCODE
      - name: Install, build, upgrade, and rebuild the same locked project
        run: python tools/release/install_upgrade.py check --manager "$INSTALL_MANAGER" --host "$INSTALL_HOST" --previous-tag "$PREVIOUS_TAG" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-upgrade-${{ matrix.host }}
          path: build/install-upgrade/result.json
          if-no-files-found: error
