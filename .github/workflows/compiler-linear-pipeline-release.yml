name: Pinned public Console and native images

on:
  push:
    branches:
      - work/compiler-linear-pipeline-host-proof
    paths:
      - .github/workflows/compiler-linear-pipeline-release.yml

permissions:
  contents: read

concurrency:
  group: compiler-linear-pipeline-release-work-proof
  cancel-in-progress: false

env:
  OMEGA_MIGRATION_REVISION: '5b223b02120bd61405047779d801e819da466d2b'
  OMEGA_EXPECTED_LIBRARY_TREE: '04a3cbef3a6a053200594fb29ff5070331dc0c77'
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: /tmp/ot
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  RUST_TEST_THREADS: '1'
  RAYON_NUM_THREADS: '1'

jobs:
  check:
    name: real-console-and-four-native-images
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OMEGA_MIGRATION_REVISION }}
          persist-credentials: false
      - name: Verify migration revision and pin library and corpus
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OMEGA_MIGRATION_REVISION"
          echo "Checked migration $(git rev-parse HEAD)"
          test "$(git rev-parse HEAD:source/library)" = "$OMEGA_EXPECTED_LIBRARY_TREE"
          echo "Library tree $(git rev-parse HEAD:source/library)"
          echo "OMEGA_LIBRARY_ROOT=$GITHUB_WORKSPACE/source/library" >> "$GITHUB_ENV"
          echo "OMEGA_CORPUS_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore the upstream post-merge cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ env.OMEGA_MIGRATION_REVISION }}
          restore-keys: |
            post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Identify the pinned mbx recipe
        id: mbx-key
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the verified mbx cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/omega-mbx/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Install verified mbx
        id: install-mbx
        run: bash tools/xtask/bootstrap-mbx.sh

      - name: Build the ordinary compiler and compare the native-host fixture
        id: release-build
        shell: bash
        run: |
          mbx build --locked -p omega --message-format=json > "$RUNNER_TEMP/omega-build.jsonl"
          git fetch --no-tags --depth=1 https://github.com/CathedralOS/Omega.git edc830ed21a353efd63ac94e19503c7224e13a01
          git show edc830ed21a353efd63ac94e19503c7224e13a01:native-host-proof/images.json > "$RUNNER_TEMP/host-proof-images.json"
          python - <<'PY'
          import hashlib, json, os, platform, shutil, subprocess
          from pathlib import Path

          scratch = Path(os.environ["RUNNER_TEMP"])
          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          records = (json.loads(line) for line in (scratch/"omega-build.jsonl").read_text().splitlines() if line.startswith("{"))
          compilers = {Path(row["executable"]) for row in records if row.get("reason") == "compiler-artifact"
                       and row.get("target", {}).get("name") == "omega" and row.get("executable")}
          if len(compilers) != 1:
              raise RuntimeError(f"Expected a single ordinary omega binary, got {compilers}")
          cli = compilers.pop()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"ordinary_cli={cli}", file=output)
          with cli.open("rb") as source:
              cli_digest = hashlib.file_digest(source, "sha256").hexdigest()
          receipt = {"compiler_sha256": cli_digest, "migration_sha": os.environ["OMEGA_MIGRATION_REVISION"],
                     "library_tree": subprocess.check_output(["git", "rev-parse", "HEAD:source/library"], text=True).strip(),
                     "host": platform.system(), "architecture": platform.machine(), "images": {}}
          print(json.dumps(receipt), flush=True)
          reference = json.loads((scratch/"host-proof-images.json").read_text())
          fixture = "tests/fixtures/run/providers/target_selected_implementation"
          assert reference["fixture"] == fixture
          project = scratch/"provider-project"
          project.mkdir()
          source_hashes = {}
          for name in ["build.omg", "main.omg"]:
              source = checkout/fixture/name
              shutil.copyfile(source, project/name)
              source_hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          if source_hashes != reference["sources_sha256"]:
              raise RuntimeError(f"The public fixture source has changed: {source_hashes}")
          dest = scratch/"compiled-provider-fixture"
          targets = ["linux_x86_64", "linux_arm64", "macos_arm64", "windows_x86_64"]
          arguments = [flag for target in targets for flag in ("--target", target)]
          subprocess.run([str(cli), "--build-dir", str(dest), *arguments, "--build-input", "build.omg",
                          "--build-input", "main.omg", "main.omg"], cwd=project, check=True, stdin=subprocess.DEVNULL)
          different = []
          for target in targets:
              filename = "omega-program.exe" if target == "windows_x86_64" else "omega-program"
              image = (dest/target/filename).read_bytes()
              current = hashlib.sha256(image).hexdigest()
              observed = reference["images"][target]
              covers = current == observed["candidate"] == observed["baseline"]
              record = {"target": target, "image_sha256": current, "bytes": len(image),
                        "matches_both_executions_in_44227027634": covers}
              receipt["images"][target] = record
              print(json.dumps(record), flush=True)
              if not covers:
                  different.append(target)
          if different:
              raise RuntimeError(f"Changed native images need a new matching-host execution: {different}")
          PY
      - name: Run the authentic bundled Console sample through both engines
        if: "!cancelled() && steps.release-build.outputs.ordinary_cli != ''"
        shell: bash
        env:
          ORDINARY_OMEGA: ${{ steps.release-build.outputs.ordinary_cli }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          checkout = Path(os.environ["GITHUB_WORKSPACE"])
          library = Path(os.environ["OMEGA_LIBRARY_ROOT"])
          assert library.resolve() == (checkout/"source/library").resolve()
          sample = Path("samples/cli/basics/cli_mvp/main.omg")
          assert (checkout/sample).is_file() and (checkout/sample.with_name("build.omg")).is_file()
          for name in (sample, sample.with_name("build.omg")):
              observed = hashlib.sha256((checkout/name).read_bytes()).hexdigest()
              print(json.dumps({"fixture": str(name), "source_sha256": observed}), flush=True)
          result = subprocess.run([os.environ["ORDINARY_OMEGA"], "run", "--both", str(sample)], cwd=checkout,
                                  input=b"\n", stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=5400)
          output = result.stdout
          sys.stdout.buffer.write(output)
          sys.stdout.buffer.flush()
          digest = hashlib.sha256(output).hexdigest()
          lines = output.splitlines()
          native_ok = lines.count(b"native exit 0") == 1
          psi_ok = lines.count(b"interp exit: 0") == 1
          expected = "9b32934016272bb0702a79ec714f6754b9b302859a450ef72bebffd1221d1f79"
          print(json.dumps({"migration_sha": os.environ["OMEGA_MIGRATION_REVISION"], "ordinary_cli_exit": result.returncode,
                            "output_bytes": len(output), "stdout_stderr_sha256": digest, "expected_sha256": expected,
                            "native_exit_zero": native_ok, "psi_exit_zero": psi_ok}), flush=True)
          if result.returncode != 0 or not native_ok or not psi_ok or digest != expected:
              raise RuntimeError("Console exits or exact combined output differ from the published comparison.")
          PY
