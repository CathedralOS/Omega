name: Publish to WinGet

# When an Omega release is published, open a pull request on
# microsoft/winget-pkgs that adds the new version of `CathedralOS.Omega`, so
# `winget install CathedralOS.Omega` and `winget upgrade` reach it without anyone
# writing a manifest by hand.
#
# Komac (through winget-releaser) copies the previous version's manifest and
# swaps in the new Windows zip, its SHA-256 and the version, so the package must
# already exist in WinGet: the first version is submitted by hand
# (`wingetcreate new`). Releases are created as drafts by the release workflow;
# publishing the draft is what starts this.
#
# Setup, once, by the account that will open the pull requests:
# - fork microsoft/winget-pkgs under that account;
# - create a classic personal access token with the `public_repo` scope and
#   store it as the repository secret WINGET_TOKEN;
# - set the repository variable WINGET_FORK_USER to that account's login.
# Until the secret exists the job is skipped, so a release never fails on it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to WinGet, such as v0.1.0-alpha.4.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: winget
  cancel-in-progress: false

jobs:
  winget:
    # Only version tags are product releases.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check the publishing setup
        id: setup
        shell: pwsh
        env:
          HAS_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
          FORK_USER: ${{ vars.WINGET_FORK_USER }}
        run: |
          if ($env:HAS_TOKEN -ne 'true' -or -not $env:FORK_USER) {
            "WinGet publishing is not set up: add the WINGET_TOKEN secret and the WINGET_FORK_USER variable (see .github/workflows/winget.yml)." >> $env:GITHUB_STEP_SUMMARY
            "ready=false" >> $env:GITHUB_OUTPUT
          } else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }
      - name: Open the winget-pkgs pull request
        if: steps.setup.outputs.ready == 'true'
        id: releaser
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: CathedralOS.Omega
          # Only the Windows bundle; WinGet is Windows-only.
          installers-regex: 'x86_64-pc-windows-msvc\.zip$'
          release-tag: ${{ github.event.release.tag_name || inputs.tag }}
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: ${{ vars.WINGET_FORK_USER }}
      - name: Report the pull request
        if: steps.setup.outputs.ready == 'true'
        shell: pwsh
        env:
          PR_URL: ${{ steps.releaser.outputs.pr-url }}
        run: |
          "Opened $env:PR_URL on microsoft/winget-pkgs." >> $env:GITHUB_STEP_SUMMARY
