name: Windows MSI installer

on:
  workflow_dispatch:
    inputs:
      previous_tag:
        description: Verified release to install first
        required: true
        type: string
      tag:
        description: Verified release to package
        required: true
        type: string
      previous_installer_version:
        description: Earlier numeric MSI version (for example 0.1.2)
        required: true
        type: string
      installer_version:
        description: New numeric MSI version; must increase and never be reused
        required: true
        type: string

permissions:
  contents: read

jobs:
  install-upgrade:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write # Needed to download the previous draft, not passed to installers.
    env:
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
      RELEASE_TAG: ${{ inputs.tag }}
      PREVIOUS_INSTALLER_VERSION: ${{ inputs.previous_installer_version }}
      INSTALLER_VERSION: ${{ inputs.installer_version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check installer authoring
        run: python tools/tests/test_windows_installer.py -v
      - name: Install pinned MSI authoring tool
        run: dotnet tool install wix --version 4.0.6 --tool-path build/wix
      - name: Download verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release/windows_install_check.py download --previous-tag "$env:PREVIOUS_TAG" --tag "$env:RELEASE_TAG" --previous-installer-version "$env:PREVIOUS_INSTALLER_VERSION" --installer-version "$env:INSTALLER_VERSION"
      - name: Build MSI, install, upgrade, compile, reject downgrade, uninstall
        run: python tools/release/windows_install_check.py check --previous-tag "$env:PREVIOUS_TAG" --tag "$env:RELEASE_TAG" --previous-installer-version "$env:PREVIOUS_INSTALLER_VERSION" --installer-version "$env:INSTALLER_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-msi-evidence
          path: |
            build/windows-installer/*.log
            build/windows-installer/result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-msi
          path: |
            build/windows-installer/current/installer/*.msi
            build/windows-installer/current/installer/*.msi.sha256
          if-no-files-found: error
