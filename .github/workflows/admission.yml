name: Admission

# The only check a pull request needs before it merges. It builds no compiler:
# the rules a description and a diff must hold, and formatting. Everything that
# needs a build (lint, tests, corpus, samples) runs on main after merge; see
# wiki/drafts/designs/ci_rebuild_plan.md. Target: about one minute.
on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a description gains its `Agent:` line.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # A pull request can restore a cache only from its own runs or from main's,
  # so main saves the built xtask for every pull request to start from.
  # Without it each one compiled xtask cold.
  push:
    branches: [main]
    paths:
      - 'tools/xtask/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/admission.yml'

permissions:
  contents: read

concurrency:
  group: admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: '0'
      # Only xtask is built here, so its objects get their own small cache.
      CARGO_TARGET_DIR: /tmp/xtask-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge commit's first parent is the base the diff is read from.
          fetch-depth: 2
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: admission-xtask-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/xtask/**') }}
          restore-keys: |
            admission-xtask-${{ runner.os }}-
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Build xtask on main
        if: github.event_name == 'push'
        run: mbx build --locked -p xtask
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check the rules a pull request must hold
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr_body.md"
          mbx xtask check-rules --base HEAD^1 --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md"
      - name: Check formatting when Rust changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '\.rs$'; then
            mbx xtask fmt --check
          else
            echo "No Rust files changed."
          fi
