name: Admission

# During the source-rust move, automated compiler checks run in the standalone V2 workspace.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'omega-rust-v2/**'
      - '.github/workflows/admission.yml'
      - 'tools/mbx-version'
      - 'tools/xtask/bootstrap-mbx.sh'
      - 'rust-toolchain.toml'

permissions:
  contents: read

env:
  OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Check active Cargo and Rust paths against the recycling directories
        run: |
          # A symlink can redirect an existing module or path dependency without editing its caller.
          if git diff --quiet HEAD^1 HEAD -- ':(glob)**/*.rs' ':(glob)**/Cargo.toml' tools/ci/check_recycling.py tools/ci/test_check_recycling.py .github/workflows/admission.yml &&
             ! git diff --raw HEAD^1 HEAD | grep -E '^:(120000 |[0-9]+ 120000 )' >/dev/null; then
            exit 0
          fi
          python3 -B tools/ci/test_check_recycling.py
          python3 -B tools/ci/check_recycling.py
      - name: Identify changes to V2 or its CI toolchain
        id: changes
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] || ! git diff --quiet HEAD^1 HEAD -- omega-rust-v2 .github/workflows/admission.yml tools/mbx-version tools/xtask/bootstrap-mbx.sh rust-toolchain.toml; then
            echo 'v2=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Root compiler checks are paused during the source-rust move.'
          fi
      - name: Identify the mbx source and build recipe
        if: steps.changes.outputs.v2 == 'true'
        id: mbx-key
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.changes.outputs.v2 == 'true'
        with:
          path: ${{ env.OMEGA_MBX_INSTALL_CACHE }}/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Install verified mbx
        if: steps.changes.outputs.v2 == 'true'
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Test the V2 workspace
        if: steps.changes.outputs.v2 == 'true'
        working-directory: omega-rust-v2
        run: mbx test --locked --workspace
