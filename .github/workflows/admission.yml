name: Admission

# The only check a pull request needs before it merges: the rules a
# description and a diff must hold, formatting, and, when Rust or Cargo files
# changed, a type check of the merge tree. It builds no compiler: lint, tests
# and samples run on main after merge; see
# wiki/drafts/designs/ci_rebuild_plan.md. Target: about two minutes.
on:
  pull_request:
    branches: [main]
    # `edited` re-runs the check when a description gains its `Agent:` line.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  # A pull request can restore a cache only from its own runs or from main's,
  # so main saves the built xtask for every pull request to start from.
  # Without it each one compiled xtask cold.
  push:
    branches: [main]
    paths:
      - 'tools/xtask/**'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/admission.yml'

permissions:
  contents: read

concurrency:
  # Same-head PR events can arrive out of order. Canceling the newer run can
  # leave its required check canceled even after an older run succeeds.
  # Let PR checks finish independently; coalesce only main's cache builds.
  group: admission-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: '0'
      # Only xtask is built here, so its objects get their own small cache.
      CARGO_TARGET_DIR: /tmp/xtask-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The merge commit's first parent is the base the diff is read from.
          fetch-depth: 2
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: admission-xtask-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'tools/xtask/**') }}
          restore-keys: |
            admission-xtask-${{ runner.os }}-
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Build xtask on main
        if: github.event_name == 'push'
        run: mbx build --locked -p xtask
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: github.event_name == 'push' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Check the rules a pull request must hold
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr_body.md"
          mbx xtask check-rules --base HEAD^1 --title "$TITLE" --body-file "$RUNNER_TEMP/pr_body.md"
      - name: Check formatting when Rust changed
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '\.rs$'; then
            mbx xtask fmt --check
          else
            echo "No Rust files changed."
          fi
      # Two pull requests can each type-check alone and still break together:
      # Git merges edits in different files without a conflict. #3326 changed
      # `Statement::Evaluate` while main had gained a new use of the old form
      # in another file, and its merge failed with E0533 until #3457. This
      # checks the merge commit GitHub built, not the branch. `cargo check`
      # stops before code generation, so a cold run over every workspace
      # target takes about 90 seconds on four CPUs; a restored target
      # directory saved only about 12 seconds, so there is no cache.
      # A change to this file runs the step too, so its own pull request tests it.
      - name: Type-check the merge tree when Rust or Cargo files changed
        if: github.event_name == 'pull_request'
        env:
          CARGO_TARGET_DIR: /tmp/check-target
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$|^\.github/workflows/admission\.yml$'; then
            mbx check --locked --workspace --all-targets
          else
            echo "No Rust or Cargo files changed."
          fi
