name: Admission

# Admission stays light and compiles nothing: heavy checks run on the LAN VMs,
# never on a GitHub runner (AGENTS.md#heavy-checks-run-on-the-lan-vms).
# It checks the shared specification, CLI examples and archive boundaries.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'wiki/spec/**'
      - '_recycling/**'
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'tools/ci/check_recycling.py'
      - 'tools/ci/test_check_recycling.py'
      - '.github/workflows/admission.yml'

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require the shared Omega specification
        run: |
          compgen -G "$GITHUB_WORKSPACE/wiki/spec/*/*.md" > /dev/null || { echo "::error::The repository specification is missing"; exit 1; }
      - name: Check Omega run examples and integration fixtures
        run: |
          refuse_matches() {
            if git grep -nI -E "$@"; then
              echo "::error::Use omega run for interpretation and omega build --compare-tests for registered test comparisons."
              exit 1
            else
              test "$?" -eq 1
            fi
          }
          refuse_matches -e 'omega[[:space:]]+run[[:space:]]+([^`[:space:]]+[[:space:]]+)*--(both|engine)([^[:alnum:]_-]|$)' -- \
            '*.md' '*.omg' ':(exclude)_recycling/**'
          refuse_matches -e '"--(both|engine)"' -- source-rust/application/tests
      - name: Check the repository archive and its boundary with active code
        run: |
          # A symlink can redirect an existing module or path dependency without editing its caller.
          if git diff --quiet HEAD^1 HEAD -- ':(glob)**/*.rs' ':(glob)**/Cargo.toml' ':(glob)**/_recycling/**' tools/ci/check_recycling.py tools/ci/test_check_recycling.py .github/workflows/admission.yml &&
             ! git diff --raw HEAD^1 HEAD | grep -E '^:(120000 |[0-9]+ 120000 )' >/dev/null; then
            exit 0
          fi
          python3 -B tools/ci/test_check_recycling.py
          python3 -B tools/ci/check_recycling.py
