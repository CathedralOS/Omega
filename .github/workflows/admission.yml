name: Admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the active workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/omega-old/
      - name: Test the V2 workspace
        run: cargo test --workspace --locked
