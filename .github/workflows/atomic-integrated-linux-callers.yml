name: Observe retained atomic source callers on Linux
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Stage the exact reviewed observer outside its program checkout
        run: |
          cp .github/atomic_integrated_linux_callers.py "$RUNNER_TEMP/atomic_integrated_linux_callers.py"
          cp .github/atomic_integrated_linux_callers.json "$RUNNER_TEMP/atomic_integrated_linux_callers.json"
          git checkout --detach 86c4ccf817c3878b15052a1d54b0e31e1cca3122
      - name: Authenticate the retained producer and capture two bounded caller snapshots
        run: python "$RUNNER_TEMP/atomic_integrated_linux_callers.py" "$RUNNER_TEMP/atomic_integrated_linux_callers.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: atomic-integrated-linux-callers-${{ github.run_id }}
          path: |
            build/atomic-integrated-linux-callers/
            !build/atomic-integrated-linux-callers/producer.zip
            !build/atomic-integrated-linux-callers/retained/**
            !build/atomic-integrated-linux-callers/source-cache/**
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
