name: Final linear compiler checks

on:
  push:
    branches:
      - work/compiler-linear-pipeline-host-proof
    paths:
      - .github/workflows/compiler-linear-pipeline-lint.yml

permissions:
  contents: read

concurrency:
  group: compiler-linear-pipeline-lint-work-proof
  cancel-in-progress: false

env:
  OMEGA_MIGRATION_REVISION: 'ff2009685ffe56afabef755a1f0496e7373700f7'
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: /tmp/ot
  CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
  CARGO_BUILD_FINGERPRINT: content
  RUST_MIN_STACK: '67108864'
  RUST_TEST_THREADS: '1'
  RAYON_NUM_THREADS: '1'

jobs:
  check:
    name: ${{ matrix.proof }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        proof:
          - workspace-clippy
          - declaration-and-product-receipts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OMEGA_MIGRATION_REVISION }}
          persist-credentials: false
      - name: Verify migration revision and pin library and corpus
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OMEGA_MIGRATION_REVISION"
          echo "Checked migration $(git rev-parse HEAD)"
          echo "Library tree $(git rev-parse HEAD:source/library)"
          echo "OMEGA_LIBRARY_ROOT=$GITHUB_WORKSPACE/source/library" >> "$GITHUB_ENV"
          echo "OMEGA_CORPUS_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Restore the upstream post-merge cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ env.OMEGA_MIGRATION_REVISION }}
          restore-keys: |
            post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Identify the pinned mbx recipe
        id: mbx-key
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the verified mbx cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/omega-mbx/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Install verified mbx
        id: install-mbx
        run: bash tools/xtask/bootstrap-mbx.sh

      - name: Lint every workspace target
        if: matrix.proof == 'workspace-clippy'
        run: mbx clippy --locked --keep-going --workspace --all-targets -- -D warnings
      - name: Verify both historical service path wire and order contracts
        if: matrix.proof == 'declaration-and-product-receipts'
        shell: bash
        run: |
          mbx test --locked -p declaration-contracts --lib segment_tests -- --nocapture \
            | tee "$RUNNER_TEMP/service-segment-tests.log"
          grep -F '2 passed; 0 failed' "$RUNNER_TEMP/service-segment-tests.log"
      - name: Exercise every product-publication library test
        if: "!cancelled() && matrix.proof == 'declaration-and-product-receipts' && steps.install-mbx.outcome == 'success'"
        run: mbx test --locked -p product-publication --lib
