name: Post-merge check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/omega-mbx/artifacts
          key: omega-mbx-Linux-X64-3c031e39b6331aacf984b8819ff7d5f3a1e8c53256243e58afc77c72272dc85b
          fail-on-cache-miss: true
      - name: Locate the installed mbx artifact
        run: |
          printf 'Installer home is %s\n' "$HOME"
          find / -xdev -type f -path '*/omega-mbx/artifacts/*/inputs.txt' -print
          find /github /__w -maxdepth 9 -type f -path '*/omega-mbx/artifacts/*/inputs.txt' -print
