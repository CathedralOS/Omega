name: Check computed fixed-array lengths

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install

jobs:
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git curl ca-certificates zstd jq
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check out the commit at the session path
        run: |
          git config --global --add safe.directory '*'
          git clone -q --filter=blob:none "https://github.com/${{ github.repository }}" /workspace/Omega
          git -C /workspace/Omega fetch -q origin "${{ github.sha }}"
          git -C /workspace/Omega checkout -q --detach "${{ github.sha }}"
      - name: Identify the mbx source and build recipe
        id: mbx-key
        working-directory: /workspace/Omega
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.OMEGA_MBX_INSTALL_CACHE }}/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Set up the host and restore main's warm build
        run: cd /workspace/Omega && bash tools/ci/session_host.sh
      - name: Build the optimized compiler for this revision
        working-directory: /workspace/Omega
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS \
            mbx build --locked -p omega --bin omega --message-format=json > "$RUNNER_TEMP/omega-artifacts.json"
          jq -es --arg compiler "$PWD/target/debug/omega" '[.[] | select(.reason=="compiler-artifact" and .target.name=="omega" and .executable==$compiler)] |
            length == 1 and (.[] | (.profile.opt_level=="1" or .profile.opt_level=="2" or .profile.opt_level=="3"))' \
            "$RUNNER_TEMP/omega-artifacts.json"
          sha256sum target/debug/omega

      - name: Run the fixed-array length fixture in both engines
        working-directory: /workspace/Omega
        shell: bash
        run: |
          set -euo pipefail
          records=$RUNNER_TEMP/array-length-results
          mkdir -p "$records"
          git rev-parse HEAD > "$records/revision.txt"
          sha256sum target/debug/omega > "$records/producer.sha256"
          jq -c 'select(.reason=="compiler-artifact" and .target.name=="omega" and .executable!=null)' "$RUNNER_TEMP/omega-artifacts.json" > "$records/artifact.json"
          fixture=tests/fixtures/run/arrays/computed_fixed_array_length
          sha256sum "$fixture/"*.omg > "$records/inputs.sha256"
          timeout 90 ./target/debug/omega run --both "$fixture/main.omg" < /dev/null > "$records/fixture.log" 2>&1
          cat "$records/fixture.log"
          grep -F 'native exit 0' "$records/fixture.log"
          grep -F 'interp exit: 0' "$records/fixture.log"
      - name: Test fixed-array proofs and lint the source compiler
        if: always()
        working-directory: /workspace/Omega
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS mbx nextest run --locked -p source-compiler -E 'test(array_lengths::)'
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS mbx clippy --locked -p source-compiler --all-targets -- -D warnings
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: computed-array-length-results
          path: ${{ runner.temp }}/array-length-results/
