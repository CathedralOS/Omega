name: Post-merge check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMEGA_MBX_INSTALL_CACHE: /tmp/omega-mbx-install

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the installer build
        id: mbx-key
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OMEGA_MBX_INSTALL_CACHE }}/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
      - name: Build and verify the installer artifact
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh

  restore:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
    steps:
      - name: Prepare the container for checkout and cache restore
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends curl ca-certificates git zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Identify the installer build
        id: mbx-key
        shell: bash
        run: printf 'key=%s\n' "$(bash tools/xtask/bootstrap-mbx.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.OMEGA_MBX_INSTALL_CACHE }}/artifacts
          key: omega-mbx-${{ runner.os }}-${{ runner.arch }}-${{ steps.mbx-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Install the verified cached binary
        shell: bash
        run: |
          set -euo pipefail
          start=$SECONDS
          timeout 100s bash tools/xtask/bootstrap-mbx.sh 2>&1 | tee "$RUNNER_TEMP/mbx-install.log"
          grep -F 'Reusing verified mbx ' "$RUNNER_TEMP/mbx-install.log"
          printf 'Installer finished in %s seconds\n' "$((SECONDS - start))"
