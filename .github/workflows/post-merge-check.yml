name: Post-merge check

# Checks main after merge, since nothing heavier than `admission` runs before
# it (wiki/drafts/designs/ci_rebuild_plan.md). One run at a time: while a run
# is active, GitHub keeps only the newest pending push, so a burst of merges
# is verified as one batch.
#
# `post-merge-check` lints the workspace and runs the lowered-route tests;
# `sample` runs one sample natively and in the interpreter; `tests` runs every
# Rust test in the workspace, only when a run is started by hand with `full`
# set. `report` writes the verdict and the batch's commits to the run summary.
#
# There is no fixture corpus and no ledger: the run measures no rows and
# publishes nothing. The run reverts nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Also run every Rust test in the workspace. Meant for after a large
          wave of merges.
        type: boolean
        default: false

permissions:
  contents: read
  # The report job reads this workflow's earlier runs to find where the last
  # judged batch ended.
  actions: read

concurrency:
  group: post-merge-check
  cancel-in-progress: false

jobs:
  post-merge-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: /tmp/ot
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            post-merge-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Check production dependency boundaries
        run: mbx xtask check-boundary
      - name: Lint every workspace target
        run: mbx clippy --locked --keep-going --workspace --all-targets -- -D warnings
      - name: Check the lowered route's verdicts on fixture programs
        run: mbx test --locked -p compiler --test lowered_route_subjects --test lowered_route_generics

  # One sample natively and in the interpreter. It builds `omega` from main's
  # restored warm build, beside the other jobs, so the compile holds up none
  # of them.
  sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git curl ca-certificates zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check out the commit at the session path
        run: |
          git config --global --add safe.directory '*'
          git clone -q --filter=blob:none "https://github.com/${{ github.repository }}" /workspace/Omega
          git -C /workspace/Omega fetch -q origin "${{ github.sha }}"
          git -C /workspace/Omega checkout -q --detach "${{ github.sha }}"
      - name: Set up the host and restore main's warm build
        run: cd /workspace/Omega && bash tools/ci/session_host.sh
      - name: Run a sample natively and in the interpreter
        run: |
          cd /workspace/Omega
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS \
            mbx xtask sample-gate --filter samples/cli/facts/length/local < /dev/null

  # Every Rust test in the workspace, only for a run started by hand with
  # `full` set: it adds most of an hour.
  tests:
    if: inputs.full
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # The container, user and path of a cloud session and of the warm-build
    # job, so main's published build is reused (tools/warm_build.sh).
    container:
      image: ubuntu:24.04
      options: --user root
    env:
      HOME: /root
    steps:
      - name: Install build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential pkg-config git curl ca-certificates zstd
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain none
          echo "/root/.cargo/bin" >> "$GITHUB_PATH"
      - name: Check out the commit at the session path
        run: |
          git config --global --add safe.directory '*'
          git clone -q --filter=blob:none "https://github.com/${{ github.repository }}" /workspace/Omega
          git -C /workspace/Omega fetch -q origin "${{ github.sha }}"
          git -C /workspace/Omega checkout -q --detach "${{ github.sha }}"
      - name: Set up the host and restore main's warm build
        run: cd /workspace/Omega && bash tools/ci/session_host.sh
      - name: Run every Rust test in the workspace
        run: |
          cd /workspace/Omega
          # A session is not a CI job: Cargo and mbx change their defaults when
          # CI is set, and the warm build was made without it.
          CARGO_TARGET_DIR=$PWD/target env -u CI -u GITHUB_ACTIONS \
            mbx test --locked --workspace --no-fail-fast < /dev/null

  report:
    needs: [post-merge-check, sample, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Deep enough to hold a batch; the base is fetched by name below
          # when it is older than this.
          fetch-depth: 100
      - name: Find the batch this run judges
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          # The batch starts where the last run that reached a verdict ended.
          # A run GitHub replaced while it waited judged nothing, so its commit
          # belongs to this batch.
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow post-merge-check.yml --branch main \
            --status completed --limit 200 --json headSha,conclusion,databaseId \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID) | select(.conclusion == \"success\" or .conclusion == \"failure\")][0].headSha // empty" || true)
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) BEFORE= ;; esac
          base=${base:-${BEFORE:-HEAD^1}}
          git cat-file -e "$base^{commit}" 2>/dev/null || git fetch -q --depth 100 origin "$base" || true
          if ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            echo "The last judged commit ($base) is not an ancestor of this one; judging the last commit alone."
            base=HEAD^1
          fi
          base=$(git rev-parse "$base")
          {
            echo "## Batch"
            echo
            echo "Commits main gained since the last judged commit \`${base:0:10}\`. A check this run reports as broken was broken by one of them."
            echo
            git log --reverse --format='- `%h` %s' "$base..HEAD"
          } | tee "$RUNNER_TEMP/batch.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Report what this batch did to main
        env:
          CHECKS: ${{ needs.post-merge-check.result }}
          SAMPLE: ${{ needs.sample.result }}
          FULL: ${{ inputs.full }}
          TESTS: ${{ needs.tests.result }}
        run: |
          red=0
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          bad() { say "- **Broken:** $1"; red=1; }
          ok() { say "- $1"; }
          say "## Post-merge verdict for \`${GITHUB_SHA:0:10}\`"
          say ""
          if [ "$CHECKS" = success ]; then
            ok "Boundaries, workspace lint and the lowered-route tests pass."
          else
            bad "the \`post-merge-check\` job failed or did not finish ($CHECKS); its log names the step."
          fi
          if [ "$SAMPLE" = success ]; then
            ok "The sample runs natively and in the interpreter."
          else
            bad "the \`sample\` job failed or did not finish ($SAMPLE)."
          fi
          if [ "$FULL" = true ]; then
            if [ "$TESTS" = success ]; then ok "Every Rust test in the workspace passes."; else bad "the workspace tests failed or did not run ($TESTS); the \`tests\` job's log names them."; fi
          fi
          say ""
          if [ "$red" = 1 ]; then
            say "### Blamed"
            say ""
            say "One of the batch's pull requests broke what is listed above. This run names the batch and does not narrow it further."
            say ""
            sed '1,/^$/d' "$RUNNER_TEMP/batch.md" | sed '1,/^$/d' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
