name: Repository lint

# RC-REPOSITORY's full lint command covers every workspace crate, test and
# example; `compiler-check` lints only the `omega` crate graph. This job runs
# only after merge, so on 2026-11-07 main went red for a day: about 40
# errors in tests, examples and sample drivers landed behind it. It now also
# runs on pull requests and in the merge queue, so `workspace-clippy` can be a
# required check. A warm run takes about 5 minutes.
#
# The `pull_request` trigger covers pushes only. `lint-when-mergeable.yml`
# dispatches this workflow when a pull request's base changes to `main` or it
# is marked ready and its head has no `workspace-clippy` run yet.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: repository-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            repository-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check formatting
        run: cargo xtask fmt --check
      - name: Lint every workspace target
        run: cargo clippy --locked --keep-going --workspace --all-targets -- -D warnings
