name: Repository lint

# RC-REPOSITORY's full lint command covers every workspace crate, test and
# example; `compiler-check` lints only the `omega` crate graph. This job runs
# only after merge, so on 2026-11-07 main went red for a day: about 40
# errors in tests, examples and sample drivers landed behind it. It now also
# runs on pull requests and in the merge queue, so `workspace-clippy` can be a
# required check. A warm run takes about 5 minutes.
#
# The `pull_request` trigger covers pushes only. `lint-when-mergeable.yml`
# dispatches this workflow when a pull request's base changes to `main` or it
# is marked ready and its head has no `workspace-clippy` run yet.
on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '41 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      # A change to prose, fixtures or the ledger compiles no Rust, so the
      # build and lint steps below have nothing to judge; they cost a runner
      # for up to 20 minutes per pull request and per merge-queue entry.
      - name: Decide whether this change touches code
        id: scope
        run: |
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != merge_group ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only HEAD^1 HEAD); then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -Ev '^(wiki/|tests/omega/|samples/)|\.md$|^$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only prose, fixtures or ledgers changed; skipping the Rust build and lint."
          fi
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.scope.outputs.code == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: repository-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            repository-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check formatting
        if: steps.scope.outputs.code == 'true'
        run: cargo xtask fmt --check
      - name: Lint every workspace target
        if: steps.scope.outputs.code == 'true'
        run: cargo clippy --locked --keep-going --workspace --all-targets -- -D warnings
