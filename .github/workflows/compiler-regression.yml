name: Compiler regression

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      cleanup:
        description: Qualify ordered cleanup on Windows and Linux instead of the small smoke
        type: boolean
        default: false

permissions:
  contents: read

# Finish the active observation. GitHub keeps only the newest pending run, so
# a busy main does not start one cold executable build for every queued PR.
concurrency:
  group: compiler-regression-${{ github.ref }}-${{ inputs.cleanup }}
  cancel-in-progress: false

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.cleanup && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      # Keep generated package outputs below Windows link.exe's path limit.
      CARGO_TARGET_DIR: ${{ matrix.runner == 'windows-2025' && 'D:/ot' || '/tmp/ot' }}
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '2'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check smoke report refusal paths
        run: python tools/tests/test_compiler_pilot.py -v
      - name: Execute native and Terminal smoke with rejection controls
        if: ${{ !inputs.cleanup }}
        run: python tools/ci/compiler_pilot.py
      - name: Execute ordered cleanup with rejection controls
        if: inputs.cleanup
        run: python tools/ci/compiler_cleanup.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compiler-regression-${{ runner.os }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            build/compiler-cleanup/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
