name: Post-merge smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      qualification_corpus:
        description: Exact comma-separated tier/group/fixture checking selection
        type: string
        default: ''
      qualification_runtime:
        description: Exact comma-separated tier/group/fixture native and Psi selection
        type: string
        default: ''
      qualification_samples:
        description: Exact comma-separated samples/project directories for ordinary CLI execution
        type: string
        default: ''
      qualification_target:
        description: Matching executor, or all four hosted targets
        type: choice
        options: [all, linux_x86_64, windows_x86_64, macos_arm64, linux_arm64]
        default: all
      qualification_controls:
        description: Optional reviewed wrong-branch plan; include its three good runtime fixtures
        type: string
        default: ''
      provider_tests:
        description: Also run the existing focused Rust provider and ABI checks
        type: boolean
        default: false

permissions:
  contents: read

# Finish the active observation. GitHub keeps only the newest pending run, so
# a busy main does not start one cold executable build for every queued PR.
concurrency:
  group: compiler-regression-${{ github.ref }}-${{ (inputs.qualification_corpus != '' || inputs.qualification_runtime != '' || inputs.qualification_samples != '' || inputs.qualification_controls != '') && github.run_id || 'ordinary' }}-${{ inputs.provider_tests || false }}
  cancel-in-progress: false

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        runner: >-
          ${{ (inputs.qualification_corpus != '' || inputs.qualification_runtime != '' || inputs.qualification_samples != '' || inputs.qualification_controls != '')
                 && (inputs.qualification_target == 'all' && fromJSON('["ubuntu-24.04","windows-2025","macos-15","ubuntu-24.04-arm"]')
                     || fromJSON('{"linux_x86_64":["ubuntu-24.04"],"windows_x86_64":["windows-2025"],"linux_arm64":["ubuntu-24.04-arm"],"macos_arm64":["macos-15"]}')[inputs.qualification_target])
              || inputs.provider_tests && fromJSON('["ubuntu-24.04","windows-2025"]')
              || fromJSON('["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    # Windows used 30 minutes building, completed both corpus legs, then hit
    # 45 minutes during public CLI controls. Keep time for those and cache upload.
    timeout-minutes: ${{ matrix.runner == 'windows-2025' && 60 || 45 }}
    env:
      CARGO_BUILD_JOBS: '2'
      # Keep generated package outputs below Windows link.exe's path limit.
      CARGO_TARGET_DIR: ${{ matrix.runner == 'windows-2025' && 'D:/ot' || '/tmp/ot' }}
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '2'
      # Per-fixture wall-clock cap for the corpus runner (default 120 s). Each
      # smoke fixture re-checks the bundled std library, and on this 2-vCPU
      # runner that alone takes 55-117 s (passing runs, 2026-11-02..05), so the
      # default turned speed into a coin flip: the same fixtures passed and
      # timed out on alternate merges. This gate checks outcomes, not speed;
      # 300 s keeps ~2.5x headroom and still fails a real hang well inside the
      # job timeout. The adaptive 3x-golden cap cannot help: those goldens were
      # recorded on a much faster macOS host (11-16 s).
      OMEGA_CORPUS_FIXTURE_SECS: '300'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore compiler build cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os == 'macOS' && 'compiler-regression-macos15' || 'compiler-regression' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Install verified mbx
        shell: bash
        run: bash tools/xtask/bootstrap-mbx.sh
      - name: Test qualification guards
        if: inputs.qualification_corpus != '' || inputs.qualification_runtime != '' || inputs.qualification_samples != '' || inputs.qualification_controls != ''
        run: mbx test --locked -p xtask
      - name: Execute exact requested programs
        if: inputs.qualification_corpus != '' || inputs.qualification_runtime != '' || inputs.qualification_samples != '' || inputs.qualification_controls != ''
        shell: bash
        env:
          QUALIFICATION_CORPUS: ${{ inputs.qualification_corpus }}
          QUALIFICATION_RUNTIME: ${{ inputs.qualification_runtime }}
          QUALIFICATION_SAMPLES: ${{ inputs.qualification_samples }}
          QUALIFICATION_CONTROLS: ${{ inputs.qualification_controls }}
        run: |
          set -euo pipefail
          arguments=(qualify --output build/qualification)
          if [ -n "$QUALIFICATION_CORPUS" ]; then arguments+=(--corpus "$QUALIFICATION_CORPUS"); fi
          if [ -n "$QUALIFICATION_RUNTIME" ]; then arguments+=(--runtime "$QUALIFICATION_RUNTIME"); fi
          if [ -n "$QUALIFICATION_SAMPLES" ]; then arguments+=(--samples "$QUALIFICATION_SAMPLES"); fi
          if [ -n "$QUALIFICATION_CONTROLS" ]; then arguments+=(--runtime-controls "$QUALIFICATION_CONTROLS"); fi
          mbx xtask "${arguments[@]}"
      - name: Execute length sample with native/Psi agreement and rejection control
        if: ${{ inputs.qualification_corpus == '' && inputs.qualification_runtime == '' && inputs.qualification_samples == '' && inputs.qualification_controls == '' }}
        run: |
          mbx test --locked -p xtask samples::tests
          mbx xtask sample-gate --filter samples/cli/facts/length/local
      # The checker on the lowered form must judge every declaration of the
      # checked package, not only what the entry calls. These fixture
      # compilations are the only test of that, and no other job runs the
      # `compiler` crate's tests (#2379, #2386).
      - name: Check the lowered route's verdicts on fixture programs
        if: ${{ inputs.qualification_corpus == '' && inputs.qualification_runtime == '' && inputs.qualification_samples == '' && inputs.qualification_controls == '' }}
        run: mbx test --locked -p compiler --test lowered_route_subjects
      - name: Check native provider frames and retained mapped homes
        if: inputs.provider_tests
        run: mbx test --locked -p native-compiler -p machine-emission -p native-provider-runtime
      - name: Check typed scalar aggregate result boundaries
        if: inputs.provider_tests
        run: |
          mbx test --locked -p terminal-interpreter scalar_aggregate_tests
          mbx test --locked -p runtime-abi integer_division
          mbx test --locked -p terminal-runtime scalar_record
          mbx test --locked -p runtime-abi network_address
          mbx test --locked -p terminal-runtime network_address
      - name: Check native provider record correspondence
        if: inputs.provider_tests
        run: mbx test --locked -p terminal-runtime native_provider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/qualification/
            build/sample-gate-runs/
            build/corpus-runs/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # A runtime rejection or cancellation must not discard a cold Rust build.
      # Every next observation still rebuilds through Cargo's content checks
      # and validates the actual executable/profile before running programs.
      - name: Preserve compiler build cache
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' && steps.compiler-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
