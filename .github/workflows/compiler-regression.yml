name: Post-merge smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
    inputs:
      cleanup:
        description: Qualify ordered cleanup on Windows and Linux instead of the small smoke
        type: boolean
        default: false
      foreign_records:
        description: Qualify libc scalar-record results on Ubuntu and Windows
        type: boolean
        default: false
      foreign_records_only:
        description: Run only the scalar/opaque corpus and public CLI controls, omitting broader provider/backing sweeps
        type: boolean
        default: false
      foreign_record_cohorts:
        description: Comma-separated scalar-opaque,nested,arrays,zero-leaf (or all); applies to foreign_records
        type: string
        default: scalar-opaque
      foreign_record_fixtures:
        description: Optional exact comma-separated corpus IDs; diagnostic subset, not full cohort qualification
        type: string
        default: ''
      foreign_record_target:
        description: Native host for foreign_records; default preserves the existing host selection
        type: choice
        options: [default, linux_x86_64, windows_x86_64, linux_arm64]
        default: default
      runtime_value_generics:
        description: Qualify runtime Value indices on all four existing hosted targets
        type: boolean
        default: false
      linux_arm64:
        description: Run the selected cohort on native Linux ARM64
        type: boolean
        default: false

permissions:
  contents: read

# Finish the active observation. GitHub keeps only the newest pending run, so
# a busy main does not start one cold executable build for every queued PR.
concurrency:
  group: compiler-regression-${{ github.ref }}-${{ inputs.cleanup }}-${{ inputs.foreign_records }}-${{ inputs.linux_arm64 }}-${{ inputs.runtime_value_generics }}-${{ inputs.foreign_records_only }}-${{ inputs.foreign_record_cohorts }}-${{ inputs.foreign_record_target }}-${{ inputs.foreign_record_fixtures && github.run_id || 'full' }}
  cancel-in-progress: false

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        # An explicit foreign host selects runner data for the same pipeline.
        # It lets a corrected Linux observation proceed while a cold Windows
        # build finishes, without starting another Windows build or canceling it.
        runner: >-
          ${{ inputs.runtime_value_generics && fromJSON('["ubuntu-24.04", "windows-2025", "macos-14", "ubuntu-24.04-arm"]')
              || inputs.foreign_records && inputs.foreign_record_target && inputs.foreign_record_target != 'default'
                 && (fromJSON('{"linux_x86_64":["ubuntu-24.04"],"windows_x86_64":["windows-2025"],"linux_arm64":["ubuntu-24.04-arm"]}')[inputs.foreign_record_target] || fromJSON('[]'))
              || fromJSON(inputs.linux_arm64 && '["ubuntu-24.04-arm"]' || (inputs.cleanup || inputs.foreign_records) && '["ubuntu-24.04", "windows-2025"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    # Windows used 30 minutes building, completed both corpus legs, then hit
    # 45 minutes during public CLI controls. Keep time for those and cache upload.
    timeout-minutes: ${{ matrix.runner == 'windows-2025' && 60 || 45 }}
    env:
      CARGO_BUILD_JOBS: '2'
      # Keep generated package outputs below Windows link.exe's path limit.
      CARGO_TARGET_DIR: ${{ matrix.runner == 'windows-2025' && 'D:/ot' || '/tmp/ot' }}
      CARGO_INCREMENTAL: '0'
      CARGO_UNSTABLE_CHECKSUM_FRESHNESS: 'true'
      CARGO_BUILD_FINGERPRINT: content
      OMEGA_CORPUS_JOBS: '2'
      RUST_MIN_STACK: '67108864'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Restore compiler build cache
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - name: Check smoke report refusal paths
        run: |
          python tools/tests/test_compiler_pilot.py -v
          python tools/tests/test_compiler_runtime_value_generics.py -v
          python tools/tests/test_compiler_foreign_records.py -v
      - name: Execute native and Terminal smoke with rejection controls
        if: ${{ !inputs.cleanup && !inputs.foreign_records && !inputs.runtime_value_generics }}
        run: python tools/ci/compiler_pilot.py
      - name: Execute ordered cleanup with rejection controls
        if: ${{ inputs.cleanup && !inputs.foreign_records && !inputs.runtime_value_generics }}
        run: python tools/ci/compiler_cleanup.py
      - name: Check native provider frames and retained mapped homes
        if: ${{ inputs.foreign_records && !inputs.foreign_records_only }}
        run: cargo test --locked -p native-production -p machine-emission -p native-provider-runtime
      - name: Check typed scalar aggregate result boundaries
        if: ${{ inputs.foreign_records && !inputs.foreign_records_only && !inputs.runtime_value_generics }}
        run: |
          cargo test --locked -p terminal-interpreter scalar_aggregate_tests
          cargo test --locked -p runtime-abi integer_division
          cargo test --locked -p terminal-runtime scalar_record
          cargo test --locked -p runtime-abi network_address
          cargo test --locked -p terminal-runtime network_address
      - name: Check native provider record correspondence
        if: ${{ inputs.foreign_records && !inputs.foreign_records_only }}
        run: cargo test --locked -p terminal-runtime native_provider
      - name: Execute retained original foreign backing with rejection controls
        if: ${{ inputs.foreign_records && !inputs.foreign_records_only }}
        run: python tools/ci/compiler_retained_foreign.py
      # These cohorts are independent. Retain an earlier failed observation
      # while still measuring the scalar/opaque rows on this matching host.
      - name: Execute foreign record results with rejection controls
        if: ${{ inputs.foreign_records && !inputs.runtime_value_generics && !cancelled() }}
        env:
          OMEGA_FOREIGN_RECORD_COHORTS: ${{ inputs.foreign_record_cohorts || 'scalar-opaque' }}
          OMEGA_FOREIGN_RECORD_FIXTURES: ${{ inputs.foreign_record_fixtures }}
        run: python tools/ci/compiler_foreign_records.py
      - name: Execute runtime Value data indices with rejection controls
        if: inputs.runtime_value_generics
        run: python tools/ci/compiler_runtime_value_generics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: compiler-regression-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/compiler-pilot/
            build/compiler-cleanup/
            build/compiler-foreign-records/
            build/compiler-retained-foreign/
            build/compiler-runtime-value-generics/
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      # A runtime rejection or cancellation must not discard a cold Rust build.
      # Every next observation still rebuilds through Cargo's content checks
      # and validates the actual executable/profile before running programs.
      - name: Preserve compiler build cache
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' && steps.compiler-cache.outputs.cache-primary-key != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
