<html>
<head><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div id="root" class="om-row"></div>
<script>
  var O = window.Omega, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(O.Button, { variant: 'solid' }, 'Run natively'),

    h(O.Button, { variant: 'solid', disabled: true }, 'Run natively')));
</script>
</body>
