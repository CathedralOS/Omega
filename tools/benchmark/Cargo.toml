[package]
name = "omega-bench"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega-bench"

[features]
fixtures = []

[[bin]]
name = "benchmark-probe"
path = "tests/fixtures/probe.rs"
required-features = ["fixtures"]
test = false

[[test]]
name = "runner"
required-features = ["fixtures"]

[dependencies]
bounded-process = { path = "../../omega-rust/omega/foundation/bounded-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
