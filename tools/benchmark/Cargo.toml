[package]
name = "omega-bench"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega-bench"

[features]
fixtures = []

[[bin]]
name = "omega-bench-workload"
path = "src/workloads.rs"

[[bin]]
name = "benchmark-probe"
path = "tests/fixtures/probe.rs"
required-features = ["fixtures"]
test = false

[[test]]
name = "runner"
required-features = ["fixtures"]

[dependencies]
declaration-contracts = { path = "../../omega-rust/psi/compilation/representations/declaration-contracts" }
arena = { path = "../../omega-rust/psi/foundation/arena" }
source-admission = { path = "../../omega-rust/psi/compilation/representations/source-admission" }
source-compiler = { path = "../../omega-rust/psi/compilation/pipeline/source-compilation" }
bounded-process = { path = "../../omega-rust/omega/host-support/bounded-process" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
