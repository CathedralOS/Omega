flow-effects = { path = "../../omega-rust/psi/representations/flow-effects" }
language-core = { path = "../../omega-rust/psi/foundation/language-core" }
language-semantics = { path = "../../omega-rust/psi/foundation/language-semantics" }
source-files-to-tokens = { path = "../../omega-rust/psi/pipeline/source-files-to-tokens" }
