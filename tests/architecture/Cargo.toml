[package]
name = "omega-architecture-test"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

# Repository-wide architecture checks live under the repository-wide test root,
# not among the compiler's production crates.

[[test]]
name = "layering"
path = "layering.rs"

[[test]]
name = "representation_ownership"
path = "representation_ownership.rs"

[[test]]
name = "optimizer_source_organization"
path = "optimizer_source_organization/mod.rs"

[[test]]
name = "optimizer_rollout"
path = "optimizer_rollout/mod.rs"

[[test]]
name = "package_source_organization"
path = "package_source_organization.rs"

[[test]]
name = "semantic_taxonomy_inventory"
path = "semantic_taxonomy_inventory.rs"

[[test]]
name = "validation_integration"
path = "validation_integration.rs"

[[test]]
name = "conformance_application_identity"
path = "conformance_application_identity.rs"

[[test]]
name = "compact_identity_inventory"
path = "compact_identity_inventory.rs"

[[test]]
name = "native_image_identity"
path = "native_image_identity.rs"

[[test]]
name = "anchor_headers"
path = "anchor_headers.rs"

