[package]
name = "omega"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega"

[[bin]]
name = "omega"
path = "src/main.rs"
test = true

[dependencies]
native-provider-sponsor = { path = "../host-support/native-provider-sponsor" }
worker-budget = { path = "../subsystems/compiler/foundation/worker-budget" }
orchestration = { path = "../build-system/orchestration" }
terminal-runtime = { path = "../subsystems/interpreter/host" }
mimalloc = { version = "0.1", default-features = false }
bounded-process = { path = "../foundation/bounded-process" }
compiler = { path = "../subsystems/compiler" }
project-build = { path = "../subsystems/compiler/build" }
products = { path = "../compilation/products" }
artifacts = { path = "../subsystems/compiler/foundation/measurements" }
platform-custody = { path = "../foundation/filesystem" }
package-manager = { path = "../subsystems/package-manager" }
source-acquisition = { path = "../subsystems/package-manager/source-acquisition" }
package-compilation = { path = "../subsystems/compiler/build/package-compilation" }
resolver-execution = { path = "../subsystems/package-manager/source-acquisition/git/execution" }
target = { path = "../subsystems/compiler/psi-to-native/targets/target" }
semantic-vocabulary = { path = "../subsystems/compiler/foundation/semantic-records" }
diagnostics = { path = "../foundation/diagnostics" }
terminal-codec = { path = "../subsystems/compiler/psi/codec" }
terminal-psi = { path = "../subsystems/compiler/psi" }
terminal-semantics = { path = "../subsystems/compiler/psi/semantics" }
psi-authorization = { path = "../subsystems/compiler/psi/authorization" }
terminal-installation = { path = "../subsystems/compiler/psi-admission" }

[target.'cfg(windows)'.dev-dependencies]
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading",
] }
