source-text = { path = "../../foundation/source-text" }
target = { path = "psi-to-native/targets/target" }
terminal-codec = { path = "psi/codec" }
psi-authorization = { path = "psi/authorization" }

[dev-dependencies]
source-compiler = { path = "source-to-psi", features = ["test-support"] }
provider-demand = { path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs/provider-demand" }
host-provider-inputs = { path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs/host-providers" }
