[package]
name = "compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "compiler.rs"

[dependencies]
compiler-identity = { path = "foundation/compiler-identity" }
review-evidence = { path = "../package-manager/review/evidence" }
provider-acceptance = { path = "build/providers/acceptance" }
psi-entry-memory = { path = "psi/access/entry-memory" }
diagnostics = { path = "../../foundation/diagnostics" }
native-compiler = { path = "psi-to-native" }
product-publication = { path = "build/build-output/product-publication" }
semantic-vocabulary = { path = "foundation/semantic-records" }
source-admission = { path = "source-to-psi/pipeline/representations/source-files/custody" }
