build-evaluation-result = { path = "build/execution/result" }
direct-boundary-bindings = { path = "psi-to-native/verification/provider-correspondence/direct-boundaries" }
project-build = { path = "build" }
target-provider-admission = { path = "psi-to-native/verification/target-providers" }
selected-provider-plans = { path = "build/providers/selections" }
provider-plans = { path = "build/providers/plans" }
source-provenance = { path = "foundation/source-provenance" }
psi-provider-selections = { path = "psi/providers" }
evaluation-accounting = { path = "build/evaluation/accounting" }
native-intrinsics = { path = "psi-to-native/targets/intrinsics" }
entry-planning = { path = "psi-to-native/pipeline/09_post-allocation-machine-to-framed-machine/entry-planning" }
native-encoding = { path = "psi-to-native/pipeline/11_bound-framed-machine-to-selected-form-encoding" }
