[package]
name = "compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "compiler.rs"

[dependencies]
diagnostics = { path = "../../foundation/diagnostics" }
native-compiler = { path = "psi-to-native" }
product-publication = { path = "build/build-output/product-publication" }
semantic-vocabulary = { path = "foundation/semantic-records" }
source-admission = { path = "source-to-psi/pipeline/representations/source-files/custody" }
source-compiler = { path = "source-to-psi" }
source-text = { path = "../../foundation/source-text" }
target = { path = "psi-to-native/targets/target" }
terminal-codec = { path = "psi/codec" }
psi-authorization = { path = "psi/authorization" }
terminal-installation = { path = "psi-admission" }

[dev-dependencies]
native-scalar-inputs = { path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs/scalar-applications" }
host-provider-inputs = { path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs/host-providers" }
native-inputs = { package = "psi-to-admitted-native-inputs", path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs" }
native-compiler = { path = "psi-to-native", features = ["test-support"] }
optimization-selections = { path = "foundation/optimization-selections" }
provider-realization = { package = "admitted-native-inputs-to-target-bound-program", path = "psi-to-native/pipeline/01_admitted-native-inputs-to-target-bound-program" }

[[test]]
name = "build_charge"
path = "tests/process/build_charge.rs"
harness = false

[[test]]
name = "build_session"
path = "tests/process/build_session.rs"
harness = false

[[test]]
name = "default_build"
path = "tests/process/default_build.rs"
harness = false

[[test]]
name = "executed_git_source"
path = "tests/process/executed_git_source.rs"
harness = false

[[test]]
name = "package_batch_sources"
path = "tests/process/package_batch_sources.rs"
harness = false

[[test]]
name = "terminal_sharing"
path = "tests/process/terminal_sharing.rs"
harness = false
