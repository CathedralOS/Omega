[package]
name = "compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "compiler.rs"

[dependencies]
compiler-identity = { path = "foundation/compiler-identity" }
review-evidence = { path = "../package-manager/review/evidence" }
provider-acceptance = { path = "build/providers/acceptance" }
psi-entry-memory = { path = "psi-execution-inputs/entry-memory" }
diagnostics = { path = "../../foundation/diagnostics" }
native-compiler = { path = "psi-to-native" }
product-publication = { path = "build/publication" }
semantic-vocabulary = { path = "foundation/semantic-records" }
source-admission = { path = "source-to-psi/representations/source-files/custody" }
source-compiler = { path = "source-to-psi" }
source-text = { path = "../../foundation/source-text" }
target = { path = "psi-to-native/targets/target" }
terminal-codec = { path = "psi-artifact/codec" }
psi-authorization = { path = "psi-artifact/authorization" }

[dev-dependencies]
symbols = { path = "foundation/declaration-identity" }
terminal-psi = { path = "psi" }
source-compiler = { path = "source-to-psi", features = ["test-support"] }
target-provider-admission = { path = "psi-to-native/verification/target-providers" }
source-provenance = { path = "foundation/source-provenance" }
native-scalar-inputs = { path = "psi-to-native/pipeline/00_psi-to-admitted-native-inputs/scalar-applications" }
optimization-selections = { path = "foundation/optimization-selections" }
provider-realization = { package = "admitted-native-inputs-to-target-bound-program", path = "psi-to-native/pipeline/01_admitted-native-inputs-to-target-bound-program" }
