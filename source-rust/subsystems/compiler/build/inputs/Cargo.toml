[package]
name = "package-compilation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "inputs.rs"

[dependencies]
build-providers = { path = "../providers" }
build-model = { path = "../model" }
retained-product-selections = { path = "../../source-to-psi/representations/retained-product-selections" }
source-declarations = { path = "../../source-to-psi/representations/symbol-resolved-trees/declarations" }
source-symbol-table = { path = "../../source-to-psi/representations/symbol-resolved-trees/symbol-table" }
build-program-launch = { path = "../evaluation/authority/program" }
build-consent = { path = "../evaluation/authority/consent" }
normalized-build-settings = { path = "../settings/normalized" }
language-core = { path = "../../foundation/language-core" }
declaration-scope = { path = "../../foundation/declaration-scope" }
source-provenance = { path = "../../foundation/source-provenance" }
optimization-requests = { path = "../settings/optimizations" }
source-admission = { path = "../../source-to-psi/representations/source-files/custody" }
source-text = { path = "../../../../foundation/source-text" }
wire = { path = "../../../../foundation/wire" }
record-storage = { path = "../../../../foundation/record-storage" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
source-acquisition = { path = "../../../package-manager/source-acquisition" }
artifacts = { path = "../../foundation/measurements" }
optimization-selections = { path = "../../foundation/optimization-selections" }
arena = { path = "../../../../foundation/arena" }
symbols = { path = "../../foundation/declaration-identity" }
source-compiler = { path = "../../source-to-psi" }
build-declarations = { path = "declarations" }
build-output = { path = "trees" }
platform-custody = { path = "../../../../foundation/filesystem" }
target = { path = "../../psi-to-native/targets/target" }
filesystem-authority = { path = "../evaluation/authority/filesystem" }
semantic-vocabulary = { path = "../../foundation/semantic-records" }
terminal-psi = { path = "../../psi" }
diagnostics = { path = "../../../../foundation/diagnostics" }
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
cap-primitives = "4.0.3"

[dev-dependencies]
source-compiler = { path = "../../source-to-psi", features = ["test-support"] }
