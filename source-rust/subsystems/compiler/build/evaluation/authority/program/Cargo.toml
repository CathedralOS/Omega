[package]
name = "build-program-launch"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bounded-process = { path = "../../../../../../foundation/bounded-process" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"

# Only the Linux namespace supervisor writes its request and status files and
# stages its scratch directory; other hosts refuse to confine a Build program.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
platform-custody = { path = "../../../../../../foundation/filesystem" }
serde_json = "1"

[[test]]
name = "confined"
harness = false
