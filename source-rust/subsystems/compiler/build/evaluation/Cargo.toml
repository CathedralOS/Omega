[package]
name = "build-execution"
edition.workspace = true
license.workspace = true
version.workspace = true


[lib]
path = "execution.rs"

[dependencies]
build-filesystem = { path = "../filesystem" }
build-time-evaluation = { path = "../build-time" }
build-model = { path = "../model" }
language-core = { path = "../../foundation/language-core" }
build-program-launch = { path = "authority/program" }
bounded-process = { path = "../../../../foundation/bounded-process" }
build-settings = { path = "../settings" }
build-evaluation-result = { path = "result" }
psi-authorization = { path = "../../psi/artifact/authorization" }
psi-provider-selections = { path = "../../psi/execution-inputs/providers" }
psi-target-layouts = { path = "../../psi/execution-inputs/target-layouts" }
declaration-scope = { path = "../../foundation/declaration-scope" }
source-provenance = { path = "../../foundation/source-provenance" }
source-admission = { path = "../../source-to-psi/representations/source-files/custody" }
source-text = { path = "../../../../foundation/source-text" }
terminal-interpreter = { path = "../../../interpreter" }
terminal-semantics = { path = "../../psi/semantics" }
terminal-work = { path = "../../psi/semantics/work" }
terminal-codec = { path = "../../psi/artifact/codec" }
syntax-trees = { path = "../../source-to-psi/representations/syntax-trees" }
source-compiler = { path = "../../source-to-psi" }
artifacts = { path = "../../foundation/measurements" }
package-compilation = { path = "../inputs" }
target = { path = "../../psi-to-native/targets/target" }
runtime-abi = { path = "../../psi-to-native/targets/runtime-abi" }
diagnostics = { path = "../../../../foundation/diagnostics" }
semantic-vocabulary = { path = "../../foundation/semantic-records" }
terminal-psi = { path = "../../psi" }
symbols = { path = "../../foundation/declaration-identity" }

[dev-dependencies]
tokens = { path = "../../source-to-psi/representations/tokens" }
source-compiler = { path = "../../source-to-psi", features = ["test-support"] }
