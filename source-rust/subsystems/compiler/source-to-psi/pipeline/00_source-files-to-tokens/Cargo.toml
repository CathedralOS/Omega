[package]
name = "source-lexer"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
autotests = false
autobenches = false

[dependencies]
source-files = { path = "../../representations/source-files" }
diagnostics = { path = "../../../../../foundation/diagnostics" }
memchr = "2"
source-text = { path = "../../../../../foundation/source-text" }
tokens = { path = "../../representations/tokens" }

[[test]]
name = "lexing_byte_inputs"
path = "tests/byte_inputs.rs"

[[test]]
name = "lexing_lexing"
path = "tests/lexing.rs"

[[test]]
name = "lexing_source_batches"
path = "tests/source_batches.rs"

[[test]]
name = "lexing_source_coverage"
path = "tests/source_coverage.rs"

[[test]]
name = "lexing_token_boundaries"
path = "tests/token_boundaries.rs"
