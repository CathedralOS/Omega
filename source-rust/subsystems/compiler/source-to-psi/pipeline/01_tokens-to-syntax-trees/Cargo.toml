[package]
name = "source-parser"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false
autotests = false
autobenches = false

[dependencies]
arena = { path = "../../../../../foundation/arena" }
diagnostics = { path = "../../../../../foundation/diagnostics" }
worker-budget = { path = "../../../foundation/worker-budget" }
language-core = { path = "../../../foundation/language-core" }
numeric-literals = { path = "../../../foundation/numeric-literals" }
numerics = { path = "../../../foundation/numerics" }
rayon = "1.11"
source-text = { path = "../../../../../foundation/source-text" }
symbols = { path = "../../../foundation/declaration-identity" }
syntax-trees = { path = "../../representations/syntax-trees" }
tokens = { path = "../../representations/tokens" }

[dev-dependencies]
serde_json = "1"
source-files = { path = "../../representations/source-files" }
source-lexer = { path = "../00_source-files-to-tokens" }

[[test]]
name = "parsing_diagnostics"
path = "tests/diagnostics.rs"

[[test]]
name = "parsing_lexical_handoff"
path = "tests/lexical_handoff.rs"

[[test]]
name = "parsing_operator_grouping"
path = "tests/operator_grouping.rs"

[[test]]
name = "parsing_positional_patterns"
path = "tests/positional_patterns.rs"

[[test]]
name = "parsing_sample_files"
path = "tests/sample_files.rs"

[[test]]
name = "parsing_stage_contract"
path = "tests/stage_contract.rs"
