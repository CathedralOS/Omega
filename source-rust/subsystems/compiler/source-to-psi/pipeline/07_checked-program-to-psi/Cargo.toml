[package]
name = "checked-program-to-psi"
edition.workspace = true
license.workspace = true
version.workspace = true
autotests = false
autoexamples = false
autobenches = false

[lib]
path = "lib.rs"

[features]
test-support = ["typed-trees-to-lowered-program/test-support", "lowered-program-to-checked-program/test-support"]

[dependencies]
source-provider-publication = { path = "../../publication/target-providers" }
psi-authorization = { path = "../../../psi/authorization" }
psi-provider-selections = { path = "../../../psi/providers" }
service-surface = { path = "../../../psi/service-surface" }
declaration-scope = { path = "../../../foundation/declaration-scope" }
numeric-literals = { path = "../../../foundation/numeric-literals" }
typed-trees-to-lowered-program = { path = "../05_typed-trees-to-lowered-program" }
source-declarations = { path = "../../representations/symbol-resolved-trees/declarations" }
source-symbol-table = { path = "../../representations/symbol-resolved-trees/symbol-table" }
typed-trees = { path = "../../representations/typed-trees" }
source-provenance = { path = "../../../foundation/source-provenance" }
evaluation-receipts = { path = "../../../build/evaluation/receipts" }
source-admission = { path = "../../representations/source-files/custody" }
source-text = { path = "../../../../../foundation/source-text" }
wire = { path = "../../../../../foundation/wire" }
arena = { path = "../../../../../foundation/arena" }
record-storage = { path = "../../../../../foundation/record-storage" }
diagnostics = { path = "../../../../../foundation/diagnostics" }
language-core = { path = "../../../foundation/language-core" }
numerics = { path = "../../../psi/semantics/numeric" }
optimization = { path = "../../../psi/optimization-selections" }
semantic-vocabulary = { path = "../../../foundation/semantic-records" }
symbols = { path = "../../../foundation/declaration-identity" }
terminal-check-tables = { path = "../../representations/lowered-program" }
terminal-codec = { path = "../../../psi/codec" }
terminal-psi = { path = "../../../psi" }
terminal-semantics = { path = "../../../psi/semantics" }
lowered-program-to-checked-program = { path = "../06_lowered-program-to-checked-program" }

[dev-dependencies]
evaluation-admission = { path = "../../../build/evaluation/admission" }
psi-provider-selections = { path = "../../../psi/providers" }
bundled-declarations = { path = "../../representations/source-files/bundled-declarations" }
syntax-trees-to-symbol-resolved-trees = { path = "../02_syntax-trees-to-symbol-resolved-trees", features = ["test-support"] }
symbol-resolved-trees-to-typed-trees = { path = "../03_symbol-resolved-trees-to-typed-trees", features = ["test-support"] }
typed-trees-to-typed-trees = { path = "../04_typed-trees-to-typed-trees", features = ["test-support"] }
source-parser = { path = "../01_tokens-to-syntax-trees" }
source-lexer = { path = "../00_source-files-to-tokens" }
syntax-trees = { path = "../../representations/syntax-trees" }
tokens = { path = "../../representations/tokens" }
typed-trees-to-lowered-program = { path = "../05_typed-trees-to-lowered-program", features = ["test-support"] }
lowered-program-to-checked-program = { path = "../06_lowered-program-to-checked-program", features = ["test-support"] }
