[package]
name = "access-admission"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "access_admission"
path = "src/lib.rs"

[features]
test-support = ["layout-plans/test-support"]

[dependencies]
access-vocabulary = { path = "../language/access-vocabulary" }
schema-reflection = { path = "../language/schema-reflection" }
extent-contracts = { path = "../language/extent-contracts" }
wire = { path = "../../../../foundation/wire" }
record-storage = { path = "../../../../foundation/record-storage" }
language-core = { path = "../language/source-vocabulary" }
layout-plans = { path = "../../../psi/layout" }
optimization = { path = "../../representations/psi/optimization-selections" }
semantic-vocabulary = { path = "../language/semantic-vocabulary" }

[dev-dependencies]
access-admission = { path = ".", features = ["test-support"] }
storage-access = { path = "../../runtime/storage-access" }
layout-plans = { path = "../../../psi/layout", features = ["test-support"] }
