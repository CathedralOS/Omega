bignum = { path = "../../../foundation/bignum" }
arena = { path = "../../../foundation/arena" }
record-storage = { path = "../../../foundation/record-storage" }
diagnostics = { path = "../../../foundation/diagnostics" }
worker-budget = { path = "../foundation/worker-budget" }
