[package]
name = "source-compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "source_to_psi.rs"

[features]
test-support = [
    "lowered-program-to-checked-program/test-support",
    "symbol-resolved-trees/test-support",
    "syntax-trees-to-symbol-resolved-trees/test-support",
    "symbol-resolved-trees-to-typed-trees/test-support",
    "prepared-typed-trees-to-lowered-program/test-support",
]

[dependencies]
retained-product-selections = { path = "representations/retained-product-selections" }
artifacts = { path = "../foundation/measurements" }
evaluation-work = { path = "../build/evaluation/accounting/work" }
build-invocation = { path = "../build/evaluation/invocations" }
evaluation-accounting = { path = "../build/evaluation/accounting" }
evaluation-admission = { path = "../build/evaluation/authority/admission" }
psi-authorization = { path = "../psi/artifact/authorization" }
psi-provider-selections = { path = "../psi/execution-inputs/providers" }
psi-scalar-applications = { path = "../psi/execution-inputs/scalar-applications" }
psi-target-layouts = { path = "../psi/execution-inputs/target-layouts" }
access-admission = { path = "../psi/access/validated-placements" }
access-vocabulary = { path = "../psi/access/policies" }
schema-reflection = { path = "../psi/types/reflection" }
source-completion-accounting = { path = "representations/evaluation-receipts" }
build-scalar-evaluation = { path = "../build/evaluation/scalars" }
build-time-values = { path = "../build/evaluation/values" }
build-value-projection = { path = "../build/evaluation/values/projection" }
service-surface = { path = "../psi/interfaces/service-surface" }
source-provenance = { path = "../foundation/source-provenance" }
declaration-scope = { path = "../foundation/declaration-scope" }
source-files = { path = "representations/source-files" }
checked-program-to-psi = { path = "pipeline/07_checked-program-to-psi" }
lowered-program-to-checked-program = { path = "pipeline/06_lowered-program-to-checked-program" }
prepared-typed-trees-to-lowered-program = { path = "pipeline/05_prepared-typed-trees-to-lowered-program" }
typed-trees-to-prepared-typed-trees = { path = "pipeline/04_typed-trees-to-prepared-typed-trees" }
symbol-resolved-trees-to-typed-trees = { path = "pipeline/03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "pipeline/02_syntax-trees-to-symbol-resolved-trees" }
source-declarations = { path = "representations/symbol-resolved-trees/declarations" }
source-symbol-table = { path = "representations/symbol-resolved-trees/symbol-table" }
symbol-resolved-trees = { path = "representations/symbol-resolved-trees" }
typed-trees = { path = "representations/typed-trees" }
source-parser = { path = "pipeline/01_tokens-to-syntax-trees" }
source-lexer = { path = "pipeline/00_source-files-to-tokens" }
behavior-exclusion-requests = { path = "../build/settings/behavior-exclusions" }
application-identity = { path = "../psi/identities/applications" }
layout-planning = { path = "../psi/semantics/default-integer-layouts" }
numeric-literals = { path = "../foundation/numeric-literals" }
evaluation-contracts = { path = "../build/evaluation/accounting/contracts" }
evaluation-receipts = { path = "../build/evaluation/receipts" }
source-admission = { path = "representations/source-files/custody" }
source-text = { path = "../../../foundation/source-text" }
bignum = { path = "../../../foundation/bignum" }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wire = { path = "../../../foundation/wire" }
arena = { path = "../../../foundation/arena" }
record-storage = { path = "../../../foundation/record-storage" }
diagnostics = { path = "../../../foundation/diagnostics" }
worker-budget = { path = "../foundation/worker-budget" }
language-core = { path = "../foundation/language-core" }
layout-plans = { path = "../psi/layouts/geometry" }
numerics = { path = "../foundation/numerics" }
optimization = { path = "../psi/artifact/optimization-selections" }
rayon = "1.11"
semantic-vocabulary = { path = "../foundation/semantic-records" }
symbols = { path = "../foundation/declaration-identity" }
syntax-trees = { path = "representations/syntax-trees" }
terminal-check-tables = { path = "representations/lowered-program" }
terminal-codec = { path = "../psi/artifact/codec" }
terminal-interpreter = { path = "../../interpreter" }
terminal-psi = { path = "../psi" }
terminal-semantics = { path = "../psi/semantics" }
terminal-work = { path = "../psi/semantics/work" }
tokens = { path = "representations/tokens" }

[dev-dependencies]
proof-admission = { path = "../psi/semantics/proofs/bounded" }
lowered-program-to-checked-program = { path = "pipeline/06_lowered-program-to-checked-program", features = ["test-support"] }
prepared-typed-trees-to-lowered-program = { path = "pipeline/05_prepared-typed-trees-to-lowered-program", features = ["test-support"] }
symbol-resolved-trees-to-typed-trees = { path = "pipeline/03_symbol-resolved-trees-to-typed-trees", features = ["test-support"] }
syntax-trees-to-symbol-resolved-trees = { path = "pipeline/02_syntax-trees-to-symbol-resolved-trees", features = ["test-support"] }
mimalloc = { version = "0.1", default-features = false }

