[package]
name = "source-compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "source_to_psi.rs"

[features]
test-support = [
    "checked-program-to-psi/test-support",
    "lowered-program-to-checked-program/test-support",
    "symbol-resolved-trees/test-support",
    "syntax-trees-to-symbol-resolved-trees/test-support",
    "symbol-resolved-trees-to-typed-trees/test-support",
    "typed-trees-to-typed-trees/test-support",
    "typed-trees-to-lowered-program/test-support",
]

[dependencies]
source-provenance = { path = "../foundation/source-provenance" }
declaration-scope = { path = "../foundation/declaration-scope" }
source-files = { path = "pipeline/representations/source-files" }
checked-program-to-psi = { path = "pipeline/07_checked-program-to-psi" }
lowered-program-to-checked-program = { path = "pipeline/06_lowered-program-to-checked-program" }
typed-trees-to-lowered-program = { path = "pipeline/05_typed-trees-to-lowered-program" }
typed-trees-to-typed-trees = { path = "pipeline/04_typed-trees-to-typed-trees" }
symbol-resolved-trees-to-typed-trees = { path = "pipeline/03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "pipeline/02_syntax-trees-to-symbol-resolved-trees" }
source-declarations = { path = "language/source-declarations" }
source-symbol-table = { path = "pipeline/02_syntax-trees-to-symbol-resolved-trees/symbol-table" }
symbol-resolved-trees = { path = "pipeline/representations/symbol-resolved-trees" }
typed-trees = { path = "pipeline/representations/typed-trees" }
source-syntax = { path = "pipeline/01_tokens-to-syntax-trees/source-syntax" }
source-parser = { path = "pipeline/01_tokens-to-syntax-trees" }
source-lexer = { path = "pipeline/00_source-files-to-tokens" }
declaration-contracts = { path = "language/declaration-contracts" }
application-identity = { path = "../psi/application-identity" }
layout-planning = { path = "../psi/layout/integer-defaults" }
numeric-literals = { path = "../foundation/numeric-literals" }
evaluation-contracts = { path = "../build/evaluation/usage" }
evaluation-receipts = { path = "../build/evaluation/receipts" }
source-capture = { path = "../../../../host-support/source-capture" }
source-admission = { path = "pipeline/representations/source-files/custody" }
source-text = { path = "../../../foundation/source-text" }
bignum = { path = "../../../foundation/bignum" }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
provider-choices = { path = "language/provider-choices" }
wire = { path = "../../../foundation/wire" }
arena = { path = "../../../foundation/arena" }
artifact-evaluation = { path = "evaluation/artifact-evaluation" }
build-time-values = { path = "evaluation/build-time-values" }
record-storage = { path = "../../../foundation/record-storage" }
diagnostics = { path = "../../../foundation/diagnostics" }
evaluation-accounting = { path = "evaluation/evaluation-accounting" }
worker-budget = { path = "../foundation/worker-budget" }
filesystem-authority = { path = "evaluation/filesystem-authority" }
flow-effects = { path = "language/source-effects" }
language-core = { path = "../foundation/language-core" }
layout-plans = { path = "../psi/layout" }
numerics = { path = "../psi/semantics/numeric" }
optimization = { path = "../psi/optimization-selections" }
proof-admission = { path = "proof-admission" }
rayon = "1.11"
semantic-vocabulary = { path = "../foundation/semantic-records" }
symbols = { path = "../foundation/declaration-identity" }
syntax-trees = { path = "pipeline/representations/syntax-trees" }
terminal-check-tables = { path = "pipeline/representations/lowered-program" }
terminal-codec = { path = "../psi/codec" }
terminal-installation = { path = "../psi-admission" }
terminal-interpreter = { path = "../../interpreter" }
terminal-psi = { path = "../psi" }
terminal-semantics = { path = "../psi/semantics" }
terminal-work = { path = "../psi/work" }
tokens = { path = "pipeline/representations/tokens" }

[dev-dependencies]
checked-program-to-psi = { path = "pipeline/07_checked-program-to-psi", features = ["test-support"] }
lowered-program-to-checked-program = { path = "pipeline/06_lowered-program-to-checked-program", features = ["test-support"] }
typed-trees-to-lowered-program = { path = "pipeline/05_typed-trees-to-lowered-program", features = ["test-support"] }
typed-trees-to-typed-trees = { path = "pipeline/04_typed-trees-to-typed-trees", features = ["test-support"] }
symbol-resolved-trees-to-typed-trees = { path = "pipeline/03_symbol-resolved-trees-to-typed-trees", features = ["test-support"] }
syntax-trees-to-symbol-resolved-trees = { path = "pipeline/02_syntax-trees-to-symbol-resolved-trees", features = ["test-support"] }
mimalloc = { version = "0.1", default-features = false }

[[bench]]
name = "lexing_lexer_timing"
path = "pipeline/00_source-files-to-tokens/benchmarks/lexer_timing.rs"
harness = false
required-features = ["test-support"]

