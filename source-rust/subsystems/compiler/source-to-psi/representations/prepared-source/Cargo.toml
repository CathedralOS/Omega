[package]
name = "prepared-source"
edition.workspace = true
license.workspace = true
version.workspace = true
autotests = false
autoexamples = false
autobenches = false

[lib]
path = "lib.rs"

[features]
# Lets tests read back the demanded inputs and take the trees back
# (`into_inner`) to prepare changed trees again.
test-support = []

[dependencies]
numeric-literals = { path = "../../../foundation/numeric-literals" }
source-admission = { path = "../source-files/custody" }
source-provenance = { path = "../../../foundation/source-provenance" }
source-symbol-table = { path = "../symbol-resolved-trees/symbol-table" }
prepared-source-issuer = { path = "issuer" }
typed-trees = { path = "../typed-trees" }
semantic-vocabulary = { path = "../../../foundation/semantic-records" }
arena = { path = "../../../../../foundation/arena" }
diagnostics = { path = "../../../../../foundation/diagnostics" }
symbols = { path = "../../../foundation/declaration-identity" }
