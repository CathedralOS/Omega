semantic-vocabulary = { path = "../../../foundation/semantic-records" }
optimization = { path = "../optimization-selections" }
numerics = { path = "../../../foundation/numerics" }
mathematical-kernel = { path = "../../semantics/proofs/mathematical" }
terminal-psi = { path = "../.." }
terminal-semantics = { path = "../../semantics" }

layout-plans = { path = "../../layouts/geometry" }

