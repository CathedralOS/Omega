[package]
name = "source-acquisition"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "lib.rs"

[features]
test-fixtures = []

[dependencies]
source-capture = { path = "../../../host-support/source-capture" }
wire = { path = "../../../foundation/wire" }
record-storage = { path = "../../../foundation/record-storage" }
filesystem-authority = { path = "../../../psi/evaluation/filesystem-authority" }
bounded-process = { path = "../../../foundation/bounded-process" }
optimization-core = { path = "../../compiler/psi-to-native/optimization-contracts" }
platform-custody = { path = "../../../foundation/filesystem" }
resolver-execution = { path = "git/execution" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user"] }

[target.'cfg(windows)'.dependencies]
cap-primitives = "4.0.3"
