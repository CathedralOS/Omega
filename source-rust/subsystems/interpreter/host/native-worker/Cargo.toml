[package]
name = "native-provider-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
wire = { path = "../../../../foundation/wire" }
bounded-process = { path = "../../../../foundation/bounded-process" }
target = { path = "../../../compiler/psi-to-native/targets/target" }
calling-conventions = { path = "../../../compiler/psi-to-native/targets/calling-conventions" }
runtime-abi = { path = "../../../compiler/psi-to-native/targets/runtime-abi" }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes",
    "Win32_System_Threading", "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
native-provider-sponsor = { path = "../native-sponsor", features = ["test-support"] }
native-compiler = { path = "../../../compiler/psi-to-native", features = ["test-support"] }
image-emission = { path = "../../../compiler/psi-to-native/pipeline/16_objects-to-image/image-emission" }
