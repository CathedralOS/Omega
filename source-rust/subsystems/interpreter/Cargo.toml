[package]
name = "terminal-interpreter"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "terminal_interpreter"
path = "interpreter.rs"

[dependencies]
build-model = { path = "../compiler/build/model" }
psi-scalar-applications = { path = "../compiler/psi/execution-inputs/scalar-applications" }
psi-provider-selections = { path = "../compiler/psi/execution-inputs/providers" }
psi-entry-memory = { path = "../compiler/psi/execution-inputs/entry-memory" }
psi-target-layouts = { path = "../compiler/psi/execution-inputs/target-layouts" }
access-vocabulary = { path = "../compiler/psi/access/policies" }
resource-bounds = { path = "../compiler/psi/semantics/storage-bounds" }
extent-contracts = { path = "../compiler/psi/access/extents" }
language-core = { path = "../compiler/foundation/language-core" }
record-storage = { path = "../../foundation/record-storage" }
access-admission = { path = "../compiler/psi/access/validated-placements" }
arena = { path = "../../foundation/arena" }
layout-plans = { path = "../compiler/psi/layouts/geometry" }
semantic-vocabulary = { path = "../compiler/foundation/semantic-records" }
numerics = { path = "../compiler/foundation/numerics" }
terminal-psi = { path = "../compiler/psi" }
terminal-codec = { path = "../compiler/psi/artifact/codec" }
psi-authorization = { path = "../compiler/psi/artifact/authorization" }
terminal-work = { path = "../compiler/psi/semantics/work" }
terminal-semantics = { path = "../compiler/psi/semantics" }
closed-predicates = { path = "../compiler/psi/semantics/closed-predicates" }

[dev-dependencies]
access-admission = { path = "../compiler/psi/access/validated-placements", features = ["test-support"] }
layout-plans = { path = "../compiler/psi/layouts/geometry", features = ["test-support"] }
