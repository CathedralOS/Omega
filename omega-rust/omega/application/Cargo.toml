[package]
name = "omega"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega"

[[bin]]
name = "omega"
path = "src/main.rs"
test = true

[dependencies]
execution-admission = { path = "../../psi/foundation/execution-admission" }
orchestration = { path = "../build-system/orchestration" }
terminal-runtime = { path = "../interpreter/terminal-runtime" }
mimalloc = { version = "0.1", default-features = false }
bounded-process = { path = "../host-support/bounded-process" }
compiler = { path = "../compilation/compiler" }
products = { path = "../compilation/products" }
artifacts = { path = "../compilation/products/measurements" }
platform-custody = { path = "../host-support/platform-custody" }
package-manager = { path = "../packages/package-manager" }
source-acquisition = { path = "../packages/source-acquisition" }
package-compilation = { path = "../packages/package-compilation" }
resolver-execution = { path = "../packages/resolver-execution" }
target = { path = "../compilation/target-description/target" }
semantic-vocabulary = { path = "../../psi/compilation/representations/semantic-vocabulary" }
diagnostics = { path = "../../psi/foundation/diagnostics" }
terminal-codec = { path = "../../psi/compilation/representations/terminal-psi/codec" }
terminal-psi = { path = "../../psi/compilation/representations/terminal-psi" }
terminal-semantics = { path = "../../psi/compilation/representations/terminal-psi/semantics" }
terminal-installation = { path = "../../psi/compilation/terminal-installation" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading",
] }
