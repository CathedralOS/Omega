[package]
name = "omega"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega"

[[bin]]
name = "omega"
path = "src/main.rs"
test = true

[dependencies]
mimalloc = { version = "0.1", default-features = false }
lowered-psi = { path = "../../../psi/compilation/representations/lowered-psi" }
lowered-psi-to-lowered-psi = { path = "../../../psi/compilation/pipeline/06_lowered-psi-to-lowered-psi" }
lowered-psi-to-terminal-psi = { path = "../../../psi/compilation/pipeline/07_lowered-psi-to-terminal-psi" }
compiler = { path = "../../compilation/driver" }
compilation-products = { path = "../../compilation/products" }
artifacts = { path = "../../foundation/artifacts" }
platform-custody = { path = "../../foundation/platform-custody" }
package-manager = { path = "../../packages/package-manager" }
package-source = { path = "../../packages/source-acquisition" }
package-compilation = { path = "../../packages/compilation-inputs" }
resolver-execution = { path = "../../packages/resolver-execution" }
target = { path = "../../compilation/backend/target" }
trust-ledger = { path = "../trust-ledger" }
checked-trees-to-lowered-psi = { path = "../../../psi/compilation/pipeline/05_checked-trees-to-lowered-psi" }
semantic-vocabulary = { path = "../../../psi/foundation/semantic-vocabulary" }
diagnostics = { path = "../../../psi/foundation/diagnostics" }
checked-interpreter = { path = "../../../psi/interpreter/checked-interpreter" }
proof-admission = { path = "../../../psi/compilation/proof/admission" }
terminal-psi = { path = "../../../psi/compilation/representations/terminal-psi" }
terminal-fixed-fuel = { path = "../../../psi/compilation/representations/terminal-psi/fuel/certification" }
terminal-verifier = { path = "../../../psi/compilation/representations/terminal-psi/verification" }

# Selected virtual host providers are interpreted only after exact Omega settlement.
effects = { path = "../../compilation/backend/plans/provider-evidence" }
provider-planning = { path = "../../compilation/realization/provider-planning" }
checked-trees = { path = "../../../psi/compilation/representations/checked-trees" }
typed-trees = { path = "../../../psi/compilation/representations/typed-trees" }
symbols = { path = "../../../psi/foundation/symbols" }
source = { path = "../../../psi/foundation/source" }
calling-conventions = { path = "../../compilation/backend/calling-conventions" }
