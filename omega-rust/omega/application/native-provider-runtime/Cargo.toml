[package]
name = "native-provider-runtime"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
bounded-process = { path = "../../foundation/bounded-process" }
native-artifact = { path = "../../compilation/backend/artifacts/native-artifact" }
target = { path = "../../compilation/backend/target" }
calling-conventions = { path = "../../compilation/backend/calling-conventions" }
runtime-abi = { path = "../../compilation/backend/runtime/runtime-abi" }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes",
    "Win32_System_Threading", "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
machine-emission = { path = "../../compilation/backend/machine-emission" }
image-emission = { path = "../../compilation/backend/images/image-emission" }
