[package]
name = "abstract-operations-to-abstract-operations"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "abstract_operations_to_abstract_operations"
path = "src/lib.rs"

[dependencies]
optimization-core = { path = "../../foundation/optimization-core" }
optimization-unit = { path = "../../representations/abstract-operations/optimization-unit" }
optimization-unit-semantics = { path = "../../representations/abstract-operations/optimization-unit/semantics" }
abstract-operations = { path = "../../representations/abstract-operations" }
terminal-psi-to-abstract-operations = { path = "../00_terminal-psi-to-abstract-operations" }
semantic-vocabulary = { path = "../../../psi/foundation/semantic-vocabulary" }
optimization = { path = "../../../psi/foundation/optimization-selections" }
terminal-psi = { path = "../../../psi/representations/terminal-psi" }
terminal-codec = { path = "../../../psi/representations/terminal-psi/codec" }
terminal-semantics = { path = "../../../psi/representations/terminal-psi/semantics" }
terminal-fuel = { path = "../../../psi/representations/terminal-psi/fuel" }
proof-admission = { path = "../../../psi/proof/admission" }
terminal-verifier = { path = "../../../psi/representations/terminal-psi/verification" }

[dev-dependencies]
# Dev builds enable test-support so the psi_optimization_allocations example and
# the test_support exports it drives compile alongside the unit tests.
abstract-operations-to-abstract-operations = { path = ".", features = ["test-support"] }
checked-trees-to-lowered-psi = { path = "../../../psi/pipeline/05_checked-trees-to-lowered-psi" }
source-files-to-tokens = { path = "../../../psi/pipeline/00_source-files-to-tokens" }
symbol-resolved-trees-to-typed-trees = { path = "../../../psi/pipeline/03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../../../psi/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
tokens-to-syntax-trees = { path = "../../../psi/pipeline/01_tokens-to-syntax-trees" }
typed-trees-to-checked-trees = { path = "../../../psi/pipeline/04_typed-trees-to-checked-trees" }

[features]
test-support = []

[[example]]
name = "psi_optimization_allocations"
required-features = ["test-support"]
