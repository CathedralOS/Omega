[package]
name = "package-source"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "package_source"
path = "src/lib.rs"

[features]
test-fixtures = []

[dependencies]
bounded-process = { path = "../../../tooling/bounded-process" }
platform-custody = { path = "../../../tooling/platform-custody" }
resolver-execution = { path = "../execution" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user"] }
