[package]
name = "package-source"
edition.workspace = true
license.workspace = true
version.workspace = true


[features]
test-fixtures = []

[dependencies]
compiler-storage = { path = "../../../psi/foundation/compiler-storage" }
bounded-process = { path = "../../foundation/bounded-process" }
optimization-core = { path = "../../foundation/optimization-core" }
platform-custody = { path = "../../foundation/platform-custody" }
source = { path = "../../../psi/foundation/source" }
resolver-execution = { path = "../resolver-execution" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user"] }

[target.'cfg(windows)'.dependencies]
cap-primitives = "4.0.3"
