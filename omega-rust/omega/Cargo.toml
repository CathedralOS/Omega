[package]
name = "omega"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "omega"

[[bin]]
name = "omega"
path = "src/main.rs"
test = true

[dependencies]
checked-trees-to-lowered-psi = { path = "../psi/pipeline/05_checked-trees-to-lowered-psi" }
lowered-psi-to-terminal-psi = { path = "../psi/pipeline/07_lowered-psi-to-terminal-psi" }
post-allocation-machine-to-selected-form-encoding = { path = "pipeline/07_post-allocation-machine-to-selected-form-encoding" }
lowered-psi-to-lowered-psi = { path = "../psi/pipeline/06_lowered-psi-to-lowered-psi" }
target = { path = "../psi/target" }
semantic-vocabulary = { path = "../psi/foundation/semantic-vocabulary" }
diagnostics = { path = "../psi/foundation/diagnostics" }
proof-admission = { path = "../psi/proof-admission" }
terminal-psi = { path = "../psi/terminal-psi" }
terminal-verifier = { path = "../psi/terminal-verifier" }

abstract-operations-to-abstract-operations = { path = "pipeline/01_abstract-operations-to-abstract-operations" }
abstract-operations-to-target-operations = { path = "pipeline/02_abstract-operations-to-target-operations" }
arena = { path = "../psi/foundation/arena" }
resolved-layout-to-resolved-layout = { path = "pipeline/09_resolved-layout-to-resolved-layout" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
installation-evidence = { path = "../psi/installation-evidence" }
language-core = { path = "../psi/foundation/language-core" }
language-semantics = { path = "../psi/foundation/language-semantics" }
numerics = { path = "../psi/foundation/numerics" }
optimization-core = { path = "../psi/optimization-core" }
register-homes-to-post-allocation-machine = { path = "pipeline/06_register-homes-to-post-allocation-machine" }
selected-form-encoding-to-resolved-layout = { path = "pipeline/08_selected-form-encoding-to-resolved-layout" }
selected-instructions-to-register-homes = { path = "pipeline/05_selected-instructions-to-register-homes" }
selected-instructions-to-selected-instructions = { path = "pipeline/04_selected-instructions-to-selected-instructions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = "0.10.9"
source = { path = "../psi/foundation/source" }
source-files-to-tokens = { path = "../psi/pipeline/00_source-files-to-tokens" }
symbol-resolved-trees-to-typed-trees = { path = "../psi/pipeline/03_symbol-resolved-trees-to-typed-trees" }
symbols = { path = "../psi/foundation/symbols" }
syntax-trees-to-symbol-resolved-trees = { path = "../psi/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
target-operations-to-selected-instructions = { path = "pipeline/03_target-operations-to-selected-instructions" }
terminal-codec = { path = "../psi/terminal-codec" }
terminal-fuel = { path = "../psi/terminal-fuel" }
terminal-psi-to-abstract-operations = { path = "pipeline/00_terminal-psi-to-abstract-operations" }
tokens-to-syntax-trees = { path = "../psi/pipeline/01_tokens-to-syntax-trees" }
typed-trees-to-checked-trees = { path = "../psi/pipeline/04_typed-trees-to-checked-trees" }

[dev-dependencies]
abstract-operations-to-target-operations = { path = "pipeline/02_abstract-operations-to-target-operations" }
arena = { path = "../psi/foundation/arena" }
language-semantics = { path = "../psi/foundation/language-semantics" }
libc = "0.2.186"
mimalloc = { version = "0.1", default-features = false }
omega = { path = ".", features = ["test-support", "test-fixtures"] }
optimization-core = { path = "../psi/optimization-core", features = ["test-support"] }
proof-admission = { path = "../psi/proof-admission" }
semantic-vocabulary = { path = "../psi/foundation/semantic-vocabulary" }
source-files-to-tokens = { path = "../psi/pipeline/00_source-files-to-tokens" }
symbol-resolved-trees-to-typed-trees = { path = "../psi/pipeline/03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../psi/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
target = { path = "../psi/target" }
terminal-codec = { path = "../psi/terminal-codec" }
terminal-psi = { path = "../psi/terminal-psi" }
tokens-to-syntax-trees = { path = "../psi/pipeline/01_tokens-to-syntax-trees" }

terminal-interpreter = { path = "../psi/terminal-interpreter" }
[target.'cfg(unix)'.dependencies]
command-group = "5.0.1"
libc = "0.2.186"
nix = { version = "0.27", features = ["user"] }
rustix = { version = "1.1.4", features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[features]
installed-writer = []
test-fixtures = []
test-support = ["resolved-layout-to-resolved-layout/test-support"]

[[test]]
name = "corpus_runner"
path = "tests/corpus_runner.rs"
harness = false

