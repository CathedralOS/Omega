[target.'cfg(unix)'.dev-dependencies]
# Match the CLI's native dependency features. A libc feature mismatch travels
# through SHA-2 and semantic vocabulary, rebuilding the heavy Psi graph for
# corpus_runner after an ordinary CLI build. This affects test artifacts only.
# Keep dev-dependency features off crates the CLI also links for the same reason.
libc = { version = "0.2.186", features = ["extra_traits"] }

# A standalone corpus outcome driver, not a test: `tools/corpus_gate.py`
# builds and executes it directly and diffs the emitted per-fixture outcome
# records against tests/omega/corpus_outcomes.txt. `harness = false` keeps
# libtest out; the runner exits immediately under NEXTEST so suite runs never
# execute it.
[[test]]
name = "corpus_runner"
path = "tests/corpus_runner.rs"
harness = false

# No canonical module decode during retained realization, counted. It drives a corpus
# fixture by path rather than embedding Omega source.
[[test]]
name = "terminal_decode_once"
path = "tests/terminal_decode_once.rs"

[[test]]
name = "retained_layout_match"
path = "tests/retained_layout_match.rs"

# Refused and adopted core Product speculation publish the same bytes.
[[test]]
name = "core_product_speculation"
path = "tests/core_product_speculation.rs"

# Checked source helpers retain access-view backing across ordinary invocations.
[[test]]
name = "access_view_calls"
path = "tests/access_view_calls.rs"

[[test]]
name = "terminal_entry_writeback"
path = "tests/terminal_entry_writeback.rs"

[[test]]
name = "terminal_behavior_exclusions"
path = "tests/terminal_behavior_exclusions.rs"

[[test]]
name = "terminal_effect_readiness"
path = "tests/terminal_effect_readiness.rs"

[[test]]
name = "product_query_suspension"
path = "tests/product_query_suspension.rs"

# Loose roots intentionally have no fixture-supplied package owner. This
# boundary test derives that owner, reloads its artifact and runs consumers
# against the exact supplied identity; ordinary corpus setup masks this path.
[[test]]
name = "anonymous_module_owner"
path = "tests/anonymous_module_owner.rs"

# The typed-frontier seam returns Psi 04's trees for programs the current
# checker rejects, and a distinct outcome for programs that stop earlier.
[[test]]
name = "typed_frontier"
path = "tests/typed_frontier.rs"

# The checker on the lowered form judges every declaration a check claims: a
# defect in a machine the entry never calls is rejected or handed back, never
# accepted.
[[test]]
name = "lowered_route_subjects"
path = "tests/lowered_route_subjects.rs"

# The lowered route's rejection messages contain each fixture's pinned
# fragment.
[[test]]
name = "lowered_route_messages"
path = "tests/lowered_route_messages.rs"

[[test]]
name = "package_review"
path = "tests/package_review.rs"

[[test]]
name = "executed_fixture_discovery"
path = "tests/executed_fixture_discovery.rs"

# Independent receiver admission of the existing Windows filesystem customer.
[[test]]
name = "filesystem_receiver"
path = "tests/filesystem_receiver.rs"
