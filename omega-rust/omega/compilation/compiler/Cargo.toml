source-files-to-tokens = { path = "../../../psi/compilation/pipeline/00_source-files-to-tokens" }
tokens-to-syntax-trees = { path = "../../../psi/compilation/pipeline/01_tokens-to-syntax-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../../../psi/compilation/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
symbol-resolved-trees-to-typed-trees = { path = "../../../psi/compilation/pipeline/03_symbol-resolved-trees-to-typed-trees" }

[target.'cfg(unix)'.dev-dependencies]
# Match the CLI's native dependency features. A libc feature mismatch travels
# through SHA-2 and semantic vocabulary, rebuilding the heavy Psi graph for
# the test binaries after an ordinary CLI build. This affects test artifacts only.
# Keep dev-dependency features off crates the CLI also links for the same reason.
libc = { version = "0.2.186", features = ["extra_traits"] }

# No canonical module decode during retained realization, counted. It drives a kept
# fixture by path rather than embedding Omega source.
[[test]]
name = "terminal_decode_once"
path = "tests/terminal_decode_once.rs"

# A Build script cannot make, keep or take apart the compiler-owned Build value:
# the real prelude's seal refuses each twin before the script runs.
[[test]]
name = "build_value_protection"
path = "tests/build_value_protection.rs"

# A source compile publishes Psi without a separate core supplier activation.
[[test]]
name = "core_build_activation"
path = "tests/core_build_activation.rs"

# Checked source helpers retain access-view backing across ordinary invocations.
[[test]]
name = "access_view_calls"
path = "tests/access_view_calls.rs"

[[test]]
name = "product_query_suspension"
path = "tests/product_query_suspension.rs"

# Loose roots intentionally have no fixture-supplied package owner. This
# boundary test derives that owner, reloads its artifact and runs consumers
# against the exact supplied identity; ordinary corpus setup masks this path.
[[test]]
name = "anonymous_module_owner"
path = "tests/anonymous_module_owner.rs"

# The checker receives a dependency's default provider only for a boundary
# trait the program reaches.
[[test]]
name = "checked_projection"
path = "tests/checked_projection.rs"

# The lowered-form checker is shown a standalone source program without its
# Build and without the old checker, which is how it is probed while no Build
# program can run.
[[test]]
name = "route_probe"
path = "tests/route_probe.rs"

# A domain's `access Policy` clause reaches the typed trees as the named
# implementation it selects, and a policy declared nowhere stops the program.
[[test]]
name = "domain_access_policy"
path = "tests/domain_access_policy.rs"

# Typing accounts for `value as =Keep -Remove +Add` against the operand's
# declared type; a cast that breaks the accounting names the domain.
[[test]]
name = "domain_casts"
path = "tests/domain_casts.rs"

# The lowered-form checker reads `T in D` as a carrier and its domains: a
# value keeps them through parameters, calls, results and cast entries, and
# a plain value for a qualified place is not accepted.
[[test]]
name = "domain_qualified_types"
path = "tests/domain_qualified_types.rs"

# The checker on the lowered form judges every declaration a check claims: a
# defect in a machine the entry never calls is rejected or handed back, never
# accepted.
[[test]]
name = "lowered_route_subjects"
path = "tests/lowered_route_subjects.rs"

# The default compile reports the lowered route's verdict where the owner's
# split gives it, and the product check's everywhere else.
[[test]]
name = "lowered_route_governance"
path = "tests/lowered_route_governance.rs"

# A program the lowered route accepts is published from the route's own
# module, its seals reach Omega 00, and it runs.
[[test]]
name = "lowered_route_publication"
path = "tests/lowered_route_publication.rs"

[[test]]
name = "program_entry_product"
path = "tests/program_entry_product.rs"

# The lowered route's rejection messages contain each fixture's pinned
# fragment.
[[test]]
name = "lowered_route_messages"
path = "tests/lowered_route_messages.rs"

# A generic body is checked once on the lowered form and its certificates
# are re-decided by the kernel in each generated specialization.
[[test]]
name = "lowered_route_generics"
path = "tests/lowered_route_generics.rs"

# A machine declared under a data type's name, and each form of call that
# names it, is judged on the lowered form.
[[test]]
name = "lowered_route_qualified"
path = "tests/lowered_route_qualified.rs"

[[test]]
name = "package_review"
path = "tests/package_review.rs"

[[test]]
name = "executed_fixture_discovery"
path = "tests/executed_fixture_discovery.rs"

# Independent receiver admission of the existing Windows filesystem customer.
[[test]]
name = "filesystem_receiver"
path = "tests/filesystem_receiver.rs"

# Plain affine transfers, local homes and cleanup govern real source and the
# accepted module executes after publication rather than relying on fallback.
[[test]]
name = "lowered_route_ownership"
path = "tests/lowered_route_ownership.rs"

# Target preparation and provider settlement decide a target's supply from
# the accepted Terminal module of programs typed from source.
[[test]]
name = "target_supply"
path = "tests/target_supply.rs"
