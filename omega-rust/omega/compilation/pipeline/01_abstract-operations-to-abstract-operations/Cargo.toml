[package]
name = "abstract-operations-to-abstract-operations"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "abstract_operations_to_abstract_operations"
path = "src/lib.rs"

[dependencies]
provider-admission = { path = "../../realization/provider-admission" }
optimization-core = { path = "../../../foundation/optimization-core" }
optimization-unit = { path = "../../representations/abstract-operations/optimization-unit" }
optimization-unit-semantics = { path = "../../representations/abstract-operations/optimization-unit/semantics" }
abstract-operations = { path = "../../representations/abstract-operations" }
verified-optimization-input = { path = "../../representations/abstract-operations/verified-input" }
semantic-vocabulary = { path = "../../../../psi/foundation/semantic-vocabulary" }
optimization = { path = "../../../../psi/foundation/optimization" }
terminal-psi = { path = "../../../../psi/compilation/representations/terminal-psi" }
terminal-codec = { path = "../../../../psi/compilation/representations/terminal-psi/codec" }
terminal-semantics = { path = "../../../../psi/compilation/representations/terminal-psi/semantics" }
psi-work = { path = "../../../../psi/compilation/representations/terminal-psi/work" }
proof-admission = { path = "../../../../psi/compilation/proof/admission" }

[dev-dependencies]
# Tests admit real Terminal artifacts through Omega 00
# to build this stage's input; production code reads only the representation.
terminal-psi-to-abstract-operations = { path = "../00_terminal-psi-to-abstract-operations" }
terminal-psi-to-terminal-psi = { path = "../../../../psi/compilation/pipeline/06_terminal-psi-to-terminal-psi" }
typed-trees-to-terminal-psi = { path = "../../../../psi/compilation/pipeline/05_typed-trees-to-terminal-psi" }
# Dev builds enable test-support so the test_support exports compile alongside
# the unit tests.
abstract-operations-to-abstract-operations = { path = ".", features = ["test-support"] }

[features]
test-support = []
