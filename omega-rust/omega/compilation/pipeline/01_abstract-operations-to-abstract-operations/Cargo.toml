[package]
name = "abstract-operations-to-abstract-operations"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "abstract_operations_to_abstract_operations"
path = "src/lib.rs"

[dependencies]
provider-admission = { path = "../../realization/provider-admission" }
optimization-core = { path = "../../../foundation/optimization-core" }
optimization-unit = { path = "../../representations/abstract-operations/optimization-unit" }
optimization-unit-semantics = { path = "../../representations/abstract-operations/optimization-unit/semantics" }
abstract-operations = { path = "../../representations/abstract-operations" }
verified-optimization-input = { path = "../../representations/abstract-operations/verified-input" }
semantic-vocabulary = { path = "../../../../psi/foundation/semantic-vocabulary" }
optimization = { path = "../../../../psi/foundation/optimization" }
terminal-psi = { path = "../../../../psi/compilation/representations/terminal-psi" }
terminal-codec = { path = "../../../../psi/compilation/representations/terminal-psi/codec" }
terminal-semantics = { path = "../../../../psi/compilation/representations/terminal-psi/semantics" }
psi-work = { path = "../../../../psi/compilation/representations/terminal-psi/work" }
proof-admission = { path = "../../../../psi/compilation/proof/admission" }

[dev-dependencies]
# Tests and the allocation example admit real Terminal artifacts through Omega 00
# to build this stage's input; production code reads only the representation.
terminal-psi-to-abstract-operations = { path = "../00_terminal-psi-to-abstract-operations" }
lowered-discharge = { path = "../../../../psi/compilation/pipeline/lowered-discharge" }
structure-elaboration = { path = "../../../../psi/compilation/pipeline/structure-elaboration" }
typed-trees-to-typed-trees = { path = "../../../../psi/compilation/pipeline/04_typed-trees-to-typed-trees" }
# Dev builds enable test-support so the psi_optimization_allocations example and
# the test_support exports it drives compile alongside the unit tests.
abstract-operations-to-abstract-operations = { path = ".", features = ["test-support"] }
checked-trees-to-lowered-psi = { path = "../../../../psi/compilation/pipeline/06_checked-trees-to-lowered-psi" }
source-files-to-tokens = { path = "../../../../psi/compilation/pipeline/00_source-files-to-tokens" }
symbol-resolved-trees-to-typed-trees = { path = "../../../../psi/compilation/pipeline/03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../../../../psi/compilation/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
tokens-to-syntax-trees = { path = "../../../../psi/compilation/pipeline/01_tokens-to-syntax-trees" }
typed-trees-to-checked-trees = { path = "../../../../psi/compilation/pipeline/05_typed-trees-to-checked-trees" }

[features]
test-support = []

[[example]]
name = "psi_optimization_allocations"
required-features = ["test-support"]
