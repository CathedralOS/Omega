[package]
name = "program-entry-plan"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "program_entry_plan"
path = "src/lib.rs"

[features]
default = []
installed-writer = [
    "dep:executable-installation",
    "dep:isa-aarch64",
    "dep:post-handoff-writer-plan",
]

[dependencies]
typed-trees = { path = "../../../../../psi/compilation/representations/typed-trees" }
terminal-psi = { path = "../../../../../psi/compilation/representations/terminal-psi" }
terminal-semantics = { path = "../../../../../psi/compilation/representations/terminal-psi/semantics" }
calling-conventions = { path = "../../calling-conventions" }
executable-installation = { path = "../../runtime/executable-installation", optional = true }
post-handoff-writer-plan = { path = "../post-handoff-writer-plan", optional = true }
effects = { path = "../provider-evidence" }
function-identity = { path = "../../../../foundation/function-identity" }
isa-aarch64 = { path = "../../instruction-set-architectures/isa-aarch64", optional = true }
isa-x86_64 = { path = "../../instruction-set-architectures/isa-x86_64" }
layout = { path = "../../layout" }
target = { path = "../../target" }
diagnostics = { path = "../../../../../psi/foundation/diagnostics" }
layout-plans = { path = "../../../../../psi/foundation/layout-plans" }
symbols = { path = "../../../../../psi/foundation/symbols" }
language-semantics = { path = "../../../../../psi/foundation/language-semantics" }
sha2 = "0.10.9"

[dev-dependencies]
semantic-vocabulary = { path = "../../../../../psi/foundation/semantic-vocabulary" }
arena = { path = "../../../../../psi/foundation/arena" }
checked-trees = { path = "../../../../../psi/compilation/representations/checked-trees" }
