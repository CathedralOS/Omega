[package]
name = "compiler"
edition.workspace = true
license.workspace = true
version.workspace = true
# Behavior is tested end to end: a fixture under tests/omega/{pass,fail,run}
# is the test, and `tools/corpus_gate.py` runs it through `corpus_runner`.
# No per-file test binaries (see tests/README.md).
autotests = false

[lib]
name = "compiler"
path = "src/lib.rs"

[dependencies]
compilation-products = { path = "../products" }
lowered-psi = { path = "../../../psi/compilation/representations/lowered-psi" }
lowered-psi-to-terminal-psi = { path = "../../../psi/compilation/pipeline/07_lowered-psi-to-terminal-psi" }
terminal-production = { path = "terminal-production" }
build-declarations = { path = "../../packages/build-declarations" }
build-evaluation = { path = "../build-evaluation" }
build-output = { path = "../../packages/build-output" }
package-compilation = { path = "../../packages/compilation-inputs" }
provider-planning = { path = "../realization/provider-planning" }
trust-model = { path = "../realization/trust-model" }
boundary-applications = { path = "../backend/artifacts/boundary-applications" }
optimization = { path = "../../../psi/foundation/optimization-selections" }
optimization-core = { path = "../../foundation/optimization-core" }
abstract-operations-to-target-operations = { path = "../pipeline/02_abstract-operations-to-target-operations" }
semantic-vocabulary = { path = "../../../psi/foundation/semantic-vocabulary" }
symbols = { path = "../../../psi/foundation/symbols" }
syntax-trees-to-symbol-resolved-trees = { path = "../../../psi/compilation/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
diagnostics = { path = "../../../psi/foundation/diagnostics" }
source = { path = "../../../psi/foundation/source" }
backend-plan = { path = "../backend/plans/backend-plan" }
artifacts = { path = "../../foundation/artifacts" }
build-time-evaluation = { path = "../../../psi/compilation/compile-time" }
validation = { path = "../../../psi/compilation/checking" }
symbol-resolved-trees-to-typed-trees = { path = "../../../psi/compilation/pipeline/03_symbol-resolved-trees-to-typed-trees" }
typed-trees-to-checked-trees = { path = "../../../psi/compilation/pipeline/04_typed-trees-to-checked-trees" }
target = { path = "../backend/target" }
typed-trees = { path = "../../../psi/compilation/representations/typed-trees" }
terminal-psi = { path = "../../../psi/compilation/representations/terminal-psi" }
checked-trees-to-lowered-psi = { path = "../../../psi/compilation/pipeline/05_checked-trees-to-lowered-psi" }
terminal-codec = { path = "../../../psi/compilation/representations/terminal-psi/codec" }
proof-admission = { path = "../../../psi/compilation/proof/admission" }
selected-dispatch = { path = "../realization/selected-dispatch" }
selected-instructions-to-selected-instructions = { path = "../pipeline/04_selected-instructions-to-selected-instructions" }
abstract-operations-to-abstract-operations = { path = "../pipeline/01_abstract-operations-to-abstract-operations" }
register-homes-to-post-allocation-machine = { path = "../pipeline/06_register-homes-to-post-allocation-machine" }
selected-instructions-to-register-homes = { path = "../pipeline/05_selected-instructions-to-register-homes" }
target-operations-to-selected-instructions = { path = "../pipeline/03_target-operations-to-selected-instructions" }
register-environment = { path = "../backend/register-environment" }
image-emission = { path = "../backend/images/image-emission" }
machine-code = { path = "../representations/machine-code" }
machine-emission = { path = "../backend/machine-emission" }
native-artifact = { path = "../backend/artifacts/native-artifact" }
terminal-psi-to-abstract-operations = { path = "../pipeline/00_terminal-psi-to-abstract-operations" }

[dev-dependencies]
syntax-trees = { path = "../../../psi/compilation/representations/syntax-trees" }
calling-conventions = { path = "../backend/calling-conventions" }
task-plans = { path = "../backend/runtime/task-plans" }
source-files-to-tokens = { path = "../../../psi/compilation/pipeline/00_source-files-to-tokens" }
checked-interpreter = { path = "../../../psi/interpreter/checked-interpreter" }
effects = { path = "../backend/plans/provider-evidence" }
installation-evidence = { path = "../backend/runtime/installation-evidence" }
target-operations = { path = "../representations/target-operations" }
tokens-to-syntax-trees = { path = "../../../psi/compilation/pipeline/01_tokens-to-syntax-trees" }
object-file = { path = "../backend/object/object-file" }
mimalloc = { version = "0.1", default-features = false }
package-compilation = { path = "../../packages/compilation-inputs", features = ["test-support"] }

# A standalone corpus outcome driver, not a test: `tools/corpus_gate.py`
# builds and executes it directly and diffs the emitted per-fixture outcome
# records against tests/omega/corpus_outcomes.txt. `harness = false` keeps
# libtest out; the runner exits immediately under NEXTEST so suite runs never
# execute it.
[[test]]
name = "corpus_runner"
path = "tests/corpus_runner.rs"
harness = false

[[test]]
name = "callback_terminal_custody"
path = "tests/callback_terminal_custody.rs"

[[test]]
name = "boundary_internal_call_evidence"
path = "tests/boundary_internal_call_evidence.rs"

[[test]]
name = "withheld_rewrite_reporting"
path = "tests/withheld_rewrite_reporting.rs"

[[test]]
name = "rollback_to_identity"
path = "tests/rollback_to_identity.rs"

[[test]]
name = "composed_rewrites"
path = "tests/composed_rewrites.rs"

[[test]]
name = "selected_rewrite_commitment"
path = "tests/selected_rewrite_commitment.rs"
