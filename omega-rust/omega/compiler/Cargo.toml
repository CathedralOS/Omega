terminal-fuel = { path = "../../psi/semantics/terminal-fuel" }
function-identity = { path = "../representations/function-identity" }
object-file = { path = "../backend/object/object-file" }
optimization-unit = { path = "../representations/optimization-unit" }
abstract-operations = { path = "../representations/abstract-operations" }
image-emission = { path = "../backend/images/image-emission" }
isa-x86_64 = { path = "../backend/instruction_set_architectures/isa-x86_64" }
machine-code = { path = "../representations/machine-code" }
machine-emission = { path = "../backend/machine-emission" }
native-artifact = { path = "../backend/artifacts/native-artifact" }
selected-instructions = { path = "../representations/selected-instructions" }
legalized-operations = { path = "../representations/legalized-operations" }
terminal-psi-to-abstract-operations = { path = "../pipeline/00_terminal-psi-to-abstract-operations" }
sha2 = "0.10.9"
image = { path = "../backend/images/image" }
image-macho = { path = "../backend/images/image-macho" }
image-pe = { path = "../backend/images/image-pe" }

[dev-dependencies]
package-compilation = { path = "../build/package-compilation", features = ["test-support"] }

# A standalone corpus outcome driver, not a test: `tools/corpus_gate.py`
# builds and executes it directly and diffs the emitted per-fixture outcome
# records against tests/omega/corpus_outcomes.txt. `harness = false` keeps
# libtest out; the runner exits immediately under NEXTEST so suite runs never
# execute it.
[[test]]
name = "corpus_runner"
path = "tests/corpus_runner.rs"
harness = false
