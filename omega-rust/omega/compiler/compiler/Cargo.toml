[package]
name = "compiler"
edition.workspace = true
license.workspace = true
version.workspace = true
# Behavior is tested end to end: a fixture under tests/omega/{pass,fail,run}
# is the test, and `tools/corpus_gate.py` runs it through `corpus_runner`.
# No per-file test binaries (see tests/README.md).
autotests = false

[lib]
name = "compiler"
path = "src/lib.rs"

[dependencies]
lowered-psi = { path = "../../../psi/representations/lowered-psi" }
lowered-psi-to-lowered-psi = { path = "../../../psi/pipeline/06_lowered-psi-to-lowered-psi" }
lowered-psi-to-terminal-psi = { path = "../../../psi/pipeline/07_lowered-psi-to-terminal-psi" }
terminal-production = { path = "../../../psi/compiler/terminal-production" }
build-declarations = { path = "../../build/build-declarations" }
build-evaluation = { path = "../../build/build-evaluation" }
build-output = { path = "../../build/build-output" }
compilation-report = { path = "../compilation-report" }
component-description = { path = "../../backend/artifacts/component-description" }
package-compilation = { path = "../../build/package-compilation" }
provider-planning = { path = "../../build/provider-planning" }
representation-planning = { path = "../../build/representation-planning" }
trust-model = { path = "../../build/trust-model" }
boundary-applications = { path = "../../representations/boundary-applications" }
optimization-core = { path = "../../representations/optimization-core" }
abstract-operations-to-target-operations = { path = "../../pipeline/02_abstract-operations-to-target-operations" }
semantic-vocabulary = { path = "../../../psi/foundation/semantic-vocabulary" }
arena = { path = "../../../psi/foundation/arena" }
symbols = { path = "../../../psi/foundation/symbols" }
syntax-trees = { path = "../../../psi/representations/syntax-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../../../psi/pipeline/02_syntax-trees-to-symbol-resolved-trees" }
calling-conventions = { path = "../../representations/calling-conventions" }
access-plans = { path = "../../../psi/foundation/access-plans" }
diagnostics = { path = "../../../psi/foundation/diagnostics" }
language-core = { path = "../../../psi/foundation/language-core" }
language-semantics = { path = "../../../psi/foundation/language-semantics" }
extents = { path = "../../../psi/foundation/extents" }
layout-plans = { path = "../../../psi/foundation/layout-plans" }
numerics = { path = "../../../psi/foundation/numerics" }
task-plans = { path = "../../representations/task-plans" }
source = { path = "../../../psi/foundation/source" }
source-files-to-tokens = { path = "../../../psi/pipeline/00_source-files-to-tokens" }
tokens = { path = "../../../psi/representations/tokens" }
backend-plan = { path = "../../backend/plans/backend-plan" }
program-entry-plan = { path = "../../backend/plans/program-entry-plan" }
artifacts = { path = "../../tooling/artifacts" }
assembled-syntax-to-checked-compilation = { path = "../checked-compilation" }
checked-compilation-to-terminal-artifact = { path = "../terminal-artifact" }
source-files-to-assembled-syntax = { path = "../source-assembly" }
checked-trees = { path = "../../../psi/representations/checked-trees" }
checked-interpreter = { path = "../../../psi/semantics/checked-interpreter" }
build-time-evaluation = { path = "../../../psi/semantics/build-time-evaluation" }
validation = { path = "../../../psi/semantics/validation" }
effects = { path = "../../representations/effects" }
installation-evidence = { path = "../../representations/installation-evidence" }
target-operations = { path = "../../representations/target-operations" }
flow-effects = { path = "../../../psi/representations/flow-effects" }
symbol-resolved-trees = { path = "../../../psi/representations/symbol-resolved-trees" }
symbol-resolved-trees-to-typed-trees = { path = "../../../psi/pipeline/03_symbol-resolved-trees-to-typed-trees" }
tokens-to-syntax-trees = { path = "../../../psi/pipeline/01_tokens-to-syntax-trees" }
typed-trees-to-checked-trees = { path = "../../../psi/pipeline/04_typed-trees-to-checked-trees" }
facts = { path = "../../../psi/representations/facts" }
target = { path = "../../representations/target" }
typed-trees = { path = "../../../psi/representations/typed-trees" }
terminal-psi = { path = "../../../psi/representations/terminal-psi" }
checked-trees-to-lowered-psi = { path = "../../../psi/pipeline/05_checked-trees-to-lowered-psi" }
terminal-codec = { path = "../../../psi/semantics/terminal-codec" }
terminal-verifier = { path = "../../../psi/semantics/terminal-verifier" }
proof-admission = { path = "../../../psi/semantics/proof-admission" }
native-realization = { path = "../native-realization" }
selected-dispatch = { path = "../../build/selected-dispatch" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
package-compilation = { path = "../../build/package-compilation", features = ["test-support"] }

# A standalone corpus outcome driver, not a test: `tools/corpus_gate.py`
# builds and executes it directly and diffs the emitted per-fixture outcome
# records against tests/omega/corpus_outcomes.json. `harness = false` keeps
# libtest out; the runner exits immediately under NEXTEST so suite runs never
# execute it.
[[test]]
name = "corpus_runner"
path = "tests/corpus_runner.rs"
harness = false
