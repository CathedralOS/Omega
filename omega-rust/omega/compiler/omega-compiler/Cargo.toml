psi-terminal-interpreter = { path = "../../../psi/semantics/psi-terminal-interpreter" }
omega-bounded-process = { path = "../../tooling/omega-bounded-process" }
omega-image-emission = { path = "../../backend/images/omega-image-emission" }
omega-machine-code = { path = "../../representations/omega-machine-code" }
