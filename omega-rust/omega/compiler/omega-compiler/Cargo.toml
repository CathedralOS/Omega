omega-psi-to-abstract-operations = { path = "../../pipeline/omega-psi-to-abstract-operations" }
omega-target-operations-to-assigned-target-operations = { path = "../../pipeline/omega-target-operations-to-assigned-target-operations" }
omega-executable-installation = { path = "../../backend/runtime/omega-executable-installation" }
omega-external-roots = { path = "../../backend/runtime/omega-external-roots" }
omega-provider-planning = { path = "../../build/omega-provider-planning", features = ["installed-writer"] }
omega-layout = { path = "../../backend/omega-layout" }
omega-object-file = { path = "../../backend/object/omega-object-file" }
omega-program-entry-plan = { path = "../../backend/plans/omega-program-entry-plan" }
omega-package-compilation = { path = "../../build/omega-package-compilation", features = ["test-support"] }
omega-installation-evidence = { path = "../../representations/omega-installation-evidence" }
omega-optimization-policy = { path = "../../pipeline/omega-optimization-policy" }
psi-facts = { path = "../../../psi/representations/psi-facts" }
psi-terminal = { path = "../../../psi/representations/psi-terminal" }
