[package]
name = "package-manager"
autotests = false
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "package_manager"
path = "src/lib.rs"

[dependencies]
provider-planning = { path = "../compiler/provider-planning" }
build-declarations = { path = "../compiler/build-declarations" }
build-evaluation = { path = "../compiler/build-evaluation" }
boundary-applications = { path = "../backend/artifacts/boundary-applications" }
compiler = { path = "../compiler" }
effects = { path = "../backend/plans/provider-evidence" }
package-evidence = { path = "review-evidence" }
package-source = { path = "source-acquisition" }
package-compilation = { path = "../compiler/package-compilation" }
optimization-core = { path = "../foundation/optimization-core" }
platform-custody = { path = "../foundation/platform-custody" }
target = { path = "../backend/target" }
arena = { path = "../../psi/foundation/arena" }
semantic-vocabulary = { path = "../../psi/foundation/semantic-vocabulary" }
language-semantics = { path = "../../psi/foundation/language-semantics" }
checked-interpreter = { path = "../../psi/interpreter/checked-interpreter" }
diagnostics = { path = "../../psi/foundation/diagnostics" }
proof-admission = { path = "../../psi/proof/admission" }
source = { path = "../../psi/foundation/source" }
source-files-to-tokens = { path = "../../psi/pipeline/00_source-files-to-tokens" }
syntax-trees = { path = "../../psi/representations/syntax-trees" }
tokens = { path = "../../psi/representations/tokens" }
tokens-to-syntax-trees = { path = "../../psi/pipeline/01_tokens-to-syntax-trees" }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
sha2 = "0.10.9"

[dev-dependencies]
build-evaluation = { path = "../compiler/build-evaluation", features = ["test-support"] }
mimalloc = { version = "0.1", default-features = false }
package-source = { path = "source-acquisition", features = ["test-fixtures"] }

[[test]]
name = "suite"
path = "tests/suite.rs"
