[package]
name = "machine-emission"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "machine_emission"
path = "src/lib.rs"

[dependencies]
abstract-operations = { path = "../../representations/abstract-operations" }
sha2 = "0.10.9"
abstract-operations-to-target-operations = { path = "../../pipeline/abstract-operations-to-target-operations" }
terminal-psi-to-abstract-operations = { path = "../../pipeline/terminal-psi-to-abstract-operations" }
abstract-operations-to-abstract-operations = { path = "../../pipeline/abstract-operations-to-abstract-operations" }
register-environment = { path = "../register-environment" }
post-allocation-machine-to-selected-form-encoding = { path = "../../pipeline/post-allocation-machine-to-selected-form-encoding" }
register-homes-to-post-allocation-machine = { path = "../../pipeline/register-homes-to-post-allocation-machine" }
selected-form-encoding-to-resolved-layout = { path = "../../pipeline/selected-form-encoding-to-resolved-layout" }
resolved-layout-to-resolved-layout = { path = "../../pipeline/resolved-layout-to-resolved-layout" }
selected-instructions-to-register-homes = { path = "../../pipeline/selected-instructions-to-register-homes" }
register-model = { path = "../../representations/register-model" }
selected-instructions = { path = "../../representations/selected-instructions" }
optimization-core = { path = "../../representations/optimization-core" }
target = { path = "../../representations/target" }
calling-conventions = { path = "../../representations/calling-conventions" }
machine-code = { path = "../../representations/machine-code" }
isa-aarch64 = { path = "../instruction_set_architectures/isa-aarch64" }
isa-x86_64 = { path = "../instruction_set_architectures/isa-x86_64" }
semantic-vocabulary = { path = "../../../psi/foundation/semantic-vocabulary" }
diagnostics = { path = "../../../psi/foundation/diagnostics" }
terminal-fuel = { path = "../../../psi/semantics/terminal-fuel" }

physical-instructions = { path = "../../representations/physical-instructions" }

[dev-dependencies]
target-operations = { path = "../../representations/target-operations" }
terminal-psi = { path = "../../../psi/representations/terminal-psi" }

[features]
test-support = [
    "selected-instructions-to-register-homes/test-support",
    "post-allocation-machine-to-selected-form-encoding/test-support",
    "selected-form-encoding-to-resolved-layout/test-support",
    "resolved-layout-to-resolved-layout/test-support",
]
