[package]
name = "lowered-discharge"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "lowered_discharge"
path = "src/lib.rs"

# Decides the obligations structure-only elaboration minted, on the lowered
# form, and accepts one only when the proof kernel accepted its certificate.
# It must never depend on Psi 05, validation, Psi 06 or checked trees.
[dependencies]
diagnostics = { path = "../../../foundation/diagnostics" }
language-core = { path = "../../../foundation/language-core" }
optimization = { path = "../../../foundation/optimization" }
proof-admission = { path = "../../proof/admission" }
semantic-vocabulary = { path = "../../../foundation/semantic-vocabulary" }
source = { path = "../../../foundation/source" }
structure-elaboration = { path = "../structure-elaboration" }
symbols = { path = "../../../foundation/symbols" }
terminal-check-tables = { path = "../../representations/terminal-psi/check-tables" }
terminal-codec = { path = "../../representations/terminal-psi/codec" }
terminal-psi = { path = "../../representations/terminal-psi" }
terminal-semantics = { path = "../../representations/terminal-psi/semantics" }
typed-trees = { path = "../../representations/typed-trees" }

[dev-dependencies]
psi-work = { path = "../../representations/terminal-psi/work" }
terminal-interpreter = { path = "../../../interpreter/terminal-interpreter" }
source-files-to-tokens = { path = "../00_source-files-to-tokens" }
tokens-to-syntax-trees = { path = "../01_tokens-to-syntax-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../02_syntax-trees-to-symbol-resolved-trees" }
symbol-resolved-trees-to-typed-trees = { path = "../03_symbol-resolved-trees-to-typed-trees" }
typed-trees-to-typed-trees = { path = "../04_typed-trees-to-typed-trees" }
