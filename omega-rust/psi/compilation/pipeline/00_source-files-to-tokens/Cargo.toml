[package]
name = "source-files-to-tokens"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "source_files_to_tokens"
path = "lexer.rs"

[[bench]]
name = "lexer_timing"
path = "benchmarks/lexer_timing.rs"
harness = false

[dependencies]
memchr = "2"
arena = { path = "../../../foundation/arena" }
diagnostics = { path = "../../../foundation/diagnostics" }
execution-admission = { path = "../../../foundation/execution-admission" }
rayon = "1.10"
source = { path = "../../../foundation/source" }
tokens = { path = "../../representations/tokens" }

[dev-dependencies]
syntax-trees = { path = "../../representations/syntax-trees" }
tokens-to-syntax-trees = { path = "../01_tokens-to-syntax-trees" }
