[package]
name = "source-compiler"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
test-support = [
    "checked-terminal-psi-to-published-psi/test-support",
    "terminal-psi-to-checked-terminal-psi/test-support",
    "symbol-resolved-trees/test-support",
    "syntax-trees-to-symbol-resolved-trees/test-support",
    "symbol-resolved-trees-to-typed-trees/test-support",
    "typed-trees-to-typed-trees/test-support",
    "typed-trees-to-terminal-psi/test-support",
]

[dependencies]
checked-terminal-psi-to-published-psi = { path = "../07_checked-terminal-psi-to-published-psi" }
terminal-psi-to-checked-terminal-psi = { path = "../06_terminal-psi-to-checked-terminal-psi" }
typed-trees-to-terminal-psi = { path = "../05_typed-trees-to-terminal-psi" }
typed-trees-to-typed-trees = { path = "../04_typed-trees-to-typed-trees" }
symbol-resolved-trees-to-typed-trees = { path = "../03_symbol-resolved-trees-to-typed-trees" }
syntax-trees-to-symbol-resolved-trees = { path = "../02_syntax-trees-to-symbol-resolved-trees" }
source-declarations = { path = "../../representations/source-declarations" }
symbol-resolved-trees = { path = "../../representations/symbol-resolved-trees" }
typed-trees = { path = "../../representations/typed-trees" }
source-syntax = { path = "src/operations/source-syntax" }
source-parser = { path = "../01_tokens-to-syntax-trees" }
source-lexer = { path = "../00_source-files-to-tokens" }
access-vocabulary = { path = "../../representations/access-vocabulary" }
declaration-contracts = { path = "../../representations/declaration-contracts" }
schema-reflection = { path = "../../representations/schema-reflection" }
application-identity = { path = "../../representations/application-identity" }
layout-planning = { path = "../../layout-planning" }
numeric-literals = { path = "../../representations/numeric-literals" }
evaluation-contracts = { path = "../../../evaluation/evaluation-contracts" }
evaluation-receipts = { path = "../../../evaluation/evaluation-receipts" }
source-capture = { path = "../../../../host-support/source-capture" }
source-admission = { path = "../../representations/source-admission" }
source-text = { path = "../../../foundation/source-text" }
bignum = { path = "../../../foundation/bignum" }
sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
provider-choices = { path = "../../representations/provider-choices" }
wire = { path = "../../../foundation/wire" }
access-admission = { path = "../../access-admission" }
arena = { path = "../../../foundation/arena" }
artifact-evaluation = { path = "../../../evaluation/artifact-evaluation" }
build-time-values = { path = "../../../evaluation/build-time-values" }
compiler-storage = { path = "../../../foundation/compiler-storage" }
diagnostics = { path = "../../../foundation/diagnostics" }
evaluation-accounting = { path = "../../../evaluation/evaluation-accounting" }
execution-admission = { path = "../../../foundation/execution-admission" }
filesystem-authority = { path = "../../../evaluation/filesystem-authority" }
flow-effects = { path = "../../representations/source-effects" }
language-core = { path = "../../representations/source-vocabulary" }
layout-plans = { path = "../../representations/storage-layout" }
numerics = { path = "../../representations/scalar-values" }
optimization = { path = "../../representations/optimization-policy" }
proof-admission = { path = "../../proof-admission" }
rayon = "1.11"
semantic-vocabulary = { path = "../../representations/semantic-vocabulary" }
symbols = { path = "../../representations/declaration-identity" }
syntax-trees = { path = "../../representations/syntax-trees" }
terminal-check-tables = { path = "../../representations/terminal-psi/check-tables" }
terminal-codec = { path = "../../representations/terminal-psi/codec" }
terminal-installation = { path = "../../terminal-installation" }
terminal-interpreter = { path = "../../../interpreter" }
terminal-psi = { path = "../../representations/terminal-psi" }
terminal-semantics = { path = "../../representations/terminal-psi/semantics" }
terminal-work = { path = "../../representations/terminal-psi/work" }
tokens = { path = "../../representations/tokens" }

[dev-dependencies]
checked-terminal-psi-to-published-psi = { path = "../07_checked-terminal-psi-to-published-psi", features = ["test-support"] }
terminal-psi-to-checked-terminal-psi = { path = "../06_terminal-psi-to-checked-terminal-psi", features = ["test-support"] }
typed-trees-to-terminal-psi = { path = "../05_typed-trees-to-terminal-psi", features = ["test-support"] }
typed-trees-to-typed-trees = { path = "../04_typed-trees-to-typed-trees", features = ["test-support"] }
symbol-resolved-trees-to-typed-trees = { path = "../03_symbol-resolved-trees-to-typed-trees", features = ["test-support"] }
syntax-trees-to-symbol-resolved-trees = { path = "../02_syntax-trees-to-symbol-resolved-trees", features = ["test-support"] }
mimalloc = { version = "0.1", default-features = false }

[[test]]
name = "lexing_lexing"
path = "../00_source-files-to-tokens/tests/lexing.rs"
