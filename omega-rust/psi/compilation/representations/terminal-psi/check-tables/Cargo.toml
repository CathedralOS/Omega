[package]
name = "terminal-check-tables"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "terminal_check_tables"
path = "src/lib.rs"

# Retained representations. This crate must never depend on pipeline stages:
# it is the contract the checker on the lowered form is built against.
[dependencies]
