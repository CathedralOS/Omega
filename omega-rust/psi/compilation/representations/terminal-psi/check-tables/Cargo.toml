language-core = { path = "../../../../foundation/language-core" }
source = { path = "../../../../foundation/source" }
symbols = { path = "../../../../foundation/symbols" }
diagnostics = { path = "../../../../foundation/diagnostics" }
terminal-psi = { path = ".." }
