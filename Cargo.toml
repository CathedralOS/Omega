[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# The compiler's ordinary development binaries are large enough that full
# DWARF materially increases codegen, linking, and artifact I/O. Panic
# backtraces retain symbol names; debugger sessions can opt back in with
# `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = 0
# The compiler is executed during ordinary development and validation. Make
# optimization the default so a forgotten session override cannot slow every
# sample replay. Debug assertions and overflow checks remain enabled.
opt-level = 1

# Native publication repeatedly replays mathematical certificates. Optimizing
# just their checker materially shortens that path without optimizing every
# compiler crate on each edit. The test profile inherits this package override;
# development assertions and overflow checks remain enabled.
[profile.dev.package.proof-admission]
opt-level = 3

# Cathedral's fresh native build spent 171 seconds in Terminal lowering after
# scratch-state copy and set-operation repairs. Its payload-history machinery
# executes here; optimize that hot analysis without changing every development
# crate's build profile. Tests inherit this package override, while development
# assertions and overflow checks remain enabled.
[profile.dev.package.terminal-semantics]
opt-level = 3

# Cathedral's next measured build still spent about 216 seconds in native
# realization. Sampling located repeated spill recovery, liveness and legality
# analysis in these two owners. Optimize that analysis without weakening its
# checks or changing the ordinary profile of unrelated development crates.
[profile.dev.package.selected-instruction-analyses]
opt-level = 3

# Typed programs, checked plans, live ranges, allocation legality and homes
# each carry a SHA-256 identity, and register allocation's spill recovery
# recomputes the changed function's digests at every step. Unoptimized, sha2's
# software compression was 22.9% of the compile thread in a debug native build
# of samples/cli/games/dungeon_crawler_cli on macOS ARM64 (2026-10-06).
# Optimizing only this leaf crate leaves every digest and every compiler crate
# as they were; the test profile inherits the override.
[profile.dev.package.sha2]
opt-level = 3

# The workspace's test binaries are enormous and short-lived. Full DWARF made
# a three-test, zero-runtime frontend regression spend over a minute in codegen
# on a 14-core development host. Compiler diagnostics remain unchanged; panic
# backtraces retain symbol names, while line-level debugger metadata can still
# be requested explicitly with `CARGO_PROFILE_TEST_DEBUG=2` when needed.
[profile.test]
debug = 0
# Every test that compiles an Omega program checks the whole assembled
# program (root plus the 27.5k-line standard library) at least twice, and that
# work is spread across the Psi crates rather than concentrated in one. On a
# 24-core Windows host, one owner canary test took 40.0 s unoptimized and
# 8.6 s at opt-level 1 (fixture review 22.4 s -> 4.7 s, compile 17.4 s ->
# 3.8 s), while rebuilding the canary-suite binary after touching the
# checking crate took 12.6 s and a full rebuild 2 m 33 s. Optimizing single
# crates did not move the number. Debug assertions and overflow checks stay
# on; only codegen changes.
opt-level = 1
