[workspace]
members = [
    "omega-rust/omega",
    "omega-rust/psi/foundation/arena",
    "omega-rust/psi/foundation/diagnostics",
    "omega-rust/psi/foundation/language-core",
    "omega-rust/psi/foundation/language-semantics",
    "omega-rust/psi/foundation/numerics",
    "omega-rust/psi/foundation/source",
    "omega-rust/psi/foundation/symbols",
    "omega-rust/psi/foundation/semantic-vocabulary",
    "omega-rust/psi/terminal-psi",
    "omega-rust/psi/pipeline/00_source-files-to-tokens",
    "omega-rust/psi/pipeline/01_tokens-to-syntax-trees",
    "omega-rust/psi/pipeline/02_syntax-trees-to-symbol-resolved-trees",
    "omega-rust/psi/pipeline/03_symbol-resolved-trees-to-typed-trees",
    "omega-rust/psi/pipeline/04_typed-trees-to-checked-trees",
    "omega-rust/psi/pipeline/05_checked-trees-to-lowered-psi",
    "omega-rust/psi/pipeline/06_lowered-psi-to-lowered-psi",
    "omega-rust/psi/pipeline/07_lowered-psi-to-terminal-psi",
    "omega-rust/psi/proof-admission",
    "omega-rust/psi/terminal-verifier",
    "omega-rust/psi/terminal-codec",
    "omega-rust/psi/terminal-fuel",
    "omega-rust/psi/terminal-semantics",
    "omega-rust/psi/terminal-interpreter",
    "omega-rust/psi/optimization-core",
    "omega-rust/psi/target",
    "omega-rust/psi/installation-evidence",
    "omega-rust/omega/pipeline/00_terminal-psi-to-abstract-operations",
    "omega-rust/omega/pipeline/02_abstract-operations-to-target-operations",
    "omega-rust/omega/pipeline/03_target-operations-to-selected-instructions",
    "omega-rust/omega/pipeline/04_selected-instructions-to-selected-instructions",
    "omega-rust/omega/pipeline/05_selected-instructions-to-register-homes",
    "omega-rust/omega/pipeline/06_register-homes-to-post-allocation-machine",
    "omega-rust/omega/pipeline/07_post-allocation-machine-to-selected-form-encoding",
    "omega-rust/omega/pipeline/08_selected-form-encoding-to-resolved-layout",
    "omega-rust/omega/pipeline/09_resolved-layout-to-resolved-layout",
    "omega-rust/omega/pipeline/01_abstract-operations-to-abstract-operations",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# The compiler's ordinary development binaries are large enough that full
# DWARF materially increases codegen, linking, and artifact I/O. Panic
# backtraces retain symbol names; debugger sessions can opt back in with
# `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = 0

# Native publication repeatedly replays mathematical certificates. Optimizing
# just their checker materially shortens that path without optimizing every
# compiler crate on each edit. The test profile inherits this package override;
# development assertions and overflow checks remain enabled.
[profile.dev.package.proof-admission]
opt-level = 3

# The workspace's test binaries are enormous and short-lived. Full DWARF made
# a three-test, zero-runtime frontend regression spend over a minute in codegen
# on a 14-core development host. Compiler diagnostics remain unchanged; panic
# backtraces retain symbol names, while line-level debugger metadata can still
# be requested explicitly with `CARGO_PROFILE_TEST_DEBUG=2` when needed.
[profile.test]
debug = 0
# Every test that compiles an Omega program checks the whole assembled
# program (root plus the 27.5k-line standard library) at least twice, and that
# work is spread across the Psi crates rather than concentrated in one. On a
# 24-core Windows host, one owner canary test took 40.0 s unoptimized and
# 8.6 s at opt-level 1 (fixture review 22.4 s -> 4.7 s, compile 17.4 s ->
# 3.8 s), while rebuilding the canary-suite binary after touching the
# checking crate took 12.6 s and a full rebuild 2 m 33 s. Optimizing single
# crates did not move the number. Debug assertions and overflow checks stay
# on; only codegen changes.
opt-level = 1
