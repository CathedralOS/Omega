[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

# The compiler's ordinary development binaries are large enough that full
# DWARF materially increases codegen, linking, and artifact I/O. Panic
# backtraces retain symbol names; debugger sessions can opt back in with
# `CARGO_PROFILE_DEV_DEBUG=2`.
[profile.dev]
debug = 0

# Native publication repeatedly replays mathematical certificates. Optimizing
# just their checker materially shortens that path without optimizing every
# compiler crate on each edit. The test profile inherits this package override;
# development assertions and overflow checks remain enabled.
[profile.dev.package.proof-admission]
opt-level = 3

# The workspace's test binaries are enormous and short-lived. Full DWARF made
# a three-test, zero-runtime frontend regression spend over a minute in codegen
# on a 14-core development host. Compiler diagnostics remain unchanged; panic
# backtraces retain symbol names, while line-level debugger metadata can still
# be requested explicitly with `CARGO_PROFILE_TEST_DEBUG=2` when needed.
[profile.test]
debug = 0
# Every test that compiles an Omega program checks the whole assembled
# program (root plus the 27.5k-line standard library) at least twice, and that
# work is spread across the Psi crates rather than concentrated in one. On a
# 24-core Windows host, one owner canary test took 40.0 s unoptimized and
# 8.6 s at opt-level 1 (fixture review 22.4 s -> 4.7 s, compile 17.4 s ->
# 3.8 s), while rebuilding the canary-suite binary after touching the
# checking crate took 12.6 s and a full rebuild 2 m 33 s. Optimizing single
# crates did not move the number. Debug assertions and overflow checks stay
# on; only codegen changes.
opt-level = 1
