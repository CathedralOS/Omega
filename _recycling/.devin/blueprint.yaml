initialize:
  - name: system packages
    run: apt-get update && apt-get install -y build-essential pkg-config python3
  - name: toolchain and mbx
    run: |
      bash tools/agent_setup.sh
      echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$ENVRC"
      export PATH="$HOME/.cargo/bin:$PATH"
      mbx xtask doctor
maintenance:
  - name: submodules (best effort; Squalr is in the CathedralOS org)
    run: git submodule update --init --recursive || echo "submodule init skipped"
  - name: git policy
    run: |
      git config pull.rebase true
      git config --global user.name "Jarod Castillo"
      git config --global user.email "43973221+Smotto@users.noreply.github.com"
  - name: prefetch and warm
    run: |
      export PATH="$HOME/.cargo/bin:$PATH"
      mbx fetch
      # Build the compiler binary itself: `mbx check` writes only metadata,
      # so a session that warmed with it still compiled omega from scratch.
      mbx build -p omega
      mbx nextest run --workspace --lib --no-run
knowledge:
  - name: rules
    contents: Read AGENTS.md in full before any change. Build and test with mbx (Mr Boxington, https://mr-boxington.jdx.dev/), as AGENTS.md's commands do; `mbx xtask doctor` checks it.
  - name: test
    contents: |
      Tests on the changed crate/area: mbx test -p <crate> --test <test> (or mbx nextest run -p <crate> <filter>).
      Samples (differential native + Psi): mbx xtask sample-gate --filter <sample_path>.
      Repository rules, lint & formatting: mbx xtask check-rules --base origin/main --title "<lane>: <subject>", mbx xtask fmt --check, mbx clippy -p <crate> --all-targets -- -D warnings, mbx xtask check-boundary.
      Bootstrap gates: sh tools/bootstrap/check-chain-hygiene.sh ; sh tests/bootstrap/alpha-beta-edge.sh --edge
  - name: landing
    contents: Coordinate via mbx xtask claims and mbx xtask worktree; push a work/<topic> branch, open a PR with an mbx xtask provenance footer, wait for admission, and squash-merge into main (see tools/docs/landing.md). Never push main directly.
