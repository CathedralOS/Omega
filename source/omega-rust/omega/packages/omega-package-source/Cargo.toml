[package]
name = "omega-package-source"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "omega_package_source"
path = "src/lib.rs"

[features]
test-fixtures = []

[dependencies]
omega-build-declarations = { path = "../../build/omega-build-declarations" }
omega-platform-custody = { path = "../../tooling/omega-platform-custody" }
omega-resolver-execution = { path = "../omega-resolver-execution" }
psi-core = { path = "../../../psi/foundation/psi-core" }
cap-fs-ext = "4.0.3"
cap-std = "4.0.3"
sha1-checked = { version = "0.10.0", default-features = false }
sha2 = "0.10.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["user"] }
