[package]
name = "omega-image-emission"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "omega_image_emission"
path = "src/lib.rs"

[features]
installed-artifact = ["dep:omega-executable-installation"]

[dependencies]
omega-calling-conventions = { path = "../../../representations/omega-calling-conventions" }
omega-abstract-operations = { path = "../../../representations/omega-abstract-operations" }
omega-executable-installation = { path = "../../runtime/omega-executable-installation", optional = true }
psi-diagnostics = { path = "../../../../psi/foundation/psi-diagnostics" }
omega-image = { path = "../omega-image" }
omega-image-elf = { path = "../omega-image-elf" }
omega-image-macho = { path = "../omega-image-macho" }
omega-image-pe = { path = "../omega-image-pe" }
omega-object-file = { path = "../../object/omega-object-file" }
omega-target = { path = "../../../representations/omega-target" }
omega-x86-encoding = { path = "../../instruction_set_architectures/omega-x86-encoding" }
omega-machine-code = { path = "../../../representations/omega-machine-code" }
omega-installation-evidence = { path = "../../../representations/omega-installation-evidence" }
omega-target-operations = { path = "../../../representations/omega-target-operations" }
omega-task-plans = { path = "../../../representations/omega-task-plans" }
omega-isa-aarch64 = { path = "../../instruction_set_architectures/omega-isa-aarch64" }
omega-isa-x86_64 = { path = "../../instruction_set_architectures/omega-isa-x86_64" }
psi-core = { path = "../../../../psi/foundation/psi-core" }
psi-terminal = { path = "../../../../psi/representations/psi-terminal" }
psi-terminal-codec = { path = "../../../../psi/semantics/psi-terminal-codec" }
psi-terminal-fixed-fuel = { path = "../../../../psi/semantics/psi-terminal-fixed-fuel" }
psi-terminal-fuel = { path = "../../../../psi/semantics/psi-terminal-fuel" }
psi-terminal-verifier = { path = "../../../../psi/semantics/psi-terminal-verifier" }
psi-proof-admission = { path = "../../../../psi/semantics/psi-proof-admission" }
sha2 = "0.10"
iced-x86 = { version = "1.21", default-features = false, features = ["std", "decoder", "instr_info"] }

[dev-dependencies]
omega-machine-emission = { path = "../../omega-machine-emission" }
omega-target-operations-to-assigned-target-operations = { path = "../../../pipeline/omega-target-operations-to-assigned-target-operations" }
