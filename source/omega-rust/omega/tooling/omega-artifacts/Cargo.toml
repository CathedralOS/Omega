[package]
name = "omega-artifacts"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "omega_artifacts"
path = "src/lib.rs"

[features]
external-root-report = ["dep:omega-external-roots"]

[dependencies]
psi-core = { path = "../../../psi/foundation/psi-core" }
psi-checked-trees = { path = "../../../psi/representations/psi-checked-trees" }
psi-typed-trees = { path = "../../../psi/representations/psi-typed-trees" }
omega-core = { path = "../../representations/omega-core" }
psi-diagnostics = { path = "../../../psi/foundation/psi-diagnostics" }
omega-calling-conventions = { path = "../../representations/omega-calling-conventions" }
omega-effects = { path = "../../representations/omega-effects" }
omega-target = { path = "../../representations/omega-target" }
omega-external-roots = { path = "../../backend/runtime/omega-external-roots", optional = true }

[dev-dependencies]
omega-executable-installation = { path = "../../backend/runtime/omega-executable-installation" }
omega-external-roots = { path = "../../backend/runtime/omega-external-roots" }
psi-layout-plans = { path = "../../../psi/foundation/psi-layout-plans" }
psi-extents = { path = "../../../psi/foundation/psi-extents" }
serde_json = "1.0"
