[package]
name = "psi-validation"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "psi_validation"
path = "src/lib.rs"

[dependencies]
psi-access-plans = { path = "../../foundation/psi-access-plans" }
psi-arena = { path = "../../foundation/psi-arena" }
psi-checked-trees = { path = "../../representations/psi-checked-trees" }
psi-diagnostics = { path = "../../foundation/psi-diagnostics" }
psi-effects = { path = "../../representations/psi-effects" }
psi-facts = { path = "../../representations/psi-facts" }
