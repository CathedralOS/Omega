[package]
name = "beta"
version = "0.0.0"
edition = "2021"
publish = false

# Disposable Rust on-ramp for the Alpha assembler: it converts Alpha assembly
# text into an Alpha VM bytecode tape, the same artifact produced by
# ../../rungs/alpha/assembler/assembler.alpha. Normal bootstrap assembly uses
# that lattice-built implementation; this crate has no Beta-language role.
[[bin]]
name = "assembler"
path = "src/assembler.rs"

