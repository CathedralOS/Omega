psi-language-semantics = { path = "../../foundation/psi-language-semantics" }
psi-numerics = { path = "../../foundation/psi-numerics" }
psi-source = { path = "../../foundation/psi-source" }
psi-symbols = { path = "../../foundation/psi-symbols" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
